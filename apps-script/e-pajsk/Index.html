<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-PAJSK SMK Asajaya</title>
  <style>
    :root {
      --biru: #1d4ed8; --biru-gelap: #1e3a8a; --biru-terang: #0ea5e9; --hijau: #15803d; --merah: #b91c1c;
      --kuning: #b45309; --kelabu: #64748b; --latar: #f1f5f9; --kad: #ffffff; --sempadan: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--latar); color: #0f172a; -webkit-font-smoothing: antialiased; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--sempadan); border-radius: 6px; width: 100%; background: #fff; }
    select { text-overflow: ellipsis; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--biru); box-shadow: 0 0 0 3px rgba(29,78,216,.14); }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--biru); outline-offset: 2px; border-radius: 4px; }
    .hidden { display: none !important; }

    .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 7px; padding: 8px 14px; font-size: 14px; font-weight: 600; background: var(--biru); color: #fff; box-shadow: 0 1px 2px rgba(29,78,216,.3); }
    .btn:hover { background: var(--biru-gelap); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.kecil { padding: 5px 10px; font-size: 12px; box-shadow: none; }
    .btn.merah { background: var(--merah); } .btn.merah:hover { background: #7f1d1d; }
    .btn.hijau { background: var(--hijau); } .btn.hijau:hover { background: #166534; }
    .btn.kelabu { background: var(--kelabu); } .btn.kelabu:hover { background: #475569; }
    .btn.luar { background: #fff; color: var(--biru); border: 1px solid var(--sempadan); box-shadow: none; } .btn.luar:hover { background: #eff6ff; border-color: var(--biru); }

    /* Log masuk */
    .skrin-tengah { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--biru-gelap), var(--hijau)); padding: 16px; }
    .kad-login { background: #fff; padding: 30px 26px; border-radius: 16px; width: 360px; max-width: 100%; box-shadow: 0 20px 45px rgba(2,6,23,.35); }
    .kad-login h1 { font-size: 19px; margin: 0 0 4px; color: var(--biru-gelap); text-align: center; }
    .kad-login p.sub { margin: 0 0 20px; font-size: 13px; color: var(--kelabu); text-align: center; }
    .logo { display: block; margin: 0 auto 12px; width: 76px; height: 76px; object-fit: contain; }
    .medan { margin-bottom: 13px; }
    .medan label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .ralat-login { color: var(--merah); font-size: 13px; margin-top: 10px; min-height: 16px; }
    .nota { font-size: 12px; color: var(--kelabu); margin-top: 6px; }

    /* Rangka */
    #aplikasi { display: flex; min-height: 100vh; }
    #bilahSisi { width: 230px; background: linear-gradient(180deg, var(--biru-gelap), #16265c); color: #fff; flex-shrink: 0; padding: 16px 0; }
    #bilahSisi .jenama { padding: 0 18px 14px; font-weight: 700; font-size: 14px; line-height: 1.3; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 6px; }
    #bilahSisi .jenama small { display: block; font-weight: 400; color: #bfdbfe; font-size: 11.5px; margin-top: 2px; }
    .item-nav { display: block; width: 100%; text-align: left; background: none; border: none; border-left: 3px solid transparent; padding: 11px 18px; color: #cbd5e1; font-size: 14px; }
    .item-nav:hover { background: rgba(255,255,255,.08); color: #fff; }
    .item-nav.aktif { background: rgba(255,255,255,.12); color: #fff; border-left-color: #facc15; font-weight: 600; }
    #kawasanUtama { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #barAtas { background: #fff; border-bottom: 1px solid var(--sempadan); padding: 11px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
    #barAtas .info { font-size: 13px; color: var(--kelabu); } #barAtas .info b { color: #0f172a; }
    #kandungan { padding: 20px; overflow-x: auto; }

    .kad { background: var(--kad); border: 1px solid var(--sempadan); border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
    .kad h3 { margin: 0 0 12px; font-size: 15px; color: var(--biru-gelap); }
    h2.tajuk { margin: 0 0 14px; font-size: 20px; color: var(--biru-gelap); }
    .grid-kad { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat { background: #fff; border: 1px solid var(--sempadan); border-radius: 12px; padding: 14px 16px; }
    .stat .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--kelabu); }
    .stat .nilai { font-size: 26px; font-weight: 700; color: var(--biru-gelap); margin-top: 4px; }
    .stat.amaran .nilai { color: var(--kuning); }
    .bar { background: #e2e8f0; border-radius: 6px; height: 8px; overflow: hidden; min-width: 70px; } .bar > div { height: 100%; background: var(--hijau); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--sempadan); vertical-align: top; }
    th { background: #f8fafc; font-size: 11.5px; text-transform: uppercase; color: var(--kelabu); white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .lencana { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e2e8f0; color: var(--kelabu); }
    .lencana.A { background: #dcfce7; color: #166534; } .lencana.B { background: #dbeafe; color: #1e40af; }
    .lencana.C { background: #fef9c3; color: #854d0e; } .lencana.D { background: #ffedd5; color: #9a3412; } .lencana.E { background: #fee2e2; color: #991b1b; }
    .lencana.hijau { background: #dcfce7; color: var(--hijau); } .lencana.merah { background: #fee2e2; color: var(--merah); } .lencana.kuning { background: #fef3c7; color: var(--kuning); }
    .baris-alat { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .baris-alat select, .baris-alat input { width: auto; min-width: 150px; }
    .baris-alat .rapat { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .amaran-kotak { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .info-kotak { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .jadual-skrol { overflow-x: auto; }

    /* Modal */
    .latar-modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 24px 12px; }
    .kad-modal { background: #fff; border-radius: 12px; width: min(860px, 100%); padding: 20px; }
    .kad-modal.kecil { width: min(520px, 100%); }
    .kad-modal h3 { margin: 0 0 12px; color: var(--biru-gelap); }
    .grid-borang { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-borang .penuh { grid-column: 1 / -1; }
    .aksi-modal { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .tab-bar { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--sempadan); margin-bottom: 14px; }
    .tab-bar button { background: none; border: none; padding: 9px 13px; font-size: 13px; font-weight: 600; color: var(--kelabu); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab-bar button.aktif { color: var(--biru); border-bottom-color: var(--biru); }
    .panel-tab { display: none; } .panel-tab.aktif { display: block; }
    .pratonton { background: #f8fafc; border: 1px solid var(--sempadan); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
    .pratonton b { color: var(--biru-gelap); }
    .kotak-semak { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .kotak-semak label { display: flex; align-items: center; gap: 6px; font-weight: 400; font-size: 13px; }
    .kotak-semak input { width: auto; }

    .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 2px 0; }
    .pager .btn { padding: 5px 10px; font-size: 12px; box-shadow: none; }
    .pager .btn:disabled { opacity: .4; }
    .pager-kumpulan { display: flex; gap: 6px; }
    #bannerBaru { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 95; background: #1e3a8a; color: #fff; padding: 9px 14px; border-radius: 999px; font-size: 13px; box-shadow: 0 6px 18px rgba(2,6,23,.35); display: flex; gap: 10px; align-items: center; }
    #bannerBaru button { background: #facc15; color: #1e3a8a; border: none; border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: 12px; }
    .titik-hidup { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
    .titik-hidup.mati { background: #94a3b8; }
    .rangka-muat { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: rangka 1.2s infinite; border-radius: 8px; height: 14px; margin: 10px 0; }
    @keyframes rangka { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .kad-guru { border: 1px solid var(--sempadan); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
    .kad-guru .kepala { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
    .kad-guru .kepala b { font-size: 14px; }
    .baris-kelas { border-top: 1px dashed var(--sempadan); margin-top: 10px; padding-top: 10px; font-size: 13px; }
    .baris-kelas .atas { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .senarai-kurang { margin: 6px 0 0; padding-left: 18px; color: #334155; }
    .senarai-kurang li { margin: 2px 0; }
    .tab-pil { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab-pil button { border: 1px solid var(--sempadan); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--kelabu); }
    .tab-pil button.aktif { background: var(--biru); color: #fff; border-color: var(--biru); }
    #kontainerToast { position: fixed; top: 14px; right: 14px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.2); max-width: 340px; }
    .toast.jaya { background: var(--hijau); } .toast.gagal { background: var(--merah); } .toast.info { background: var(--biru); }
    #selimutSibuk { position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 90; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--biru-gelap); }

    /* Slip */
    .slip { background: #fff; border: 1px solid #94a3b8; padding: 12px 14px; margin: 0 auto 18px; width: 190mm; max-width: 100%; font-size: 11.5px; page-break-after: always; break-after: page; color: #000; }
    .slip h4 { margin: 0; text-align: center; font-size: 13.5px; } .slip .sub { text-align: center; margin-bottom: 8px; font-size: 12px; }
    .slip table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
    .slip th, .slip td { border: 1px solid #475569; padding: 3px 5px; font-size: 11px; text-transform: none; color: #000; background: #fff; vertical-align: top; }
    .slip th { background: #e2e8f0; text-align: center; font-weight: 700; }
    .slip td.skor { text-align: center; width: 38px; white-space: nowrap; }
    .slip .tebal td { font-weight: 700; background: #f1f5f9; }
    .slip .rumusan-teks { border: 1px solid #475569; padding: 5px 7px; font-style: italic; }
    #kawasanCetak { display: none; }

    @media (max-width: 820px) {
      #aplikasi { flex-direction: column; }
      #bilahSisi { width: 100%; display: flex; overflow-x: auto; padding: 8px; align-items: center; }
      #bilahSisi .jenama { border: none; margin: 0 8px 0 0; padding: 0 10px 0 4px; white-space: nowrap; }
      #bilahSisi .jenama small { display: none; }
      .item-nav { width: auto; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 8px 11px; }
      .item-nav.aktif { border-bottom-color: #facc15; }
      .grid-borang { grid-template-columns: 1fr; }
      #kandungan { padding: 12px; }
    }
    @media print {
      body { background: #fff; }
      #aplikasi, #skrinLogin, #skrinTukar, #modalRoot, #kontainerToast, #selimutSibuk { display: none !important; }
      #kawasanCetak { display: block !important; }
      .slip { border: none; margin: 0 auto; padding: 4mm 0 0; }
      @page { size: A4; margin: 10mm; }
    }
  </style>
</head>

<script><?!= kodKiraan ?></script>
<script>
/* =========================================================================
 * Skrip klien SPA e-PAJSK. Semua panggilan pelayan melalui google.script.run.
 * Pengiraan markah (kiraAspekMurni dll.) disalin daripada Scoring.gs oleh pelayan
 * — pratonton di sini hanya untuk paparan; markah SAH dikira semula di pelayan.
 * ========================================================================= */
var S = { token: null, user: null, ref: null, tetapan: null, kelasSenarai: [], kelasPilihan: '', data: null, halaman: 'dashboard', cacheKelas: {}, versi: null, kemaskini: null, segar: null, pg: {}, seq: 0 };
var ASPEK = ['PBB', 'KP', 'SP'];
var NAMA_ASPEK = { PBB: 'Pasukan Badan Beruniform', KP: 'Kelab & Persatuan', SP: 'Sukan & Permainan' };
var ADMIN = 'ADMIN';

/* ---------- Utiliti ---------- */
function e(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function nilaiEl(id) { var el = $(id); return el ? el.value : ''; }
function fmt(n) { var v = Number(n); return isNaN(v) ? '' : (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); }
function tanda(n) { return n === '' || n === null || n === undefined ? '–' : e(fmt(n)); }

function toast(mesej, jenis) {
  var el = document.createElement('div');
  el.className = 'toast ' + (jenis || 'info');
  el.textContent = mesej;
  $('kontainerToast').appendChild(el);
  setTimeout(function () { el.remove(); }, jenis === 'gagal' ? 6500 : 3500);
}
var bilSibuk = 0;
function sibuk(hidup) {
  bilSibuk = Math.max(0, bilSibuk + (hidup ? 1 : -1));
  $('selimutSibuk').classList.toggle('hidden', bilSibuk === 0);
}
// Hanya operasi TULIS menyekat skrin; bacaan dipaparkan dengan petunjuk 'memuatkan' setempat supaya terasa pantas.
var API_TULIS = /^api(Simpan|Segerak|Arkib|Naik|Reset|Padam|Import|Kira|Tukar|Auto|Login)/;
var RALAT_SEMENTARA = /Service|timed out|Server|bersambung|temporarily|Try again|sibuk/i;

function api(fn, param, tanpaSibuk, cubaan) {
  return new Promise(function (res, rej) {
    if (!window.google || !google.script || !google.script.run) { rej(new Error('Tidak bersambung dengan pelayan.')); return; }
    var tulis = API_TULIS.test(fn);
    var blok = tulis && !tanpaSibuk;
    if (blok) sibuk(true);
    var tamat = function () { if (blok) sibuk(false); };
    google.script.run
      .withSuccessHandler(function (r) {
        tamat();
        if (r === null || r === undefined) { rej(new Error('Respons kosong daripada pelayan.')); return; }
        if (r.success === false) {
          if (/Sesi tamat|Akaun tidak aktif/.test(r.message || '')) { setTimeout(keluar, 50); }
          rej(new Error(r.message)); return;
        }
        res(r);
      })
      .withFailureHandler(function (err) {
        tamat();
        var mesej = err && err.message ? err.message : String(err);
        if (!tulis && !cubaan && RALAT_SEMENTARA.test(mesej)) {   // bacaan sahaja boleh diulang dengan selamat
          setTimeout(function () { api(fn, param, tanpaSibuk, 1).then(res, rej); }, 800);
          return;
        }
        rej(new Error(mesej));
      })[fn](Object.assign({ token: S.token }, param || {}));
  });
}
function gagal(err) { toast(err.message || String(err), 'gagal'); }

function simpanToken(t) { try { if (t) sessionStorage.setItem('epajsk_token', t); else sessionStorage.removeItem('epajsk_token'); } catch (x) { /* storan disekat */ } }
function bacaToken() { try { return sessionStorage.getItem('epajsk_token'); } catch (x) { return null; } }

/* ---------- Modal ---------- */
function bukaModal(html, kecil) {
  var root = $('modalRoot');
  var d = document.createElement('div');
  d.className = 'latar-modal';
  d.innerHTML = '<div class="kad-modal' + (kecil ? ' kecil' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  root.appendChild(d);
  return d;
}
function tutupModal(el) { var m = el ? (el.closest ? el.closest('.latar-modal') : el) : $('modalRoot').lastElementChild; if (m) m.remove(); }
function semuaModalTutup() { $('modalRoot').innerHTML = ''; }
function sahkan(mesej, ok, labelOk) {
  var m = bukaModal('<h3>Pengesahan</h3><p>' + e(mesej) + '</p><div class="aksi-modal"><button class="btn luar" data-x="batal">Batal</button><button class="btn merah" data-x="ok">' + e(labelOk || 'Teruskan') + '</button></div>', true);
  m.querySelector('[data-x=batal]').onclick = function () { tutupModal(m); };
  m.querySelector('[data-x=ok]').onclick = function () { tutupModal(m); ok(); };
}

/* ---------- Log masuk / sesi ---------- */
$('borangLogin').addEventListener('submit', function (ev) {
  ev.preventDefault();
  $('ralatLogin').textContent = '';
  $('btnLogin').disabled = true;
  api('apiLogin', { nokp: nilaiEl('lgKP').replace(/\D/g, ''), kataLaluan: nilaiEl('lgKW') }).then(function (r) {
    S.token = r.token; simpanToken(r.token);
    S.user = { nama: r.nama, peranan: r.peranan, kelas: r.kelas };
    $('lgKW').value = '';
    if (r.mestiTukarPassword) { paparSkrin('skrinTukar'); } else { mulaAplikasi(); }
  }).catch(function (er) { $('ralatLogin').textContent = er.message; }).then(function () { $('btnLogin').disabled = false; });
});

function paparSkrin(id) {
  ['skrinLogin', 'skrinTukar', 'aplikasi'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); });
}

$('borangTukar').addEventListener('submit', function (ev) {
  ev.preventDefault();
  $('ralatTukar').textContent = '';
  if (nilaiEl('tkBaru') !== nilaiEl('tkSah')) { $('ralatTukar').textContent = 'Pengesahan kata laluan tidak sepadan.'; return; }
  api('apiTukarPasswordSendiri', { kataLaluanLama: nilaiEl('tkLama'), kataLaluanBaharu: nilaiEl('tkBaru') }).then(function () {
    ['tkLama', 'tkBaru', 'tkSah'].forEach(function (i) { $(i).value = ''; });
    toast('Kata laluan berjaya ditukar.', 'jaya');
    mulaAplikasi();
  }).catch(function (er) { $('ralatTukar').textContent = er.message; });
});
$('btnTukarKeluar').onclick = function () { keluar(); };
$('btnLogout').onclick = function () { api('apiLogout').catch(function () {}).then(keluar); };
$('btnTukarKW').onclick = function () {
  var m = bukaModal('<h3>Tukar Kata Laluan</h3><div class="medan"><label>Kata laluan semasa</label><input id="mLama" type="password"></div><div class="medan"><label>Kata laluan baharu (min. 6 aksara)</label><input id="mBaru" type="password"></div><div class="medan"><label>Sahkan</label><input id="mSah" type="password"></div><div class="aksi-modal"><button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">Simpan</button></div>', true);
  m.querySelector('[data-x=b]').onclick = function () { tutupModal(m); };
  m.querySelector('[data-x=s]').onclick = function () {
    if (nilaiEl('mBaru') !== nilaiEl('mSah')) { toast('Pengesahan tidak sepadan.', 'gagal'); return; }
    api('apiTukarPasswordSendiri', { kataLaluanLama: nilaiEl('mLama'), kataLaluanBaharu: nilaiEl('mBaru') })
      .then(function () { tutupModal(m); toast('Kata laluan ditukar.', 'jaya'); }).catch(gagal);
  };
};

function keluar() {
  S.token = null; S.user = null; S.data = null; S.cacheKelas = {}; S.versi = null; S.segar = null; S.pg = {}; simpanToken(null);
  clearInterval(pollTimer); $('bannerBaru').classList.add('hidden');
  semuaModalTutup();
  paparSkrin('skrinLogin');
}

/* ---------- Mula aplikasi (SATU panggilan: pengguna + rujukan skor + tetapan + kelas) ---------- */
function mulaAplikasi() {
  api('apiMula').then(function (r) {
    S.user = { nama: r.nama, peranan: r.peranan, kelas: r.kelas };
    if (r.mestiTukarPassword) { paparSkrin('skrinTukar'); return; }
    S.ref = r.rujukan; S.tetapan = r.tetapan; S.kelasSenarai = r.kelasSenarai; S.versi = r.versi;
    if (!S.kelasSenarai.some(function (k) { return k.kunci === S.kelasPilihan; })) S.kelasPilihan = S.kelasSenarai.length ? S.kelasSenarai[0].kunci : '';
    paparSkrin('aplikasi');
    $('infoPengguna').innerHTML = '<span class="titik-hidup" id="titikHidup" title="Disegerakkan automatik dengan e-Kokurikulum"></span><b>' + e(S.user.nama) + '</b> · ' + (S.user.peranan === ADMIN ? 'Admin' : 'Guru Kelas') + ' · Tahun pentaksiran <b id="infoTahun">' + e(S.tetapan.tahun) + '</b>';
    binaMenu();
    pergi(S.halaman || 'dashboard');
    mulaPoll();
  }).catch(function (er) { gagal(er); keluar(); });
}

/* ---------- Kemas kini langsung ---------- */
var pollTimer = null, pollDaftar = false, sedangPoll = false;
function modalTerbuka() { return $('modalRoot').children.length > 0; }

function mulaPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(semakVersi, 45000);
  if (!pollDaftar) { pollDaftar = true; document.addEventListener('visibilitychange', function () { if (!document.hidden) semakVersi(); }); }
}

function semakVersi() {
  if (!S.token || document.hidden || sedangPoll) return;
  sedangPoll = true;
  api('apiVersi', {}, true).then(function (r) {
    var titik = $('titikHidup'); if (titik) titik.classList.remove('mati');
    if (S.kemaskini !== null && r.kemaskini && r.kemaskini !== S.kemaskini) toast('Data dikemas kini daripada e-Kokurikulum.', 'info');
    S.kemaskini = r.kemaskini || '';
    if (S.versi && r.versi !== S.versi) {
      S.versi = r.versi;
      if (modalTerbuka()) { $('bannerBaru').classList.remove('hidden'); } else { segarSenyap(); }
    } else if (!S.versi) { S.versi = r.versi; }
  }).catch(function () { var titik = $('titikHidup'); if (titik) titik.classList.add('mati'); }).then(function () { sedangPoll = false; });
}

function segarSenyap() {
  $('bannerBaru').classList.add('hidden');
  api('apiSenaraiKelas', {}, true).then(function (r) {
    S.kelasSenarai = r.kelas;
    if (!r.kelas.some(function (k) { return k.kunci === S.kelasPilihan; })) S.kelasPilihan = r.kelas.length ? r.kelas[0].kunci : '';
    S.cacheKelas = {};
    if (S.segar) S.segar();
  }).catch(function () {});
}
$('btnBannerSegar').onclick = segarSenyap;

var MENU = [
  { id: 'dashboard', label: 'Dashboard', paparan: dashboard },
  { id: 'pengisian', label: 'Status Pengisian', paparan: halamanPengisian },
  { id: 'pentaksiran', label: 'Pentaksiran Kelas', paparan: halamanPentaksiran },
  { id: 'rumusan', label: 'Rumusan Kelas', paparan: halamanRumusan },
  { id: 'slip', label: 'Slip PAJSK', paparan: halamanSlip },
  { id: 'analisa', label: 'Analisa Ringkas', paparan: halamanAnalisa },
  { id: 'murid', label: 'Murid', admin: true, paparan: halamanMurid },
  { id: 'pengguna', label: 'Pengguna', admin: true, paparan: halamanPengguna },
  { id: 'arkib', label: 'Arkib & Naik Tingkatan', admin: true, paparan: halamanArkib },
  { id: 'tetapan', label: 'Tetapan', admin: true, paparan: halamanTetapan },
  { id: 'audit', label: 'Log Audit', admin: true, paparan: halamanAudit }
];
function binaMenu() {
  $('menuNav').innerHTML = MENU.filter(function (m) { return !m.admin || S.user.peranan === ADMIN; })
    .map(function (m) { return '<button class="item-nav" data-id="' + m.id + '">' + e(m.label) + '</button>'; }).join('');
  Array.prototype.forEach.call($('menuNav').querySelectorAll('.item-nav'), function (b) { b.onclick = function () { pergi(b.getAttribute('data-id')); }; });
}
function pergi(id) {
  S.halaman = id; S.segar = null;
  $('bannerBaru').classList.add('hidden');
  Array.prototype.forEach.call($('menuNav').querySelectorAll('.item-nav'), function (b) { b.classList.toggle('aktif', b.getAttribute('data-id') === id); });
  var m = MENU.filter(function (x) { return x.id === id; })[0];
  $('kandungan').innerHTML = '<div class="rangka-muat" style="width:40%"></div><div class="rangka-muat"></div><div class="rangka-muat" style="width:85%"></div><div class="rangka-muat" style="width:70%"></div>';
  Promise.resolve().then(function () { return m.paparan(); })
    .catch(function (er) { $('kandungan').innerHTML = '<div class="amaran-kotak">' + e(er.message) + '</div>'; });
}

/* Muat semula senarai kelas selepas tindakan yang mengubahnya (segerak, sunting murid, naik tingkatan). */
function muatSemulaKelas() {
  return api('apiSenaraiKelas', {}, true).then(function (r) {
    S.kelasSenarai = r.kelas; S.cacheKelas = {};
    if (!r.kelas.some(function (k) { return k.kunci === S.kelasPilihan; })) S.kelasPilihan = r.kelas.length ? r.kelas[0].kunci : '';
  });
}

/* ---------- Penomboran generik (carian & halaman diproses di pelayan) ---------- */
function PG(k, lalai) { return S.pg[k] = S.pg[k] || Object.assign({ halaman: 1, saiz: 25, cari: '' }, lalai || {}); }
function palangPg(k, tanpaCari) {
  return (tanpaCari ? '' : '<input id="' + k + 'Cari" placeholder="Cari nama / No. KP…" style="max-width:240px" aria-label="Carian">') +
    '<select id="' + k + 'Saiz" aria-label="Baris setiap halaman"><option>10</option><option>25</option><option>50</option><option>100</option></select>';
}
function pasangPg(k, muat) {
  var st = PG(k), c = $(k + 'Cari'), sz = $(k + 'Saiz'), t;
  if (c) { c.value = st.cari; c.oninput = function () { clearTimeout(t); t = setTimeout(function () { st.cari = c.value; st.halaman = 1; muat(); }, 300); }; }
  if (sz) { sz.value = String(st.saiz); sz.onchange = function () { st.saiz = Number(sz.value); st.halaman = 1; muat(); }; }
}
function pagerHtml(r) {
  var h = r.halaman, jh = r.jumlahHalaman;
  return '<div class="pager"><span class="nota">' + r.jumlah + ' rekod · halaman ' + h + ' / ' + jh + '</span><span class="pager-kumpulan">' +
    '<button type="button" class="btn luar" data-pg="1"' + (h <= 1 ? ' disabled' : '') + '>« Pertama</button>' +
    '<button type="button" class="btn luar" data-pg="' + (h - 1) + '"' + (h <= 1 ? ' disabled' : '') + '>‹ Sebelum</button>' +
    '<button type="button" class="btn luar" data-pg="' + (h + 1) + '"' + (h >= jh ? ' disabled' : '') + '>Seterus ›</button>' +
    '<button type="button" class="btn luar" data-pg="' + jh + '"' + (h >= jh ? ' disabled' : '') + '>Akhir »</button></span></div>';
}
function pasangPager(k, kontena, muat) {
  Array.prototype.forEach.call(kontena.querySelectorAll('[data-pg]'), function (b) {
    b.onclick = function () { PG(k).halaman = Number(b.getAttribute('data-pg')); muat(); };
  });
}
/* Pastikan hanya jawapan permintaan TERKINI dipaparkan (elak jawapan lambat menimpa yang baharu). */
function permintaanTerkini() { var n = ++S.seq; return function () { return n === S.seq; }; }

/* ---------- Komponen pilih kelas ---------- */
function pilihKelasHtml(id, termasukSemua) {
  if (!S.kelasSenarai.length && !termasukSemua) return '';
  return '<select id="' + id + '" aria-label="Pilih kelas">' + (termasukSemua ? '<option value="">Semua kelas</option>' : '') +
    S.kelasSenarai.map(function (k) { return '<option value="' + e(k.kunci) + '"' + (k.kunci === S.kelasPilihan ? ' selected' : '') + '>' + e(k.nama) + ' (' + k.bilMurid + ')</option>'; }).join('') + '</select>';
}
function adaKelas() {
  if (S.kelasSenarai.length) return true;
  $('kandungan').innerHTML = '<div class="amaran-kotak">' + (S.user.peranan === ADMIN
    ? 'Belum ada murid. Pergi ke menu <b>Tetapan</b>/<b>Murid</b> dan jalankan <b>Segerak daripada e-Kokurikulum</b>.'
    : 'Tiada kelas ditetapkan kepada anda. Sila hubungi Admin untuk menetapkan kelas yang anda jaga.') + '</div>';
  return false;
}

      h += '<div class="kad"><h3>Status pengisian guru kelas</h3><div class="baris-alat" style="margin:0"><span class="lencana merah">Belum mula: ' + pk.BELUM_MULA + '</span><span class="lencana kuning">Dalam proses: ' + pk.DALAM_PROSES + '</span><span class="lencana hijau">Lengkap: ' + pk.LENGKAP + '</span>' +

    }
    if (admin && d.bilPerluSemak) h += '<div class="amaran-kotak"><b>' + d.bilPerluSemak + ' murid</b> baru dinaikkan tingkatan dan kelas barunya belum disahkan. Naikkan tingkatan di e-Kokurikulum, kemudian jalankan <b>Segerak daripada e-Kokurikulum</b> (menu Murid).</div>';
    if (admin && !d.arkibTahunIni) h += '<div class="info-kotak">Arkib tahun ' + e(d.tahun) + ' belum dibuat. Buat di menu <b>Arkib &amp; Naik Tingkatan</b> pada akhir tahun.</div>';
    if (!d.kelas.length) { h += '<div class="amaran-kotak">' + (admin ? 'Belum ada data murid. Jalankan <b>Segerak daripada e-Kokurikulum</b> di menu Murid.' : 'Tiada kelas ditetapkan kepada anda. Sila hubungi Admin.') + '</div>'; }

      h += '<div class="kad"><h3>Kemajuan mengikut kelas</h3><div class="jadual-skrol"><table><thead><tr><th>Kelas</th><th class="n">Murid</th><th>Kemajuan</th><th class="n">Purata CGPA</th><th class="n">A</th><th class="n">B</th><th class="n">C</th><th class="n">D</th><th class="n">E</th><th></th></tr></thead><tbody>' +

/* ---------- Pentaksiran kelas ---------- */
function muatDataKelas(kelas) {
  return api('apiDataKelas', { kelas: kelas }).then(function (d) { S.data = d; S.cacheKelas[kelas] = d; S.versi = d.versi || S.versi; return d; });
}

/* "Stale-while-revalidate": jika kelas ini pernah dimuat, paparkan serta-merta kemudian segarkan di latar belakang. */
function paparKelasSWR(render) {
  var kelas = S.kelasPilihan, cache = S.cacheKelas[kelas];
  var segar = muatDataKelas(kelas).then(function (d) {
    if (kelas !== S.kelasPilihan) return;
    if (!modalTerbuka() || !cache) render(d);
  });
  if (cache) { S.data = cache; render(cache); }
  return segar;
}

function halamanPentaksiran() {
  if (!adaKelas()) return;
  var id = S.halaman;
  S.segar = function () { if (S.halaman === id) paparKelasSWR(function () { renderPentaksiran(); }); };
  return paparKelasSWR(function () { if (S.halaman === id) renderPentaksiran(); });
}

function lencanaGred(g) { return g ? '<span class="lencana ' + e(g) + '">' + e(g) + '</span>' : '<span class="lencana">–</span>'; }

function renderPentaksiran() {
  var d = S.data;
  var h = '<h2 class="tajuk">Pentaksiran Kelas</h2><div class="baris-alat">' + pilihKelasHtml('pkKelas') +
    '<button class="btn hijau" id="btnSegerak">Segerak daripada e-Kokurikulum</button>' +
    '<span class="nota">Segerak terakhir: ' + e(d.segerakTerakhir || 'belum pernah') + '</span></div>';
  var perlu = d.murid.filter(function (m) { return m.perluSemak === 'YA'; }).length;
  var bilLengkap = d.murid.filter(function (m) { return m.kelengkapan && m.kelengkapan.status === 'LENGKAP'; }).length;
  if (d.murid.length) h += '<div class="info-kotak">Pengisian lengkap: <b>' + bilLengkap + ' / ' + d.murid.length + '</b> murid. Medan wajib bagi setiap aspek yang disertai: Jawatan, Pelibatan dan sekurang-kurangnya satu Komitmen; serta CGPA tahun sebelum bagi Tingkatan 2 ke atas.</div>';
  if (perlu) h += '<div class="amaran-kotak">' + perlu + ' murid dalam kelas ini baru dinaikkan tingkatan dan kelasnya belum disahkan melalui e-Kokurikulum.</div>';
  if (!d.murid.length) h += '<div class="amaran-kotak">Tiada murid dalam kelas ini. Tekan <b>Segerak daripada e-Kokurikulum</b>.</div>';
  else {
    h += '<div class="kad"><div class="jadual-skrol"><table><thead><tr><th>Bil</th><th>Nama</th><th class="n">PBB</th><th class="n">KP</th><th class="n">SP</th><th class="n">Ekstra</th><th class="n">GPA</th><th class="n">CGPA</th><th>Gred</th><th>Pengisian</th><th></th></tr></thead><tbody>' +
      d.murid.map(function (m, i) {
        var r = m.rumusan || {};
        return '<tr><td>' + (i + 1) + '</td><td>' + e(m.nama) + '<div class="nota">' + e(m.nokp) + '</div></td>' +
          '<td class="n">' + tanda(r.PBB) + '</td><td class="n">' + tanda(r.KP) + '</td><td class="n">' + tanda(r.SP) + '</td><td class="n">' + tanda(r.Ekstra) + '</td>' +
          '<td class="n">' + tanda(r.GPA) + '</td><td class="n"><b>' + tanda(r.CGPA) + '</b></td><td>' + lencanaGred(r.Gred) + '</td>' +
          '<td>' + (m.kelengkapan ? lencanaSt(m.kelengkapan.status) + (m.kelengkapan.kurang.length ? '<div class="nota">Belum: ' + m.kelengkapan.kurang.map(e).join('; ') + '</div>' : '') : '') + '</td>' +
          '<td><button class="btn kecil" data-nokp="' + e(m.nokp) + '">Isi / Kemaskini</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  $('kandungan').innerHTML = h;
  $('pkKelas').onchange = function () { S.kelasPilihan = this.value; halamanPentaksiran(); };
  $('btnSegerak').onclick = function () { segerakKoko(S.kelasPilihan, function () { halamanPentaksiran(); }); };
  Array.prototype.forEach.call($('kandungan').querySelectorAll('[data-nokp]'), function (b) { b.onclick = function () { bukaPentaksiran(b.getAttribute('data-nokp')); }; });
}

function segerakKoko(kelas, selesai, paksa) {
  api('apiSegerakKoko', { kelas: kelas || '', paksa: !!paksa }).then(function (r) {
    var l = r.laporan;
    S.versi = r.versi || S.versi;
    var h = '<h3>Segerak e-Kokurikulum selesai</h3><p>' + l.jumlahDiproses + ' murid disemak · <b>' + l.diubah + ' rekod dikemaskini</b> · ' + l.baharu + ' murid baharu · ' + l.kelasBerubah + ' bertukar kelas.' + (l.dariCache && !l.diubah ? ' <span class="nota">(e-Kokurikulum tiada perubahan sejak segerak terakhir)</span>' : '') + '</p>';
    if (l.tiadaDiKoko) h += '<div class="info-kotak">' + l.tiadaDiKoko + ' murid aktif dalam e-PAJSK tiada lagi dalam e-Kokurikulum (pindah/tamat) — tidak dipadam; Admin boleh menandakannya PINDAH di menu Murid.</div>';
    if (l.tingkatanBeza.length) h += '<div class="amaran-kotak"><b>Tingkatan berbeza (tidak diubah):</b><br>' + l.tingkatanBeza.slice(0, 15).map(e).join('<br>') + (l.tingkatanBeza.length > 15 ? '<br>… dan ' + (l.tingkatanBeza.length - 15) + ' lagi' : '') + '</div>';
    if (l.amaran.length) h += '<div class="amaran-kotak">' + l.amaran.map(e).join('<br>') + '</div>';
    h += '<div class="aksi-modal"><button class="btn" data-x="o">OK</button></div>';
    var m = bukaModal(h, true);
    m.querySelector('[data-x=o]').onclick = function () { tutupModal(m); };
    muatSemulaKelas().then(function () { if (selesai) selesai(); });
  }).catch(gagal);
}

/* ---------- Borang pentaksiran murid ---------- */
var FIELD_ASPEK = [
  ['Jawatan', 'JAWATAN', 'Jawatan'], ['Libat1', 'PELIBATAN', 'Pelibatan (aktiviti 1)'], ['Capai1', 'PENCAPAIAN', 'Pencapaian (aktiviti 1)'],
  ['Libat2', 'PELIBATAN', 'Pelibatan (tambahan aktiviti)'], ['Capai2', 'PENCAPAIAN', 'Pencapaian (tambahan aktiviti)'],
  ['Komit1', 'KOMITMEN', 'Komitmen 1'], ['Komit2', 'KOMITMEN', 'Komitmen 2'], ['Komit3', 'KOMITMEN', 'Komitmen 3'], ['Komit4', 'KOMITMEN', 'Komitmen 4'],
  ['Khidmat', 'KHIDMAT_SUMBANGAN', 'Khidmat sumbangan di peringkat sekolah']
];
var FIELD_EKSTRA = [
  ['Perkhidmatan', 'PERKHIDMATAN', 'Perkhidmatan'], ['AnugerahKhas', 'ANUGERAH_KHAS', 'Anugerah khas'], ['KhidmatMasyarakat', 'KHIDMAT_MASYARAKAT', 'Khidmat masyarakat'],
  ['Nilam', 'NILAM', 'NILAM'], ['TimmsPisa', 'TIMMS_PISA', 'TIMSS & PISA'], ['TugasKhas', 'TUGAS_KHAS', 'Tugas-tugas khas']
];

function selHtml(id, jenis, nilai) {
  var senarai = (S.ref.pilihan[jenis] || []);
  var ada = !nilai || senarai.some(function (x) { return x[0] === nilai; });
  return '<select id="' + id + '"><option value="">— tiada —</option>' +
    (ada ? '' : '<option value="' + e(nilai) + '" selected>' + e(nilai) + ' (tiada dalam senarai)</option>') +
    senarai.map(function (x) { return '<option value="' + e(x[0]) + '"' + (x[0] === nilai ? ' selected' : '') + ' title="' + e(x[0]) + '">' + e(x[0]) + '  [' + fmt(x[1]) + ']</option>'; }).join('') + '</select>';
}

function bukaPentaksiran(nokp) {
  var m = S.data.murid.filter(function (x) { return x.nokp === nokp; })[0];
  if (!m) return;
  var tabs = ['Maklumat'].concat(ASPEK).concat(['Ekstra']);
  var h = '<h3>' + e(m.nama) + '</h3><div class="nota" style="margin:-8px 0 10px">' + e(S.data.namaKelas) + ' · ' + e(m.nokp) + ' · ' + e(m.jantina) + '</div>' +
    '<div class="tab-bar">' + tabs.map(function (t, i) { return '<button type="button" data-tab="' + t + '" class="' + (i === 0 ? 'aktif' : '') + '">' + e(t === 'Maklumat' ? 'Maklumat & CGPA' : (t === 'Ekstra' ? 'Ekstra Kurikulum' : t + ' · ' + NAMA_ASPEK[t])) + '</button>'; }).join('') + '</div>';

  h += '<div class="panel-tab aktif" data-panel="Maklumat"><div class="grid-borang">' +
    '<div class="medan"><label>CGPA tahun sebelum (%)</label><input id="f_cgpa" type="number" min="0" max="100" step="0.01" value="' + e(m.cgpaSebelum) + '"><div class="nota">Kosongkan jika tiada (Tingkatan 1 / murid baharu). Diisi automatik selepas Naik Tingkatan.</div></div>' +
    '<div class="medan"><label>Sejarah CGPA tingkatan lain (untuk slip)</label><input id="f_sejarah" maxlength="300" value="' + e(m.sejarah) + '"></div>' +
    '<div class="penuh"><button type="button" class="btn luar" id="btnCadangan">Semak pencapaian daripada e-Kokurikulum</button><div id="kotakCadangan"></div></div></div></div>';

  ASPEK.forEach(function (a) {
    var r = m.aspek[a];
    h += '<div class="panel-tab" data-panel="' + a + '"><div class="grid-borang">' +
      '<div class="medan"><label>Unit / aktiviti (daripada e-Kokurikulum)</label><input id="f_' + a + '_Unit" value="' + e(r.Unit) + '" disabled></div>' +
      '<div class="medan"><label>Tambahan aktiviti (nama, jika ada)</label><input id="f_' + a + '_Aktiviti2" maxlength="120" value="' + e(r.Aktiviti2) + '"></div>' +
      FIELD_ASPEK.map(function (f) {
        return '<div class="medan' + (f[0] === 'Jawatan' || f[0] === 'Khidmat' ? ' penuh' : '') + '"><label>' + f[2] + '</label>' + selHtml('f_' + a + '_' + f[0], f[1], r[f[0]]) + '</div>';
      }).join('') +
      '<div class="medan"><label>Kehadiran daripada e-Kokurikulum (perjumpaan)</label><input value="' + e(r.KehadiranAuto) + '" disabled></div>' +
      '<div class="medan"><label>Kehadiran manual (0–12, ganti auto)</label><input id="f_' + a + '_KehadiranManual" type="number" min="0" max="12" step="1" value="' + e(r.KehadiranManual) + '"></div></div>' +
      '<div class="pratonton" id="prev_' + a + '"></div></div>';
  });

  h += '<div class="panel-tab" data-panel="Ekstra"><div class="grid-borang">' + FIELD_EKSTRA.map(function (f) {
    return '<div class="medan penuh"><label>' + f[2] + '</label>' + selHtml('f_E_' + f[0], f[1], m.ekstra[f[0]]) + '</div>';
  }).join('') + '</div><div class="pratonton" id="prev_E"></div></div>';

  h += '<div class="pratonton" id="prev_R" style="background:#eff6ff"></div>' +
    '<div class="aksi-modal"><button type="button" class="btn luar" data-x="b">Tutup</button><button type="button" class="btn hijau" data-x="s">Simpan</button></div>';
  var modal = bukaModal(h);

  Array.prototype.forEach.call(modal.querySelectorAll('[data-tab]'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(modal.querySelectorAll('[data-tab]'), function (x) { x.classList.toggle('aktif', x === b); });
      Array.prototype.forEach.call(modal.querySelectorAll('[data-panel]'), function (x) { x.classList.toggle('aktif', x.getAttribute('data-panel') === b.getAttribute('data-tab')); });
    };
  });
  modal.addEventListener('input', function () { kemasPratonton(m); });
  modal.addEventListener('change', function () { kemasPratonton(m); });
  modal.querySelector('[data-x=b]').onclick = function () { tutupModal(modal); };
  modal.querySelector('[data-x=s]').onclick = function () {
    var p = kumpulBorang(m);
    p.nokp = m.nokp;
    api('apiSimpanPentaksiran', p).then(function (r) {
      var i = S.data.murid.findIndex(function (x) { return x.nokp === m.nokp; });
      if (i >= 0) S.data.murid[i] = r.murid;
      S.versi = r.versi || S.versi;
      toast('Pentaksiran disimpan.', 'jaya');
      tutupModal(modal);
      renderPentaksiran();
    }).catch(gagal);
  };
  $('btnCadangan').onclick = function () { muatCadangan(m); };
  kemasPratonton(m);
}

function kumpulBorang(m) {
  var aspek = {};
  ASPEK.forEach(function (a) {
    var o = {};
    FIELD_ASPEK.forEach(function (f) { o[f[0]] = nilaiEl('f_' + a + '_' + f[0]); });
    o.Aktiviti2 = nilaiEl('f_' + a + '_Aktiviti2');
    o.KehadiranManual = nilaiEl('f_' + a + '_KehadiranManual');
    aspek[a] = o;
  });
  var ekstra = {};
  FIELD_EKSTRA.forEach(function (f) { ekstra[f[0]] = nilaiEl('f_E_' + f[0]); });
  return { aspek: aspek, ekstra: ekstra, cgpaSebelum: nilaiEl('f_cgpa'), sejarah: nilaiEl('f_sejarah') };
}

function kemasPratonton(m) {
  var p = kumpulBorang(m), markah = {};
  ASPEK.forEach(function (a) {
    var rec = Object.assign({}, p.aspek[a]);
    var auto = Number(m.aspek[a].KehadiranAuto) || 0;
    rec.Kehadiran = rec.KehadiranManual !== '' ? Number(rec.KehadiranManual) : auto;
    var k = kiraAspekMurni(rec, S.ref);
    markah[a] = k.Markah;
    var dup = [rec.Komit1, rec.Komit2, rec.Komit3, rec.Komit4].filter(Boolean);
    var ada = dup.length !== dup.filter(function (x, i) { return dup.indexOf(x) === i; }).length;
    $('prev_' + a).innerHTML = '<span>Jawatan <b>' + fmt(k.SkorJawatan) + '</b></span><span>Libat <b>' + fmt(k.SkorLibat) + '</b></span><span>Capai <b>' + fmt(k.SkorCapai) + '</b></span><span>Komitmen <b>' + fmt(k.SkorKomit) + '</b></span><span>Khidmat <b>' + fmt(k.SkorKhidmat) + '</b></span><span>Hadir <b>' + fmt(k.SkorKehadiran) + '</b> (' + rec.Kehadiran + ')</span><span>Skor <b>' + fmt(k.Skor) + '/110</b> = <b>' + fmt(k.Markah) + '%</b></span>' +
      (ada ? '<span style="color:#b45309">Pilihan komitmen yang sama hanya dikira sekali.</span>' : '');
  });
  var ek = kiraEkstraMurni(p.ekstra, S.ref);
  $('prev_E').innerHTML = '<span>Skor tertinggi ekstra kurikulum: <b>' + fmt(ek.SkorTertinggi) + '</b></span>';
  var cg = p.cgpaSebelum === '' ? '' : Number(p.cgpaSebelum);
  var r = kiraRumusanMurni(markah.PBB, markah.SP, markah.KP, ek.SkorTertinggi, cg, S.ref);
  $('prev_R').innerHTML = '<span>PBB <b>' + fmt(markah.PBB) + '</b></span><span>KP <b>' + fmt(markah.KP) + '</b></span><span>SP <b>' + fmt(markah.SP) + '</b></span><span>Purata 2 tertinggi <b>' + fmt(r.Purata2Tertinggi) + '</b></span><span>GPA <b>' + fmt(r.GPA) + '</b></span><span>CGPA <b>' + fmt(r.CGPA) + '</b></span><span>Gred <b>' + e(r.Gred || '–') + '</b> ' + e(r.Label) + '</span>';
}

function muatCadangan(m) {
  var k = $('kotakCadangan');
  k.innerHTML = '<div class="nota">Memuatkan…</div>';
  api('apiCadanganKoko', { nokp: m.nokp }, true).then(function (r) {
    if (!r.senarai.length) { k.innerHTML = '<div class="info-kotak" style="margin-top:10px">Tiada rekod pencapaian untuk murid ini dalam e-Kokurikulum bagi tahun ' + e(S.tetapan.tahun) + '.</div>'; return; }
    var pilihanSasaran = ASPEK.map(function (a) { return [1, 2].map(function (n) { return '<option value="' + a + '|' + n + '">' + a + ' · aktiviti ' + n + '</option>'; }).join(''); }).join('');
    k.innerHTML = '<div class="nota" style="margin:10px 0 6px">Cadangan sahaja — semak dan tekan <b>Guna</b> untuk mengisi borang (belum disimpan sehingga anda tekan Simpan).</div><div class="jadual-skrol"><table><thead><tr><th>Pertandingan</th><th>Peringkat</th><th>Pencapaian</th><th>Cadangan PAJSK</th><th>Isi ke</th><th></th></tr></thead><tbody>' +
      r.senarai.map(function (c, i) {
        var def = (c.aspekCadangan || 'SP') + '|1';
        return '<tr><td>' + e(c.pertandingan) + '<div class="nota">' + e(c.tarikh) + '</div></td><td>' + e(c.peringkat) + '</td><td>' + e(c.pencapaian) + '</td><td>' + (c.cadanganLibat ? 'Libat: ' + e(c.cadanganLibat) + '<br>' : '') + (c.cadanganCapai ? 'Capai: ' + e(c.cadanganCapai) : '') + (!c.cadanganLibat && !c.cadanganCapai ? '<span class="nota">tiada padanan</span>' : '') + '</td>' +
          '<td><select id="cs' + i + '">' + pilihanSasaran.replace('value="' + def + '"', 'value="' + def + '" selected') + '</select></td>' +
          '<td><button type="button" class="btn kecil" data-i="' + i + '"' + (!c.cadanganLibat && !c.cadanganCapai ? ' disabled' : '') + '>Guna</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    Array.prototype.forEach.call(k.querySelectorAll('[data-i]'), function (b) {
      b.onclick = function () {
        var i = Number(b.getAttribute('data-i')), c = r.senarai[i];
        var t = nilaiEl('cs' + i).split('|'), a = t[0], n = t[1];
        if (c.cadanganLibat) $('f_' + a + '_Libat' + n).value = c.cadanganLibat;
        if (c.cadanganCapai) $('f_' + a + '_Capai' + n).value = c.cadanganCapai;
        kemasPratonton(m);
        toast('Diisi ke ' + a + ' aktiviti ' + n + '. Jangan lupa Simpan.', 'info');
      };
    });
  }).catch(function (er) { k.innerHTML = '<div class="amaran-kotak" style="margin-top:10px">' + e(er.message) + '</div>'; });
}

/* ---------- Status pengisian guru kelas ---------- */
var LABEL_ST = { LENGKAP: 'Lengkap', DALAM_PROSES: 'Dalam proses', BELUM_MULA: 'Belum mula' };
var WARNA_ST = { LENGKAP: 'hijau', DALAM_PROSES: 'kuning', BELUM_MULA: 'merah' };
function lencanaSt(st) { return '<span class="lencana ' + (WARNA_ST[st] || '') + '">' + e(LABEL_ST[st] || st) + '</span>'; }

/* "PBB: 12 murid (Jawatan 10, Komitmen 8)" bagi setiap aspek yang belum lengkap dalam satu kelas. */
function senaraiKurangKelas(k) {
  var hasil = [];
  ASPEK.forEach(function (a) {
    var x = k.kurangAspek[a];
    if (!x) return;
    hasil.push(a + ' · ' + NAMA_ASPEK[a] + ': ' + x.murid + ' murid belum lengkap (' + Object.keys(x.medan).map(function (md) { return md + ' ' + x.medan[md]; }).join(', ') + ')');
  });
  if (k.kurangCgpa) hasil.push('CGPA tahun sebelum: ' + k.kurangCgpa + ' murid belum diisi');
  return hasil;
}

function halamanPengisian() {
  var st = PG('pi', { tapis: 'BELUM_SIAP', cari: '' });
  S.segar = function () { if (S.halaman === 'pengisian') halamanPengisian(); };
  return api('apiStatusPengisian').then(function (d) {
    if (S.halaman !== 'pengisian') return;
    S.pengisian = d;
    var admin = S.user.peranan === ADMIN;
    var tab = [['BELUM_SIAP', 'Belum siap (' + (d.kira.BELUM_MULA + d.kira.DALAM_PROSES) + ')'], ['BELUM_MULA', 'Belum mula (' + d.kira.BELUM_MULA + ')'],
      ['DALAM_PROSES', 'Dalam proses (' + d.kira.DALAM_PROSES + ')'], ['LENGKAP', 'Lengkap (' + d.kira.LENGKAP + ')'], ['SEMUA', 'Semua (' + d.guru.length + ')']];
    var h = '<h2 class="tajuk">Status Pengisian Guru Kelas · ' + e(d.tahun) + '</h2>' +
      '<div class="grid-kad"><div class="stat"><div class="label">Belum mula</div><div class="nilai" style="color:var(--merah)">' + d.kira.BELUM_MULA + '</div></div>' +
      '<div class="stat"><div class="label">Dalam proses</div><div class="nilai" style="color:var(--kuning)">' + d.kira.DALAM_PROSES + '</div></div>' +
      '<div class="stat"><div class="label">Lengkap</div><div class="nilai" style="color:var(--hijau)">' + d.kira.LENGKAP + '</div></div></div>' +
      '<div class="nota" style="margin-bottom:10px">Medan wajib bagi setiap aspek yang murid sertai: <b>' + e(d.peraturan.medanWajib.join(', ')) + '</b>' + (d.peraturan.cgpa ? ' serta <b>CGPA tahun sebelum</b> (Tingkatan 2 ke atas)' : '') + '. Pencapaian, khidmat sumbangan dan ekstra kurikulum adalah pilihan.</div>' +
      '<div class="baris-alat">' + (admin ? '<div class="tab-pil" id="piTab">' + tab.map(function (t) { return '<button type="button" data-t="' + t[0] + '" class="' + (st.tapis === t[0] ? 'aktif' : '') + '">' + e(t[1]) + '</button>'; }).join('') + '</div>' +
        '<input id="piCari" placeholder="Cari nama guru / kelas…" style="max-width:240px" value="' + e(st.cari) + '">' : '') +
      '<div class="rapat">' + (admin ? '<button class="btn luar" id="btnPiSalin">Salin senarai peringatan</button><button class="btn luar" id="btnPiCsv">Muat turun CSV</button>' : '') + '</div></div>' +
      '<div id="senaraiPi"></div>';
    if (admin && d.kelasTanpaGuru.length) h += '<div class="kad"><h3>Kelas tanpa guru kelas (' + d.kelasTanpaGuru.length + ')</h3>' + d.kelasTanpaGuru.map(function (k) { return '<div class="baris-kelas"><div class="atas"><b>' + e(k.nama) + '</b>' + lencanaSt(k.status) + '<span class="nota">' + k.lengkap + '/' + k.bil + ' lengkap</span></div></div>'; }).join('') + '<p class="nota">Tetapkan guru kelas di menu Pengguna.</p></div>';
    if (admin && d.guruTanpaKelas.length) h += '<div class="kad"><h3>Guru kelas belum ditetapkan kelas (' + d.guruTanpaKelas.length + ')</h3><p class="nota">' + d.guruTanpaKelas.map(function (g) { return e(g.nama); }).join(' · ') + '</p></div>';
    $('kandungan').innerHTML = h;
    renderSenaraiPengisian();
    if (admin) {
      Array.prototype.forEach.call($('piTab').querySelectorAll('[data-t]'), function (b) {
        b.onclick = function () { st.tapis = b.getAttribute('data-t'); Array.prototype.forEach.call($('piTab').querySelectorAll('[data-t]'), function (x) { x.classList.toggle('aktif', x === b); }); renderSenaraiPengisian(); };
      });
      var t; $('piCari').oninput = function () { var v = this.value; clearTimeout(t); t = setTimeout(function () { st.cari = v; renderSenaraiPengisian(); }, 250); };
      $('btnPiCsv').onclick = function () { muatTurunCsvPengisian(d); };
      $('btnPiSalin').onclick = function () { salinPeringatan(d); };
    }
  });
}

function guruDitapis() {
  var d = S.pengisian, st = PG('pi');
  var cari = String(st.cari || '').trim().toUpperCase();
  return d.guru.filter(function (g) {
    if (S.user.peranan === ADMIN) {
      if (st.tapis === 'BELUM_SIAP' && g.status === 'LENGKAP') return false;
      if (st.tapis !== 'BELUM_SIAP' && st.tapis !== 'SEMUA' && g.status !== st.tapis) return false;
    }
    if (cari && (g.nama + ' ' + g.kelas.map(function (k) { return k.nama; }).join(' ')).toUpperCase().indexOf(cari) === -1) return false;
    return true;
  });
}

function renderSenaraiPengisian() {
  var senarai = guruDitapis();
  var kont = $('senaraiPi');
  if (!senarai.length) { kont.innerHTML = '<div class="info-kotak">Tiada guru kelas dalam kategori ini.</div>'; return; }
  kont.innerHTML = senarai.map(function (g, gi) {
    return '<div class="kad-guru"><div class="kepala"><div><b>' + e(g.nama) + '</b> ' + lencanaSt(g.status) +
      '<div class="nota">Aktiviti pengisian terakhir: ' + e(g.aktivitiTerakhir || 'tiada') + '</div></div>' +
      '<div style="min-width:180px"><div class="bar"><div style="width:' + g.peratus + '%"></div></div><span class="nota">' + g.peratus + '% murid lengkap</span></div></div>' +
      g.kelas.map(function (k, ki) {
        var butiran;
        if (k.status === 'LENGKAP') butiran = '<div class="nota" style="color:var(--hijau)">Semua murid lengkap.</div>';
        else if (k.status === 'BELUM_MULA') butiran = '<div class="nota" style="color:var(--merah)">Belum memulakan pengisian bagi ' + k.bil + ' murid.</div>';
        else butiran = '<ul class="senarai-kurang">' + senaraiKurangKelas(k).map(function (x) { return '<li>' + e(x) + '</li>'; }).join('') + '</ul>';
        return '<div class="baris-kelas"><div class="atas"><b>' + e(k.nama) + '</b>' + lencanaSt(k.status) +
          '<span class="nota">Lengkap ' + k.lengkap + ' · Dalam proses ' + k.proses + ' · Belum mula ' + k.belum + ' (daripada ' + k.bil + ')</span>' +
          (k.murid.length ? '<button type="button" class="btn kecil luar" data-murid="' + gi + '-' + ki + '">Senarai murid belum lengkap</button>' : '') +
          '<button type="button" class="btn kecil" data-buka="' + e(k.kunci) + '">Buka kelas</button></div>' + butiran +
          '<div class="hidden" id="pim-' + gi + '-' + ki + '"></div></div>';
      }).join('') + '</div>';
  }).join('');
  Array.prototype.forEach.call(kont.querySelectorAll('[data-murid]'), function (b) {
    b.onclick = function () {
      var ix = b.getAttribute('data-murid').split('-'), k = senarai[Number(ix[0])].kelas[Number(ix[1])], el = $('pim-' + ix[0] + '-' + ix[1]);
      if (!el.innerHTML) el.innerHTML = '<div class="jadual-skrol" style="margin-top:8px"><table><thead><tr><th>Nama</th><th>Status</th><th>Belum diisi</th></tr></thead><tbody>' +
        k.murid.map(function (m) { return '<tr><td>' + e(m.nama) + '</td><td>' + lencanaSt(m.status) + '</td><td>' + (m.status === 'BELUM_MULA' ? '<span class="nota">Semua</span>' : m.kurang.map(e).join('<br>')) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      el.classList.toggle('hidden');
    };
  });
  Array.prototype.forEach.call(kont.querySelectorAll('[data-buka]'), function (b) {
    b.onclick = function () { S.kelasPilihan = b.getAttribute('data-buka'); pergi('pentaksiran'); };
  });
}

function teksRingkasKelas(k) {
  if (k.status === 'BELUM_MULA') return 'Belum mula (' + k.bil + ' murid)';
  if (k.status === 'LENGKAP') return 'Lengkap';
  return 'Dalam proses, ' + k.lengkap + '/' + k.bil + ' lengkap — ' + senaraiKurangKelas(k).join('; ');
}

function salinPeringatan(d) {
  var belum = d.guru.filter(function (g) { return g.status !== 'LENGKAP'; });
  var teks = 'PERINGATAN PENGISIAN e-PAJSK ' + d.tahun + '\n' + (belum.length ? belum.map(function (g, i) {
    return (i + 1) + '. ' + g.nama + '\n' + g.kelas.filter(function (k) { return k.status !== 'LENGKAP'; }).map(function (k) { return '   - ' + paparKelasJs(k.kunci) + ': ' + teksRingkasKelas(k); }).join('\n');

            '<td style="white-space:nowrap"><button class="btn kecil" data-e="' + i + '">Sunting</button> <button class="btn kecil luar" data-r="' + i + '">Reset KW</button> <button class="btn kecil merah" data-d="' + i + '">Padam</button></td></tr>';
        }).join('') : '<tr><td colspan="6" class="nota">Tiada rekod.</td></tr>') + '</tbody></table></div>' + pagerHtml(r) + '</div>';
      pasangPager(k, kont, muat);
      var cari = function (a) { return r.senarai[Number(a)]; };
      Array.prototype.forEach.call(kont.querySelectorAll('[data-e]'), function (b) { b.onclick = function () { borangPengguna(cari(b.getAttribute('data-e')), muat); }; });
      Array.prototype.forEach.call(kont.querySelectorAll('[data-r]'), function (b) {
        b.onclick = function () { var u = cari(b.getAttribute('data-r')); sahkan('Set semula kata laluan ' + u.nama + ' kepada 6 digit terakhir No. KP?', function () { api('apiResetPassword', { nokp: u.nokp }).then(function () { toast('Kata laluan di-set semula.', 'jaya'); muat(); }).catch(gagal); }, 'Reset'); };
      });
      Array.prototype.forEach.call(kont.querySelectorAll('[data-d]'), function (b) {
        b.onclick = function () { var u = cari(b.getAttribute('data-d')); sahkan('Padam pengguna ' + u.nama + '? Pertimbangkan menukar status kepada TIDAK AKTIF sahaja.', function () { api('apiPadamPengguna', { nokp: u.nokp }).then(function () { toast('Dipadam.', 'jaya'); muat(); }).catch(gagal); }, 'Padam'); };
      });
    }).catch(gagal);
  };
  S.segar = muat;
  pasangPg(k, muat);
  $('btnTambahUser').onclick = function () { borangPengguna(null, muat); };
  $('btnImportGuru').onclick = function () {
    sahkan('Import semua guru daripada Sheet PENGGUNA e-Kokurikulum (yang belum ada) sebagai Guru Kelas?', function () {
      api('apiImportGuruKoko').then(function (x) { toast(x.ditambah + ' guru ditambah, ' + x.sediaAda + ' sedia ada dilangkau.', 'jaya'); muat(); }).catch(gagal);

}
function borangPengguna(u, selesai) {

      '<div class="medan"><label>No. KP (12 digit)</label><input id="puKp" inputmode="numeric" maxlength="14" value="' + e(u.nokp) + '"' + (baru ? '' : ' disabled') + '></div>' +
      '<div class="medan"><label>Nama penuh</label><input id="puNama" value="' + e(u.nama) + '"></div>' +

      (kr.kelas.length ? kr.kelas.map(function (k) { return '<label><input type="checkbox" class="puKelas" value="' + e(k.kunci) + '"' + (u.kelas.indexOf(k.kunci) !== -1 ? ' checked' : '') + '>' + e(k.nama) + '</label>'; }).join('') : '<span class="nota">Belum ada kelas — segerak murid daripada e-Kokurikulum dahulu.</span>') + '</div></div></div>' +
      '<div class="aksi-modal"><button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">Simpan</button></div>');
    var togol = function () { $('puKelasWrap').classList.toggle('hidden', nilaiEl('puPeranan') !== 'GURU_KELAS'); };

        .then(function () { tutupModal(modal); toast('Disimpan.', 'jaya'); if (selesai) selesai(); }).catch(gagal);
    };
  }).catch(gagal);
}

/* ---------- Tetapan (Admin) ---------- */

      '<div class="grid-borang"><div class="medan"><label>Auto-segerak</label><select id="asAktif"><option value="1"' + (t.autoSegerak.aktif ? ' selected' : '') + '>Hidup</option><option value="0"' + (!t.autoSegerak.aktif ? ' selected' : '') + '>Mati</option></select></div>' +
      '<div class="medan"><label>Semak setiap</label><select id="asMinit">' + [1, 5, 10, 15, 30].map(function (m) { return '<option value="' + m + '"' + (t.autoSegerak.minit === m ? ' selected' : '') + '>' + m + ' minit</option>'; }).join('') + '</select><div class="nota">Disyorkan 5 minit.</div></div></div>' +

      '<hr style="border:none;border-top:1px solid var(--sempadan);margin:16px 0"><p class="nota"><b>Segera (pilihan):</b> e-Kokurikulum boleh memanggil URL ping rahsia selepas menyimpan data supaya e-PAJSK segerak serta-merta. Rujuk README untuk kod ringkas bagi e-Kokurikulum.</p>' +
      '<div class="aksi-modal" style="justify-content:flex-start"><button class="btn luar" id="btnPing">Papar / jana URL ping</button></div><div id="kotakPing"></div></div>' +
      '<div class="kad"><h3>Jadual skor (Sheet REFERENSI)</h3><p class="nota">' + Object.keys(kira).map(function (k) { return e(k) + ': ' + kira[k]; }).join(' · ') + '</p>' +
      '<p class="nota">Sunting jadual skor terus dalam Sheet <b>REFERENSI</b> (lajur JENIS / KOD / NILAI). Perubahan dikesan serta-merta (atau guna menu <i>Sistem e-PAJSK → Kosongkan Semua Cache</i> jika disunting melalui cara lain). Kemudian tekan butang di bawah untuk mengira semula semua markah.</p>' +
      '<button class="btn luar" id="btnKiraSemula">Kira semula semua markah</button></div>';
    $('btnSimpanTet').onclick = function () {

        .then(function () { toast('Tetapan disimpan.', 'jaya'); return api('apiTetapan'); }).then(function (r) { S.tetapan = r; }).catch(gagal);
    };
    $('btnSimpanAuto').onclick = function () {
      api('apiAutoSegerak', { aktif: nilaiEl('asAktif') === '1', minit: nilaiEl('asMinit') }).then(function (r) {
        if (r.amaran) { var m = bukaModal('<h3>Tetapan disimpan — pencetus belum dipasang</h3><p>' + e(r.amaran) + '</p><div class="aksi-modal"><button class="btn" data-x="o">OK</button></div>', true); m.querySelector('[data-x=o]').onclick = function () { tutupModal(m); halamanTetapan(); }; }

        $('btnPingBaru').onclick = function () { sahkan('Kunci lama akan berhenti berfungsi. Jana kunci baharu?', function () { api('apiKunciPing', { jana: true }).then(function () { $('btnPing').click(); }).catch(gagal); }, 'Jana'); };

/* ---------- Arkib & Naik Tingkatan (Admin) ---------- */
function halamanArkib() {
  return api('apiStatusArkib').then(function (s) {
    var sudahArkib = !!s.arkibSemasa, sudahNaik = sudahArkib && s.arkibSemasa.naik === 'YA';
    var h = '<h2 class="tajuk">Arkib &amp; Naik Tingkatan</h2><div class="info-kotak">Lakukan pada akhir tahun <b>mengikut turutan</b>: <b>(1) Arkib tahun ' + e(s.tahun) + '</b> → <b>(2) Naik Tingkatan</b>. Selepas itu, naikkan tingkatan di e-Kokurikulum dan jalankan <i>Segerak</i> supaya kelas baharu disahkan.</div>';
    h += '<div class="grid-kad"><div class="stat"><div class="label">Murid aktif</div><div class="nilai">' + s.bilMurid + '</div></div>' +
      [1, 2, 3, 4, 5].map(function (t) { return '<div class="stat"><div class="label">Tingkatan ' + t + '</div><div class="nilai">' + s.bilTingkatan[t] + '</div></div>'; }).join('') +
      '<div class="stat ' + (s.tanpaMarkah ? 'amaran' : '') + '"><div class="label">Belum ada markah</div><div class="nilai">' + s.tanpaMarkah + '</div></div></div>';
    h += '<div class="kad"><h3>Langkah 1 — Arkib tahun ' + e(s.tahun) + '</h3>' +
      (sudahArkib ? '<p>Diarkibkan pada ' + e(s.arkibSemasa.tarikh) + ' · <a href="' + e(s.arkibSemasa.url) + '" target="_blank" rel="noopener">Buka fail arkib</a></p>' : '<p class="nota">Menyimpan salinan penuh tahun ini (murid, pentaksiran, rumusan, jadual skor) ke satu Google Sheet baharu dalam Drive.</p>') +
      (s.tanpaMarkah ? '<div class="amaran-kotak">' + s.tanpaMarkah + ' murid aktif belum mempunyai markah. Mereka tetap diarkibkan tetapi CGPA mereka tidak akan dibawa ke tahun hadapan.</div>' : '') +
      (sudahNaik ? '<p class="nota">Tahun ini sudah dinaikkan tingkatan.</p>' : '<div class="baris-alat"><input id="arkSah" placeholder="Taip ARKIB" style="max-width:160px">' + (sudahArkib ? '<label style="font-size:13px"><input type="checkbox" id="arkGanti" style="width:auto"> Ganti arkib sedia ada</label>' : '') + '<button class="btn" id="btnArkib">Arkib Tahun ' + e(s.tahun) + '</button></div>') + '</div>';
    h += '<div class="kad"><h3>Langkah 2 — Naik Tingkatan</h3>' + (!sudahArkib ? '<p class="nota">Dikunci sehingga arkib tahun ' + e(s.tahun) + ' dibuat.</p>' : (sudahNaik ? '<p>Sudah dilaksanakan. Tahun pentaksiran semasa: <b>' + e(s.tahun) + '</b>.</p>' :
      '<ul class="nota"><li>CGPA tahun ' + e(s.tahun) + ' menjadi CGPA tahun sebelum bagi tahun hadapan dan ditambah pada sejarah CGPA.</li><li>Tingkatan 1–4 dinaikkan; Tingkatan 5 (' + s.bilTingkatan[5] + ' murid) ditanda <b>TAMAT</b>.</li><li>Data pentaksiran ' + e(s.tahun) + ' dikosongkan daripada sistem aktif (kekal dalam arkib).</li><li>Tidak boleh dibatalkan daripada antara muka — pastikan arkib betul dahulu.</li></ul>' +
      '<div class="grid-borang"><div class="medan"><label>Tahun pentaksiran baharu</label><input id="nkTahun" type="number" value="' + (s.tahun + 1) + '"></div><div class="medan"><label>Taip NAIK TINGKATAN</label><input id="nkSah"></div>' +
      '<div class="medan penuh"><label style="font-weight:400"><input type="checkbox" id="nkGuru" checked style="width:auto"> Kosongkan penetapan kelas Guru Kelas (tetapkan semula untuk tahun baharu)</label></div></div>' +
      '<div class="aksi-modal"><button class="btn merah" id="btnNaik">Naik Tingkatan</button></div>')) + '</div>';
    h += '<div class="kad"><h3>Sejarah arkib</h3>' + (s.arkib.length ? '<div class="jadual-skrol"><table><thead><tr><th>Tahun</th><th>Tarikh arkib</th><th>Oleh</th><th class="n">Murid</th><th>Naik tingkatan</th><th></th></tr></thead><tbody>' +
      s.arkib.map(function (a, i) { return '<tr><td>' + e(a.tahun) + '</td><td>' + e(a.tarikh) + '</td><td>' + e(a.oleh) + '</td><td class="n">' + e(a.bilMurid) + '</td><td>' + (a.naik === 'YA' ? 'Ya (' + e(a.tarikhNaik) + ')' : 'Belum') + '</td><td><button class="btn kecil" data-lihat="' + i + '">Lihat</button> <a class="btn kecil luar" href="' + e(a.url) + '" target="_blank" rel="noopener">Buka Sheet</a></td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="nota">Belum ada arkib.</p>') + '</div><div id="paparArkib"></div>';
    $('kandungan').innerHTML = h;
    if ($('btnArkib')) $('btnArkib').onclick = function () {
      api('apiArkibTahun', { pengesahan: nilaiEl('arkSah'), ganti: $('arkGanti') ? $('arkGanti').checked : false }).then(function (r) { toast('Arkib tahun ' + r.tahun + ' berjaya dibuat.', 'jaya'); halamanArkib(); }).catch(gagal);
    };
    if ($('btnNaik')) $('btnNaik').onclick = function () {
      sahkan('Naikkan tingkatan semua murid dan mulakan tahun ' + nilaiEl('nkTahun') + '? Tindakan ini tidak boleh dibatalkan daripada antara muka.', function () {
        api('apiNaikTingkatan', { pengesahan: nilaiEl('nkSah'), tahunBaharu: nilaiEl('nkTahun'), kosongkanGuruKelas: $('nkGuru').checked }).then(function (r) {
          toast('Selesai: ' + r.naik + ' dinaikkan, ' + r.tamat + ' tamat. Tahun baharu ' + r.tahunBaharu + '.', 'jaya');
          return Promise.all([api('apiTetapan', {}, true), api('apiSenaraiKelas', {}, true)]);
        }).then(function (x) { S.tetapan = x[0]; S.kelasSenarai = x[1].kelas; S.cacheKelas = {}; if ($('infoTahun')) $('infoTahun').textContent = S.tetapan.tahun; halamanArkib(); }).catch(gagal);
      }, 'Naik Tingkatan');
    };
    Array.prototype.forEach.call($('kandungan').querySelectorAll('[data-lihat]'), function (b) {
      b.onclick = function () { lihatArkib(s.arkib[Number(b.getAttribute('data-lihat'))].id, ''); };
    });
  });
}
function lihatArkib(id, kelas) {
  var k = 'ark', st = PG(k), baru = st.id !== id;
  if (baru) { st.id = id; st.halaman = 1; st.cari = ''; }
  st.kelas = kelas === undefined ? st.kelas : kelas;
  api('apiLihatArkib', { id: id, kelas: st.kelas || '', halaman: st.halaman, saiz: st.saiz, cari: st.cari }).then(function (r) {
    st.halaman = r.halaman;
    $('paparArkib').innerHTML = '<div class="kad"><h3>Arkib ' + e(r.tahun) + '</h3><div class="baris-alat"><select id="arkKelas"><option value="">Semua kelas</option>' + r.kelas.map(function (kk) { return '<option value="' + e(kk) + '"' + (kk === st.kelas ? ' selected' : '') + '>' + e(paparKelasJs(kk)) + '</option>'; }).join('') + '</select><input id="arkCari" placeholder="Cari nama / No. KP…" style="max-width:240px" value="' + e(st.cari) + '"></div><div class="jadual-skrol"><table><thead><tr><th>Nama</th><th>Kelas</th><th class="n">PBB</th><th class="n">SP</th><th class="n">KP</th><th class="n">GPA</th><th class="n">CGPA</th><th>Gred</th></tr></thead><tbody>' +
      r.senarai.map(function (m) { return '<tr><td>' + e(m.nama) + '</td><td>' + e(paparKelasJs(m.kunciKelas)) + '</td><td class="n">' + tanda(m.pbb) + '</td><td class="n">' + tanda(m.sp) + '</td><td class="n">' + tanda(m.kp) + '</td><td class="n">' + tanda(m.gpa) + '</td><td class="n"><b>' + tanda(m.cgpa) + '</b></td><td>' + lencanaGred(m.gred) + '</td></tr>'; }).join('') + '</tbody></table></div>' + pagerHtml(r) + '</div>';
    $('arkKelas').onchange = function () { st.halaman = 1; lihatArkib(id, this.value); };
    var t; $('arkCari').oninput = function () { var v = this.value; clearTimeout(t); t = setTimeout(function () { st.cari = v; st.halaman = 1; lihatArkib(id); }, 300); };
    pasangPager(k, $('paparArkib'), function () { lihatArkib(id); });
    if (st.cari) { var ci = $('arkCari'); ci.focus(); ci.setSelectionRange(ci.value.length, ci.value.length); }
    if (baru) $('paparArkib').scrollIntoView({ behavior: 'smooth' });
  }).catch(gagal);
}

/* ---------- Log audit ---------- */
function halamanAudit() {
  var k = 'au';
  $('kandungan').innerHTML = '<h2 class="tajuk">Log Audit</h2><div class="baris-alat">' + palangPg(k, true) + '<span class="nota">Terbaharu dahulu</span></div><div id="senaraiAudit"><div class="rangka-muat"></div><div class="rangka-muat"></div></div>';
  var st = PG(k);
  var muat = function () {
    var terkini = permintaanTerkini();
    api('apiSenaraiAudit', { halaman: st.halaman, saiz: st.saiz }).then(function (r) {
      if (!terkini() || S.halaman !== 'audit') return;
      st.halaman = r.halaman;
      var kont = $('senaraiAudit');
      kont.innerHTML = '<div class="kad"><div class="jadual-skrol"><table><thead><tr><th>Tarikh</th><th>Pengguna</th><th>Tindakan</th><th>Modul</th><th>Butiran</th></tr></thead><tbody>' +
        r.senarai.map(function (a) { return '<tr><td style="white-space:nowrap">' + e(a.tarikh) + '</td><td>' + e(a.nama) + '<div class="nota">' + e(a.peranan) + '</div></td><td>' + e(a.tindakan) + '</td><td>' + e(a.modul) + '</td><td>' + e(a.butiran) + '</td></tr>'; }).join('') + '</tbody></table></div>' + pagerHtml(r) + '</div>';
      pasangPager(k, kont, muat);

}

/* ---------- Mula ---------- */
(function () {
  var t = bacaToken();
  if (!t) return;
  S.token = t;
  mulaAplikasi();
})();
</script>
