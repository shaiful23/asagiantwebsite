<script>
/* =========================================================================
 * JsKejohanan — Modul Kejohanan Olahraga Tahunan (mula hingga akhir).
 * Data modul dimuat dalam SATU panggilan (apiKejohanan) dan dikongsi semua
 * halaman modul; butiran acara/pendaftaran dimuat apabila perlu sahaja.
 * ========================================================================= */
var STATUS_KJ = { DIRANCANG: ['Dirancang', ''], SEDIA: ['Senarai mula sedia', 'biru'], SARINGAN: ['Saringan selesai', 'ungu'], SELESAI: ['Selesai', 'hijau'] };
var JENIS_KJ = { BALAPAN: 'Balapan', PADANG: 'Padang', BERGANTI: 'Berganti-ganti' };
var UNIT_KJ = { MASA: 'Masa', JARAK: 'Jarak (m)', TINGGI: 'Tinggi (m)' };

function muatKj(segar) { return api('apiKejohanan', {}, { segar: !!segar }).then(function (r) { S.kj = r; return r; }); }
function kjAcara(id) { return (S.kj.acara || []).filter(function (a) { return a.id === id; })[0]; }
function labelAcara(a) { return a.nama + ' · ' + (a.kategori || 'Terbuka') + ' ' + namaJantina(a.jantina); }
function lencanaStatus(s) { var x = STATUS_KJ[s] || [s, '']; return '<span class="lencana ' + x[1] + '">' + e(x[0]) + '</span>'; }
function ikonJenis(j) { return j === 'PADANG' ? 'ruler' : j === 'BERGANTI' ? 'users' : 'run'; }
function warnaJenis(j) { return j === 'PADANG' ? '#1f9254' : j === 'BERGANTI' ? '#6d28d9' : '#c8462b'; }
function rumahKj(id) { return (S.kj.rumah || []).filter(function (r) { return r.id === id; })[0] || null; }
function lencanaRumahKj(id) { return lencanaRumah(rumahKj(id)); }
function pilihanKategoriKj(dipilih, kosong) { return pilihan((S.kj.kategori || []).map(function (k) { return { v: k.kod, l: k.kod + ' — ' + k.nama }; }), dipilih, kosong); }
function selepasTulisKj(mesej, halaman, arg) { toast(mesej, 'jaya'); muatKj(true).then(function () { pergi(halaman || S.halaman, arg); }).catch(gagal); }

/* Kawasan cetak (laporan dicetak tanpa membuka tetingkap baharu) */
function cetak(tajuk, html) {
  var k = $('kawasanCetak');
  if (!k) { k = document.createElement('div'); k.id = 'kawasanCetak'; document.body.appendChild(k); }
  k.innerHTML = '<div class="kepala-cetak"><img src="' + LOGO + '" alt=""><div><b>SMK ASAJAYA</b><div>' + e(S.kj ? S.kj.tet.nama + ' ' + S.kj.tet.tahun : '') + '</div><h1>' + e(tajuk) + '</h1></div></div>' + html +
    '<div class="kaki-cetak">Dicetak pada ' + e(new Date().toLocaleString('ms-MY')) + ' · Sistem Rumah Sukan SMK Asajaya</div>';
  document.body.classList.add('mod-cetak');
  setTimeout(function () { window.print(); setTimeout(function () { document.body.classList.remove('mod-cetak'); }, 300); }, 120);
}

/* ================================ PUSAT KEJOHANAN ================================ */
HALAMAN['kj-pusat'] = function () {
  muatKj().then(function (r) {
    var t = r.tet, kb = r.kebenaran;
    var selesai = r.acara.filter(function (a) { return a.status === 'SELESAI'; }).length;
    var penyertaan = r.acara.reduce(function (n, a) { return n + a.bilPeserta; }, 0);
    var rekodBaru = r.acara.filter(function (a) { return a.rekodBaharu; }).length;
    var h = '<div class="hero"><div class="baris-hero"><div><div class="salam">Pusat Kejohanan · ' + e(t.tahun) + '</div><h1>' + e(t.nama) + '</h1>' +
      '<span class="cip">' + ik('calendar', 'kecil') + e(t.tarikh ? tarikhPapar(t.tarikh) : 'Tarikh belum ditetapkan') + '</span>' + (t.lokasi ? '<span class="cip">' + ik('pin', 'kecil') + e(t.lokasi) + '</span>' : '') +
      '<span class="cip">' + ik(t.pendaftaran === 'BUKA' ? 'check' : 'lock', 'kecil') + 'Pendaftaran ' + (t.pendaftaran === 'BUKA' ? 'dibuka' : 'ditutup') + '</span>' +
      '<span class="cip">' + ik('megaphone', 'kecil') + (t.terbit ? 'Keputusan diterbitkan' : 'Belum diterbitkan') + '</span></div>' + kiraanHtml(t.tarikh) + '</div></div>';
    // stepper fasa
    var jalan = r.fasa.findIndex(function (f) { return f.peratus < 100; });
    h += '<div class="kad blok"><div class="kepala-kad"><h3>' + ik('flag') + 'Perjalanan Kejohanan</h3><span class="nota">Dari persediaan hingga keputusan rasmi</span></div><div class="langkah">' + r.fasa.map(function (f, i) {
      var kls = f.peratus >= 100 ? 'siap' : i === jalan ? 'jalan' : '';
      return '<div class="l ' + kls + '"><div class="bulat">' + ik(f.peratus >= 100 ? 'check' : f.ikon, 'besar') + '</div><div><div class="nm">' + (i + 1) + '. ' + e(f.nama) + '</div><div class="pc">' + f.peratus + '%</div><div class="bt">' + e(f.butiran) + '</div></div></div>';
    }).join('') + '</div></div>';
    h += '<div class="grid auto blok">' + kpi('Acara', r.acara.length, 'calendar', 'biru', JENIS_KJ.BALAPAN + ' ' + r.acara.filter(function (a) { return a.jenis === 'BALAPAN'; }).length + ' · Padang ' + r.acara.filter(function (a) { return a.jenis === 'PADANG'; }).length + ' · Berganti ' + r.acara.filter(function (a) { return a.jenis === 'BERGANTI'; }).length) +
      kpi('Penyertaan', nomborFormat(penyertaan), 'run', 'trek', 'atlet / pasukan berdaftar') +
      kpi('Acara Selesai', selesai + '/' + r.acara.length, 'timer', 'hijau', r.acara.length ? Math.round(selesai / r.acara.length * 100) + '% siap' : '') +
      kpi('Pecah Rekod', rekodBaru, 'star', 'kuning', rekodBaru ? 'acara dengan rekod baharu' : 'belum ada') + '</div>';
    // papan mata + keputusan terkini
    var ked = r.kedudukan, adaMata = ked.some(function (x) { return x.jumlah > 0; });
    h += '<div class="grid k-1-1 blok"><div class="kad"><div class="kepala-kad"><h3>' + ik('trophy') + 'Papan Mata Langsung</h3><button class="btn luar kecil" onclick="pergi(\'kj-mata\')">Butiran ' + ik('kanan', 'kecil') + '</button></div>' +
      (adaMata ? podiumHtml(ked.slice(0, 3).map(function (x) { return { nama: x.nama, nilai: x.jumlah, warna: x.warna }; })) + '<div style="margin-top:14px">' +
        cartaHbar(ked.map(function (x) { return { label: x.nama, nilai: x.jumlah, warna: x.warna, prefix: pingat(x.kedudukan) + ' ' }; })) + '</div>' : kosongHtml('Belum ada mata.', 'trophy')) + '</div>';
    h += '<div class="kad"><div class="kepala-kad"><h3>' + ik('bolt') + 'Keputusan Terkini</h3><button class="btn luar kecil" onclick="pergi(\'kj-keputusan\')">Semua ' + ik('kanan', 'kecil') + '</button></div>' +
      (r.terkini.length ? '<div style="display:grid;gap:10px">' + r.terkini.map(function (id) {
        var a = kjAcara(id);
        return '<div class="kad-acara" style="cursor:pointer" onclick="pergi(\'kj-keputusan\',\'' + e(a.id) + '\')"><span class="jalur" style="background:' + warnaJenis(a.jenis) + '"></span><div class="nm">' + e(labelAcara(a)) + '</div><div class="mt">' +
          a.podium.map(function (p) { return '<span>' + pingat(p.kedudukan) + ' ' + e(p.nama || (rumahKj(p.rumahId) || {}).nama || '') + ' <b class="papan" style="font-size:15px">' + e(p.keputusan) + '</b>' + (p.rekodBaharu ? ' ' + ik('star', 'kecil') : '') + '</span>'; }).join('') + '</div></div>';
      }).join('') + '</div>' : kosongHtml('Belum ada acara selesai.', 'timer')) + '</div></div>';
    // status acara
    var bil = { DIRANCANG: 0, SEDIA: 0, SARINGAN: 0, SELESAI: 0 };
    r.acara.forEach(function (a) { bil[a.status] = (bil[a.status] || 0) + 1; });
    h += '<div class="grid k-1-1 blok"><div class="kad"><h3>' + ik('target') + 'Status Acara</h3>' + cartaDonut([
      { label: 'Dirancang', nilai: bil.DIRANCANG, warna: '#cbd5e1' }, { label: 'Senarai mula sedia', nilai: bil.SEDIA, warna: '#1d4ed8' },
      { label: 'Saringan selesai', nilai: bil.SARINGAN, warna: '#6d28d9' }, { label: 'Selesai', nilai: bil.SELESAI, warna: '#1f9254' }], r.acara.length, 'acara') + '</div>';
    h += '<div class="kad"><h3>' + ik('bolt') + 'Tindakan Pantas</h3><div class="grid k2" style="gap:10px">' +
      (kb.admin ? '<button class="btn luar" onclick="pergi(\'kj-tetapan\')">' + ik('sliders') + 'Tetapan kejohanan</button><button class="btn luar" onclick="pergi(\'kj-acara\')">' + ik('calendar') + 'Urus acara</button>' : '') +
      (kb.rumahUrus.length ? '<button class="btn" onclick="pergi(\'kj-daftar\')">' + ik('run') + 'Daftar atlet</button>' : '') +
      (kb.keputusan ? '<button class="btn hijau" onclick="pergi(\'kj-keputusan\')">' + ik('timer') + 'Masukkan keputusan</button>' : '') +
      '<button class="btn luar" onclick="pergi(\'kj-laporan\')">' + ik('printer') + 'Laporan & cetak</button><button class="btn luar" onclick="pergi(\'kj-rekod\')">' + ik('star') + 'Rekod kejohanan</button></div>' +
      '<div class="nota" style="margin-top:12px">Akses anda: ' + (kb.admin ? 'Admin (penuh)' : [kb.keputusan ? 'keputusan & jadual' : '', kb.rumahUrus.length ? 'pendaftaran atlet rumah' : ''].filter(Boolean).join(', ') || 'lihat sahaja') + '</div></div></div>';
    kandungan(h);
  }).catch(ralatHalaman);
};

/* ================================ ACARA & JADUAL ================================ */
HALAMAN['kj-acara'] = function () {
  muatKj().then(function (r) {
    S.ubah.jadual = {};
    var kb = r.kebenaran;
    var aksi = (kb.admin ? '<button class="btn luar" id="kaSalin">' + ik('copy') + '<span class="teks-panjang">Salin tahun lepas</span></button><button class="btn luar" id="kaStandard">' + ik('layers') + 'Jana acara standard</button><button class="btn" id="kaTambah">' + ik('plus') + 'Tambah acara</button>' : '') +
      (kb.keputusan ? '<button class="btn luar" id="kaJadualAuto">' + ik('clock') + '<span class="teks-panjang">Jana jadual automatik</span></button>' : '') +
      '<button class="btn luar" id="kaCetak">' + ik('printer') + '<span class="teks-panjang">Cetak jadual</span></button>';
    var h = kepalaHalaman('Acara & Jadual', 'Senarai acara ' + e(r.tet.tahun) + '. No. acara, tarikh & masa dijana <b>automatik</b> — acara padang pada ' + e((r.tet.tarikhPadang ? tarikhPapar(r.tet.tarikhPadang) : 'hari 1')) + ', balapan pada ' + e((r.tet.tarikhBalapan1 ? tarikhPapar(r.tet.tarikhBalapan1) : 'hari 2')) + ' & ' + e((r.tet.tarikhBalapan2 ? tarikhPapar(r.tet.tarikhBalapan2) : 'hari 3')) + '.' + (kb.keputusan ? ' Boleh diubah terus dalam jadual (tekan Simpan Jadual) — acara yang disunting <b>dikunci</b> ' + ik('lock', 'kecil') + ' daripada jadual automatik.' : ''), 'calendar', aksi);
    if (!r.acara.length) {
      h += '<div class="kad">' + kosongHtml('Belum ada acara. ' + (kb.admin ? 'Gunakan "Jana acara standard" untuk mencipta acara lazim secara automatik.' : ''), 'calendar') + '</div>';
      kandungan(h); pasangAksiAcara(); return;
    }
    h += '<div class="baris-alat"><div class="cari">' + ik('search', 'kecil') + '<input id="kaCari" placeholder="Cari acara…"></div>' +
      '<select id="kaKat">' + pilihanKategoriKj('', 'Semua kategori') + '</select><select id="kaJan">' + pilihan([{ v: 'L', l: 'Lelaki' }, { v: 'P', l: 'Perempuan' }, { v: 'C', l: 'Campuran' }], '', 'Semua jantina') + '</select>' +
      '<select id="kaJenis">' + pilihan(Object.keys(JENIS_KJ).map(function (k) { return { v: k, l: JENIS_KJ[k] }; }), '', 'Semua jenis') + '</select>' +
      '<select id="kaStatus">' + pilihan(Object.keys(STATUS_KJ).map(function (k) { return { v: k, l: STATUS_KJ[k][0] }; }), '', 'Semua status') + '</select></div>' +
      '<div class="kad rapat"><div class="jadual-skrol"><table><thead><tr><th>No.</th><th>Acara</th><th>Kategori</th><th>Jenis</th><th>Tarikh</th><th>Masa</th><th class="c">Peserta</th><th>Status</th><th></th></tr></thead><tbody id="kaJadual"></tbody></table></div></div>' +
      (kb.keputusan ? '<div class="aksi-modal kad" style="position:sticky;bottom:10px;padding:10px 14px;z-index:5"><span class="nota" id="kaBilUbah" style="margin-right:auto"></span><button class="btn luar" id="kaBatal">Batal</button><button class="btn hijau" id="kaSimpan" disabled>' + ik('check') + 'Simpan Jadual</button></div>' : '');
    kandungan(h);
    ['kaCari', 'kaKat', 'kaJan', 'kaJenis', 'kaStatus'].forEach(function (id) { $(id).oninput = lukisAcara; });
    pasangAksiAcara();
    if (kb.keputusan) {
      $('kaBatal').onclick = function () { S.ubah.jadual = {}; lukisAcara(); };
      $('kaSimpan').onclick = function () {
        var j = Object.keys(S.ubah.jadual).map(function (k) { return S.ubah.jadual[k]; });
        api('apiSimpanJadual', { jadual: j }).then(function (x) { S.ubah.jadual = {}; selepasTulisKj(x.bil + ' acara dikemas kini.'); }).catch(gagal);
      };
    }
    lukisAcara();
  }).catch(ralatHalaman);
};
function pasangAksiAcara() {
  if ($('kaTambah')) $('kaTambah').onclick = function () { borangAcara(null); };
  if ($('kaStandard')) $('kaStandard').onclick = borangJanaStandard;
  if ($('kaSalin')) $('kaSalin').onclick = function () {
    sahkan('Salin semua acara (termasuk rekod kejohanan) daripada tahun terakhir yang ada ke tahun ' + S.kj.tet.tahun + '? Acara yang sudah wujud tidak diduplikasi.', function () {
      api('apiSalinAcaraTahunLepas').then(function (x) { selepasTulisKj(x.bil + ' acara disalin daripada ' + x.tahun + '.'); }).catch(gagal);
    }, 'Salin', 'biasa');
  };
  if ($('kaCetak')) $('kaCetak').onclick = cetakJadual;
  if ($('kaJadualAuto')) $('kaJadualAuto').onclick = function () {
    var t = S.kj.tet, bilManual = S.kj.acara.filter(function (a) { return a.jadualManual; }).length;
    var m = bukaModal('<h3>' + ik('clock') + 'Jana Jadual Automatik</h3>' +
      kotak('info', 'No. acara, tarikh & masa disusun semula secara automatik. Acara padang dan balapan <b>tidak serentak</b>:<ul style="margin:6px 0 0;padding-left:18px">' +
        '<li><b>Padang</b> (1 hari) — ' + e((t.tarikhPadang ? tarikhPapar(t.tarikhPadang) : 'tarikh belum ditetapkan')) + ', setiap ' + t.selangPadang + ' minit</li>' +
        '<li><b>Balapan</b> (2 hari) — ' + e((t.tarikhBalapan1 ? tarikhPapar(t.tarikhBalapan1) : '-')) + ' & ' + e((t.tarikhBalapan2 ? tarikhPapar(t.tarikhBalapan2) : '-')) + ', setiap ' + t.selangBalapan + ' minit (jarak menaik, berganti-ganti di akhir)</li></ul>' +
        '<div style="margin-top:6px">Bermula ' + e(t.masaMula) + ' setiap hari. Tarikh & selang boleh diubah di Tetapan Kejohanan.</div>', 'clock') +
      (bilManual ? '<label class="togol" style="margin-top:6px"><input type="checkbox" id="jjManual"> Termasuk ' + bilManual + ' acara yang disunting manual ' + ik('lock', 'kecil') + ' (tarikh / masa manual akan diganti)</label>' +
        '<div class="nota">Jika tidak ditanda, acara yang disunting manual kekal seperti yang ditetapkan.</div>' : '') +
      '<div class="aksi-modal"><button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">' + ik('clock') + 'Jana jadual</button></div>');
    m.querySelector('[data-x=b]').onclick = function () { tutupModal(m); };
    m.querySelector('[data-x=s]').onclick = function () {
      api('apiJanaJadual', { termasukManual: !!($('jjManual') && $('jjManual').checked) }).then(function (x) { tutupModal(m); selepasTulisKj(x.bil + ' acara dijadualkan secara automatik.'); }).catch(gagal);
    };
  };
}
function nilaiJadual(a) { var u = S.ubah.jadual[a.id]; return u || { id: a.id, no: a.no, tarikh: a.tarikh, masa: a.masa }; }
function lukisAcara() {
  var kb = S.kj.kebenaran, cari = nilaiEl('kaCari').toUpperCase(), kat = nilaiEl('kaKat'), jan = nilaiEl('kaJan'), jen = nilaiEl('kaJenis'), st = nilaiEl('kaStatus');
  var s = S.kj.acara.filter(function (a) {
    return (!cari || labelAcara(a).toUpperCase().indexOf(cari) !== -1 || a.no === cari) && (!kat || a.kategori === kat) && (!jan || a.jantina === jan) && (!jen || a.jenis === jen) && (!st || a.status === st);
  });
  $('kaJadual').innerHTML = s.length ? s.map(function (a) {
    var j = nilaiJadual(a), ub = !!S.ubah.jadual[a.id];
    var sel = kb.keputusan
      ? '<td><input data-j="no" data-id="' + e(a.id) + '" value="' + e(j.no) + '" style="width:62px"></td>'
      : '<td><b>' + e(a.no) + '</b></td>';
    if (a.jadualManual) sel = sel.replace('</td>', ' <span title="Jadual disunting manual — tidak diubah oleh jadual automatik" style="color:#b7791f">' + ik('lock', 'kecil') + '</span></td>');
    return '<tr' + (ub ? ' class="berubah"' : '') + '>' + sel + '<td><div style="display:flex;gap:9px;align-items:center"><span class="cip-ikon" style="width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:' + warnaJenis(a.jenis) + '1f;color:' + warnaJenis(a.jenis) + '">' + ik(ikonJenis(a.jenis), 'kecil') + '</span><div><b style="white-space:nowrap">' + e(a.nama) + '</b>' +
      (a.rekod.nilai ? '<div class="nota" style="margin:0">' + ik('star', 'kecil') + ' Rekod ' + e(a.rekod.nilai) + '</div>' : '') + '</div></div></td>' +
      '<td style="white-space:nowrap">' + e(a.kategori || 'Terbuka') + ' · ' + e(namaJantina(a.jantina)) + '</td><td style="white-space:nowrap">' + e(JENIS_KJ[a.jenis] || a.jenis) + '</td>' +
      (kb.keputusan ? '<td><input type="date" data-j="tarikh" data-id="' + e(a.id) + '" value="' + e(j.tarikh) + '" style="width:150px"></td><td><input type="time" data-j="masa" data-id="' + e(a.id) + '" value="' + e(j.masa) + '" style="width:112px"></td>'
        : '<td>' + e(a.tarikh ? tarikhPapar(a.tarikh) : '-') + '</td><td>' + e(a.masa || '-') + '</td>') +
      '<td class="c"><b>' + a.bilPeserta + '</b></td><td>' + lencanaStatus(a.status) + (a.rekodBaharu ? ' <span class="lencana kuning">' + ik('star', 'kecil') + 'Rekod baharu</span>' : '') + '</td>' +
      '<td style="white-space:nowrap"><button class="btn luar kecil" data-buka="' + e(a.id) + '">' + ik('timer', 'kecil') + 'Buka</button>' +
      (kb.admin ? ' <button class="btn hantu kecil" data-sunting="' + e(a.id) + '" title="Sunting">' + ik('edit', 'kecil') + '</button><button class="btn hantu kecil" data-padam="' + e(a.id) + '" title="Padam" style="color:var(--merah)">' + ik('trash', 'kecil') + '</button>' : '') + '</td></tr>';
  }).join('') : '<tr><td colspan="9">' + kosongHtml('Tiada acara sepadan.', 'search') + '</td></tr>';
  if (kb.keputusan) {
    var n = Object.keys(S.ubah.jadual).length;
    $('kaBilUbah').textContent = s.length + ' acara dipaparkan' + (n ? ' · ' + n + ' perubahan belum disimpan' : '');
    $('kaSimpan').disabled = !n;
    semua('[data-j]').forEach(function (el) {
      el.onchange = function () {
        var id = el.getAttribute('data-id'), a = kjAcara(id), j = Object.assign({}, nilaiJadual(a));
        j[el.getAttribute('data-j')] = el.value;
        if (j.no === a.no && j.tarikh === a.tarikh && j.masa === a.masa) delete S.ubah.jadual[id]; else S.ubah.jadual[id] = j;
        lukisAcara();
      };
    });
  }
  semua('[data-buka]').forEach(function (b) { b.onclick = function () { pergi('kj-keputusan', b.getAttribute('data-buka')); }; });
  semua('[data-sunting]').forEach(function (b) { b.onclick = function () { borangAcara(b.getAttribute('data-sunting')); }; });
  semua('[data-padam]').forEach(function (b) {
    b.onclick = function () {
      var a = kjAcara(b.getAttribute('data-padam'));
      sahkan('Padam acara ' + labelAcara(a) + '?' + (a.bilPeserta ? '\n\n' + a.bilPeserta + ' penyertaan dan semua keputusan acara ini turut dipadam.' : ''), function () {
        api('apiPadamAcara', { id: a.id }).then(function () { selepasTulisKj('Acara dipadam.'); }).catch(gagal);
      }, 'Padam');
    };
  });
}
function borangAcara(id) {
  var a = id ? kjAcara(id) : { nama: '', jenis: 'BALAPAN', kategori: '', jantina: 'L', unit: 'MASA', had: 2, bilLorong: 8, bilKeAkhir: 0, no: '', tarikh: '', masa: '', rekod: { nilai: '', pemegang: '', rumah: '', tahun: '' }, rekodAsal: { nilai: '', pemegang: '', rumah: '', tahun: '' } };
  var ra = a.rekodAsal || { nilai: '', pemegang: '', rumah: '', tahun: '' }, rs = a.rekodManual ? a.rekod : { nilai: '', pemegang: '', rumah: '', tahun: '' };
  var m = bukaModal('<h3>' + ik('calendar') + (id ? 'Sunting' : 'Tambah') + ' Acara</h3><datalist id="dlStandard">' + S.kj.standard.map(function (n) { return '<option value="' + e(n) + '">'; }).join('') + '</datalist><div class="grid-borang">' +
    '<div class="medan penuh"><label>Nama acara</label><input id="baNama" list="dlStandard" value="' + e(a.nama) + '" placeholder="cth. 100 METER"></div>' +

HALAMAN['kj-keputusan'] = function (acaraId) {
  muatKj().then(function (kj) {
    if (!kj.acara.length) { kandungan(kepalaHalaman('Saringan & Keputusan', '', 'timer') + '<div class="kad">' + kosongHtml('Belum ada acara.', 'calendar') + '</div>'); return; }
    var id = acaraId || S.data.kjAcara || kj.acara[0].id;

    if (S.data.kjAcara !== id) S.data.kjSunting = false;
    S.data.kjAcara = id;
    var senarai = kj.acara.slice().sort(function (a, b) { return (a.tarikh + a.masa).localeCompare(b.tarikh + b.masa) || Number(a.no) - Number(b.no); });
    var idx = senarai.findIndex(function (a) { return a.id === id; });
    var pemilih = '<div class="baris-alat"><button class="btn luar ikon" id="kkSblm" title="Acara sebelum"' + (idx <= 0 ? ' disabled' : '') + '>' + ik('kiri') + '</button>' +

    kandungan(kepalaHalaman('Saringan & Keputusan', 'Masukkan keputusan sahaja — senarai mula, kedudukan, mata, mara ke akhir dan rekod dikira <b>automatik</b>. Format masa: <b>12.345</b> · <b>1:05.321</b> · jarak: <b>4.35</b>', 'timer') + pemilih + '<div id="kkIsi">' + rangkaHalaman() + '</div>');
    $('kkAcara').onchange = function () { pergi('kj-keputusan', this.value); };

    $('kkSlps').onclick = function () { pergi('kj-keputusan', senarai[idx + 1].id); };

  }).catch(ralatHalaman);
};

    // mata lain-lain

      (r.mataLain.length ? r.mataLain.map(function (m) {
        return '<tr><td><b>' + e(m.perkara) + '</b></td><td>' + lencanaRumahKj(m.rumahId) + '</td><td class="n papan" style="font-size:18px">' + m.mata + '</td><td>' + e(m.catatan) + '</td>' +
          (kb.admin ? '<td style="white-space:nowrap"><button class="btn hantu kecil" data-mls="' + e(m.id) + '">' + ik('edit', 'kecil') + '</button><button class="btn hantu kecil" data-mlp="' + e(m.id) + '" style="color:var(--merah)">' + ik('trash', 'kecil') + '</button></td>' : '') + '</tr>';
      }).join('') : '<tr><td colspan="5">' + kosongHtml('Tiada mata lain-lain (cth. perbarisan, sorakan, kebersihan khemah).', 'star') + '</td></tr>') + '</tbody></table></div></div>';
    kandungan(h);
    $('kmSegar').onclick = function () { muatKj(true).then(function () { pergi('kj-mata'); }).catch(gagal); };
    $('kmCetak').onclick = function () { cetakPapanMata(); };
    if ($('kmTambah')) $('kmTambah').onclick = function () { borangMataLain(null); };
    semua('[data-mls]').forEach(function (b) { b.onclick = function () { borangMataLain(b.getAttribute('data-mls')); }; });
    semua('[data-mlp]').forEach(function (b) {
      b.onclick = function () { sahkan('Padam rekod mata ini?', function () { api('apiPadamMataLain', { id: b.getAttribute('data-mlp') }).then(function () { selepasTulisKj('Dipadam.'); }).catch(gagal); }, 'Padam'); };
    });
  }).catch(ralatHalaman);
};
function borangMataLain(id) {
  var m0 = id ? S.kj.mataLain.filter(function (x) { return x.id === id; })[0] : { rumahId: '', perkara: '', mata: '', catatan: '' };
  var m = bukaModal('<h3>' + ik('star') + (id ? 'Sunting' : 'Tambah') + ' Mata Lain-lain</h3><div class="grid-borang">' +
    '<div class="medan"><label>Perkara</label><input id="mlPerkara" list="dlPerkara" value="' + e(m0.perkara) + '" placeholder="cth. PERBARISAN"><datalist id="dlPerkara"><option value="PERBARISAN"><option value="SORAKAN"><option value="KEBERSIHAN KHEMAH"><option value="HIASAN KHEMAH"><option value="DISIPLIN"></datalist></div>' +
    '<div class="medan"><label>Rumah</label><select id="mlRumah">' + pilihan(S.kj.rumah.map(function (r) { return { v: r.id, l: r.nama }; }), m0.rumahId, '— pilih —') + '</select></div>' +
    '<div class="medan"><label>Mata</label><input id="mlMata" type="number" step="0.5" value="' + e(m0.mata) + '"></div>' +
    '<div class="medan"><label>Catatan</label><input id="mlCatatan" value="' + e(m0.catatan) + '" placeholder="cth. Johan perbarisan"></div></div>' +
    '<div class="aksi-modal"><button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">' + ik('check') + 'Simpan</button></div>', true);
  m.querySelector('[data-x=b]').onclick = function () { tutupModal(m); };
  m.querySelector('[data-x=s]').onclick = function () {
    api('apiSimpanMataLain', { data: { id: id || '', perkara: nilaiEl('mlPerkara'), rumahId: nilaiEl('mlRumah'), mata: nilaiEl('mlMata'), catatan: nilaiEl('mlCatatan') } })
      .then(function () { tutupModal(m); selepasTulisKj('Mata disimpan.'); }).catch(gagal);
  };
}
function cetakPapanMata() {
  var r = S.kj;
  cetak('Keputusan Keseluruhan & Papan Mata', '<table><thead><tr><th>Kedudukan</th><th>Rumah</th><th>Emas</th><th>Perak</th><th>Gangsa</th><th>Mata Acara</th><th>Mata Lain</th><th>Jumlah</th></tr></thead><tbody>' +
    r.kedudukan.map(function (x) { return '<tr><td>' + x.kedudukan + '</td><td><b>' + e(x.nama) + '</b></td><td>' + x.emas + '</td><td>' + x.perak + '</td><td>' + x.gangsa + '</td><td>' + x.mataAcara + '</td><td>' + x.mataLain + '</td><td><b>' + x.jumlah + '</b></td></tr>'; }).join('') + '</tbody></table>' +
    '<h2>Olahragawan & Olahragawati</h2><table><thead><tr><th>Anugerah</th><th>Nama</th><th>Kelas</th><th>Rumah</th><th>Mata</th><th>E/P/G</th></tr></thead><tbody>' +
    (r.olahragawan.length ? r.olahragawan.map(function (o) { var c = o.calon[0]; return '<tr><td><b>' + e(o.gelaran) + '</b></td><td>' + e(c.nama) + '</td><td>' + e(c.kelas) + '</td><td>' + e((rumahKj(c.rumahId) || {}).nama || '') + '</td><td>' + c.mata + '</td><td>' + c.emas + '/' + c.perak + '/' + c.gangsa + '</td></tr>'; }).join('') : '<tr><td colspan="6">Belum ada.</td></tr>') + '</tbody></table>' +
    (r.mataLain.length ? '<h2>Mata Lain-lain</h2><table><thead><tr><th>Perkara</th><th>Rumah</th><th>Mata</th><th>Catatan</th></tr></thead><tbody>' + r.mataLain.map(function (m) { return '<tr><td>' + e(m.perkara) + '</td><td>' + e((rumahKj(m.rumahId) || {}).nama || '') + '</td><td>' + m.mata + '</td><td>' + e(m.catatan) + '</td></tr>'; }).join('') + '</tbody></table>' : ''));
}

/* ================================ REKOD KEJOHANAN ================================ */
HALAMAN['kj-rekod'] = function () {
  muatKj().then(function (r) {
    var kb = r.kebenaran, tahun = r.tet.tahun;
    var baru = r.acara.filter(function (a) { return a.rekodBaharu; });
    var h = kepalaHalaman('Rekod Kejohanan', 'Rekod dikemas kini <b>automatik</b> sebaik catatan yang lebih baik disimpan (dan dipulihkan sendiri jika keputusan dibetulkan). Admin boleh menetapkan rekod secara manual — ia mengatasi kiraan automatik.', 'star');
    if (baru.length) h += kotak('jaya', '<b>' + baru.length + '</b> rekod baharu dicipta pada kejohanan ' + e(tahun) + ': ' + baru.map(function (a) { return e(labelAcara(a)) + ' (' + e(a.rekod.nilai) + ')'; }).join(', '), 'star');
    var ikut = ikutKunci(r.acara, function (a) { return a.nama; });
    h += '<div class="kad rapat"><div class="jadual-skrol"><table><thead><tr><th>Acara</th><th>Kategori</th><th>Rekod Semasa</th><th>Pemegang</th><th>Rumah</th><th>Tahun</th><th>Rekod Sebelum</th>' + (kb.admin ? '<th></th>' : '') + '</tr></thead><tbody>' +
      Object.keys(ikut).sort().map(function (n) {
        return ikut[n].map(function (a) {
          return '<tr' + (a.rekodBaharu ? ' class="emas"' : '') + '><td><b>' + e(a.nama) + '</b></td><td>' + e((a.kategori || 'Terbuka') + ' ' + namaJantina(a.jantina)) + '</td>' +
            '<td class="papan" style="font-size:19px;color:var(--navy)">' + e(a.rekod.nilai || '-') + (a.rekodBaharu ? ' <span class="lencana kuning">' + ik('star', 'kecil') + 'Baharu</span>' : '') + (a.rekodManual ? ' <span class="lencana" title="Ditetapkan manual — tidak dikira semula automatik">' + ik('lock', 'kecil') + 'Manual</span>' : '') + '</td>' +
            '<td>' + e(a.rekod.pemegang || '-') + '</td><td>' + e(a.rekod.rumah || '-') + '</td><td>' + e(a.rekod.tahun || '-') + '</td>' +
            '<td class="nota">' + (a.rekodBaharu && a.rekodAsal.nilai ? e(a.rekodAsal.nilai + ' · ' + a.rekodAsal.pemegang + ' (' + a.rekodAsal.tahun + ')') : '-') + '</td>' +
            (kb.admin ? '<td><button class="btn hantu kecil" data-suntingrekod="' + e(a.id) + '" title="Sunting rekod">' + ik('edit', 'kecil') + '</button></td>' : '') + '</tr>';
        }).join('');
      }).join('') + '</tbody></table></div></div>';
    kandungan(h);
    semua('[data-suntingrekod]').forEach(function (b) { b.onclick = function () { borangAcara(b.getAttribute('data-suntingrekod')); }; });
  }).catch(ralatHalaman);
};

/* ================================ LAPORAN & CETAK ================================ */
HALAMAN['kj-laporan'] = function () {
  muatKj().then(function (r) {
    var kad = function (ikon, warna, tajuk, ket, id) {
      return '<div class="kpi" style="align-items:flex-start;flex-direction:column;gap:10px"><div style="display:flex;gap:12px;align-items:center"><div class="cip-ikon w-' + warna + '">' + ik(ikon) + '</div><div><b style="font-size:15px;color:var(--navy)">' + e(tajuk) + '</b><div class="sub">' + e(ket) + '</div></div></div>' +
        '<button class="btn luar kecil" id="' + id + '">' + ik('printer', 'kecil') + 'Cetak / PDF</button></div>';
    };
    var h = kepalaHalaman('Laporan & Cetak', 'Semua dokumen kejohanan boleh dicetak atau disimpan sebagai PDF (pilih "Save as PDF" dalam dialog cetak).', 'printer');
    h += '<div class="grid auto">' +
      kad('calendar', 'biru', 'Jadual Acara', 'Mengikut tarikh & masa', 'lpJadual') +
      kad('list', 'trek', 'Senarai Mula Semua Acara', 'Saringan, lorong / giliran', 'lpMula') +
      kad('file', 'ungu', 'Buku Keputusan', 'Keputusan penuh setiap acara', 'lpBuku') +
      kad('medal', 'kuning', 'Senarai Pemenang', 'Johan, naib johan & ketiga setiap acara', 'lpPemenang') +
      kad('trophy', 'hijau', 'Papan Mata & Olahragawan', 'Keputusan keseluruhan', 'lpMata') +
      kad('users', 'merah', 'Senarai Atlet Ikut Rumah', 'Atlet & acara bagi setiap rumah', 'lpAtlet') +
      '</div>' +
      '<div class="kad" style="margin-top:18px"><h3>' + ik('download') + 'Eksport Data</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn luar" id="lpCsv">' + ik('download') + 'Keputusan (CSV)</button><button class="btn luar" id="lpCsvMata">' + ik('download') + 'Papan mata (CSV)</button></div></div>';
    kandungan(h);
    var dgnLaporan = function (fn) { return function () { api('apiLaporanKejohanan').then(fn).catch(gagal); }; };
    $('lpJadual').onclick = cetakJadual;
    $('lpMata').onclick = cetakPapanMata;
    $('lpMula').onclick = dgnLaporan(function (l) {
      cetak('Senarai Mula', l.acara.filter(function (a) { return a.saringan.length || a.akhir.length; }).map(function (a, i) {
        var s = a.saringan.length ? ikutKunci(a.saringan, function (x) { return x.saringan; }) : { '': a.akhir };
        return '<div' + (i ? ' class="cetak-pecah"' : '') + '><h2>Acara ' + e(a.no) + ': ' + e(labelAcara(a)) + '</h2><p>' + e(a.tarikh ? tarikhPapar(a.tarikh) : '') + ' ' + e(a.masa) + '</p>' +
          Object.keys(s).sort().map(function (k) { return (k ? '<h3>Saringan ' + e(k) + '</h3>' : '') + jadualCetak(s[k], a); }).join('') + '</div>';
      }).join('') || '<p>Belum ada senarai mula.</p>');
    });
    $('lpBuku').onclick = dgnLaporan(function (l) {
      cetak('Buku Keputusan', l.acara.filter(function (a) { return a.status === 'SELESAI'; }).map(function (a) {
        return '<h2>Acara ' + e(a.no) + ': ' + e(labelAcara(a)) + '</h2>' + jadualCetak(a.akhir.slice().sort(function (x, y) { return (Number(x.kedudukan) || 99) - (Number(y.kedudukan) || 99); }), a);
      }).join('') || '<p>Belum ada acara selesai.</p>');
    });
    $('lpPemenang').onclick = dgnLaporan(function (l) {
      cetak('Senarai Pemenang', '<table><thead><tr><th>No.</th><th>Acara</th><th>Johan</th><th>Naib Johan</th><th>Ketiga</th></tr></thead><tbody>' +
        l.acara.filter(function (a) { return a.status === 'SELESAI'; }).map(function (a) {
          var p = function (k) { return a.akhir.filter(function (x) { return Number(x.kedudukan) === k; }).map(function (x) { return e(x.nama) + ' (' + e(x.rumah) + ') ' + e(x.keputusan); }).join('<br>') || '-'; };
          return '<tr><td>' + e(a.no) + '</td><td><b>' + e(labelAcara(a)) + '</b></td><td>' + p(1) + '</td><td>' + p(2) + '</td><td>' + p(3) + '</td></tr>';
        }).join('') + '</tbody></table>');
    });
    $('lpAtlet').onclick = dgnLaporan(function (l) {
      var ikutRumah = {};
      l.acara.forEach(function (a) {
        a.daftar.concat(a.saringan, a.akhir.filter(function (x) { return !a.saringan.length; })).forEach(function (x) {
          var o = ikutRumah[x.rumah] = ikutRumah[x.rumah] || {};
          (x.nokp ? [x.nama] : x.ahli).forEach(function (n) { (o[n] = o[n] || []).push(a.nama + ' ' + (a.kategori || '') + a.jantina); });
        });
      });
      cetak('Senarai Atlet Mengikut Rumah', Object.keys(ikutRumah).sort().map(function (ru, i) {
        return '<div' + (i ? ' class="cetak-pecah"' : '') + '><h2>Rumah ' + e(ru) + '</h2><table><thead><tr><th>#</th><th>Nama</th><th>Acara</th></tr></thead><tbody>' +
          Object.keys(ikutRumah[ru]).sort().map(function (n, j) { return '<tr><td>' + (j + 1) + '</td><td>' + e(n) + '</td><td>' + e(unik(ikutRumah[ru][n]).join(', ')) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }).join('') || '<p>Belum ada penyertaan.</p>');
    });
    $('lpCsv').onclick = dgnLaporan(function (l) {
      var baris = [['No Acara', 'Acara', 'Kategori', 'Jantina', 'Pusingan', 'Saringan', 'Lorong', 'Bib', 'Nama', 'Rumah', 'Keputusan', 'Status', 'Kedudukan', 'Mata']];
      l.acara.forEach(function (a) { a.saringan.concat(a.akhir).forEach(function (x) { baris.push([a.no, a.nama, a.kategori, a.jantina, x.pusingan, x.saringan, x.lorong, x.bib, x.nokp ? x.nama : x.nama + ' (' + x.ahli.join('; ') + ')', x.rumah, x.keputusan, x.status, x.kedudukan, x.mata]); }); });
      muatTurunTeks('keputusan_kejohanan_' + S.kj.tet.tahun + '.csv', baris.map(function (b) { return b.map(function (v) { return '"' + String(v === undefined ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n'));
    });
    $('lpCsvMata').onclick = function () {
      var baris = [['Kedudukan', 'Rumah', 'Emas', 'Perak', 'Gangsa', 'Mata Acara', 'Mata Lain', 'Jumlah']].concat(S.kj.kedudukan.map(function (x) { return [x.kedudukan, x.nama, x.emas, x.perak, x.gangsa, x.mataAcara, x.mataLain, x.jumlah]; }));
      muatTurunTeks('papan_mata_' + S.kj.tet.tahun + '.csv', baris.map(function (b) { return b.join(','); }).join('\n'));
    };
  }).catch(ralatHalaman);
};

/* ================================ TETAPAN KEJOHANAN ================================ */
HALAMAN['kj-tetapan'] = function () {
  muatKj(true).then(function (r) {
    var t = r.tet;
    var h = kepalaHalaman('Tetapan Kejohanan', 'Tarikh, lokasi, jadual mata, had penyertaan, pendaftaran dan penerbitan keputusan.', 'sliders');
    h += '<div class="grid k-2-1"><div class="kad"><h3>' + ik('sliders') + 'Tetapan Utama</h3><div class="grid-borang">' +
      '<div class="medan"><label>Tarikh kejohanan</label><input id="ktTarikh" type="date" value="' + e(t.tarikh) + '"></div>' +
      '<div class="medan"><label>Lokasi</label><input id="ktLokasi" value="' + e(t.lokasi) + '"></div>' +
      '<div class="medan"><label>Mata individu (kedudukan 1, 2, 3, …)</label><input id="ktMataI" value="' + e(t.mataIndividu.join(',')) + '"></div>' +
      '<div class="medan"><label>Mata berganti-ganti</label><input id="ktMataB" value="' + e(t.mataBerganti.join(',')) + '"></div>' +
      '<div class="medan"><label>Had acara individu / atlet</label><input id="ktHadI" type="number" min="1" max="10" value="' + e(t.hadIndividu) + '"></div>' +
      '<div class="medan"><label>Had acara berganti-ganti / atlet</label><input id="ktHadB" type="number" min="0" max="10" value="' + e(t.hadBerganti) + '"></div>' +
      '<div class="medan penuh nota" style="margin:4px 0 -4px">' + ik('calendar', 'kecil') + ' Acara padang (1 hari) dan balapan (2 hari) <b>tidak serentak</b>. Kosongkan untuk ikut tarikh kejohanan: padang = hari 1, balapan = hari 2 & 3.</div>' +
      '<div class="medan"><label>Tarikh acara padang</label><input id="ktTarikhPadang" type="date" value="' + e(t.tarikhHari.padang) + '"><div class="nota">Auto: ' + e((t.tarikhPadang ? tarikhPapar(t.tarikhPadang) : '-')) + '</div></div>' +
      '<div class="medan"><label>Tarikh balapan — hari 1 / hari 2</label><div style="display:flex;gap:8px"><input id="ktTarikhBalapan1" type="date" value="' + e(t.tarikhHari.balapan1) + '"><input id="ktTarikhBalapan2" type="date" value="' + e(t.tarikhHari.balapan2) + '"></div><div class="nota">Auto: ' + e(((t.tarikhBalapan1 ? tarikhPapar(t.tarikhBalapan1) : '-')) + ' & ' + ((t.tarikhBalapan2 ? tarikhPapar(t.tarikhBalapan2) : '-'))) + '</div></div>' +
      '<div class="medan"><label>Masa acara pertama (jadual automatik)</label><input id="ktMasaMula" type="time" value="' + e(t.masaMula) + '"></div>' +
      '<div class="medan"><label>Selang balapan / padang (minit)</label><div style="display:flex;gap:8px"><input id="ktSelB" type="number" min="1" max="120" value="' + e(t.selangBalapan) + '"><input id="ktSelP" type="number" min="1" max="240" value="' + e(t.selangPadang) + '"></div></div>' +
      '<div class="medan penuh"><label class="togol"><input type="checkbox" id="ktDaftar"' + (t.pendaftaran === 'BUKA' ? ' checked' : '') + '> Buka pendaftaran atlet (Ketua/Penolong Ketua Guru Rumah boleh mendaftar)</label></div>' +
      '<div class="medan penuh"><label class="togol"><input type="checkbox" id="ktTerbit"' + (t.terbit ? ' checked' : '') + '> Terbitkan keputusan & papan mata di Portal Murid</label></div>' +
      '</div><div class="nota">Nama & tahun kejohanan serta kategori ditetapkan di <a href="#" onclick="pergi(\'tetapan\');return false">Tetapan Rumah Sukan</a>. Mata semua acara selesai dikira semula secara automatik jika jadual mata diubah.</div>' +
      '<div class="aksi-modal"><button class="btn" id="ktSimpan">' + ik('check') + 'Simpan Tetapan</button></div></div>';
    h += '<div><div class="kad"><h3>' + ik('bolt') + 'Dibuat Automatik oleh Sistem</h3><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:#334155">' +
      '<li><b>Jadual</b> — no. acara, tarikh & masa: padang 1 hari, balapan 2 hari (tidak serentak)</li><li><b>No. Bib</b> — sebaik atlet didaftarkan</li>' +
      '<li><b>Senarai mula</b> — saringan & lorong / giliran sebaik pendaftaran ditutup</li><li><b>Kedudukan & mata</b> — sebaik keputusan disimpan (seri berkongsi kedudukan)</li>' +
      '<li><b>Mara ke akhir</b> — sebaik semua saringan lengkap</li><li><b>Rekod kejohanan</b>, pingat, papan mata & olahragawan/olahragawati</li></ul>' +
      '<div style="margin-top:10px">' + kotak('amaran', '<b>Kawalan manual mengatasi automasi.</b> Admin & guru berakses boleh menyunting jadual, No. Bib, lorong / saringan, finalis, kedudukan dan rekod — suntingan itu dikunci dan tidak diubah oleh fungsi automatik.', 'lock') + '</div></div>' +
      '<div class="kad"><h3>' + ik('info') + 'Aliran Kerja Kejohanan</h3><ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:#334155">' +
      '<li>Tetapkan tarikh, lokasi & mata (halaman ini)</li><li>Jana acara standard (jadual dijana automatik)</li><li>Lantik AJK & beri akses keputusan</li><li>Buka pendaftaran — guru rumah daftar atlet</li><li>Tutup pendaftaran (senarai mula & bib automatik)</li>' +
      '<li>Hari kejohanan: masukkan keputusan sahaja</li><li>Masukkan mata lain-lain (perbarisan, sorakan)</li><li>Terbitkan keputusan & cetak laporan</li></ol></div></div></div>';
    kandungan(h);
    $('ktSimpan').onclick = function () {
      api('apiSimpanTetapanKejohanan', { data: { tarikh: nilaiEl('ktTarikh'), lokasi: nilaiEl('ktLokasi'), mataIndividu: nilaiEl('ktMataI'), mataBerganti: nilaiEl('ktMataB'),
        hadIndividu: nilaiEl('ktHadI'), hadBerganti: nilaiEl('ktHadB'), pendaftaran: semakEl('ktDaftar') ? 'BUKA' : 'TUTUP', terbit: semakEl('ktTerbit'),
        masaMula: nilaiEl('ktMasaMula'), tarikhPadang: nilaiEl('ktTarikhPadang'), tarikhBalapan1: nilaiEl('ktTarikhBalapan1'), tarikhBalapan2: nilaiEl('ktTarikhBalapan2'), selangBalapan: nilaiEl('ktSelB'), selangPadang: nilaiEl('ktSelP') } })
        .then(function (x) {
          selepasTulisKj('Tetapan disimpan.' + (x.jadual ? ' ' + x.jadual + ' acara dijadualkan.' : '') + (x.bib ? ' ' + x.bib + ' No. Bib dijana.' : '') + (x.senaraiMula ? ' Senarai mula ' + x.senaraiMula + ' acara dijana.' : ''));
        }).catch(gagal);
    };
  }).catch(ralatHalaman);
};
</script>
