<style>
/* =========================================================================
 * SISTEM REKA BENTUK — Rumah Sukan SMK Asajaya
 * Tema: OLAHRAGA BALAPAN & PADANG · warna logo sekolah:
 *   biru tua (langit logo) · merah (cincin) · kuning (jalur) · ungu (pena)
 *   + merah bata balapan & hijau padang sebagai warna sokongan.
 * ========================================================================= */
:root {
  --navy: #0b1b4d; --navy-2: #13286b; --biru: #1d4ed8; --biru-2: #2563eb; --biru-lembut: #e8efff;
  --merah: #d92d27; --merah-2: #b91c1c; --merah-lembut: #fdeceb;
  --kuning: #fcc419; --kuning-2: #f59f00; --kuning-lembut: #fff6d6;
  --ungu: #6d28d9; --ungu-lembut: #f1eafe;
  --trek: #c8462b; --trek-2: #a83a22; --padang: #1f9254; --padang-lembut: #e3f6ea;
  --hijau: #15803d; --hijau-lembut: #dcfce7;
  --latar: #f2f5fb; --kad: #ffffff; --garis: #e4e9f2; --garis-2: #d5dceb;
  --teks: #0f172a; --teks-2: #334155; --kelabu: #64748b; --kelabu-2: #94a3b8;
  --bayang: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
  --bayang-2: 0 10px 30px rgba(11,27,77,.16);
  --jejari: 16px; --jejari-k: 10px;
  --fon: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  --fon-papan: 'Barlow Condensed', 'Plus Jakarta Sans', 'Arial Narrow', sans-serif;
  --lorong: repeating-linear-gradient(180deg, var(--trek) 0 18px, rgba(255,255,255,.75) 18px 20px);
  --penamat: repeating-conic-gradient(#0b1b4d 0 25%, #fff 0 50%) 0 0 / 10px 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--fon); font-size: 14px; background: var(--latar); color: var(--teks); -webkit-font-smoothing: antialiased; }
button { cursor: pointer; font-family: inherit; }
a { color: var(--biru); }
input, select, textarea { font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--garis-2); border-radius: var(--jejari-k); width: 100%; background: #fff; color: var(--teks); transition: border-color .15s, box-shadow .15s; }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--biru); }
input[type=color] { padding: 2px; height: 38px; width: 54px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--biru-2); box-shadow: 0 0 0 4px rgba(37,99,235,.14); }
button:focus-visible, a:focus-visible { outline: 3px solid rgba(37,99,235,.45); outline-offset: 2px; }
.hidden { display: none !important; }
.ik { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ik.kecil { width: 15px; height: 15px; } .ik.besar { width: 24px; height: 24px; }
.papan { font-family: var(--fon-papan); font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; }

/* ---------- Butang ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 11px; padding: 9px 15px; font-size: 13.5px; font-weight: 700; background: var(--biru); color: #fff; transition: transform .08s, background .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { background: var(--navy-2); box-shadow: 0 6px 16px rgba(29,78,216,.25); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn.kecil { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.merah { background: var(--merah); } .btn.merah:hover { background: var(--merah-2); box-shadow: 0 6px 16px rgba(217,45,39,.25); }
.btn.hijau { background: var(--padang); } .btn.hijau:hover { background: #166c40; box-shadow: 0 6px 16px rgba(31,146,84,.25); }
.btn.kuning { background: var(--kuning); color: var(--navy); } .btn.kuning:hover { background: var(--kuning-2); }
.btn.kelabu { background: #475569; } .btn.kelabu:hover { background: #334155; }
.btn.luar { background: #fff; color: var(--navy); border-color: var(--garis-2); } .btn.luar:hover { background: var(--biru-lembut); border-color: var(--biru-2); box-shadow: none; }
.btn.hantu { background: transparent; color: var(--teks-2); } .btn.hantu:hover { background: rgba(15,23,42,.06); box-shadow: none; }
.btn.ikon { padding: 8px; }

/* ---------- Log masuk: stadium ---------- */
.skrin-tengah { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 1fr; background: var(--navy); }
.panel-stadium { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; color: #fff;
  background: radial-gradient(1200px 600px at 20% 10%, #1e3a8a 0%, transparent 60%), linear-gradient(160deg, #0b1b4d 0%, #13286b 55%, #3b1b6d 100%); }
.panel-stadium svg.stadium { width: min(560px, 92%); filter: drop-shadow(0 30px 40px rgba(0,0,0,.35)); }
.panel-stadium .tagline { margin-top: 26px; text-align: center; }
.panel-stadium .tagline .kecil { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--kuning); font-weight: 700; }
.panel-stadium .tagline h2 { margin: 8px 0 6px; font-family: var(--fon-papan); font-size: 44px; line-height: 1; letter-spacing: .02em; }
.panel-stadium .tagline p { margin: 0; color: #c7d2fe; font-size: 14px; }
.panel-stadium::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: var(--penamat); opacity: .9; }
.panel-borang { display: flex; align-items: center; justify-content: center; padding: 28px 20px; background: var(--latar); }
.kad-login { background: #fff; padding: 30px 28px; border-radius: 22px; width: 400px; max-width: 100%; box-shadow: var(--bayang-2); position: relative; overflow: hidden; }
.kad-login::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--merah) 0 25%, var(--kuning) 25% 50%, var(--biru) 50% 75%, var(--ungu) 75%); }
.kad-login h1 { font-size: 21px; margin: 0 0 4px; color: var(--navy); text-align: center; font-weight: 800; }
.kad-login p.sub { margin: 0 0 18px; font-size: 13px; color: var(--kelabu); text-align: center; }
.logo { display: block; margin: 0 auto 10px; width: 84px; height: auto; }
.medan { margin-bottom: 13px; }
.medan label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; color: var(--teks-2); }
.medan .dgn-ikon { position: relative; } .medan .dgn-ikon .ik { position: absolute; left: 11px; top: 11px; color: var(--kelabu-2); } .medan .dgn-ikon input { padding-left: 36px; }
.ralat-login { color: var(--merah); font-size: 13px; margin-top: 10px; min-height: 16px; font-weight: 600; }
.nota { font-size: 12px; color: var(--kelabu); margin-top: 5px; }
.tab-portal { display: grid; grid-template-columns: 1fr 1fr; background: #eef2f9; border-radius: 13px; padding: 4px; margin-bottom: 18px; }
.tab-portal button { border: none; background: none; padding: 10px 6px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--kelabu); display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.tab-portal button.aktif { background: #fff; color: var(--navy); box-shadow: 0 2px 6px rgba(15,23,42,.12); }

/* ---------- Rangka aplikasi ---------- */
#aplikasi { display: flex; min-height: 100vh; }
#bilahSisi { width: 258px; flex-shrink: 0; color: #fff; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column;
  background: linear-gradient(185deg, #0b1b4d 0%, #102463 60%, #1b1a5e 100%); }
#bilahSisi::before { content: ''; display: block; height: 6px; background: linear-gradient(90deg, var(--merah) 0 25%, var(--kuning) 25% 50%, var(--biru-2) 50% 75%, var(--ungu) 75%); }
#bilahSisi .jenama { padding: 18px 18px 16px; display: flex; gap: 11px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.08); }
#bilahSisi .jenama img { width: 44px; height: auto; background: #fff; border-radius: 50%; padding: 2px; }
#bilahSisi .jenama b { display: block; font-size: 15px; font-weight: 800; letter-spacing: .01em; }
#bilahSisi .jenama small { display: block; color: #a5b4fc; font-size: 11.5px; font-weight: 600; margin-top: 1px; }
#menuNav { padding: 8px 10px 16px; flex: 1; }
.label-nav { padding: 16px 10px 6px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #8ea2e8; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.label-nav::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
.item-nav { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; padding: 10px 12px; margin: 2px 0; border-radius: 11px; color: #cdd6f6; font-size: 13.5px; font-weight: 600; transition: background .15s, color .15s; }
.item-nav .ik { color: #8ea2e8; }
.item-nav:hover { background: rgba(255,255,255,.07); color: #fff; }
.item-nav.aktif { background: linear-gradient(90deg, rgba(252,196,25,.18), rgba(255,255,255,.05)); color: #fff; box-shadow: inset 3px 0 0 var(--kuning); }
.item-nav.aktif .ik { color: var(--kuning); }
.kaki-sisi { padding: 12px 18px 16px; font-size: 11px; color: #8ea2e8; border-top: 1px solid rgba(255,255,255,.08); }
.kaki-sisi .trek-mini { height: 8px; border-radius: 4px; background: var(--penamat); opacity: .55; margin-bottom: 8px; }
#kawasanUtama { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#barAtas { background: rgba(255,255,255,.88); backdrop-filter: saturate(160%) blur(10px); -webkit-backdrop-filter: saturate(160%) blur(10px); border-bottom: 1px solid var(--garis); padding: 10px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; }
#barAtas .kiri { display: flex; align-items: center; gap: 10px; min-width: 0; }
#tajukHalaman { font-weight: 800; font-size: 16px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#btnMenu { display: none; }
.cip-pengguna { display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #f4f6fb; border: 1px solid var(--garis); max-width: 260px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12.5px; color: #fff; background: var(--biru); flex-shrink: 0; }
.cip-pengguna .nm { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cip-pengguna .pr { font-size: 11px; color: var(--kelabu); }
#kandungan { padding: 22px; max-width: 1400px; width: 100%; margin: 0 auto; }
#bebanAtas { position: fixed; left: 0; top: 0; height: 3px; width: 0; z-index: 200; background: linear-gradient(90deg, var(--merah), var(--kuning), var(--biru-2)); transition: width .3s ease, opacity .3s; opacity: 0; }
#bebanAtas.jalan { opacity: 1; width: 70%; transition: width 6s cubic-bezier(.1,.6,.2,1); }
#bebanAtas.siap { opacity: 0; width: 100%; transition: width .2s, opacity .4s .2s; }
#latarMenu { display: none; }

/* ---------- Kepala halaman & hero ---------- */
.kepala-hal { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.kepala-hal h2 { margin: 0; font-size: 22px; color: var(--navy); font-weight: 800; display: flex; align-items: center; gap: 10px; }
.kepala-hal h2 .ikon-bulat { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--biru-lembut); color: var(--biru); }
.kepala-hal p { margin: 4px 0 0; color: var(--kelabu); font-size: 13px; }
.kepala-hal .aksi { display: flex; gap: 8px; flex-wrap: wrap; }
.hero { position: relative; overflow: hidden; border-radius: 22px; color: #fff; padding: 24px 26px 46px; margin-bottom: 20px; box-shadow: var(--bayang-2);
  background: radial-gradient(700px 300px at 85% -10%, rgba(252,196,25,.28), transparent 60%), linear-gradient(120deg, #0b1b4d 0%, #1d3fa8 60%, #4c2a9e 100%); }
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: repeating-linear-gradient(180deg, var(--trek) 0 7px, rgba(255,255,255,.85) 7px 8px); opacity: .95; }
.hero::before { content: ''; position: absolute; right: 64px; bottom: 0; width: 22px; height: 26px; background: var(--penamat); z-index: 1; }
.hero .salam { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--kuning); font-weight: 800; }
.hero h1 { margin: 6px 0 6px; font-size: 28px; font-weight: 800; line-height: 1.15; }
.hero p { margin: 0; color: #dbe4ff; font-size: 13.5px; }
.hero .baris-hero { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; position: relative; z-index: 2; }
.hero .cip { display: inline-flex; gap: 6px; align-items: center; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); font-size: 12px; font-weight: 600; margin: 10px 6px 0 0; }
.kiraan { display: flex; gap: 8px; }
.kiraan div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; padding: 8px 12px; text-align: center; min-width: 66px; }
.kiraan b { display: block; font-family: var(--fon-papan); font-size: 32px; line-height: 1; color: #fff; }
.kiraan span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #c7d2fe; }

/* ---------- Kad & KPI ---------- */
.kad { background: var(--kad); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 18px; margin-bottom: 18px; box-shadow: var(--bayang); }
.kad > h3, .kad .kepala-kad h3 { margin: 0 0 14px; font-size: 15px; color: var(--navy); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.kepala-kad { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.kepala-kad h3 { margin: 0 !important; }
.kad.rapat { padding: 0; overflow: hidden; } .kad.rapat .kepala-kad { padding: 14px 18px 0; }
.grid { display: grid; gap: 16px; }
.grid.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid.auto { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.grid.k-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } .grid.k-1-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.grid > .kad { margin-bottom: 0; }
.blok { margin-bottom: 18px; }
.kpi { background: #fff; border: 1px solid var(--garis); border-radius: var(--jejari); padding: 16px; display: flex; gap: 13px; align-items: center; box-shadow: var(--bayang); position: relative; overflow: hidden; }
.kpi .cip-ikon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; }
.kpi .cip-ikon .ik { width: 22px; height: 22px; }
.kpi .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--kelabu); font-weight: 700; }
.kpi .nilai { font-family: var(--fon-papan); font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1.05; }
.kpi .sub { font-size: 11.5px; color: var(--kelabu); }
.kpi.amaran .nilai { color: var(--merah); }
.w-biru { background: var(--biru-lembut); color: var(--biru); } .w-merah { background: var(--merah-lembut); color: var(--merah); }
.w-kuning { background: var(--kuning-lembut); color: #b07300; } .w-ungu { background: var(--ungu-lembut); color: var(--ungu); }
.w-hijau { background: var(--padang-lembut); color: var(--padang); } .w-trek { background: #fbe8e3; color: var(--trek); }

/* ---------- Kad rumah ---------- */
.kad-rumah { background: #fff; border: 1px solid var(--garis); border-radius: var(--jejari); overflow: hidden; box-shadow: var(--bayang); display: flex; flex-direction: column; }
.kad-rumah .kepala { padding: 14px 16px 22px; position: relative; color: #fff; }
.kad-rumah .kepala::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(180deg, rgba(0,0,0,.08) 0 2px, rgba(255,255,255,.45) 2px 3px); }
.kad-rumah .kepala b { font-size: 18px; font-weight: 800; letter-spacing: .03em; display: block; }
.kad-rumah .kepala span { font-size: 12px; opacity: .9; }
.kad-rumah .kepala .nombor { position: absolute; right: 14px; top: 8px; font-family: var(--fon-papan); font-size: 40px; opacity: .3; line-height: 1; }
.kad-rumah .badan { padding: 12px 16px 14px; font-size: 13px; flex: 1; }
.kad-rumah .baris { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--garis); }
.kad-rumah .baris:last-child { border-bottom: none; }
.kad-rumah .baris span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Jadual ---------- */
.jadual-skrol { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--garis); vertical-align: middle; }
th { background: #f6f8fc; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--kelabu); font-weight: 800; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
tbody tr:hover td { background: #f8faff; }
tbody tr:last-child td { border-bottom: none; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; } td.c, th.c { text-align: center; }
td select, td input { padding: 6px 8px; font-size: 13px; border-radius: 8px; }
tr.berubah td { background: #fffbea !important; }
tr.emas td { background: #fff8e1; }
.kosong { color: var(--kelabu); text-align: center; padding: 28px 16px; font-size: 13px; }
.kosong .ik { width: 34px; height: 34px; color: var(--kelabu-2); display: block; margin: 0 auto 8px; }
.lencana { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #eef1f6; color: var(--teks-2); white-space: nowrap; }
.lencana.hijau { background: var(--hijau-lembut); color: var(--hijau); } .lencana.merah { background: var(--merah-lembut); color: var(--merah-2); }
.lencana.kuning { background: var(--kuning-lembut); color: #a16207; } .lencana.biru { background: var(--biru-lembut); color: var(--biru); }
.lencana.ungu { background: var(--ungu-lembut); color: var(--ungu); } .lencana.gelap { background: var(--navy); color: #fff; }
.pingat { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 800; font-size: 12px; color: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.pingat.p1 { background: linear-gradient(135deg, #ffd84d, #e0a400); color: #5a3d00; } .pingat.p2 { background: linear-gradient(135deg, #eef1f5, #a7b0bd); color: #2b3440; }
.pingat.p3 { background: linear-gradient(135deg, #f2b27c, #b5652a); } .pingat.px { background: #e7ebf3; color: var(--teks-2); }
.titik { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08); }
.baris-alat { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.baris-alat select, .baris-alat input { width: auto; min-width: 140px; }
.baris-alat .rapat { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.cari { position: relative; } .cari .ik { position: absolute; left: 10px; top: 11px; color: var(--kelabu-2); } .cari input { padding-left: 34px; }
.amaran-kotak, .info-kotak, .jaya-kotak { padding: 11px 13px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; display: flex; gap: 9px; align-items: flex-start; }
.amaran-kotak { background: #fff8e6; border: 1px solid #fde49a; color: #8a5300; }
.info-kotak { background: #eef4ff; border: 1px solid #c9d9ff; color: #1e3a8a; }
.jaya-kotak { background: #ecfbf1; border: 1px solid #b6ecc8; color: #166534; }
.ralat-senarai { max-height: 180px; overflow-y: auto; font-size: 12.5px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 8px 12px; color: #991b1b; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; font-size: 13px; color: var(--kelabu); border-top: 1px solid var(--garis); }
.pager div { display: flex; gap: 6px; }

/* ---------- Tab & Modal ---------- */
.tab-bar { display: inline-flex; gap: 4px; flex-wrap: wrap; background: #e9eef8; padding: 4px; border-radius: 13px; margin-bottom: 16px; }
