<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Rumah Sukan SMK Asajaya</title>
  <style>
    :root {
      --biru: #1d4ed8; --biru-gelap: #1e3a8a; --merah: #b91c1c; --merah-terang: #dc2626; --kuning: #facc15; --kuning-gelap: #a16207;
      --hijau: #15803d; --kelabu: #64748b; --latar: #f1f5f9; --kad: #ffffff; --sempadan: #e2e8f0; --teks: #0f172a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--latar); color: var(--teks); -webkit-font-smoothing: antialiased; }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--sempadan); border-radius: 6px; width: 100%; background: #fff; color: var(--teks); }
    input[type=checkbox], input[type=radio] { width: auto; }
    input[type=color] { padding: 2px; height: 36px; width: 52px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--biru); box-shadow: 0 0 0 3px rgba(29,78,216,.14); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--biru); outline-offset: 2px; border-radius: 4px; }
    .hidden { display: none !important; }

    .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 7px; padding: 8px 14px; font-size: 14px; font-weight: 600; background: var(--biru); color: #fff; }
    .btn:hover { background: var(--biru-gelap); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.kecil { padding: 5px 10px; font-size: 12px; }
    .btn.merah { background: var(--merah); } .btn.merah:hover { background: #7f1d1d; }
    .btn.hijau { background: var(--hijau); } .btn.hijau:hover { background: #166534; }
    .btn.kelabu { background: var(--kelabu); } .btn.kelabu:hover { background: #475569; }
    .btn.luar { background: #fff; color: var(--biru); border: 1px solid var(--sempadan); } .btn.luar:hover { background: #eff6ff; border-color: var(--biru); }

    /* Log masuk */
    .skrin-tengah { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: linear-gradient(160deg, var(--biru-gelap) 0%, #1e40af 45%, var(--merah) 100%); }
    .kad-login { background: #fff; padding: 28px 26px; border-radius: 16px; width: 380px; max-width: 100%; box-shadow: 0 20px 45px rgba(2,6,23,.35); border-top: 6px solid var(--kuning); }
    .kad-login h1 { font-size: 19px; margin: 0 0 4px; color: var(--biru-gelap); text-align: center; }
    .kad-login p.sub { margin: 0 0 16px; font-size: 13px; color: var(--kelabu); text-align: center; }
    .logo { display: block; margin: 0 auto 10px; width: 92px; height: auto; }
    .medan { margin-bottom: 13px; }
    .medan label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .ralat-login { color: var(--merah); font-size: 13px; margin-top: 10px; min-height: 16px; }
    .nota { font-size: 12px; color: var(--kelabu); margin-top: 6px; }
    .tab-portal { display: grid; grid-template-columns: 1fr 1fr; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
    .tab-portal button { border: none; background: none; padding: 9px 6px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--kelabu); }
    .tab-portal button.aktif { background: #fff; color: var(--biru-gelap); box-shadow: 0 1px 3px rgba(15,23,42,.15); }

    /* Rangka aplikasi */
    #aplikasi { display: flex; min-height: 100vh; }
    #bilahSisi { width: 236px; background: linear-gradient(180deg, var(--biru-gelap), #172554); color: #fff; flex-shrink: 0; padding: 14px 0; }
    #bilahSisi .jenama { padding: 0 16px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 6px; }
    #bilahSisi .jenama img { width: 42px; height: auto; }
    #bilahSisi .jenama div { font-weight: 700; font-size: 13.5px; line-height: 1.25; }
    #bilahSisi .jenama small { display: block; font-weight: 400; color: #bfdbfe; font-size: 11.5px; }
    .label-nav { padding: 12px 18px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #93c5fd; }
    .item-nav { display: block; width: 100%; text-align: left; background: none; border: none; border-left: 3px solid transparent; padding: 10px 18px; color: #cbd5e1; font-size: 14px; }
    .item-nav:hover { background: rgba(255,255,255,.08); color: #fff; }
    .item-nav.aktif { background: rgba(255,255,255,.12); color: #fff; border-left-color: var(--kuning); font-weight: 600; }
    #kawasanUtama { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #barAtas { background: #fff; border-bottom: 1px solid var(--sempadan); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
    #barAtas .info { font-size: 13px; color: var(--kelabu); } #barAtas .info b { color: var(--teks); }
    #kandungan { padding: 20px; }

    .kad { background: var(--kad); border: 1px solid var(--sempadan); border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
    .kad h3 { margin: 0 0 12px; font-size: 15px; color: var(--biru-gelap); }
    h2.tajuk { margin: 0 0 4px; font-size: 20px; color: var(--biru-gelap); }
    p.subtajuk { margin: 0 0 16px; color: var(--kelabu); font-size: 13px; }
    .grid-kad { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .stat { background: #fff; border: 1px solid var(--sempadan); border-radius: 12px; padding: 14px 16px; }
    .stat .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--kelabu); }
    .stat .nilai { font-size: 26px; font-weight: 700; color: var(--biru-gelap); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat.amaran .nilai { color: var(--merah); }
    .kad-rumah { background: #fff; border: 1px solid var(--sempadan); border-radius: 12px; overflow: hidden; }
    .kad-rumah .kepala { padding: 12px 14px; color: #fff; font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .kad-rumah .badan { padding: 12px 14px; font-size: 13px; }
    .kad-rumah .baris { display: flex; justify-content: space-between; padding: 3px 0; }
    .kad-rumah .baris span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--sempadan); vertical-align: middle; }
    th { background: #f8fafc; font-size: 11.5px; text-transform: uppercase; color: var(--kelabu); white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    td.c, th.c { text-align: center; }
    td select, td input { padding: 5px 7px; font-size: 13px; }
    tr.berubah td { background: #fffbeb !important; }
    .jadual-skrol { overflow-x: auto; }
    .lencana { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e2e8f0; color: #334155; white-space: nowrap; }
    .lencana.hijau { background: #dcfce7; color: var(--hijau); } .lencana.merah { background: #fee2e2; color: var(--merah); }
    .lencana.kuning { background: #fef3c7; color: var(--kuning-gelap); } .lencana.biru { background: #dbeafe; color: #1e40af; }
    .titik { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 1px solid rgba(0,0,0,.15); }
    .baris-alat { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .baris-alat select, .baris-alat input { width: auto; min-width: 130px; }
    .baris-alat .rapat { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .amaran-kotak { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .info-kotak { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .jaya-kotak { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .kosong { color: var(--kelabu); text-align: center; padding: 24px; font-size: 13px; }

    .latar-modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 24px 12px; }
    .kad-modal { background: #fff; border-radius: 12px; width: min(860px, 100%); padding: 20px; }
    .kad-modal.kecil { width: min(520px, 100%); }
    .kad-modal h3 { margin: 0 0 12px; color: var(--biru-gelap); }
    .grid-borang { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-borang .penuh { grid-column: 1 / -1; }
    .grid-borang .medan { margin-bottom: 0; }
    .aksi-modal { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .tab-bar { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--sempadan); margin-bottom: 14px; }
    .tab-bar button { background: none; border: none; padding: 9px 13px; font-size: 13px; font-weight: 600; color: var(--kelabu); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab-bar button.aktif { color: var(--biru); border-bottom-color: var(--biru); }
    .semak { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--sempadan); }
    .semak:last-child { border-bottom: none; }
    .semak input { margin-top: 3px; width: 17px; height: 17px; flex-shrink: 0; }
    .semak b { display: block; font-size: 14px; } .semak span { font-size: 12.5px; color: var(--kelabu); }
    .senarai-semak { max-height: 340px; overflow-y: auto; border: 1px solid var(--sempadan); border-radius: 8px; padding: 6px 10px; }
    .senarai-semak label { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
    .pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 2px 0; font-size: 13px; color: var(--kelabu); }
    .pager div { display: flex; gap: 6px; }
    .ralat-senarai { max-height: 180px; overflow-y: auto; font-size: 12.5px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 8px 12px; color: #991b1b; }
    .rumah-besar { border-radius: 16px; color: #fff; padding: 22px; margin-bottom: 18px; position: relative; overflow: hidden; }
    .rumah-besar .kecil { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; opacity: .9; }
    .rumah-besar .nama { font-size: 34px; font-weight: 800; letter-spacing: .02em; margin: 4px 0; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .rumah-besar .moto { font-style: italic; opacity: .95; }
    .grid-dua { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    dl.profil { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; margin: 0; font-size: 13.5px; }
    dl.profil dt { color: var(--kelabu); } dl.profil dd { margin: 0; font-weight: 600; }

    #kontainerToast { position: fixed; top: 14px; right: 14px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.2); max-width: 360px; }
    .toast.jaya { background: var(--hijau); } .toast.gagal { background: var(--merah); } .toast.info { background: var(--biru); }
    #selimutSibuk { position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 90; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--biru-gelap); }

    @media (max-width: 860px) {
      #aplikasi { flex-direction: column; }
      #bilahSisi { width: 100%; display: flex; overflow-x: auto; padding: 8px; align-items: center; }
      #bilahSisi .jenama { border: none; margin: 0 6px 0 0; padding: 0 8px 0 4px; white-space: nowrap; }
      #bilahSisi .jenama small, .label-nav { display: none; }
      #menuNav { display: flex; }
      .item-nav { width: auto; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; padding: 8px 11px; }
      .item-nav.aktif { border-bottom-color: var(--kuning); }
      .grid-borang, .grid-dua { grid-template-columns: 1fr; }
      #kandungan { padding: 12px; }
    }
    @media print {
      #bilahSisi, #barAtas, .baris-alat, .tiada-cetak, #kontainerToast { display: none !important; }
      #kandungan { padding: 0; } .kad { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

<!-- ======================= LOG MASUK ======================= -->
<div id="skrinLogin" class="skrin-tengah">
  <form class="kad-login" id="borangLogin" autocomplete="on">
    <img class="logo" alt="Logo SMK Asajaya" src="<?!= logoSrc ?>">
    <h1>Sistem Pengurusan Rumah Sukan</h1>
    <p class="sub">SMK Asajaya</p>
    <div class="tab-portal" role="tablist">
      <button type="button" data-portal="STAF" role="tab">Portal Guru &amp; Staf</button>
      <button type="button" data-portal="MURID" role="tab">Portal Murid</button>
    </div>
    <div class="medan"><label for="lgKP">No. Kad Pengenalan</label><input id="lgKP" inputmode="numeric" autocomplete="username" placeholder="12 digit, tanpa tanda &quot;-&quot;" required></div>
    <div class="medan"><label for="lgKW">Kata Laluan</label><input id="lgKW" type="password" autocomplete="current-password" required>
      <div class="nota">Log masuk kali pertama: 6 digit terakhir No. KP anda.</div></div>
    <button class="btn" style="width:100%;justify-content:center" type="submit" id="btnLogin">Log Masuk</button>

</div>

<!-- ======================= TUKAR KATA LALUAN (PAKSA) ======================= -->
<div id="skrinTukar" class="skrin-tengah hidden">
  <form class="kad-login" id="borangTukar">
    <h1>Tukar Kata Laluan</h1>
    <p class="sub">Ini log masuk pertama anda (atau kata laluan telah di-set semula). Sila tetapkan kata laluan baharu sebelum meneruskan.</p>
    <div class="medan"><label for="tkLama">Kata laluan semasa</label><input id="tkLama" type="password" autocomplete="current-password" required></div>
    <div class="medan"><label for="tkBaru">Kata laluan baharu (min. 6 aksara)</label><input id="tkBaru" type="password" autocomplete="new-password" minlength="6" required></div>
    <div class="medan"><label for="tkSah">Sahkan kata laluan baharu</label><input id="tkSah" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="btn" style="width:100%;justify-content:center" type="submit">Simpan &amp; Teruskan</button>
    <button class="btn luar" style="width:100%;justify-content:center;margin-top:8px" type="button" id="btnTukarKeluar">Log Keluar</button>

<!-- ======================= APLIKASI ======================= -->
<div id="aplikasi" class="hidden">
  <nav id="bilahSisi" aria-label="Menu utama">
    <div class="jenama"><img alt="" src="<?!= logoSrc ?>"><div>Rumah Sukan<small id="labelPortal">SMK Asajaya</small></div></div>
    <div id="menuNav"></div>
  </nav>
  <div id="kawasanUtama">
    <header id="barAtas">
      <div class="info" id="infoPengguna"></div>
      <div style="display:flex;gap:8px">
        <button class="btn luar kecil" id="btnTukarKW">Tukar Kata Laluan</button>
        <button class="btn kelabu kecil" id="btnLogout">Log Keluar</button>
      </div>
    </header>
    <main id="kandungan"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="kontainerToast"></div>
<div id="selimutSibuk" class="hidden">Sila tunggu…</div>

<script>
/* =========================================================================
 * Skrip klien SPA Sistem Rumah Sukan. Semua panggilan pelayan melalui
 * google.script.run; kebenaran disahkan semula di pelayan setiap panggilan.
 * ========================================================================= */
var S = { token: null, user: null, portal: '<?= portalAwal ?>', tet: null, halaman: '', data: {}, ubah: {} };
var NAMA_PERANAN_RUMAH = { KETUA_GURU_RUMAH: 'Ketua Guru Rumah', PENOLONG_KETUA_GURU_RUMAH: 'Penolong Ketua Guru Rumah', GURU_RUMAH: 'Guru Rumah' };
var NAMA_PERANAN_AJK = { KETUA_AJK: 'Ketua AJK', AHLI_AJK: 'Ahli AJK' };

/* ---------- Utiliti ---------- */
function e(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function nilaiEl(id) { var el = $(id); return el ? el.value : ''; }
function semakEl(id) { var el = $(id); return !!(el && el.checked); }
function kandungan(html) { $('kandungan').innerHTML = html; }
function kpPapar(kp) { kp = String(kp || ''); return kp.length === 12 ? kp.slice(0, 6) + '-' + kp.slice(6, 8) + '-' + kp.slice(8) : kp; }
function jantinaPendek(j) { return j === 'PEREMPUAN' ? 'P' : (j === 'LELAKI' ? 'L' : '-'); }
function warnaTeks(hex) {
  var h = String(hex || '#64748b').replace('#', '');
  var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 165 ? '#0f172a' : '#ffffff';
}
function lencanaRumah(r) {
  if (!r) return '<span class="lencana">Belum ditetapkan</span>';
  return '<span class="lencana" style="background:' + e(r.warna) + ';color:' + warnaTeks(r.warna) + '">' + e(r.nama) + '</span>';
}
function rumahIkutId(id) { return (S.tet && S.tet.rumah || []).filter(function (r) { return r.id === id; })[0] || null; }
function namaKategori(kod) { var k = (S.tet && S.tet.kategori.senarai || []).filter(function (x) { return x.kod === kod; })[0]; return k ? k.nama : (kod || '-'); }
function pilihan(senarai, dipilih, labelKosong) {
  var h = labelKosong !== undefined ? '<option value="">' + e(labelKosong) + '</option>' : '';
  return h + senarai.map(function (x) { var v = typeof x === 'object' ? x.v : x, l = typeof x === 'object' ? x.l : x; return '<option value="' + e(v) + '"' + (String(v) === String(dipilih) ? ' selected' : '') + '>' + e(l) + '</option>'; }).join('');
}
function pilihanRumah(dipilih, labelKosong) { return pilihan((S.tet.rumah || []).map(function (r) { return { v: r.id, l: r.nama }; }), dipilih, labelKosong); }
function unik(arr) { var o = {}, h = []; arr.forEach(function (x) { if (x !== '' && !o[x]) { o[x] = 1; h.push(x); } }); return h; }
function susunKelas(a, b) { return String(a).localeCompare(String(b), 'ms', { numeric: true }); }

function toast(mesej, jenis) {
  var el = document.createElement('div');
  el.className = 'toast ' + (jenis || 'info');
  el.textContent = mesej;
  $('kontainerToast').appendChild(el);
  setTimeout(function () { el.remove(); }, jenis === 'gagal' ? 6500 : 3500);
}
var bilSibuk = 0;
function sibuk(hidup) { bilSibuk = Math.max(0, bilSibuk + (hidup ? 1 : -1)); $('selimutSibuk').classList.toggle('hidden', bilSibuk === 0); }

var API_TULIS = /^api(Simpan|Import|Padam|Reset|Tetapkan|Agih|Kunci|Tukar|Login)/;
function api(fn, param, cubaan) {
  return new Promise(function (res, rej) {
    if (!window.google || !google.script || !google.script.run) { rej(new Error('Tidak bersambung dengan pelayan.')); return; }
    var tulis = API_TULIS.test(fn);
    if (tulis) sibuk(true);
    google.script.run
      .withSuccessHandler(function (r) {
        if (tulis) sibuk(false);
        if (r === null || r === undefined) { rej(new Error('Respons kosong daripada pelayan.')); return; }
        if (r.success === false) {
          if (/Sesi tamat|Akaun tidak aktif/.test(r.message || '')) setTimeout(keluar, 50);
          rej(new Error(r.message)); return;
        }
        res(r);
      })
      .withFailureHandler(function (err) {
        if (tulis) sibuk(false);
        var mesej = err && err.message ? err.message : String(err);
        if (!tulis && !cubaan && /Service|timed out|Server|temporarily|Try again/i.test(mesej)) {
          setTimeout(function () { api(fn, param, 1).then(res, rej); }, 800); return;
        }
        rej(new Error(mesej));
      })[fn](Object.assign({ token: S.token }, param || {}));
  });
}
function gagal(err) { toast(err.message || String(err), 'gagal'); }

/* ---------- Modal ---------- */
function bukaModal(html, kecil) {
  var d = document.createElement('div');
  d.className = 'latar-modal';
  d.innerHTML = '<div class="kad-modal' + (kecil ? ' kecil' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  $('modalRoot').appendChild(d);
  return d;
}
function tutupModal(el) { var m = el && el.closest ? el.closest('.latar-modal') : el; if (m) m.remove(); }
function sahkan(mesej, ok, labelOk) {

/* ---------- Storan token ---------- */
function simpanToken(t) { try { if (t) sessionStorage.setItem('rs_token', t); else sessionStorage.removeItem('rs_token'); } catch (x) { /* storan disekat */ } }
function bacaToken() { try { return sessionStorage.getItem('rs_token'); } catch (x) { return null; } }

function setPortal(p) {
  S.portal = p;

function paparSkrin(id) { ['skrinLogin', 'skrinTukar', 'aplikasi'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); }); }

$('borangLogin').addEventListener('submit', function (ev) {
  ev.preventDefault();
  $('ralatLogin').textContent = '';

  api('apiLogin', { nokp: nilaiEl('lgKP').replace(/\D/g, ''), kataLaluan: nilaiEl('lgKW'), portal: S.portal }).then(function (r) {
    S.token = r.token; simpanToken(r.token);
    S.user = r;
    $('lgKW').value = '';
    $('tkLama').value = '';

$('borangTukar').addEventListener('submit', function (ev) {

  api('apiTukarPasswordSendiri', { kataLaluanLama: nilaiEl('tkLama'), kataLaluanBaharu: nilaiEl('tkBaru') }).then(function () {
    ['tkLama', 'tkBaru', 'tkSah'].forEach(function (i) { $(i).value = ''; });

  }).catch(function (er) { $('ralatTukar').textContent = er.message; });
});
$('btnTukarKeluar').onclick = function () { api('apiLogout').catch(function () {}).then(keluar); };
$('btnLogout').onclick = function () { api('apiLogout').catch(function () {}).then(keluar); };

    '<div class="medan"><label>Kata laluan baharu (min. 6 aksara)</label><input id="mBaru" type="password"></div>' +
    '<div class="medan"><label>Sahkan kata laluan baharu</label><input id="mSah" type="password"></div>' +
    '<div class="aksi-modal"><button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">Simpan</button></div>', true);

function keluar() {

  var h = '';

}
function itemNav(m) { return '<button class="item-nav" data-h="' + m.id + '">' + e(m.label) + '</button>'; }

function pergi(h) {
  var adaUbah = Object.keys(S.ubah).some(function (k) { return S.ubah[k] && Object.keys(S.ubah[k]).length; });
  if (adaUbah && h !== S.halaman) {
    sahkan('Terdapat perubahan yang belum disimpan. Tinggalkan halaman ini?', function () { S.ubah = {}; pergi(h); }, 'Tinggalkan');
    return;
  }
  S.halaman = h;
  Array.prototype.forEach.call($('menuNav').querySelectorAll('.item-nav'), function (b) { b.classList.toggle('aktif', b.getAttribute('data-h') === h); });

}

  api('apiTetapan').then(function (t) { S.tet = t; pergi('dashboard'); }).catch(gagal);

function normalHeader(h) { return String(h || '').toUpperCase().replace(/\./g, '').replace(/[_\s]+/g, ' ').trim(); }

/* Penghurai CSV/TSV ringkas yang menyokong petikan. */
function huraiTeksJadual(teks) {
  teks = String(teks || '').replace(/^﻿/, '');
  var baris1 = teks.split(/\r?\n/)[0] || '';
  var pemisah = baris1.indexOf('\t') !== -1 ? '\t' : (baris1.split(';').length > baris1.split(',').length ? ';' : ',');
  var hasil = [], baris = [], sel = '', petik = false;
  for (var i = 0; i < teks.length; i++) {
    var c = teks[i];
    if (petik) {
      if (c === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else petik = false; } else sel += c;
    } else if (c === '"') petik = true;
    else if (c === pemisah) { baris.push(sel); sel = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; baris.push(sel); hasil.push(baris); baris = []; sel = ''; }
    else sel += c;
  }
  if (sel !== '' || baris.length) { baris.push(sel); hasil.push(baris); }
  return hasil.filter(function (b) { return b.some(function (x) { return String(x).trim() !== ''; }); });
}

/* Tukar jadual (baris pertama = header) kepada objek mengikut alias. */
function petaJadual(jadual, alias) {
  if (jadual.length < 2) return { ralat: 'Data mesti mempunyai baris header dan sekurang-kurangnya satu baris data.' };
  var header = jadual[0].map(normalHeader), indeks = {};
  Object.keys(alias).forEach(function (k) {
    var al = alias[k].map(normalHeader);
    for (var i = 0; i < header.length; i++) { if (al.indexOf(header[i]) !== -1) { indeks[k] = i; break; } }
  });
  if (indeks.nokp === undefined || indeks.nama === undefined) return { ralat: 'Lajur "NO KP" dan "NAMA" diperlukan. Header dijumpai: ' + jadual[0].join(', ') };
  var baris = jadual.slice(1).map(function (b) {
    var o = {};
    Object.keys(indeks).forEach(function (k) { o[k] = String(b[indeks[k]] === undefined ? '' : b[indeks[k]]).trim(); });
    return o;
  });
  return { baris: baris, lajur: Object.keys(indeks) };
}

function muatTurunTeks(namaFail, teks) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + teks], { type: 'text/csv;charset=utf-8' }));
  a.download = namaFail; document.body.appendChild(a); a.click(); a.remove();
}

var _xlsxMuat = null;
function muatXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxMuat) return _xlsxMuat;
  _xlsxMuat = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = function () { _xlsxMuat = null; rej(new Error('Gagal memuatkan pembaca Excel. Simpan fail sebagai CSV atau tampal data.')); };
    document.head.appendChild(s);
  });
  return _xlsxMuat;
}
function bacaFailJadual(fail) {
  return new Promise(function (res, rej) {
    var nama = fail.name.toLowerCase();
    var pembaca = new FileReader();
    if (/\.(xlsx|xls)$/.test(nama)) {
      muatXlsx().then(function () {
        pembaca.onload = function () {
          try {
            var wb = XLSX.read(new Uint8Array(pembaca.result), { type: 'array', raw: false });
            res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' })
              .filter(function (b) { return b.some(function (x) { return String(x).trim() !== ''; }); }));
          } catch (x) { rej(x); }
        };
        pembaca.readAsArrayBuffer(fail);
      }).catch(rej);
    } else {
      pembaca.onload = function () { res(huraiTeksJadual(pembaca.result)); };
      pembaca.readAsText(fail, 'utf-8');
    }
  });
}

  var proses = function (jadual) {

  $('impFail').onchange = function () {
    var f = this.files[0]; if (!f) return;
    $('impTeks').value = '';

  };

    else S.ubah.atlet[nokp] = { nokp: nokp, atlet: at, acara: ac };
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-at]'), function (el) {
    el.onchange = function () { tanda(el.getAttribute('data-at')); lukisMurid(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ac]'), function (el) {
    el.onchange = function () { tanda(el.getAttribute('data-ac')); lukisMurid(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ms]'), function (b) { b.onclick = function () { borangMurid(b.getAttribute('data-ms')); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-mk]'), function (b) { b.onclick = function () { resetKW('MURID', b.getAttribute('data-mk')); }; });
}
function borangMurid(nokp) {
  var x = nokp ? S.data.murid.filter(function (y) { return y.nokp === nokp; })[0] :
    { nokp: '', nama: '', jantina: '', tingkatan: '', kelas: '', kaum: '', agama: '', tarikhLahir: '', noTelPenjaga: '', atlet: false, acara: '', rumahId: '', kunciRumah: false, status: 'AKTIF' };
  var m = bukaModal('<h3>' + (nokp ? 'Sunting' : 'Tambah') + ' Murid</h3><div class="grid-borang">' +
    '<div class="medan"><label>No. KP</label><input id="bmKP" value="' + e(x.nokp) + '"' + (nokp ? ' disabled' : '') + ' inputmode="numeric"></div>' +
    '<div class="medan"><label>Nama penuh</label><input id="bmNama" value="' + e(x.nama) + '"></div>' +
    '<div class="medan"><label>Tingkatan</label><input id="bmTing" value="' + e(x.tingkatan) + '" placeholder="cth. 1 / 6 RENDAH"></div>' +
    '<div class="medan"><label>Kelas</label><input id="bmKelas" value="' + e(x.kelas) + '" placeholder="cth. BESTARI"></div>' +
    '<div class="medan"><label>Jantina</label><select id="bmJan">' + pilihan([{ v: 'LELAKI', l: 'Lelaki' }, { v: 'PEREMPUAN', l: 'Perempuan' }], x.jantina, '(ikut No. KP)') + '</select></div>' +
    '<div class="medan"><label>Tarikh lahir (pilihan)</label><input id="bmLahir" value="' + e(x.tarikhLahir) + '" placeholder="YYYY-MM-DD"></div>' +
    '<div class="medan"><label>Kaum</label><input id="bmKaum" value="' + e(x.kaum) + '"></div>' +
    '<div class="medan"><label>Agama</label><input id="bmAgama" value="' + e(x.agama) + '"></div>' +
    '<div class="medan"><label>No. tel penjaga</label><input id="bmTel" value="' + e(x.noTelPenjaga) + '"></div>' +
    '<div class="medan"><label>Status</label><select id="bmStatus">' + pilihan(['AKTIF', 'TIDAK AKTIF'], x.status) + '</select></div>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="bmAtlet"' + (x.atlet ? ' checked' : '') + '> Atlet</label>' +
    '<div class="medan"><label>Acara</label><input id="bmAcara" value="' + e(x.acara) + '" placeholder="cth. 100M, 4X100M"></div>' +
    '<div class="medan"><label>Rumah sukan</label><select id="bmRumah">' + pilihanRumah(x.rumahId, '— tiada —') + '</select></div>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="bmKunci"' + (x.kunciRumah ? ' checked' : '') + '> 🔒 Kunci rumah (tidak dipindah oleh agihan automatik)</label>' +
    '</div><div class="aksi-modal">' + (nokp ? '<button class="btn merah" data-x="p" style="margin-right:auto">Padam</button>' : '') +
    '<button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">Simpan</button></div>');
  m.querySelector('[data-x=b]').onclick = function () { tutupModal(m); };
  m.querySelector('[data-x=s]').onclick = function () {
    api('apiSimpanMurid', { data: {
      baharu: !nokp, nokp: nokp || nilaiEl('bmKP').replace(/\D/g, ''), nama: nilaiEl('bmNama'), tingkatan: nilaiEl('bmTing'), kelas: nilaiEl('bmKelas'),
      jantina: nilaiEl('bmJan'), tarikhLahir: nilaiEl('bmLahir'), kaum: nilaiEl('bmKaum'), agama: nilaiEl('bmAgama'), noTelPenjaga: nilaiEl('bmTel'),
      status: nilaiEl('bmStatus'), atlet: semakEl('bmAtlet'), acara: nilaiEl('bmAcara'), rumahId: nilaiEl('bmRumah'), kunciRumah: semakEl('bmKunci') } })
      .then(function () { tutupModal(m); toast('Rekod murid disimpan.', 'jaya'); HALAMAN.murid(); }).catch(gagal);
  };
  if (nokp) m.querySelector('[data-x=p]').onclick = function () {
    sahkan('Padam rekod ' + x.nama + '? (Pilihan lain: tukar status kepada TIDAK AKTIF.)', function () {
      api('apiPadamMurid', { nokp: nokp }).then(function () { tutupModal(m); toast('Rekod dipadam.', 'jaya'); HALAMAN.murid(); }).catch(gagal);
    }, 'Padam');
  };
}

/* =====================================================================
 * ADMIN — AGIHAN MURID KE RUMAH SUKAN
 * ===================================================================== */
var KRITERIA_UI = [
  { k: 'atletDahulu', t: 'Agih atlet dahulu secara sama rata', d: 'Murid yang ditanda ATLET dibahagi sama rata kepada semua rumah sukan mengikut kategori dan jantina sebelum murid lain.' },
  { k: 'atletIkutAcara', t: 'Sebar atlet bagi acara yang sama', d: 'Atlet bagi acara yang sama (cth. 100M) disebar ke semua rumah supaya setiap rumah mempunyai atlet bagi setiap acara.' },
  { k: 'ikutKategori', t: 'Imbang mengikut kategori', d: 'Bilangan ahli setiap kategori (cth. B15, B18) hampir sama bagi setiap rumah.' },
  { k: 'ikutJantina', t: 'Imbang mengikut jantina', d: 'Bilangan lelaki dan perempuan diimbangkan secara berasingan.' },
  { k: 'ikutKelas', t: 'Imbang mengikut kelas', d: 'Setiap kelas mempunyai bilangan ahli yang hampir sama rata bagi setiap rumah sukan (mengikut jantina jika diaktifkan).' },
  { k: 'hormatKunci', t: 'Kekalkan murid yang dikunci 🔒', d: 'Murid yang rumahnya ditetapkan secara manual tidak dipindahkan (tetapi dikira dalam imbangan).' }
];
HALAMAN.agihan = function () {
  S.data.pratonton = null;
  api('apiRingkasanAgihan').then(function (r) {
    var k = r.kriteria;
    var h = '<h2 class="tajuk">Agihan Murid ke Rumah Sukan</h2><p class="subtajuk">Tetapkan kriteria, buat pratonton, dan sahkan untuk menyimpan agihan.</p>';
    if (r.terakhir) h += '<div class="info-kotak"><b>Agihan terakhir:</b> ' + e(r.terakhir) + '</div>';
    h += '<div class="grid-dua"><div class="kad"><h3>Kriteria Agihan</h3>' + KRITERIA_UI.map(function (c) {
      return '<label class="semak"><input type="checkbox" id="kr_' + c.k + '"' + (k[c.k] ? ' checked' : '') + '><div><b>' + e(c.t) + '</b><span>' + e(c.d) + '</span></div></label>';
    }).join('') + '</div><div class="kad"><h3>Skop Agihan</h3>' +
      '<label class="semak"><input type="radio" name="krSkop" value="SEMUA"' + (k.skop !== 'BAHARU' ? ' checked' : '') + '><div><b>Agih semula SEMUA murid aktif</b><span>Sesuai untuk awal tahun / agihan pertama. Murid boleh bertukar rumah (kecuali yang dikunci).</span></div></label>' +
      '<label class="semak"><input type="radio" name="krSkop" value="BAHARU"' + (k.skop === 'BAHARU' ? ' checked' : '') + '><div><b>Hanya murid yang BELUM mempunyai rumah</b><span>Sesuai untuk murid baharu/pindah masuk. Ahli sedia ada kekal dan diambil kira supaya imbangan terpelihara.</span></div></label>' +
      '<div class="aksi-modal"><button class="btn luar" id="agSimpanKr">Simpan Kriteria Sebagai Lalai</button><button class="btn" id="agPratonton">Pratonton Agihan</button></div></div></div>' +
      '<div id="agHasil"><div class="kad"><h3>Taburan Semasa</h3>' + lukisRingkasan(r.ringkasan) + '</div></div>';
    kandungan(h);
    $('agSimpanKr').onclick = function () { api('apiSimpanKriteria', { kriteria: bacaKriteria() }).then(function () { toast('Kriteria disimpan.', 'jaya'); }).catch(gagal); };
    $('agPratonton').onclick = function () { pratontonAgihan(); };
  }).catch(function (er) { kandungan('<div class="amaran-kotak">' + e(er.message) + '</div>'); });
};
function bacaKriteria() {
  var k = {};
  KRITERIA_UI.forEach(function (c) { k[c.k] = semakEl('kr_' + c.k); });
  var r = document.querySelector('input[name=krSkop]:checked');
  k.skop = r ? r.value : 'SEMUA';
  return k;
}
function pratontonAgihan(seed) {
  var kr = bacaKriteria();
  sibuk(true);
  api('apiPratontonAgihan', { kriteria: kr, seed: seed || 0 }).then(function (r) {
    sibuk(false);
    S.data.pratonton = { seed: r.seed, kriteria: kr };
    $('agHasil').innerHTML = '<div class="kad" style="border:2px solid var(--biru)"><h3>Pratonton Agihan (belum disimpan)</h3>' +
      '<div class="info-kotak">' + r.bilDiagih + ' murid akan diagih, ' + r.bilTetap + ' murid kekal di rumah sedia ada. ' +
      (r.ringkasan.dipindah ? r.ringkasan.dipindah + ' murid akan bertukar rumah. ' : '') + '</div>' +
      lukisRingkasan(r.ringkasan) +
      '<div class="aksi-modal"><button class="btn luar" id="agSemula">Jana Semula (susunan rawak lain)</button><button class="btn hijau" id="agSahkan">Sahkan & Simpan Agihan</button></div></div>';
    $('agSemula').onclick = function () { pratontonAgihan(); };
    $('agSahkan').onclick = function () {
      sahkan('Simpan agihan ini? Rumah sukan ' + r.bilDiagih + ' murid akan dikemas kini dan kriteria ini disimpan sebagai lalai.', function () {
        api('apiSimpanAgihan', { kriteria: S.data.pratonton.kriteria, seed: S.data.pratonton.seed }).then(function (x) {
          toast('Agihan disimpan: ' + x.bilDikemaskini + ' murid dikemas kini.', 'jaya');
          HALAMAN.agihan();
        }).catch(gagal);
      }, 'Simpan Agihan');
    };
    $('agHasil').scrollIntoView({ behavior: 'smooth' });
  }).catch(function (er) { sibuk(false); gagal(er); });
}
function lukisRingkasan(g) {
  if (!g.jumlahMurid) return '<div class="kosong">Tiada murid aktif. Import senarai murid dahulu.</div>';
  var h = '';
  if (g.tiadaRumah) h += '<div class="amaran-kotak">' + g.tiadaRumah + ' murid belum mempunyai rumah sukan.</div>';
  h += '<div class="jadual-skrol"><table><thead><tr><th>Rumah</th><th class="n">Jumlah</th><th class="n">Lelaki</th><th class="n">Perempuan</th><th class="n">Atlet L</th><th class="n">Atlet P</th>' +
    g.kategori.map(function (k) { return '<th class="n">' + e(k.kod) + ' L</th><th class="n">' + e(k.kod) + ' P</th>'; }).join('') + '</tr></thead><tbody>' +
    g.rumah.map(function (r) {
      return '<tr><td><span class="titik" style="background:' + e(r.warna) + '"></span><b>' + e(r.nama) + '</b></td><td class="n"><b>' + r.jumlah + '</b></td><td class="n">' + r.L + '</td><td class="n">' + r.P + '</td><td class="n">' + r.atletL + '</td><td class="n">' + r.atletP + '</td>' +
        g.kategori.map(function (k) {
          var l = r.kat[k.kod + '|L'] || { semua: 0, atlet: 0 }, p = r.kat[k.kod + '|P'] || { semua: 0, atlet: 0 };
          return '<td class="n" title="' + l.atlet + ' atlet">' + l.semua + '</td><td class="n" title="' + p.atlet + ' atlet">' + p.semua + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
  var tidakSeimbang = g.kelasTidakSeimbang;
  h += '<h3 style="margin-top:18px">Taburan Mengikut Kelas <span class="lencana ' + (tidakSeimbang ? 'kuning' : 'hijau') + '">' +
    (tidakSeimbang ? tidakSeimbang + ' kelas beza > 1' : 'Semua kelas seimbang (beza ≤ 1)') + '</span></h3>' +
    '<div class="jadual-skrol" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>Kelas</th><th class="n">Jumlah</th>' +
    g.rumah.map(function (r) { return '<th class="c"><span class="titik" style="background:' + e(r.warna) + '"></span>' + e(r.nama) + '<br>L / P</th>'; }).join('') +
    '<th class="c">Beza maks</th></tr></thead><tbody>' + g.kelas.map(function (c) {
      var beza = Math.max(c.julatL, c.julatP);
      return '<tr><td>' + e(c.kelas) + '</td><td class="n">' + c.jumlah + '</td>' +
        g.rumah.map(function (r) { return '<td class="c">' + (c.L[r.id] || 0) + ' / ' + (c.P[r.id] || 0) + '</td>'; }).join('') +
        '<td class="c"><span class="lencana ' + (beza > 1 ? 'kuning' : 'hijau') + '">' + beza + '</span>' + (c.tiadaRumah ? ' <span class="lencana merah">' + c.tiadaRumah + ' tiada rumah</span>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  return h;
}

/* =====================================================================
 * ADMIN — LOG AUDIT
 * ===================================================================== */
HALAMAN.audit = function (halaman) {
  api('apiSenaraiAudit', { halaman: halaman || 1, saiz: 50 }).then(function (r) {
    kandungan('<h2 class="tajuk">Log Audit</h2><p class="subtajuk">' + r.jumlah + ' rekod, terbaharu dahulu.</p><div class="kad" style="padding:0"><div class="jadual-skrol"><table><thead><tr><th>Tarikh</th><th>Pengguna</th><th>Tindakan</th><th>Modul</th><th>Butiran</th></tr></thead><tbody>' +
      (r.senarai.length ? r.senarai.map(function (x) {
        return '<tr><td style="white-space:nowrap">' + e(x.tarikh) + '</td><td>' + e(x.nama) + '<div class="nota" style="margin:0">' + e(x.peranan) + '</div></td><td>' + e(x.tindakan) + '</td><td>' + e(x.modul) + '</td><td>' + e(x.butiran) + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="kosong">Tiada rekod.</td></tr>') + '</tbody></table></div>' +
      '<div class="pager" style="padding:10px 12px"><span>Halaman ' + r.halaman + ' / ' + r.jumlahHalaman + '</span><div><button class="btn luar kecil" id="auSblm"' + (r.halaman <= 1 ? ' disabled' : '') + '>‹ Baharu</button><button class="btn luar kecil" id="auSlps"' + (r.halaman >= r.jumlahHalaman ? ' disabled' : '') + '>Lama ›</button></div></div></div>');
    $('auSblm').onclick = function () { HALAMAN.audit(r.halaman - 1); };
    $('auSlps').onclick = function () { HALAMAN.audit(r.halaman + 1); };
  }).catch(function (er) { kandungan('<div class="amaran-kotak">' + e(er.message) + '</div>'); });
};
</script>
