  var susun = [tiga[1], tiga[0], tiga[2]], kls = ['t2', 't1', 't3'], no = [2, 1, 3];
  return '<div class="podium">' + susun.map(function (r, i) {
    if (!r) return '<div></div>';
    return '<div class="tiang ' + kls[i] + '"><div class="nm">' + e(r.nama) + '</div><div class="mt">' + e(r.nilai) + '</div><div class="blok-p" style="background:' + e(r.warna) + ';color:' + warnaTeks(r.warna) + '">' + no[i] + '</div></div>';
  }).join('') + '</div>';
}
/* Stadium balapan (SVG) untuk skrin log masuk. */
function svgStadium() {
  var g = '<rect x="6" y="6" width="588" height="328" rx="164" fill="#c8462b"/>';
  for (var i = 1; i <= 7; i++) g += '<rect x="' + (6 + i * 11) + '" y="' + (6 + i * 11) + '" width="' + (588 - i * 22) + '" height="' + (328 - i * 22) + '" rx="' + (164 - i * 11) + '" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/>';
  g += '<rect x="94" y="94" width="412" height="152" rx="76" fill="#1f9254"/>' +
    '<rect x="94" y="94" width="412" height="152" rx="76" fill="url(#jalurRumput)"/>' +
    '<line x1="300" y1="94" x2="300" y2="246" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="300" cy="170" r="30" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>' +
    '<rect x="380" y="6" width="10" height="88" fill="url(#penamat)"/>' +
    '<circle cx="300" cy="170" r="46" fill="#fff"/><image href="' + LOGO + '" x="258" y="128" width="84" height="84"/>';
  return '<svg class="stadium" viewBox="0 0 600 340" aria-hidden="true"><defs>' +
    '<pattern id="jalurRumput" width="40" height="152" patternUnits="userSpaceOnUse"><rect width="20" height="152" fill="rgba(255,255,255,.06)"/></pattern>' +
    '<pattern id="penamat" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><rect x="5" y="5" width="5" height="5" fill="#fff"/><rect x="5" width="5" height="5" fill="#0b1b4d"/><rect y="5" width="5" height="5" fill="#0b1b4d"/></pattern>' +
    '</defs>' + g + '</svg>';
}
function kiraDetik(tarikh) {
  if (!tarikh) return null;
  var sasaran = new Date(tarikh + 'T07:30:00').getTime(), beza = sasaran - Date.now();
  if (isNaN(sasaran)) return null;
  if (beza <= 0) return { lepas: true, hari: Math.floor(-beza / 864e5) };
  return { hari: Math.floor(beza / 864e5), jam: Math.floor(beza / 36e5) % 24, minit: Math.floor(beza / 6e4) % 60 };
}
function kiraanHtml(tarikh) {
  var k = kiraDetik(tarikh);
  if (!k) return '';
  if (k.lepas) return k.hari < 2 ? '<div class="kiraan"><div><b>HARI</b><span>Kejohanan</span></div></div>' : '';
  return '<div class="kiraan"><div><b>' + k.hari + '</b><span>Hari</span></div><div><b>' + k.jam + '</b><span>Jam</span></div><div><b>' + k.minit + '</b><span>Minit</span></div></div>';
}

/* ---------- Toast, sibuk, bar pemuat ---------- */
function toast(mesej, jenis) {
  var el = document.createElement('div');
  el.className = 'toast ' + (jenis || 'info');
  el.innerHTML = ik(jenis === 'gagal' ? 'alert' : jenis === 'jaya' ? 'check' : 'info', 'kecil') + '<span></span>';
  el.lastChild.textContent = mesej;
  $('kontainerToast').appendChild(el);
  setTimeout(function () { el.remove(); }, jenis === 'gagal' ? 6500 : 3500);
}
var bilSibuk = 0;
function sibuk(hidup) { bilSibuk = Math.max(0, bilSibuk + (hidup ? 1 : -1)); $('selimutSibuk').classList.toggle('hidden', bilSibuk === 0); }
var bilMuat = 0;
function bebanAtas(hidup) {
  bilMuat = Math.max(0, bilMuat + (hidup ? 1 : -1));
  var b = $('bebanAtas');
  if (bilMuat > 0) { b.className = ''; void b.offsetWidth; b.className = 'jalan'; } else { b.className = 'siap'; }
}

/* ---------- Panggilan pelayan (dengan cache bacaan) ---------- */
var API_TULIS = /^api(Simpan|Import|Padam|Reset|Tetapkan|Agih|Kunci|Tukar|Login|Jana|Salin|Mara|Sahkan|SetSemula)/;
var CACHE_API = {}, TTL_CACHE_MS = 60000;
function kosongkanCacheApi() { CACHE_API = {}; }
function api(fn, param, pilihan) {
  pilihan = pilihan || {};
  var tulis = API_TULIS.test(fn);
  var kunci = fn + '|' + JSON.stringify(param || {});
  if (!tulis && !pilihan.segar && CACHE_API[kunci] && Date.now() - CACHE_API[kunci].masa < TTL_CACHE_MS) return Promise.resolve(CACHE_API[kunci].hasil);
  if (tulis) kosongkanCacheApi();
  return new Promise(function (res, rej) {
    if (!window.google || !google.script || !google.script.run) { rej(new Error('Tidak bersambung dengan pelayan.')); return; }
    if (typeof google.script.run[fn] !== 'function') {
      rej(new Error('Fungsi pelayan "' + fn + '" tiada dalam versi sistem yang sedang di-deploy. Pastikan SEMUA fail .gs terkini (termasuk ' + (/Kejohanan|Acara|Jadual|Penyertaan|Keputusan|Finalis|SenaraiMula|Mara|MataLain|SetSemula/.test(fn) ? 'KejohananService.gs' : 'fail servis berkaitan') + ') telah disalin, kemudian Deploy → Manage deployments → Edit → Version: New version. Di Google Sheet, jalankan menu Sistem Rumah Sukan → 4. Semak Pemasangan untuk menyemak.'));
      return;
    }
    var sekat = tulis && !pilihan.senyap;
    if (sekat) sibuk(true); else bebanAtas(true);
    var tamat = function () { if (sekat) sibuk(false); else bebanAtas(false); };
    google.script.run
      .withSuccessHandler(function (r) {
        tamat();
        if (r === null || r === undefined) { rej(new Error('Respons kosong daripada pelayan. Sila cuba lagi.')); return; }
        if (r.success === false) {
          if (/Sesi tamat|Akaun tidak aktif/.test(r.message || '')) setTimeout(keluar, 50);
          rej(new Error(r.message)); return;
        }
        if (!tulis) CACHE_API[kunci] = { masa: Date.now(), hasil: r };
        res(r);
      })
      .withFailureHandler(function (err) {
        tamat();
        var mesej = err && err.message ? err.message : String(err);
        if (!tulis && !pilihan.cubaan && /Service|timed out|Server|temporarily|Try again|NetworkError|network/i.test(mesej)) {   // bacaan: cuba sekali lagi
          setTimeout(function () { api(fn, param, Object.assign({}, pilihan, { cubaan: 1 })).then(res, rej); }, 900);
          return;
        }
        rej(new Error(/NetworkError|network/i.test(mesej) ? 'Sambungan internet terganggu. Sila cuba lagi.' : mesej));
      })[fn](Object.assign({ token: S.token }, param || {}));
  });
}
function gagal(err) { toast(err.message || String(err), 'gagal'); }

/* ---------- Modal ---------- */
function bukaModal(html, kecil) {
  var d = document.createElement('div');
  d.className = 'latar-modal';
  d.innerHTML = '<div class="kad-modal' + (kecil ? ' kecil' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  $('modalRoot').appendChild(d);
  d.addEventListener('mousedown', function (ev) { if (ev.target === d) d.remove(); });
  return d;
}
function tutupModal(el) { var m = el && el.closest ? el.closest('.latar-modal') : el; if (m) m.remove(); }
function sahkan(mesej, ok, labelOk, jenis) {
  var m = bukaModal('<h3>' + ik(jenis === 'biasa' ? 'info' : 'alert') + 'Pengesahan</h3><p style="white-space:pre-line;margin:0;color:#334155">' + e(mesej) + '</p><div class="aksi-modal"><button class="btn luar" data-x="batal">Batal</button><button class="btn ' + (jenis === 'biasa' ? '' : 'merah') + '" data-x="ok">' + e(labelOk || 'Teruskan') + '</button></div>', true);
  m.querySelector('[data-x=batal]').onclick = function () { tutupModal(m); };
  m.querySelector('[data-x=ok]').onclick = function () { tutupModal(m); ok(); };
}
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { var m = $('modalRoot').lastElementChild; if (m) m.remove(); else tutupMenuMudah(); }
});

/* ---------- Storan sesi ---------- */
function simpanSesiTempatan() {
  try {
    if (S.token) { sessionStorage.setItem('rs_token', S.token); sessionStorage.setItem('rs_sesi', JSON.stringify({ user: S.user, mula: S.mula })); }
    else { sessionStorage.removeItem('rs_token'); sessionStorage.removeItem('rs_sesi'); }
  } catch (x) { /* storan disekat / penuh */ }
}
function bacaSesiTempatan() {
  try { var t = sessionStorage.getItem('rs_token'); var s = JSON.parse(sessionStorage.getItem('rs_sesi') || 'null'); return t ? { token: t, sesi: s } : null; } catch (x) { return null; }
}

/* ---------- Log masuk ---------- */
function setPortal(p) {
  S.portal = p;
  semua('.tab-portal button').forEach(function (b) { b.classList.toggle('aktif', b.getAttribute('data-portal') === p); });
  $('labelKP').textContent = p === 'MURID' ? 'No. Kad Pengenalan / MyKid murid' : 'No. Kad Pengenalan';
}
function paparSkrin(id) { ['skrinLogin', 'skrinTukar', 'aplikasi'].forEach(function (x) { $(x).classList.toggle('hidden', x !== id); }); }

function terimaSesi(r) {
  S.user = { nama: r.nama, jenis: r.jenis, admin: r.admin, peranan: r.peranan };
  S.mula = r.mula || null;
  if (S.mula && S.mula.tet) S.tet = S.mula.tet;
  simpanSesiTempatan();
}

function pasangLogMasuk() {
  $('stadiumLogin').innerHTML = svgStadium();
  semua('img[data-logo]').forEach(function (i) { i.src = LOGO; });
  semua('.tab-portal button').forEach(function (b) { b.onclick = function () { setPortal(b.getAttribute('data-portal')); }; });
  setPortal(S.portal);
  $('borangLogin').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('ralatLogin').textContent = '';
    $('btnLogin').disabled = true;
    $('btnLogin').innerHTML = '<span class="pemutar" style="width:16px;height:16px;border-width:2px"></span> Sedang log masuk…';
    api('apiLogin', { nokp: nilaiEl('lgKP').replace(/\D/g, ''), kataLaluan: nilaiEl('lgKW'), portal: S.portal }, { senyap: true }).then(function (r) {
      S.token = r.token;
      terimaSesi(r);
      $('lgKW').value = '';
      if (r.mestiTukarPassword) paparSkrin('skrinTukar'); else mulaAplikasi();
    }).catch(function (er) { $('ralatLogin').textContent = er.message; }).then(function () {
      $('btnLogin').disabled = false; $('btnLogin').innerHTML = ik('logout') + ' Log Masuk';
    });
  });
  $('borangTukar').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('ralatTukar').textContent = '';
    if (nilaiEl('tkBaru') !== nilaiEl('tkSah')) { $('ralatTukar').textContent = 'Pengesahan kata laluan tidak sepadan.'; return; }
    api('apiTukarPasswordSendiri', { kataLaluanLama: nilaiEl('tkLama'), kataLaluanBaharu: nilaiEl('tkBaru') }).then(function () {
      ['tkLama', 'tkBaru', 'tkSah'].forEach(function (i) { $(i).value = ''; });
      toast('Kata laluan berjaya ditukar.', 'jaya');
      return api('apiMula', {}, { segar: true });
    }).then(function (r) { terimaSesi(r); mulaAplikasi(); })
      .catch(function (er) { $('ralatTukar').textContent = er.message; });
  });
  $('btnTukarKeluar').onclick = logKeluar;
  $('btnLogout').onclick = logKeluar;
  $('btnTukarKW').onclick = bukaTukarKW;
  $('btnMenu').onclick = function () { document.body.classList.toggle('menu-buka'); };
  $('latarMenu').onclick = tutupMenuMudah;
}
function tutupMenuMudah() { document.body.classList.remove('menu-buka'); }

function bukaTukarKW() {
  var m = bukaModal('<h3>' + ik('key') + 'Tukar Kata Laluan</h3><div class="medan"><label>Kata laluan semasa</label><input id="mLama" type="password"></div>' +
    '<div class="medan"><label>Kata laluan baharu (min. 6 aksara)</label><input id="mBaru" type="password"></div>' +
    '<div class="medan"><label>Sahkan kata laluan baharu</label><input id="mSah" type="password"></div>' +
    '<div class="aksi-modal"><button class="btn luar" data-x="b">Batal</button><button class="btn" data-x="s">' + ik('check') + 'Simpan</button></div>', true);
  m.querySelector('[data-x=b]').onclick = function () { tutupModal(m); };
  m.querySelector('[data-x=s]').onclick = function () {
    if (nilaiEl('mBaru') !== nilaiEl('mSah')) { toast('Pengesahan kata laluan tidak sepadan.', 'gagal'); return; }
    api('apiTukarPasswordSendiri', { kataLaluanLama: nilaiEl('mLama'), kataLaluanBaharu: nilaiEl('mBaru') })
      .then(function () { tutupModal(m); toast('Kata laluan ditukar.', 'jaya'); }).catch(gagal);
  };
}

/* Log keluar: terus ke halaman log masuk (tanpa menunggu pelayan); sesi dipadam di pelayan di latar belakang. */
function logKeluar() {
  var token = S.token;
  keluar();
  if (token) api('apiLogout', { token: token }, { senyap: true }).catch(function () { /* sesi tamat sendiri */ });
}
function keluar() {
  S.token = null; S.user = null; S.tet = null; S.mula = null; S.kj = null; S.data = {}; S.ubah = {};
  kosongkanCacheApi();
  simpanSesiTempatan();
  $('modalRoot').innerHTML = '';
  bilSibuk = 0; $('selimutSibuk').classList.add('hidden');
  S.halaman = '';
  $('kandungan').innerHTML = '';
  $('menuNav').innerHTML = '';
  ['lgKW', 'tkLama', 'tkBaru', 'tkSah'].forEach(function (i) { $(i).value = ''; });
  $('ralatLogin').textContent = ''; $('ralatTukar').textContent = '';
  tutupMenuMudah();
  paparSkrin('skrinLogin');
  window.scrollTo(0, 0);
  try { $('lgKP').focus(); } catch (x) { /* abaikan */ }
}

/* ---------- Navigasi ---------- */
var HALAMAN = {};
function senaraiMenu() {
  if (!S.user) return [];
  if (S.user.jenis === 'MURID') return [
    { kumpulan: 'Portal Murid' },
    { id: 'portalmurid', label: 'Rumah Sukan Saya', ikon: 'home' },
    { id: 'muridkj', label: 'Kejohanan Olahraga', ikon: 'trophy' }
  ];
  var m = [
    { kumpulan: 'Utama' },
    { id: 'dashboard', label: 'Dashboard', ikon: 'home' },
    { id: 'rumahsaya', label: 'Rumah Sukan', ikon: 'users' },
    { id: 'ajk', label: 'AJK Kejohanan', ikon: 'clipboard' },
    { kumpulan: 'Kejohanan Olahraga' },
    { id: 'kj-pusat', label: 'Pusat Kejohanan', ikon: 'trophy' },
    { id: 'kj-acara', label: 'Acara & Jadual', ikon: 'calendar' },
    { id: 'kj-daftar', label: 'Pendaftaran Atlet', ikon: 'run' },
    { id: 'kj-keputusan', label: 'Saringan & Keputusan', ikon: 'timer' },
    { id: 'kj-mata', label: 'Papan Mata & Pingat', ikon: 'medal' },
    { id: 'kj-rekod', label: 'Rekod Kejohanan', ikon: 'star' },
    { id: 'kj-laporan', label: 'Laporan & Cetak', ikon: 'printer' }
  ];
  if (S.user.admin) m = m.concat([
    { kumpulan: 'Pentadbiran' },
    { id: 'kj-tetapan', label: 'Tetapan Kejohanan', ikon: 'sliders' },
    { id: 'tetapan', label: 'Tetapan Rumah Sukan', ikon: 'flag' },
    { id: 'staf', label: 'Guru & Staf AKP', ikon: 'user' },
    { id: 'murid', label: 'Murid & Atlet', ikon: 'users' },
    { id: 'agihan', label: 'Agihan Murid', ikon: 'shuffle' },
    { id: 'audit', label: 'Log Audit', ikon: 'file' }
  ]);
  return m;
}
function binaMenu() {
  $('menuNav').innerHTML = senaraiMenu().map(function (m) {
    return m.kumpulan ? '<div class="label-nav">' + e(m.kumpulan) + '</div>' : '<button class="item-nav" data-h="' + m.id + '">' + ik(m.ikon) + '<span>' + e(m.label) + '</span></button>';
  }).join('');
  semua('#menuNav .item-nav').forEach(function (b) { b.onclick = function () { pergi(b.getAttribute('data-h')); }; });
}
function adaPerubahan() { return Object.keys(S.ubah).some(function (k) { return S.ubah[k] && Object.keys(S.ubah[k]).length; }); }
function pergi(h, arg) {
  if (adaPerubahan() && h !== S.halaman) {
    sahkan('Terdapat perubahan yang belum disimpan. Tinggalkan halaman ini?', function () { S.ubah = {}; pergi(h, arg); }, 'Tinggalkan');
    return;
  }
  S.halaman = h;
  tutupMenuMudah();
  var item = senaraiMenu().filter(function (m) { return m.id === h; })[0];
  $('tajukHalaman').textContent = item ? item.label : '';
  semua('#menuNav .item-nav').forEach(function (b) { b.classList.toggle('aktif', b.getAttribute('data-h') === h); });
  kandungan(rangkaHalaman());
  window.scrollTo(0, 0);
  var f = HALAMAN[h];
  if (f) { try { f(arg); } catch (er) { ralatHalaman(er); } }
}

function mulaAplikasi() {
  paparSkrin('aplikasi');
  var u = S.user;
  $('labelPortal').textContent = u.jenis === 'MURID' ? 'Portal Murid' : 'Portal Guru & Staf';
  var warna = u.jenis === 'MURID' && S.mula && S.mula.portal && S.mula.portal.rumah ? S.mula.portal.rumah.warna
    : (S.mula && S.mula.dashboard && S.mula.dashboard.saya.rumah ? S.mula.dashboard.saya.rumah.warna : '#1d4ed8');
  $('cipPengguna').innerHTML = '<span class="avatar" style="background:' + e(warna) + ';color:' + warnaTeks(warna) + '">' + e(inisial(u.nama)) + '</span><span class="teks" title="' + e(u.nama) + '"><div class="nm">' + e(u.nama) + '</div><div class="pr">' +
    (u.jenis === 'MURID' ? 'Murid' : (u.admin ? 'Admin' : (u.peranan === 'AKP' ? 'Staf AKP' : 'Guru'))) + '</div></span>';
  binaMenu();
  pergi(u.jenis === 'MURID' ? 'portalmurid' : 'dashboard');
}

/* Sambung semula sesi selepas muat semula halaman: papar data simpanan serta-merta, kemudian segarkan. */
function mulakan() {
  pasangLogMasuk();
  var t = bacaSesiTempatan();
  if (!t) return;
  S.token = t.token;
  if (t.sesi && t.sesi.user && t.sesi.mula) { S.user = t.sesi.user; S.mula = t.sesi.mula; S.tet = S.mula.tet || null; mulaAplikasi(); }
  api('apiMula', {}, { segar: true }).then(function (r) {
    var adaPaparan = !!(t.sesi && t.sesi.mula);
    terimaSesi(r);
    if (r.mestiTukarPassword) { paparSkrin('skrinTukar'); return; }
    if (!adaPaparan) mulaAplikasi();
    else if (S.halaman === 'dashboard' || S.halaman === 'portalmurid') pergi(S.halaman);
  }).catch(function () { if (!S.user) { S.token = null; simpanSesiTempatan(); } });
}
function muatSemulaTetapan() { return api('apiTetapan', {}, { segar: true }).then(function (t) { S.tet = t; if (S.mula) { S.mula.tet = t; simpanSesiTempatan(); } return t; }); }
</script>
