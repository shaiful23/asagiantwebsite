/* Simpanan pelayar: localStorage (kekal walaupun tab ditutup — portal terus dibuka
   tanpa log masuk semula), dengan sandaran sessionStorage jika pelayar menyekat
   localStorage dalam iframe. Semua akses dibalut try/catch. */
const SIMPANAN = (function () {
  const cuba = jenis => {
    try { const st = window[jenis]; st.setItem('__uji', '1'); st.removeItem('__uji'); return st; } catch (e) { return null; }
  };
  const st = cuba('localStorage') || cuba('sessionStorage');
  return {
    get: k => { try { return st ? st.getItem(k) : null; } catch (e) { return null; } },
    set: (k, v) => { try { if (!st) return false; st.setItem(k, v); return true; } catch (e) { return false; } },
    remove: k => { try { if (st) st.removeItem(k); } catch (e) { return null; } },
    keys: () => { try { return st ? Object.keys(st) : []; } catch (e) { return []; } }
  };
})();

/* Panggilan pelayan dengan satu cubaan semula automatik bagi kegagalan rangkaian
   sementara (cth. sambungan Wi-Fi sekolah terputus seketika) — lebih stabil. */
function panggil(namaFungsi, param, cubaanSemula) {
  return new Promise((selesai, gagal) => {
    google.script.run.withSuccessHandler(selesai).withFailureHandler(gagal)[namaFungsi](param || {});
  }).catch(ralatRangkaian => {
    /* Cuba semula panggilan BACAAN sahaja — panggilan tulis mungkin sudah berjaya di pelayan. */
    if (cubaanSemula === false || (cubaanSemula === undefined && !adalahBacaan(namaFungsi))) throw ralatRangkaian;
    return new Promise(t => setTimeout(t, 800)).then(() => new Promise((selesai, gagal) => {
      google.script.run.withSuccessHandler(selesai).withFailureHandler(gagal)[namaFungsi](param || {});
    }));
  });
}

function papartToast(mesej, jenis) {
  const t = document.createElement('div');
  t.className = 'toast ' + (jenis || 'jaya');
  t.innerHTML = ikon(jenis === 'gagal' ? 'amaran' : 'betul');
  t.appendChild(document.createTextNode(mesej));
  document.getElementById('kontainerToast').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* Skeleton pemuat — dipaparkan serta-merta sementara data dimuat (rasa lebih pantas). */
function rangkaHtml(bilBaris) {
  let h = '';
  for (let i = 0; i < (bilBaris || 4); i++) h += `<div class="rangka rangka-baris" style="width:${92 - (i % 3) * 14}%"></div>`;
  return h;
}
function rangkaKadHtml(bil) {
  let h = '';
  for (let i = 0; i < (bil || 4); i++) h += '<div class="rangka rangka-blok"></div>';
  return `<div class="grid-kpi">${h}</div>`;
}
function esc(teks) {
  return String(teks === undefined || teks === null ? '' : teks).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function kosongHtml(mesej, namaIkon) {
  return `<div class="kosong">${ikon(namaIkon || 'atom')}${mesej}</div>`;
}

function adalahBacaan(namaFungsi) {
  return /^api(Senarai|Checklist|Dashboard|Carta|Kalendar|Profil|SemakSesi|Tetapan)/.test(namaFungsi);
}
/* Sama seperti CORAK_BACAAN_PANTAS di pelayan (AuthService.gs). */
const CORAK_BACAAN_PANTAS = /^api(Senarai|Checklist|Dashboard|Carta|Kalendar|Profil|Tetapan)[A-Za-z]*$/;

/* Cache memori klien bagi panggilan BACAAN (45 saat) — bertukar menu/panitia terasa
   serta-merta. Sebarang panggilan TULIS mengosongkan cache supaya data sentiasa terkini. */
const CACHE_API = {};
const TEMPOH_CACHE_API_MS = 45000;
function kosongkanCacheApi() { Object.keys(CACHE_API).forEach(k => delete CACHE_API[k]); }

/* Simpanan data kekal (localStorage): halaman dipaparkan SERTA-MERTA daripada data
   terakhir, kemudian disegarkan senyap di latar. Pelayan hanya memulangkan
   { sama: true } jika data tidak berubah (rujuk apiBacaPantas). */
const PREFIX_DATA = 'ebidang_d_';
let TULIS_TERAKHIR = 0;
let VIEW_SEMASA = 'dashboard';
function kunciData(kunci) { return PREFIX_DATA + ((SESI && SESI.nokp) || '') + '|' + kunci; }
function bacaDataTersimpan(kunci) {
  const teks = SIMPANAN.get(kunciData(kunci));
  if (!teks) return null;
  try { return JSON.parse(teks); } catch (e) { return null; }
}
function buangDataTersimpan() {
  SIMPANAN.keys().filter(k => k.indexOf(PREFIX_DATA) === 0).forEach(k => SIMPANAN.remove(k));
}
function simpanDataTersimpan(kunci, hasil) {
  const teks = JSON.stringify({ masa: Date.now(), hasil });
  if (teks.length > 400000) return;
  if (!SIMPANAN.set(kunciData(kunci), teks)) { buangDataTersimpan(); SIMPANAN.set(kunciData(kunci), teks); }
}

/* Panggil pelayan + kendali ralat seragam. senyap = tiada toast (segar latar). */
function panggilPelayan(namaFungsi, param, senyap) {
  return panggil(namaFungsi, Object.assign({ token: TOKEN }, param || {})).then(hasil => {
    if (!hasil || hasil.success === false) {
      const mesej = (hasil && hasil.message) || 'Ralat tidak diketahui.';
      if (/Sesi tamat tempoh/i.test(mesej) && TOKEN) {
        keluar();
        document.getElementById('ralatLogin').textContent = 'Sesi tamat tempoh. Sila log masuk semula.';
      } else if (!senyap) {
        papartToast(mesej, 'gagal');
      }
      throw new Error(mesej);
    }
    return hasil;
  }, ralatRangkaian => {
    if (!senyap) papartToast('Sambungan ke pelayan gagal. Sila semak internet dan cuba lagi.', 'gagal');
    throw ralatRangkaian;
  });
}

function panggilApi(namaFungsi, param) {
  const bacaan = adalahBacaan(namaFungsi);
  const kunci = namaFungsi + '|' + JSON.stringify(param || {});
  if (bacaan && CACHE_API[kunci] && Date.now() - CACHE_API[kunci].masa < TEMPOH_CACHE_API_MS) {
    return Promise.resolve(CACHE_API[kunci].hasil);
  }
  if (!bacaan) {
    kosongkanCacheApi();
    TULIS_TERAKHIR = Date.now();
    return panggilPelayan(namaFungsi, param);
  }
  if (!CORAK_BACAAN_PANTAS.test(namaFungsi)) {
    return panggilPelayan(namaFungsi, param).then(hasil => {
      CACHE_API[kunci] = { masa: Date.now(), hasil };
      return hasil;
    });
  }

  const tersimpan = bacaDataTersimpan(kunci);
  const segar = senyap => panggilPelayan('apiBacaPantas', {
    fn: namaFungsi, param: param || {}, hash: tersimpan && tersimpan.hasil ? (tersimpan.hasil.__hash || '') : ''
  }, senyap).then(hasil => {
    const akhir = hasil.sama && tersimpan ? tersimpan.hasil : hasil;
    CACHE_API[kunci] = { masa: Date.now(), hasil: akhir };
    simpanDataTersimpan(kunci, akhir);
    return { akhir, berubah: !hasil.sama };
  });

  if (tersimpan && tersimpan.hasil && tersimpan.masa > TULIS_TERAKHIR) {
    const view = VIEW_SEMASA;
    segar(true).then(r => { if (r.berubah) segarSenyap(view); }).catch(() => {});
    return Promise.resolve(tersimpan.hasil);
  }
  return segar(false).then(r => r.akhir);
}

/* Data terkini tiba selepas halaman dipaparkan daripada simpanan — lukis semula
   halaman yang sama tanpa rangka pemuat (kecuali pengguna sedang menaip/modal). */
let PEMASA_SEGAR = null;
function segarSenyap(view) {
  clearTimeout(PEMASA_SEGAR);
  PEMASA_SEGAR = setTimeout(() => {
    if (!SESI || view !== VIEW_SEMASA) return;
    const modal = document.getElementById('latarModalUmum');
    if (modal && !modal.classList.contains('hidden')) return;
    const aktif = document.activeElement;
    const k = document.getElementById('kandungan');
    if (aktif && /INPUT|TEXTAREA|SELECT/.test(aktif.tagName) && k.contains(aktif)) return;
    const y = window.scrollY;
    navigasi(view, true);
    window.scrollTo(0, y);
  }, 250);
}

/* ------------------------- LOG MASUK / LOG KELUAR ------------------------- */
document.getElementById('borangLogin').addEventListener('submit', function (ev) {
  ev.preventDefault();
  const nokp = document.getElementById('inputNoKP').value.trim();
  const kataLaluan = document.getElementById('inputKataLaluan').value;
  document.getElementById('ralatLogin').textContent = '';
  const btn = document.getElementById('btnLogMasuk');
  btn.disabled = true; btn.textContent = 'Mengesahkan…';
  const pulihBtn = () => { btn.disabled = false; btn.textContent = 'Log Masuk'; };
  panggil('apiLogin', { nokp, kataLaluan }, false).then(hasil => {
    pulihBtn();
    if (!hasil.success) { document.getElementById('ralatLogin').textContent = hasil.message; return; }
    TOKEN = hasil.token;
    SESI = { nokp: hasil.nokp, nama: hasil.nama, peranan: hasil.peranan, panitia: hasil.panitia, makmal: hasil.makmal };
    SIMPANAN.set('ebidang_token', TOKEN);
    SIMPANAN.set('ebidang_sesi', JSON.stringify(SESI));
    if (hasil.mestiTukarPassword) {
      KATA_LALUAN_SEMENTARA = kataLaluan;
      document.getElementById('latarModal').classList.remove('hidden');
    } else {
      mulakanApp();
    }
  }, () => { pulihBtn(); document.getElementById('ralatLogin').textContent = 'Sambungan ke pelayan gagal. Sila cuba lagi.'; });
});

document.getElementById('borangTukarPassword').addEventListener('submit', function (ev) {
  ev.preventDefault();
  const baharu = document.getElementById('inputPasswordBaharu').value;

/* Sambung semula sesi jika token tersimpan (cth. selepas refresh pelayar). Dijalankan
   serta-merta (tidak menunggu fon/imej dimuat) dengan skrin splash berlogo supaya
   borang log masuk tidak berkelip sebelum aplikasi dibuka. */
function sambungSesiTersimpan() {
  if (!TOKEN) return;
  let sesiTersimpan = null;
  try { sesiTersimpan = JSON.parse(SIMPANAN.get('ebidang_sesi') || 'null'); } catch (e) { sesiTersimpan = null; }
  const sahkanLatar = segera => panggil('apiSemakSesi', { token: TOKEN }).then(hasil => {
    if (hasil && hasil.success) {
      const baharu = { nokp: hasil.nokp, nama: hasil.nama, peranan: hasil.peranan, panitia: hasil.panitia, makmal: hasil.makmal };
      const berubah = JSON.stringify(baharu) !== JSON.stringify(SESI);
      SESI = baharu;
      SIMPANAN.set('ebidang_sesi', JSON.stringify(SESI));
      if (segera || berubah) mulakanApp();
      return;
    }
    keluar();
    document.getElementById('ralatLogin').textContent = 'Sesi tamat tempoh. Sila log masuk semula.';
  });

  /* Sesi tersimpan: buka aplikasi SERTA-MERTA, sahkan sesi di latar. */
  if (sesiTersimpan && sesiTersimpan.nama && sesiTersimpan.peranan) {
    SESI = sesiTersimpan;
    mulakanApp();
    sahkanLatar(false).catch(() => {});
    return;
  }

  const splash = document.getElementById('skrinSplash');
  splash.classList.remove('hidden');
  document.getElementById('skrinLogin').classList.add('hidden');
  const tamat = () => splash.classList.add('hidden');
  sahkanLatar(true).then(tamat, () => {
    tamat();
    document.getElementById('skrinLogin').classList.remove('hidden');
    document.getElementById('ralatLogin').textContent = 'Sambungan ke pelayan gagal. Sila log masuk semula.';
  });
}

/* Pelayan/Sheet simpan & sort tarikh sebagai "yyyy-MM-dd" (ISO, perlu untuk
   <input type="date"> asli & perbandingan rentetan seperti localeCompare/>=).
   Fungsi ini HANYA untuk paparan — tukar ke format dd/MM/yyyy diminta pengguna.
   Jangan guna hasil fungsi ini untuk nilai <input type="date"> atau logik sort. */
function formatTarikhPaparan(iso) {
  const tarikhSahaja = String(iso || '').trim().split(' ')[0];
  const bahagian = tarikhSahaja.split('-');
  if (bahagian.length !== 3) return iso || '';
  return bahagian[2] + '/' + bahagian[1] + '/' + bahagian[0];
}

/* Sama seperti formatTarikhPaparan() tetapi bagi rentetan tarikh+masa
   ("yyyy-MM-dd HH:mm:ss") — masa dikekalkan seperti asal. */
function formatTarikhMasaPaparan(iso) {
  const bahagian = String(iso || '').trim().split(' ');
  const tarikh = formatTarikhPaparan(bahagian[0]);
  return bahagian[1] ? (tarikh + ' ' + bahagian[1]) : tarikh;
}

/* Eksport senarai (array baris) sebagai fail CSV & muat turun terus di pelayar —
   tiada panggilan pelayan, guna data yang sudah dimuatkan pada jadual semasa.
   `header` & `baris` ialah array rentetan/array-array rentetan (bukan objek). */
function eksportCSV(namaFail, header, baris) {
  const escapeCSV = nilai => {
    const s = nilai === undefined || nilai === null ? '' : String(nilai);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const isi = [header].concat(baris).map(b => b.map(escapeCSV).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + isi], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = namaFail;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function inisialDaripadaNama(nama) {
  const perkataan = String(nama || '').trim().split(/\s+/).filter(Boolean);
  if (!perkataan.length) return '?';
  return (perkataan[0][0] + (perkataan.length > 1 ? perkataan[perkataan.length - 1][0] : '')).toUpperCase();
}

/* ============================ CARTA SVG (ringan, tanpa pustaka luar) ============================ */
const WARNA_CARTA = { biru: '#1E3BD1', merah: '#D9141B', kuning: '#E9B200', ungu: '#5B1F8C', hijau: '#16A34A', kelabu: '#94A3B8', langit: '#2F80ED' };

function cartaDonut(segmen, saiz, teksTengah, subTengah) {
  const jumlah = segmen.reduce((j, s) => j + s.nilai, 0);
  const r = 42, lilitan = 2 * Math.PI * r;
  let offset = 0;
  const lengkok = jumlah ? segmen.filter(s => s.nilai > 0).map(s => {
    const panjang = (s.nilai / jumlah) * lilitan;
    const el = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${s.warna}" stroke-width="16" stroke-dasharray="${panjang} ${lilitan - panjang}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"><title>${s.label}: ${s.nilai}</title></circle>`;
    offset += panjang;
    return el;
  }).join('') : '';
  return `<svg class="carta" viewBox="0 0 120 120" style="width:${saiz || 160}px" role="img" aria-label="${teksTengah} ${subTengah || ''}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#EEF1F7" stroke-width="16"/>${lengkok}
    <text x="60" y="58" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">${teksTengah}</text>
    <text x="60" y="74" text-anchor="middle" font-size="8.5" font-weight="700" fill="#64748B">${subTengah || ''}</text></svg>`;
}

function cartaCincin(peratus, saiz) {
  const r = 26, lilitan = 2 * Math.PI * r, p = Math.max(0, Math.min(100, peratus));
  const warna = p >= 80 ? WARNA_CARTA.hijau : p >= 50 ? WARNA_CARTA.kuning : WARNA_CARTA.merah;
  return `<svg viewBox="0 0 64 64" style="width:${saiz || 64}px;flex-shrink:0" role="img" aria-label="Kelengkapan ${p}%">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#EEF1F7" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${warna}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(p / 100) * lilitan} ${lilitan}" transform="rotate(-90 32 32)"/>
    <text x="32" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#0F172A">${p}%</text></svg>`;
}

/* Carta lajur bertindan bulanan (Mesyuarat / Program / PLC). */
function cartaLajurBulanan(data) {
  const W = 600, H = 230, kiri = 30, bawah = 26, atas = 10;
  const maks = Math.max(1, ...data.map(d => d.mesyuarat + d.program + d.plc));
  const skalaMaks = Math.max(4, Math.ceil(maks / 4) * 4);
  const lebarLajur = (W - kiri - 10) / 12;
  const tinggiKawasan = H - bawah - atas;
  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const y = atas + tinggiKawasan - (i / 4) * tinggiKawasan;
    grid += `<line x1="${kiri}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="#EEF1F7"/><text x="${kiri - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#94A3B8">${(skalaMaks / 4) * i}</text>`;
  }
  const bulanIni = new Date().getMonth();
  const lajur = data.map((d, i) => {
    const x = kiri + i * lebarLajur + lebarLajur * 0.22, w = lebarLajur * 0.56;
    let y = atas + tinggiKawasan, h = '';
    [['mesyuarat', WARNA_CARTA.biru], ['program', WARNA_CARTA.merah], ['plc', WARNA_CARTA.ungu]].forEach(([k, warna]) => {
      if (!d[k]) return;
      const t = (d[k] / skalaMaks) * tinggiKawasan;
      y -= t;
      h += `<rect x="${x}" y="${y}" width="${w}" height="${t}" fill="${warna}" rx="3"><title>${BULAN_TAHUNAN[i]} — ${k === 'plc' ? 'PLC' : k.charAt(0).toUpperCase() + k.slice(1)}: ${d[k]}</title></rect>`;
    });
    const label = `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" font-weight="${i === bulanIni ? 800 : 600}" fill="${i === bulanIni ? '#D9141B' : '#64748B'}">${BULAN_TAHUNAN[i]}</text>`;
    return h + label;
  }).join('');
  return `<svg class="carta" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta aktiviti bulanan">${grid}${lajur}</svg>
    <div class="legenda"><span><i style="background:${WARNA_CARTA.biru}"></i>Mesyuarat</span><span><i style="background:${WARNA_CARTA.merah}"></i>Program</span><span><i style="background:${WARNA_CARTA.ungu}"></i>PLC</span></div>`;
}

/* ============================ GOOGLE CALENDAR (pautan klien) ============================ */
const LABEL_JENIS_AKTIVITI = { MESYUARAT: 'Mesyuarat', PROGRAM: 'Program', PLC: 'PLC' };
const WARNA_JENIS_AKTIVITI = { MESYUARAT: WARNA_CARTA.biru, PROGRAM: WARNA_CARTA.merah, PLC: WARNA_CARTA.ungu };

function tarikhKompak(iso, masa) {
  const t = String(iso || '').replace(/-/g, '');
  return masa ? t + 'T' + String(masa).replace(':', '') + '00' : t;
}
function tambahHariIso(iso, hari) {
  const b = String(iso).split('-').map(Number);
  const d = new Date(b[0], b[1] - 1, b[2] + hari);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
/* Pautan "Tambah ke Google Calendar saya" — berfungsi untuk sesiapa, tanpa perlu kalendar dikongsi. */
/* Tiada garis miring berganda literal dalam skrip ini: Apps Script membuang teks selepas
   dua garis miring semasa menyajikan halaman, jadi URL dibina daripada cebisan. */
const URL_GOOGLE_CALENDAR = 'https:' + '/' + '/calendar.google.com/calendar/';
function pautanTambahKalendar(ak) {
  const bermasa = ak.masaMula && ak.masaTamat;
  const mula = tarikhKompak(ak.tarikhMula, bermasa ? ak.masaMula : '');
  const tamat = bermasa ? tarikhKompak(ak.tarikhTamat || ak.tarikhMula, ak.masaTamat) : tarikhKompak(tambahHariIso(ak.tarikhTamat || ak.tarikhMula, 1));
  const tajuk = '[' + LABEL_JENIS_AKTIVITI[ak.jenis] + ' ' + labelSkop(ak.panitia) + '] ' + ak.tajuk;
  return URL_GOOGLE_CALENDAR + 'render?action=TEMPLATE&text=' + encodeURIComponent(tajuk) +
    '&dates=' + mula + '/' + tamat + '&ctz=Asia/Kuching&details=' + encodeURIComponent((ak.keterangan || '') + '\n\nE-Bidang Sains & Matematik SMK Asajaya');
}
function pautanLanggan(idKalendar) {
  return URL_GOOGLE_CALENDAR + 'u/0/r?cid=' + encodeURIComponent(idKalendar);
}
/* Lencana status Google Calendar (lajur StatusKalendar di pelayan). */
function lencanaKalendar(disegerak, status) {
  const st = String(status || '');
  const t = esc(st);
  if (st.indexOf('RALAT') === 0) return `<span class="lencana merah" title="${t}">${ikon('amaran', 'ikon-sahaja')} Ralat</span>`;
  if (st.indexOf('\u21c4') === 0) return `<span class="lencana biru" title="Tarikh/masa/tempat dikemaskini dari Google Calendar (${t})">${ikon('segerak', 'ikon-sahaja')} Dari Kalendar</span>`;
  if (st.indexOf('DIPADAM DI KALENDAR') === 0) return `<span class="lencana kelabu" title="${t}">${ikon('padam', 'ikon-sahaja')} Dipadam di Kalendar</span>`;
  if (st === 'DIBATALKAN') return `<span class="lencana kelabu">Dibatalkan</span>`;
  if (st === 'TIADA TARIKH') return `<span class="lencana kelabu">Tiada Tarikh</span>`;
  return disegerak
    ? `<span class="lencana hijau" title="${t || 'Disegerak ke Google Calendar'}">${ikon('google', 'ikon-sahaja')} Disegerak</span>`
    : `<span class="lencana kelabu" title="Akan disegerak automatik">${ikon('segerak', 'ikon-sahaja')} Menunggu</span>`;
}

/* ============================ KALENDAR (paparan bulanan) ============================ */
const NAMA_BULAN_PENUH = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
let BULAN_KALENDAR = null; /* { tahun, bulan } */
let AKTIVITI_KALENDAR = [];

function paparKalendar() {
  if (!BULAN_KALENDAR) { const d = new Date(); BULAN_KALENDAR = { tahun: d.getFullYear(), bulan: d.getMonth() + 1 }; }
  const aksesPenuh = SESI.peranan === 'ADMIN' || SESI.peranan === 'KETUA_BIDANG';
  const k = document.getElementById('kandungan');
  k.innerHTML = `<div class="kad">
    <div class="baris-alat">
      <div class="navigasi-bulan">
        <button class="btn kecil luar" id="btnBulanSebelum" aria-label="Bulan sebelum">${ikon('kiri', 'ikon-sahaja')}</button>
        <h4 id="labelBulanKalendar">${NAMA_BULAN_PENUH[BULAN_KALENDAR.bulan - 1]} ${BULAN_KALENDAR.tahun}</h4>
        <button class="btn kecil luar" id="btnBulanSelepas" aria-label="Bulan selepas">${ikon('kanan', 'ikon-sahaja')}</button>
        <button class="btn kecil kelabu" id="btnBulanIni">Hari Ini</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn kecil luar hidden" id="btnLanggan" target="_blank" rel="noopener">${ikon('google')}Langgan di Google Calendar</a>
        ${aksesPenuh ? `<button class="btn kecil" id="btnSegerakKalendar">${ikon('segerak')}Segerak Sekarang</button>` : ''}
      </div>
    </div>
    <div class="legenda" style="margin:-6px 0 14px">
      <span><i style="background:${WARNA_CARTA.biru}"></i>Mesyuarat</span><span><i style="background:${WARNA_CARTA.merah}"></i>Program</span><span><i style="background:${WARNA_CARTA.ungu}"></i>PLC</span>
      <span style="color:var(--kelabu);font-weight:500" id="notaSegerakKalendar">Mesyuarat, Program &amp; PLC disegerak DUA HALA dengan Google Calendar — ubah tarikh/masa/tempat di kalendar, portal turut dikemaskini.</span>
    </div>
    <div id="gridKalendar">${rangkaHtml(8)}</div>
  </div>
  <div class="kad"><h3>${ikon('senaraiSemak', 'ikon-h3')}Senarai Aktiviti Bulan Ini</h3><div id="senaraiAktivitiBulan">${rangkaHtml(3)}</div></div>`;

  const tukarBulan = delta => {
    let { tahun, bulan } = BULAN_KALENDAR;
    bulan += delta;
    if (bulan < 1) { bulan = 12; tahun--; } else if (bulan > 12) { bulan = 1; tahun++; }
    BULAN_KALENDAR = { tahun, bulan };
    paparKalendar();
  };
  document.getElementById('btnBulanSebelum').addEventListener('click', () => tukarBulan(-1));
  document.getElementById('btnBulanSelepas').addEventListener('click', () => tukarBulan(1));
  document.getElementById('btnBulanIni').addEventListener('click', () => { BULAN_KALENDAR = null; paparKalendar(); });
  const btnSegerak = document.getElementById('btnSegerakKalendar');
  if (btnSegerak) btnSegerak.addEventListener('click', () => {
    btnSegerak.disabled = true; btnSegerak.innerHTML = ikon('segerak') + 'Menyegerak…';
    panggilApi('apiSegerakKalendar').then(h => {
      papartToast(`Segerak selesai: ${h.disegerak} dihantar, ${h.ditarik || 0} ditarik dari kalendar, ${h.tidakBerubah} tidak berubah${h.gagal ? ', ' + h.gagal + ' gagal' : ''}.`, h.gagal ? 'gagal' : 'jaya');
      paparKalendar();
    }).catch(() => { btnSegerak.disabled = false; btnSegerak.innerHTML = ikon('segerak') + 'Segerak Sekarang'; });
  });

  panggilApi('apiKalendarAktiviti', BULAN_KALENDAR).then(hasil => {
    AKTIVITI_KALENDAR = hasil.senarai;
    const nota = document.getElementById('notaSegerakKalendar');
    if (nota && hasil.syncTerakhir) nota.textContent = (hasil.duaHala ? 'Segerak dua hala' : 'Segerak sehala') + ' dengan Google Calendar — kali terakhir ' + formatTarikhPaparan(hasil.syncTerakhir) + ' ' + String(hasil.syncTerakhir).slice(11, 16) + '.';
    if (hasil.idKalendar) {
      const a = document.getElementById('btnLanggan');
      a.href = pautanLanggan(hasil.idKalendar);
      a.classList.remove('hidden');
    }
    document.getElementById('gridKalendar').innerHTML = gridKalendarHtml(hasil.tahun, hasil.bulan, hasil.senarai);
    document.getElementById('senaraiAktivitiBulan').innerHTML = hasil.senarai.length ? `<table><thead><tr>
      <th>Tarikh</th><th>Masa</th><th>Jenis</th><th>Aktiviti</th><th>Panitia</th><th>Google Calendar</th><th></th></tr></thead><tbody>` +
      hasil.senarai.map((ak, i) => `<tr>
        <td>${formatTarikhPaparan(ak.tarikhMula)}${ak.tarikhTamat !== ak.tarikhMula ? ' → ' + formatTarikhPaparan(ak.tarikhTamat) : ''}</td>
        <td>${ak.masaMula && ak.masaTamat ? ak.masaMula + '–' + ak.masaTamat : 'Sepanjang hari'}</td>
        <td><span class="lencana ${ak.jenis === 'MESYUARAT' ? 'biru' : ak.jenis === 'PLC' ? 'ungu' : 'merah'}">${LABEL_JENIS_AKTIVITI[ak.jenis]}</span></td>
        <td><a href="#" onclick="bukaButiranAktiviti(${i});return false">${esc(ak.tajuk)}</a></td><td>${labelSkop(ak.panitia)}</td>
        <td>${lencanaKalendar(ak.disegerak, ak.statusKalendar)}</td>
        <td><a class="btn kecil luar" href="${pautanTambahKalendar(ak)}" target="_blank" rel="noopener">${ikon('tambah')}Kalendar Saya</a></td>
      </tr>`).join('') + '</tbody></table>' : kosongHtml('Tiada mesyuarat atau program pada bulan ini.', 'kalendar');
  }).catch(() => {});
}

function gridKalendarHtml(tahun, bulan, senarai) {
  const pertama = new Date(tahun, bulan - 1, 1);
  const mulaGrid = new Date(tahun, bulan - 1, 1 - ((pertama.getDay() + 6) % 7)); /* minggu bermula Isnin */
  const isoTempatan = d => d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  let html = ['Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab', 'Ahd'].map(h => `<div class="hari-minggu">${h}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(mulaGrid.getFullYear(), mulaGrid.getMonth(), mulaGrid.getDate() + i);
    if (i >= 35 && d.getMonth() !== bulan - 1) break;
    const iso = isoTempatan(d);
    const pada = senarai.map((ak, idx) => ({ ak, idx })).filter(o => o.ak.tarikhMula <= iso && (o.ak.tarikhTamat || o.ak.tarikhMula) >= iso);
    html += `<div class="sel ${d.getMonth() !== bulan - 1 ? 'luar-bulan' : ''} ${iso === isoTempatan(new Date()) ? 'hari-ini' : ''}">
      <span class="no-hari">${d.getDate()}</span>
      ${pada.slice(0, 3).map(o => `<button class="peristiwa" style="background:${WARNA_JENIS_AKTIVITI[o.ak.jenis]}" title="${esc(o.ak.tajuk)}" onclick="bukaButiranAktiviti(${o.idx})">${o.ak.masaMula ? o.ak.masaMula + ' ' : ''}${esc(o.ak.tajuk)}</button>`).join('')}
      ${pada.length > 3 ? `<span style="font-size:11px;color:var(--kelabu);font-weight:700">+${pada.length - 3} lagi</span>` : ''}
    </div>`;
  }
  return `<div class="grid-kalendar">${html}</div>`;
}

function bukaButiranAktiviti(idx) {
  const ak = AKTIVITI_KALENDAR[idx];
  if (!ak) return;
  bukaModal(ikon(ak.jenis === 'MESYUARAT' ? 'mesyuarat' : 'program', 'ikon-h3') + esc(ak.tajuk), `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      <span class="lencana ${ak.jenis === 'MESYUARAT' ? 'biru' : ak.jenis === 'PLC' ? 'ungu' : 'merah'}">${LABEL_JENIS_AKTIVITI[ak.jenis]}</span>
      <span class="lencana kelabu">${labelSkop(ak.panitia)}</span>${lencanaKalendar(ak.disegerak, ak.statusKalendar)}
    </div>
    <table><tbody>
      <tr><th style="width:120px">Tarikh</th><td>${formatTarikhPaparan(ak.tarikhMula)}${ak.tarikhTamat !== ak.tarikhMula ? ' → ' + formatTarikhPaparan(ak.tarikhTamat) : ''}</td></tr>
      <tr><th>Masa</th><td>${ak.masaMula && ak.masaTamat ? ak.masaMula + '–' + ak.masaTamat : 'Sepanjang hari'}</td></tr>
      ${ak.tempat ? `<tr><th>Tempat</th><td>${esc(ak.tempat)}</td></tr>` : ''}
      <tr><th>${ak.jenis === 'MESYUARAT' ? 'Agenda' : 'Objektif'}</th><td style="white-space:pre-wrap">${esc(ak.keterangan) || '-'}</td></tr>
    </tbody></table>
    <div class="aksi-modal">
      <button type="button" class="btn kelabu" onclick="tutupModal()">Tutup</button>
      <a class="btn" href="${pautanTambahKalendar(ak)}" target="_blank" rel="noopener">${ikon('google')}Tambah ke Kalendar Saya</a>
    </div>`);
}

      /* muat naik gambar yang gagal senyap tidak lagi kelihatan seolah-olah berjaya. */
      papartToast(e.message || 'Gagal memuat naik gambar profil.', 'gagal');

    document.getElementById('statusMuatProfilSaya').textContent = 'Gagal memuatkan profil sedia ada. Sila muat semula halaman.';

      kelayakanAkademik: f.get('kelayakanAkademik'), kelasDiajar: f.get('kelasDiajar')
    }).then(() => papartToast('Profil disimpan.'));
  });
}

function bacaFailSebagaiBase64(fail) {
  return new Promise((selesai, gagal) => {
    const pembaca = new FileReader();
    pembaca.onload = () => selesai(pembaca.result.split(',')[1]);
    pembaca.onerror = gagal;
    pembaca.readAsDataURL(fail);
  });
}

/* Kecilkan & mampatkan imej (guna <canvas>) sebelum muat naik gambar profil —
   dibenamkan sebagai data URI base64 dalam respons apiCartaOrganisasi()/
   apiProfilPengguna() bagi SEMUA staf sekali gus, jadi saiz setiap gambar
   mesti dikekalkan kecil. Pulangkan base64 (tanpa prefix "data:...") + jenis MIME. */
function resizeGambarSebagaiBase64(fail, saizMaksimum) {
  const saiz = saizMaksimum || 300;
  return new Promise((selesai, gagal) => {
    const imej = new Image();
    const url = URL.createObjectURL(fail);
    imej.onload = () => {
      URL.revokeObjectURL(url);
      const skala = Math.min(1, saiz / Math.max(imej.width, imej.height));
      const lebar = Math.round(imej.width * skala);
      const tinggi = Math.round(imej.height * skala);
      const kanvas = document.createElement('canvas');
      kanvas.width = lebar;
      kanvas.height = tinggi;
      kanvas.getContext('2d').drawImage(imej, 0, 0, lebar, tinggi);
      const dataUrl = kanvas.toDataURL('image/jpeg', 0.72);
      selesai({ dataBase64: dataUrl.split(',')[1], jenisMime: 'image/jpeg' });
    };
    imej.onerror = gagal;
    imej.src = url;
  });
}

        <div class="medan"><label>Masa Tamat (pilihan)</label><input type="time" name="masaTamat" value="${m ? (m.MasaTamat || '') : ''}"></div>
        <div class="medan lebar-penuh"><label>Tempat (pilihan)</label><input type="text" name="tempat" value="${m ? esc(m.Tempat || '') : ''}" placeholder="cth. Bilik Mesyuarat Utama"></div>
        <div class="medan lebar-penuh"><label>Agenda</label><textarea name="agenda" rows="3">${m ? (m.Agenda || '') : ''}</textarea></div>
        <div class="medan lebar-penuh"><label>Fail Minit (pilihan)</label><input type="file" name="fail"></div>
      </div>
      <div class="aksi-modal"><button type="button" class="btn kelabu" onclick="tutupModal()">Batal</button><button type="submit" class="btn">Simpan</button></div>
    </form>`);
  document.getElementById('borangMesyuarat').addEventListener('submit', ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const masaMula = f.get('masaMula'), masaTamat = f.get('masaTamat');
    if (masaMula && masaTamat && masaTamat <= masaMula) { papartToast('Masa tamat mesti selepas masa mula.', 'gagal'); return; }
    const fail = f.get('fail');
    const param = {
      idMesyuarat: m ? m.IDMesyuarat : '', panitia: PANITIA_AKTIF, tarikhMesyuarat: f.get('tarikhMesyuarat'),
      tajuk: f.get('tajuk'), masaMula, masaTamat, agenda: f.get('agenda'), tempat: f.get('tempat')
    };
    const proses = (fail && fail.size) ? bacaFailSebagaiBase64(fail).then(b64 => Object.assign(param, { namaFail: fail.name, jenisMime: fail.type, dataBase64: b64 })) : Promise.resolve(param);
    proses.then(p => panggilApi('apiSimpanMesyuarat', p)).then(h => { toastSimpanKalendar('Mesyuarat disimpan', h); tutupModal(); muatSemulaMesyuarat(); });
  });
}

function padamMesyuarat(idMesyuarat) {

  panggilApi('apiPadamMesyuarat', { idMesyuarat }).then(() => { papartToast('Mesyuarat dipadam.'); muatSemulaMesyuarat(); });

/* ============================ PERANCANGAN STRATEGIK (PS/PT/PO) & CARTA GANTT ============================ */
/* Skop = satu Panitia ATAU SKOP_BIDANG (peringkat Ketua Bidang, merentasi semua panitia).
   Sesiapa log masuk boleh LIHAT skop Bidang (dikongsi) + panitia sendiri; hanya
   ADMIN/KETUA_BIDANG boleh URUS skop Bidang, dan ADMIN/KETUA_BIDANG/KETUA_PANITIA
   panitia berkenaan boleh urus skop Panitia (selaras PERANAN_URUS_PANITIA pelayan). */
function senaraiSkopBolehDilihat() {
  const aksesPenuh = SESI.peranan === 'ADMIN' || SESI.peranan === 'KETUA_BIDANG';
  const panitiaSendiri = aksesPenuh ? SENARAI_PANITIA : (SESI.panitia || []);
  return [SKOP_BIDANG].concat(panitiaSendiri);
}
function labelSkop(skop) { return skop === SKOP_BIDANG ? 'Bidang (Keseluruhan)' : skop; }
function bolehUrusSkopJS(skop) {
  const aksesPenuh = SESI.peranan === 'ADMIN' || SESI.peranan === 'KETUA_BIDANG';
  if (skop === SKOP_BIDANG) return aksesPenuh;
  return aksesPenuh || (SESI.peranan === 'KETUA_PANITIA' && (SESI.panitia || []).indexOf(skop) !== -1);
}

let SKOP_PERANCANGAN_AKTIF = null;
let TAB_PERANCANGAN_AKTIF = 'ps';

function paparPerancangan() {
  if (!SKOP_PERANCANGAN_AKTIF) SKOP_PERANCANGAN_AKTIF = senaraiSkopBolehDilihat()[0];
  const k = document.getElementById('kandungan');
  const pilihanSkop = senaraiSkopBolehDilihat().map(sk => `<option value="${sk}" ${sk === SKOP_PERANCANGAN_AKTIF ? 'selected' : ''}>${labelSkop(sk)}</option>`).join('');
  const tab = (kunci, label) => `<button type="button" data-tab="${kunci}" class="${TAB_PERANCANGAN_AKTIF === kunci ? 'aktif' : ''}">${label}</button>`;
  k.innerHTML = `<div class="kad"><h3>${ikon('perancangan', 'ikon-h3')}Perancangan Strategik</h3>
    <p style="margin:-8px 0 14px;font-size:12px;color:var(--kelabu)">Perancangan Strategik (PS), Pelan Taktikal (PT), Pelan Operasi (PO) dan Carta Gantt aktiviti tahunan.</p>
    <div class="baris-alat"><label style="font-size:13px;font-weight:600">Skop:</label><select id="pemilihSkopPerancangan" style="width:auto">${pilihanSkop}</select></div>
    <div class="bar-tab">${tab('ps', 'Perancangan Strategik (PS)')}${tab('pt', 'Pelan Taktikal (PT)')}${tab('po', 'Pelan Operasi (PO)')}${tab('gantt', 'Carta Gantt')}</div>
    <div id="kandunganTabPerancangan"></div></div>`;

  document.getElementById('pemilihSkopPerancangan').addEventListener('change', ev => { SKOP_PERANCANGAN_AKTIF = ev.target.value; muatSemulaTabPerancangan(); });
  document.querySelectorAll('.bar-tab button').forEach(btn => btn.addEventListener('click', () => { TAB_PERANCANGAN_AKTIF = btn.dataset.tab; paparPerancangan(); }));
  muatSemulaTabPerancangan();
}

function muatSemulaTabPerancangan() {
  ({ ps: muatSemulaPS, pt: muatSemulaPT, po: muatSemulaPO, gantt: muatSemulaGantt })[TAB_PERANCANGAN_AKTIF]();
}

/* ---------- Perancangan Strategik (PS) ---------- */
function muatSemulaPS() {
  const bolehUrus = bolehUrusSkopJS(SKOP_PERANCANGAN_AKTIF);
  const k = document.getElementById('kandunganTabPerancangan');

  const btn = document.getElementById('btnTambahPS');

  panggilApi('apiSenaraiPS', { skop: SKOP_PERANCANGAN_AKTIF }).then(hasil => {
    document.getElementById('jadualPS').innerHTML = hasil.senarai.length ? hasil.senarai.map(ps => `

/* ============================ PESANAN RADAS & BAHAN MAKMAL ============================ */
/* Senarai panitia makmal yang pengguna semasa boleh buat pesanan bagi pihaknya —
   ADMIN/KETUA_BIDANG boleh bagi semua panitia makmal; GURU/KETUA_PANITIA hanya
   panitia makmal dalam senarai panitia sendiri (mungkin > 1). */
function panitiaPesananBoleh() {
  const aksesPenuh = SESI.peranan === 'ADMIN' || SESI.peranan === 'KETUA_BIDANG';
  if (aksesPenuh) return PANITIA_MAKMAL;
  if (['GURU', 'KETUA_PANITIA'].indexOf(SESI.peranan) === -1) return [];
  return (SESI.panitia || []).filter(pn => PANITIA_MAKMAL.indexOf(pn) !== -1);
}
function bolehBuatPesananMakmalJS() {
  return panitiaPesananBoleh().length > 0;
}
/* "Urus semua" = nampak SEMUA pesanan merentasi semua panitia/makmal (Admin/Ketua Bidang/
   Ketua Pembantu Makmal) — dapat penapis Panitia+Makmal dan lajur Panitia/Makmal dalam jadual. */
function bolehUrusSemuaPesananJS() { return PERANAN_LIHAT_SEMUA_PESANAN.indexOf(SESI.peranan) !== -1; }
/* Sama ada boleh batal/sunting pesanan (pemohon panitia makmal, atau Admin/Ketua Bidang) —
   Pembantu Makmal sengaja dikecualikan, peranan itu hanya memproses status, bukan kandungan pesanan. */
function bolehBatalSuntingPesananJS() {
  return bolehBuatPesananMakmalJS() || SESI.peranan === 'ADMIN' || SESI.peranan === 'KETUA_BIDANG';
}
/* Sama ada boleh tukar status/proses pesanan — Pembantu Makmal biasa boleh proses juga,
   tetapi apiSenaraiPesanan() pelayan sudah hanya memulangkan pesanan bagi Makmal sendiri,
   jadi semua baris yang dipaparkan kepada mereka sememangnya sah untuk diproses. */
function bolehProsesPesananJS() { return bolehUrusSemuaPesananJS() || SESI.peranan === 'PEMBANTU_MAKMAL'; }

function paparPesananMakmal() {
  const k = document.getElementById('kandungan');
  const urusSemua = bolehUrusSemuaPesananJS();
  const penapisPanitia = urusSemua
    ? `<select id="penapisPanitiaPesanan" style="width:auto"><option value="">Semua Panitia Makmal</option>${PANITIA_MAKMAL.map(pn => `<option value="${pn}">${pn}</option>`).join('')}</select>` : '';
  const penapisMakmal = urusSemua
    ? `<select id="penapisMakmalPesanan" style="width:auto"><option value="">Semua Makmal</option>${SENARAI_MAKMAL.map(mk => `<option value="${mk}">${mk}</option>`).join('')}</select>` : '';
  const penapisStatus = `<select id="penapisStatusPesanan" style="width:auto"><option value="">Semua Status</option>${Object.keys(LABEL_STATUS_PESANAN).map(s => `<option value="${s}">${LABEL_STATUS_PESANAN[s]}</option>`).join('')}</select>`;
  k.innerHTML = `<div class="baris-alat">${penapisPanitia}${penapisMakmal}${penapisStatus}${bolehBuatPesananMakmalJS() ? `<button class="btn" id="btnPesananBaharu">${ikon('tambah')}Pesanan Baharu</button>` : ''}</div>
    <div class="kad"><h3>${ikon('pesananMakmal', 'ikon-h3')}Senarai Pesanan Radas &amp; Bahan Makmal</h3><div id="jadualPesananMakmal"></div></div>`;

  const btnBaharu = document.getElementById('btnPesananBaharu');
  if (btnBaharu) btnBaharu.addEventListener('click', () => bukaBorangPesananMakmal());
  const pp = document.getElementById('penapisPanitiaPesanan');
  if (pp) pp.addEventListener('change', muatSemulaPesananMakmal);
  const pm = document.getElementById('penapisMakmalPesanan');
  if (pm) pm.addEventListener('change', muatSemulaPesananMakmal);
  document.getElementById('penapisStatusPesanan').addEventListener('change', muatSemulaPesananMakmal);
  muatSemulaPesananMakmal();
}

function muatSemulaPesananMakmal() {
  const param = { status: (document.getElementById('penapisStatusPesanan') || {}).value || '' };
  const pp = document.getElementById('penapisPanitiaPesanan');
  if (pp) param.panitia = pp.value;
  const pm = document.getElementById('penapisMakmalPesanan');
  if (pm) param.makmal = pm.value;

  panggilApi('apiSenaraiPesanan', param).then(hasil => {
    const urusSemua = bolehUrusSemuaPesananJS();
    const bolehUbah = bolehBatalSuntingPesananJS();
    const bolehProses = bolehProsesPesananJS();
    document.getElementById('jadualPesananMakmal').innerHTML = hasil.senarai.length ? `<table><thead><tr>
      <th>Tarikh Pesanan</th><th>Makmal</th>${urusSemua ? '<th>Panitia</th>' : ''}<th>Guru</th><th>Kelas</th><th>Masa</th><th>Tajuk Eksperimen</th><th>Tarikh Diperlukan</th><th>Status</th><th></th></tr></thead><tbody>` +
      hasil.senarai.map(ps => `<tr>
        <td>${formatTarikhMasaPaparan(ps.TarikhCipta)}</td><td>${ps.Makmal || '-'}</td>${urusSemua ? `<td>${ps.Panitia}</td>` : ''}<td>${ps.NamaGuru}</td><td>${ps.Kelas}</td>
        <td>${ps.MasaMula || '-'}&ndash;${ps.MasaTamat || '-'}</td><td>${ps.TajukEksperimen}</td><td>${formatTarikhPaparan(ps.TarikhDiperlukan)}</td>
        <td><span class="lencana ${LENCANA_STATUS_PESANAN[ps.Status]}">${LABEL_STATUS_PESANAN[ps.Status]}</span></td>
        <td>
          <button class="btn kecil luar" onclick="cetakPesanan('${ps.IDPesanan}')">${ikon('cetak')}Cetak / PDF</button>
          ${bolehProses ? `<button class="btn kecil luar" onclick="bukaKemaskiniStatusPesanan('${ps.IDPesanan}', '${ps.Status}')">${ikon('sunting')}Kemaskini Status</button>` : ''}
          ${ps.Status === 'MENUNGGU' && bolehUbah ? `<button class="btn kecil luar" onclick="bukaSuntingPesanan('${ps.IDPesanan}')">${ikon('sunting')}Sunting</button>
          <button class="btn kecil merah" onclick="batalPesananMakmal('${ps.IDPesanan}')">${ikon('padam')}Batal</button>` : ''}
          ${SESI.peranan === 'ADMIN' || SESI.peranan === 'KETUA_BIDANG' ? `<button class="btn kecil merah" onclick="padamPesananMakmal('${ps.IDPesanan}')">${ikon('padam')}Padam</button>` : ''}
        </td></tr>`).join('') + `</tbody></table>` : kosongHtml('Tiada pesanan direkod.');
  });
}

/* pesananSedia/itemSedia diisi hanya semasa Sunting (bukaSuntingPesanan) — kosong bermaksud Pesanan Baharu. */
function bukaBorangPesananMakmal(pesananSedia, itemSedia) {
  const suntingMod = !!pesananSedia;
  const panitiaPilihan = panitiaPesananBoleh();
  const medanPanitia = suntingMod ? '' :
    (panitiaPilihan.length > 1
      ? `<div class="medan"><label>Panitia</label><select name="panitia">${panitiaPilihan.map(p => `<option value="${p}">${p}</option>`).join('')}</select></div>`
      : `<input type="hidden" name="panitia" value="${panitiaPilihan[0] || ''}">`);
  const makmalSemasa = suntingMod ? pesananSedia.Makmal : '';
  bukaModal(ikon('pesananMakmal', 'ikon-h3') + (suntingMod ? ('Sunting Pesanan — ' + pesananSedia.Panitia) : 'Pesanan Baharu'), `
    <form id="borangPesananMakmal">
      <div class="grid-borang">
        ${medanPanitia}
        <div class="medan"><label>Makmal</label><select name="makmal" required>${SENARAI_MAKMAL.map(mk => `<option value="${mk}" ${mk === makmalSemasa ? 'selected' : ''}>${mk}</option>`).join('')}</select></div>
        <div class="medan"><label>Kelas</label><input type="text" name="kelas" value="${suntingMod ? pesananSedia.Kelas : ''}" placeholder="cth. 5 Bestari" required></div>
        <div class="medan"><label>Tarikh Diperlukan</label><input type="date" name="tarikhDiperlukan" value="${suntingMod ? pesananSedia.TarikhDiperlukan : ''}" required></div>
        <div class="medan"><label>Masa Mula</label><input type="time" name="masaMula" value="${suntingMod ? (pesananSedia.MasaMula || '') : ''}" required></div>
        <div class="medan"><label>Masa Tamat</label><input type="time" name="masaTamat" value="${suntingMod ? (pesananSedia.MasaTamat || '') : ''}" required></div>
        <div class="medan lebar-penuh"><label>Tajuk Eksperimen/Aktiviti</label><input type="text" name="tajukEksperimen" value="${suntingMod ? pesananSedia.TajukEksperimen : ''}" required></div>
        <div class="medan lebar-penuh"><label>Catatan Am (pilihan)</label><input type="text" name="catatanAm" value="${suntingMod ? (pesananSedia.CatatanAm || '') : ''}"></div>
      </div>
      <h4 style="margin:16px 0 8px;font-size:13px;color:var(--kelabu);text-transform:uppercase">Senarai Bahan &amp; Radas</h4>
      <div id="barisItemPesanan"></div>
      <button type="button" class="btn kecil luar" id="btnTambahBarisItem" style="margin-top:2px">${ikon('tambah')}Tambah Baris</button>
      <div class="aksi-modal"><button type="button" class="btn kelabu" onclick="tutupModal()">Batal</button><button type="submit" class="btn">${ikon('pesananMakmal')}${suntingMod ? 'Simpan Perubahan' : 'Hantar Pesanan'}</button></div>
    </form>`);
  if (suntingMod && itemSedia.length) {
    itemSedia.forEach(it => tambahBarisItemPesanan({ namaBahanRadas: it.NamaBahanRadas, kuantiti: it.Kuantiti, unit: it.Unit, catatan: it.Catatan }));
  } else {
    tambahBarisItemPesanan();
  }
  document.getElementById('btnTambahBarisItem').addEventListener('click', () => tambahBarisItemPesanan());
  document.getElementById('borangPesananMakmal').addEventListener('submit', ev => hantarBorangPesananMakmal(ev, suntingMod ? pesananSedia.IDPesanan : null));
}

function bukaSuntingPesanan(idPesanan) {
  panggilApi('apiButiranPesanan', { idPesanan }).then(hasil => bukaBorangPesananMakmal(hasil.pesanan, hasil.item));
}

function tambahBarisItemPesanan(nilaiSedia) {
  const v = nilaiSedia || {};
  const kontainer = document.getElementById('barisItemPesanan');
  const baris = document.createElement('div');
  baris.className = 'baris-item-pesanan';
  baris.innerHTML = `
    <input type="text" placeholder="Nama Bahan/Radas" data-medan="namaBahanRadas" value="${v.namaBahanRadas || ''}" required>
    <input type="number" min="1" step="1" placeholder="Kuantiti" data-medan="kuantiti" value="${v.kuantiti || ''}" required>
    <input type="text" placeholder="Unit (cth. botol, g)" data-medan="unit" value="${v.unit || ''}">
    <input type="text" placeholder="Catatan" data-medan="catatan" value="${v.catatan || ''}">
    <button type="button" class="btn kecil merah" onclick="this.parentElement.remove()" aria-label="Buang baris">${ikon('padam', 'ikon-sahaja')}</button>`;
  kontainer.appendChild(baris);
}

function hantarBorangPesananMakmal(ev, idPesananSunting) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const item = Array.from(document.querySelectorAll('.baris-item-pesanan')).map(baris => {
    const obj = {};
    baris.querySelectorAll('[data-medan]').forEach(el => { obj[el.dataset.medan] = el.value; });
    return obj;
  });
  const masaMula = f.get('masaMula'), masaTamat = f.get('masaTamat');
  if (masaTamat <= masaMula) { papartToast('Masa tamat mesti selepas masa mula.', 'gagal'); return; }
  const data = {
    panitia: f.get('panitia'), makmal: f.get('makmal'), kelas: f.get('kelas'), tajukEksperimen: f.get('tajukEksperimen'),
    tarikhDiperlukan: f.get('tarikhDiperlukan'), masaMula, masaTamat, catatanAm: f.get('catatanAm'), item
  };
  const panggilan = idPesananSunting
    ? panggilApi('apiKemaskiniPesanan', Object.assign({ idPesanan: idPesananSunting }, data))
    : panggilApi('apiSimpanPesanan', data);
  panggilan.then(() => {
    papartToast(idPesananSunting ? 'Pesanan dikemaskini.' : 'Pesanan berjaya dihantar.');
    tutupModal();
    muatSemulaPesananMakmal();
  });
}

function batalPesananMakmal(idPesanan) {
  if (!confirm('Batalkan pesanan ini?')) return;
  panggilApi('apiBatalPesanan', { idPesanan }).then(() => { papartToast('Pesanan dibatalkan.'); muatSemulaPesananMakmal(); });
}

function padamPesananMakmal(idPesanan) {
  if (!confirm('Padam pesanan ini secara kekal?')) return;
  panggilApi('apiPadamPesanan', { idPesanan }).then(() => { papartToast('Pesanan dipadam.'); muatSemulaPesananMakmal(); });
}

function bukaKemaskiniStatusPesanan(idPesanan, statusSemasa) {
  bukaModal(ikon('sunting', 'ikon-h3') + 'Kemaskini Status Pesanan', `
    <form id="borangStatusPesanan">
      <div class="medan"><label>Status</label><select name="status">${Object.keys(LABEL_STATUS_PESANAN).map(s => `<option value="${s}" ${s === statusSemasa ? 'selected' : ''}>${LABEL_STATUS_PESANAN[s]}</option>`).join('')}</select></div>
      <div class="medan"><label>Catatan Pembantu Makmal</label><textarea name="catatanPembantu" rows="3"></textarea></div>
      <div class="aksi-modal"><button type="button" class="btn kelabu" onclick="tutupModal()">Batal</button><button type="submit" class="btn">Simpan</button></div>
    </form>`);
  document.getElementById('borangStatusPesanan').addEventListener('submit', ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    panggilApi('apiKemaskiniStatusPesanan', { idPesanan, status: f.get('status'), catatanPembantu: f.get('catatanPembantu') })
      .then(() => { papartToast('Status pesanan dikemaskini.'); tutupModal(); muatSemulaPesananMakmal(); });
  });
}

          <tr><td><b>Tajuk Eksperimen/Aktiviti</b></td><td colspan="3">${ps.TajukEksperimen}</td></tr>
          <tr><td><b>Tarikh Diperlukan</b></td><td>${formatTarikhPaparan(ps.TarikhDiperlukan)}</td><td><b>Status</b></td><td>${LABEL_STATUS_PESANAN[ps.Status] || ps.Status}</td></tr>
          ${ps.CatatanAm ? `<tr><td><b>Catatan Am</b></td><td colspan="3">${ps.CatatanAm}</td></tr>` : ''}
        </table>

          <thead><tr><th>Bil.</th><th>Nama Bahan / Radas</th><th>Kuantiti</th><th>Unit</th><th>Catatan</th></tr></thead>
          <tbody>
            ${item.map((it, i) => `<tr><td>${i + 1}</td><td>${it.NamaBahanRadas}</td><td>${it.Kuantiti}</td><td>${it.Unit || '-'}</td><td>${it.Catatan || '-'}</td></tr>`).join('')}
            ${barisKosong}
          </tbody>
        </table>
        ${ps.CatatanPembantu ? `<p class="catatan-pembantu-cetak"><b>Catatan Pembantu Makmal:</b> ${ps.CatatanPembantu}</p>` : ''}
        <div class="blok-tandatangan">
          <div><p class="garis-tandatangan">....................................</p><p>Disediakan oleh (Guru)<br>${ps.NamaGuru}</p></div>

          <div><p class="garis-tandatangan">....................................</p><p>Diproses oleh (Pembantu Makmal)<br>${ps.DiprosesOleh || ''}</p></div>
        </div>
      </div>`;
    setTimeout(() => window.print(), 150);
  });
}

/* ============================ PENGURUSAN MAKMAL (INVENTORI & KESELAMATAN) ============================ */
/* Lanjutan Pesanan Makmal di atas (permintaan) — modul ini uruskan STOK sedia
   ada & pematuhan keselamatan. Skop mengikut Makmal (bukan Panitia). */
function senaraiMakmalBolehDilihat() {
  return SESI.peranan === 'PEMBANTU_MAKMAL' ? (SESI.makmal || []) : SENARAI_MAKMAL;
}
function bolehUrusMakmalJS(makmal) {
  if (PERANAN_LIHAT_SEMUA_PESANAN.indexOf(SESI.peranan) !== -1) return true;
  return SESI.peranan === 'PEMBANTU_MAKMAL' && (SESI.makmal || []).indexOf(makmal) !== -1;
}

let MAKMAL_OPS_AKTIF = null;
let TAB_MAKMAL_OPS_AKTIF = 'inventori';

function paparMakmalOps() {
  if (!MAKMAL_OPS_AKTIF) MAKMAL_OPS_AKTIF = senaraiMakmalBolehDilihat()[0];
  const k = document.getElementById('kandungan');
  const pilihanMakmal = senaraiMakmalBolehDilihat().map(mk => `<option value="${mk}" ${mk === MAKMAL_OPS_AKTIF ? 'selected' : ''}>${mk}</option>`).join('');
  const tab = (kunci, label) => `<button type="button" data-tab="${kunci}" class="${TAB_MAKMAL_OPS_AKTIF === kunci ? 'aktif' : ''}">${label}</button>`;
  k.innerHTML = `<div class="kad"><h3>${ikon('makmalOps', 'ikon-h3')}Pengurusan Makmal</h3>
    <p style="margin:-8px 0 14px;font-size:12px;color:var(--kelabu)">Inventori radas/bahan dan senarai semak keselamatan setiap Makmal.</p>
    <div class="baris-alat"><label style="font-size:13px;font-weight:600">Makmal:</label><select id="pemilihMakmalOps" style="width:auto">${pilihanMakmal}</select></div>
    <div class="bar-tab">${tab('inventori', 'Inventori')}${tab('keselamatan', 'Semakan Keselamatan')}</div>
    <div id="kandunganTabMakmalOps"></div></div>`;

  document.getElementById('pemilihMakmalOps').addEventListener('change', ev => { MAKMAL_OPS_AKTIF = ev.target.value; muatSemulaTabMakmalOps(); });
  document.querySelectorAll('.bar-tab button').forEach(btn => btn.addEventListener('click', () => { TAB_MAKMAL_OPS_AKTIF = btn.dataset.tab; paparMakmalOps(); }));
  muatSemulaTabMakmalOps();
}

function muatSemulaTabMakmalOps() {
  ({ inventori: muatSemulaInventori, keselamatan: muatSemulaKeselamatan })[TAB_MAKMAL_OPS_AKTIF]();
}

/* ---------- Inventori ---------- */

  const bolehUrus = bolehUrusMakmalJS(MAKMAL_OPS_AKTIF);
  const k = document.getElementById('kandunganTabMakmalOps');

  const btn = document.getElementById('btnTambahInventori');
  if (btn) btn.addEventListener('click', () => bukaBorangInventori(null));
  panggilApi('apiSenaraiInventoriMakmal', { makmal: MAKMAL_OPS_AKTIF }).then(hasil => {
    document.getElementById('jadualInventori').innerHTML = hasil.senarai.length ? `<table><thead><tr>
      <th>Nama Item</th><th>Kategori</th><th>Kuantiti</th><th>Status</th><th>Kemaskini</th><th></th></tr></thead><tbody>` +
      hasil.senarai.map(inv => `<tr><td>${inv.NamaItem}</td><td>${inv.Kategori === 'BAHAN_KIMIA' ? 'Bahan Kimia' : 'Radas'}</td>
        <td>${inv.Kuantiti || '-'} ${inv.Unit || ''}</td><td><span class="lencana ${inv.Status === 'BAIK' ? 'hijau' : inv.Status === 'ROSAK' ? 'merah' : 'kuning'}">${inv.Status}</span></td>

      `</tbody></table>` : kosongHtml('Tiada item inventori direkod bagi Makmal ini.');
  });
}

function bukaBorangInventori(inv) {
  bukaModal(ikon('makmalOps', 'ikon-h3') + (inv ? 'Sunting Item Inventori' : 'Item Inventori Baharu') + ' — ' + MAKMAL_OPS_AKTIF, `
    <form id="borangInventori">
      <div class="grid-borang">

        <div class="medan"><label>Status</label><select name="status">

function padamInventori(idInventori) {

}

/* ---------- Semakan Keselamatan ---------- */
function muatSemulaKeselamatan() {
  const bolehUrus = bolehUrusMakmalJS(MAKMAL_OPS_AKTIF);
  const k = document.getElementById('kandunganTabMakmalOps');

function padamKeselamatan(idSemakanKeselamatan) {

      <div class="grid-borang">
        <div class="medan"><label>Jawatan/Gelaran</label><input type="text" name="jawatan" value="${u ? (u.jawatan || '') : ''}" placeholder="cth. Ketua Panitia Kimia"></div>
        <div class="medan"><label>Gred Jawatan</label><input type="text" name="gredJawatan" value="${u ? (u.gredJawatan || '') : ''}" placeholder="cth. DG44"></div>

        <div class="medan lebar-penuh"><label>Opsyen/Bidang Pengkhususan Mengajar</label><input type="text" name="opsyenPengkhususan" value="${u ? (u.opsyenPengkhususan || '') : ''}"></div>

  ));
  panggilApi('apiSenaraiAudit').then(hasil => {
    SENARAI_AUDIT_SEMASA = hasil.senarai;
    document.getElementById('jadualAudit').innerHTML = `<table><thead><tr>
      <th>Tarikh</th><th>Nama</th><th>Peranan</th><th>Tindakan</th><th>Modul</th><th>Butiran</th></tr></thead><tbody>` +
      hasil.senarai.map(a => `<tr><td>${formatTarikhMasaPaparan(a.Tarikh)}</td><td>${a.Nama}</td><td>${LABEL_PERANAN[a.Peranan] || a.Peranan}</td>
        <td>${a.Tindakan}</td><td>${a.Modul}</td><td>${a.Butiran}</td></tr>`).join('') + `</tbody></table>`;
  });
}
let SENARAI_AUDIT_SEMASA = [];

/* ============================ PLC (PROFESSIONAL LEARNING COMMUNITY) ============================ */
/* Semua guru panitia boleh merekod PLC; sunting/padam oleh pencipta atau Ketua Panitia
   (bolehUrus dikira di pelayan). Disegerak dua hala dengan Google Calendar. */
let SENARAI_PLC_SEMASA = [];
let SENARAI_JENIS_PLC = ['Lesson Study', 'Learning Walk', 'Teacher Sharing Session', 'Peer Coaching',
  'Coaching & Mentoring', 'Book Club', 'Data Analysis', 'Kajian Tindakan', 'Lain-lain'];
const LABEL_STATUS_PLC = { DIRANCANG: 'Dirancang', SELESAI: 'Selesai', DIBATALKAN: 'Dibatalkan' };
const LENCANA_STATUS_PLC = { DIRANCANG: 'kuning', SELESAI: 'hijau', DIBATALKAN: 'kelabu' };

function toastSimpanKalendar(mesej, h) {
  const st = String((h && h.statusKalendar) || '');
  if (st.indexOf('RALAT') === 0) papartToast(mesej + ', tetapi Google Calendar gagal: ' + st.slice(7), 'gagal');
  else papartToast(mesej + (st.indexOf('DISEGERAK') === 0 ? ' & disegerak ke Google Calendar.' : '.'));
}

function paparPLC() {
  const k = document.getElementById('kandungan');
  const bolehTambah = bolehUbahSkopAktif() && !!PANITIA_AKTIF;
  k.innerHTML = `<div class="baris-alat">${pemilihPanitiaHtml(true)}
      <button class="btn kecil luar" id="btnEksportPLC">${ikon('cetak')}Eksport CSV</button>
      ${bolehTambah ? `<button class="btn" id="btnTambahPLC">${ikon('tambah')}PLC Baharu</button>` : ''}</div>
    <div id="kpiPLC">${rangkaKadHtml(4)}</div>
    <div class="kad"><h3>${ikon('plc', 'ikon-h3')}Sesi PLC — ${esc(labelSkop(PANITIA_AKTIF))}</h3>
      <p class="sub-kad">Semua guru panitia boleh merekod sesi PLC. Setiap sesi disegerak dua hala dengan Google Calendar.</p>
      <div id="jadualPLC">${rangkaHtml(4)}</div></div>`;
  pasangPemilihPanitia(paparPLC);
  const btn = document.getElementById('btnTambahPLC');
  if (btn) btn.addEventListener('click', () => bukaBorangPLC(null));
  document.getElementById('btnEksportPLC').addEventListener('click', () => eksportCSV(
    'PLC_' + PANITIA_AKTIF + '.csv',
    ['Tarikh', 'Masa', 'Tajuk', 'Jenis', 'Tempat', 'Fasilitator', 'Peserta', 'Status', 'Refleksi'],
    SENARAI_PLC_SEMASA.map(r => [formatTarikhPaparan(r.Tarikh), r.MasaMula && r.MasaTamat ? r.MasaMula + '-' + r.MasaTamat : '-',
      r.Tajuk, r.JenisPLC, r.Tempat || '', r.Fasilitator || '', r.Peserta || '', LABEL_STATUS_PLC[r.Status] || r.Status, r.Refleksi || ''])
  ));
  muatSemulaPLC();
}

function muatSemulaPLC() {
  panggilApi('apiSenaraiPLC', { panitia: PANITIA_AKTIF }).then(hasil => {
    SENARAI_PLC_SEMASA = hasil.senarai || [];
    if (hasil.jenisPLC) SENARAI_JENIS_PLC = hasil.jenisPLC;
    const s = SENARAI_PLC_SEMASA;
    const tahun = String(new Date().getFullYear());
    const kad = (warna, namaIkon, label, nilai) => `<div class="kpi ${warna}"><div class="lencana-ikon">${ikon(namaIkon)}</div>
      <div><div class="label">${label}</div><div class="nilai">${nilai}</div></div></div>`;
    const kpi = document.getElementById('kpiPLC');
    if (kpi) kpi.innerHTML = `<div class="grid-kpi">
      ${kad('ungu', 'plc', 'Sesi PLC ' + tahun, s.filter(r => String(r.Tarikh).indexOf(tahun) === 0).length)}
      ${kad('hijau', 'betul', 'Selesai', s.filter(r => r.Status === 'SELESAI').length)}
      ${kad('kuning', 'jam', 'Dirancang', s.filter(r => r.Status === 'DIRANCANG').length)}
      ${kad('biru', 'google', 'Di Google Calendar', s.filter(r => r.EventIdKalendar).length)}</div>`;
    const el = document.getElementById('jadualPLC');
    if (!el) return;
    if (hasil.perluMigrasi) { el.innerHTML = kosongHtml('Sheet PLC belum wujud. Admin perlu jalankan menu "2. Kemaskini Struktur" dalam Google Sheet.', 'amaran'); return; }
    el.innerHTML = s.length ? `<table><thead><tr><th>Tarikh</th><th>Masa</th><th>Tajuk</th><th>Jenis</th>
      <th>Fasilitator</th><th>Status</th><th>Google Calendar</th><th></th></tr></thead><tbody>` +
      s.map((r, i) => `<tr>
        <td>${formatTarikhPaparan(r.Tarikh)}</td>
        <td>${r.MasaMula && r.MasaTamat ? r.MasaMula + '&ndash;' + r.MasaTamat : '-'}</td>
        <td><a href="#" onclick="bukaButiranPLC(${i});return false">${esc(r.Tajuk)}</a>
          ${r.Tempat ? `<div style="font-size:11.5px;color:var(--kelabu)">${ikon('lokasi', 'ikon-sahaja')} ${esc(r.Tempat)}</div>` : ''}</td>
        <td><span class="lencana ungu">${esc(r.JenisPLC)}</span></td><td>${esc(r.Fasilitator || '-')}</td>
        <td><span class="lencana ${LENCANA_STATUS_PLC[r.Status] || 'kelabu'}">${LABEL_STATUS_PLC[r.Status] || esc(r.Status)}</span></td>
        <td>${lencanaKalendar(!!r.EventIdKalendar, r.StatusKalendar)}</td>
        <td>${r.FailUrl ? `<a class="btn kecil luar" href="${esc(r.FailUrl)}" target="_blank" rel="noopener">${ikon('lihat')}Fail</a>` : ''}
          ${r.bolehUrus ? `<button class="btn kecil luar" onclick="bukaBorangPLC(${i})">${ikon('sunting')}Sunting</button>
          <button class="btn kecil merah" onclick="padamPLC(${i})">${ikon('padam')}Padam</button>` : ''}</td>
      </tr>`).join('') + '</tbody></table>' : kosongHtml('Belum ada sesi PLC direkod bagi ' + esc(labelSkop(PANITIA_AKTIF)) + '.', 'plc');
  }).catch(() => {});
}

function bukaButiranPLC(i) {
  const r = SENARAI_PLC_SEMASA[i];
  if (!r) return;
  const baris = (label, nilai) => nilai ? `<tr><th style="width:130px">${label}</th><td style="white-space:pre-wrap">${esc(nilai)}</td></tr>` : '';
  bukaModal(ikon('plc', 'ikon-h3') + esc(r.Tajuk), `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      <span class="lencana ungu">${esc(r.JenisPLC)}</span><span class="lencana kelabu">${esc(labelSkop(r.Panitia))}</span>
      <span class="lencana ${LENCANA_STATUS_PLC[r.Status] || 'kelabu'}">${LABEL_STATUS_PLC[r.Status] || esc(r.Status)}</span>
      ${lencanaKalendar(!!r.EventIdKalendar, r.StatusKalendar)}</div>
    <table><tbody>
      ${baris('Tarikh', formatTarikhPaparan(r.Tarikh))}
      ${baris('Masa', r.MasaMula && r.MasaTamat ? r.MasaMula + ' - ' + r.MasaTamat : 'Sepanjang hari')}
      ${baris('Tempat', r.Tempat)}${baris('Fasilitator', r.Fasilitator)}${baris('Peserta', r.Peserta)}
      ${baris('Objektif', r.Objektif)}${baris('Refleksi', r.Refleksi)}${baris('Direkod oleh', r.DiciptaOleh)}
    </tbody></table>
    <div class="aksi-modal">
      <button type="button" class="btn kelabu" onclick="tutupModal()">Tutup</button>
      ${r.FailUrl ? `<a class="btn luar" href="${esc(r.FailUrl)}" target="_blank" rel="noopener">${ikon('lihat')}Lihat Fail</a>` : ''}
      <a class="btn" target="_blank" rel="noopener" href="${pautanTambahKalendar({ jenis: 'PLC', tajuk: r.Tajuk, panitia: r.Panitia,
        tarikhMula: r.Tarikh, tarikhTamat: r.Tarikh, masaMula: r.MasaMula, masaTamat: r.MasaTamat, keterangan: r.Objektif })}">${ikon('google')}Kalendar Saya</a>
    </div>`);
}

function bukaBorangPLC(i) {
  const r = i === null || i === undefined ? null : SENARAI_PLC_SEMASA[i];
  const v = medan => esc(r ? (r[medan] || '') : '');
  const pilihanJenis = SENARAI_JENIS_PLC.map(j => `<option ${r && r.JenisPLC === j ? 'selected' : ''}>${esc(j)}</option>`).join('');
  const pilihanStatus = Object.keys(LABEL_STATUS_PLC).map(st => `<option value="${st}" ${r && r.Status === st ? 'selected' : ''}>${LABEL_STATUS_PLC[st]}</option>`).join('');
  bukaModal(ikon('plc', 'ikon-h3') + (r ? 'Sunting PLC' : 'PLC Baharu — ' + esc(labelSkop(PANITIA_AKTIF))), `
    <form id="borangPLC">
      <div class="grid-borang">
        <div class="medan lebar-penuh"><label>Tajuk Sesi</label><input type="text" name="tajuk" value="${v('Tajuk')}" required></div>
        <div class="medan"><label>Jenis PLC</label><select name="jenisPLC">${pilihanJenis}</select></div>
        <div class="medan"><label>Status</label><select name="status">${pilihanStatus}</select></div>
        <div class="medan"><label>Tarikh</label><input type="date" name="tarikh" value="${v('Tarikh')}" required></div>
        <div class="medan"><label>Tempat</label><input type="text" name="tempat" value="${v('Tempat')}"></div>
        <div class="medan"><label>Masa Mula (pilihan)</label><input type="time" name="masaMula" value="${v('MasaMula')}"></div>
        <div class="medan"><label>Masa Tamat (pilihan)</label><input type="time" name="masaTamat" value="${v('MasaTamat')}"></div>
        <div class="medan"><label>Fasilitator</label><input type="text" name="fasilitator" value="${v('Fasilitator')}"></div>
        <div class="medan"><label>Peserta</label><input type="text" name="peserta" value="${v('Peserta')}" placeholder="cth. Semua guru Sains"></div>
        <div class="medan lebar-penuh"><label>Objektif</label><textarea name="objektif" rows="2">${v('Objektif')}</textarea></div>
        <div class="medan lebar-penuh"><label>Refleksi / Dapatan</label><textarea name="refleksi" rows="3">${v('Refleksi')}</textarea></div>
        <div class="medan lebar-penuh"><label>Fail Laporan/Evidens (pilihan)</label><input type="file" name="fail"></div>
      </div>
      <div class="aksi-modal"><button type="button" class="btn kelabu" onclick="tutupModal()">Batal</button><button type="submit" class="btn">Simpan</button></div>
    </form>`);
  document.getElementById('borangPLC').addEventListener('submit', ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const masaMula = f.get('masaMula'), masaTamat = f.get('masaTamat');
    if (masaMula && masaTamat && masaTamat <= masaMula) { papartToast('Masa tamat mesti selepas masa mula.', 'gagal'); return; }
    const param = { idPLC: r ? r.IDPLC : '', panitia: r ? r.Panitia : PANITIA_AKTIF, masaMula, masaTamat };
    ['tajuk', 'jenisPLC', 'status', 'tarikh', 'tempat', 'fasilitator', 'peserta', 'objektif', 'refleksi'].forEach(m => { param[m] = f.get(m); });
    const fail = f.get('fail');
    const btnSimpan = ev.target.querySelector('button[type=submit]');
    btnSimpan.disabled = true; btnSimpan.textContent = 'Menyimpan…';
    const proses = (fail && fail.size) ? bacaFailSebagaiBase64(fail).then(b64 => Object.assign(param, { namaFail: fail.name, jenisMime: fail.type, dataBase64: b64 })) : Promise.resolve(param);
    proses.then(p => panggilApi('apiSimpanPLC', p)).then(h => { toastSimpanKalendar('PLC disimpan', h); tutupModal(); muatSemulaPLC(); })
      .catch(() => { btnSimpan.disabled = false; btnSimpan.textContent = 'Simpan'; });
  });
}

function padamPLC(i) {
  const r = SENARAI_PLC_SEMASA[i];
  if (!r || !confirm('Padam sesi PLC "' + r.Tajuk + '"? Event Google Calendar turut dipadam.')) return;
  panggilApi('apiPadamPLC', { idPLC: r.IDPLC }).then(() => { papartToast('PLC dipadam.'); muatSemulaPLC(); });
}

/* ============================ TETAPAN (ADMIN / KETUA BIDANG) ============================ */
const KUMPULAN_TETAPAN = [
  ['Google Calendar (Dua Hala)', ['CALENDAR_ID', 'DUA_HALA', 'JEMPUT_GURU', 'SELANG_SYNC_MINIT', 'PERINGATAN_MINIT']],
  ['Masa & Tempat Lalai', ['MASA_MULA_LALAI', 'MASA_TAMAT_LALAI', 'TEMPAT_LALAI']],
  ['Carta Organisasi', ['PENGETUA', 'PK_PENTADBIRAN', 'SETIAUSAHA_BIDANG']]
];
const LABEL_TETAPAN = {
  CALENDAR_ID: 'ID Google Calendar', DUA_HALA: 'Segerak Dua Hala', JEMPUT_GURU: 'Jemput Guru ke Event',
  SELANG_SYNC_MINIT: 'Selang Segerak Automatik', PERINGATAN_MINIT: 'Peringatan (minit sebelum)',
  MASA_MULA_LALAI: 'Masa Mula Lalai', MASA_TAMAT_LALAI: 'Masa Tamat Lalai', TEMPAT_LALAI: 'Tempat Lalai',
  PENGETUA: 'Pengetua (Penasihat)', PK_PENTADBIRAN: 'PK Pentadbiran (Penasihat Bersama)', SETIAUSAHA_BIDANG: 'Setiausaha Bidang'
};

function inputTetapanHtml(t) {
  const nilai = esc(t.nilai);
  if (t.kunci === 'DUA_HALA' || t.kunci === 'JEMPUT_GURU') {
    return `<select name="${t.kunci}">${['YA', 'TIDAK'].map(x => `<option ${String(t.nilai).toUpperCase() === x ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  }
  if (t.kunci === 'SELANG_SYNC_MINIT') {
    return `<select name="${t.kunci}">${[['5', '5 minit'], ['10', '10 minit'], ['15', '15 minit'], ['30', '30 minit'], ['60', '1 jam']]
      .map(x => `<option value="${x[0]}" ${String(t.nilai) === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>`;
  }
  if (t.kunci === 'MASA_MULA_LALAI' || t.kunci === 'MASA_TAMAT_LALAI') return `<input type="time" name="${t.kunci}" value="${nilai}">`;
  if (t.kunci === 'PERINGATAN_MINIT') return `<input type="number" min="0" max="10080" name="${t.kunci}" value="${nilai}">`;
  return `<input type="text" name="${t.kunci}" value="${nilai}">`;
}

function paparTetapan() {
  const k = document.getElementById('kandungan');
  k.innerHTML = `<div class="kad">${rangkaHtml(6)}</div>`;
  panggilApi('apiTetapan').then(hasil => {
    const peta = {};
    hasil.senarai.forEach(t => { peta[t.kunci] = t; });
    k.innerHTML = `<form id="borangTetapan">
      <div class="kad"><h3>${ikon('google', 'ikon-h3')}Status Penyegerakan</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <span class="lencana ${hasil.pencetusAktif ? 'hijau' : 'merah'}">${hasil.pencetusAktif ? 'Pencetus automatik aktif' : 'Pencetus automatik BELUM aktif'}</span>
          <span class="lencana kelabu">Segerak terakhir: ${hasil.syncTerakhir ? esc(formatTarikhPaparan(hasil.syncTerakhir) + ' ' + String(hasil.syncTerakhir).slice(11, 16)) : '-'}</span>
          <button type="button" class="btn kecil" id="btnSegerakTetapan">${ikon('segerak')}Segerak Sekarang</button>
        </div>
        ${hasil.pencetusAktif ? '' : '<p class="sub-kad" style="margin-top:10px">Jalankan menu Google Sheet "Sistem E-Bidang &gt; 4. Aktifkan Pencetus Automatik" sekali untuk segerak automatik.</p>'}
        ${hasil.idKalendar ? `<p class="sub-kad" style="margin-top:10px">ID kalendar: <code>${esc(hasil.idKalendar)}</code></p>` : ''}
      </div>
      ${KUMPULAN_TETAPAN.map(([tajuk, kunci]) => `<div class="kad"><h3>${ikon(tajuk.indexOf('Carta') === 0 ? 'cartaOrganisasi' : tajuk.indexOf('Masa') === 0 ? 'jam' : 'kalendar', 'ikon-h3')}${tajuk}</h3>
        <div class="grid-borang">${kunci.filter(x => peta[x]).map(x => `<div class="medan"><label>${LABEL_TETAPAN[x] || x}</label>
          ${inputTetapanHtml(peta[x])}<small style="color:var(--kelabu);font-size:11.5px">${esc(peta[x].keterangan)}</small></div>`).join('')}</div></div>`).join('')}
      <div class="aksi-modal"><button type="submit" class="btn">${ikon('betul')}Simpan Tetapan</button></div>
    </form>`;
    document.getElementById('btnSegerakTetapan').addEventListener('click', ev => {
      const b = ev.currentTarget;
      b.disabled = true; b.innerHTML = ikon('segerak') + 'Menyegerak…';
      panggilApi('apiSegerakKalendar').then(h => {
        papartToast(`Segerak selesai: ${h.disegerak} dihantar, ${h.ditarik || 0} ditarik dari kalendar, ${h.tidakBerubah} tidak berubah${h.gagal ? ', ' + h.gagal + ' gagal' : ''}.`, h.gagal ? 'gagal' : 'jaya');
        paparTetapan();
      }).catch(() => { b.disabled = false; b.innerHTML = ikon('segerak') + 'Segerak Sekarang'; });
    });
    document.getElementById('borangTetapan').addEventListener('submit', ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const nilai = {};
      hasil.senarai.forEach(t => { if (f.has(t.kunci)) nilai[t.kunci] = f.get(t.kunci); });
      panggilApi('apiSimpanTetapan', { nilai }).then(h => {
        papartToast(h.berubah.length ? 'Tetapan disimpan (' + h.berubah.length + ' perubahan).' : 'Tiada perubahan.');
        paparTetapan();
      });
    });
  }).catch(() => { k.innerHTML = kosongHtml('Tetapan tidak dapat dimuatkan.', 'amaran'); });
}

sambungSesiTersimpan();
</script>
