      : h === 'Keterangan' ? '<small style="color:var(--teks-2)">' + esc(r[h]) + '</small>' : h === d.kunci ? '<b>' + esc(r[h]) + '</b>' : esc(r[h]) })).concat([{ k: 'x', label: '', isih: false, teks: () => '',
    f: r => '<div class="aksi">' + (sumberLuar && !r.__tempatan ? '<small style="color:var(--kelabu);align-self:center">' + (d.jadual === 'GURU' ? 'e-Data' : 'e-Data') + '</small>' : '') +
      '<button class="btn hantu kecil ur-edit" data-k="' + esc(r[d.kunci]) + '">' + ikon('pencil-simple') + 'Edit</button>' +
      (d.padam && r.__tempatan ? '<button class="btn bahaya kecil ur-padam" data-k="' + esc(r[d.kunci]) + '">' + ikon('trash') + (sumberLuar ? 'Buang Tetapan' : 'Padam') + '</button>' : '') + '</div>' }]) });
  $('#tUrus').addEventListener('click', e => {
    const b = e.target.closest('.ur-edit, .ur-padam'); if (!b) return;
    const r = baris.find(x => String(x[d.kunci]) === b.dataset.k);
    if (b.classList.contains('ur-edit')) borangUrus(d, r);
    else {
      if (!confirm(sumberLuar ? 'Buang tetapan tempatan bagi ' + b.dataset.k + '? Data asal e-Data akan digunakan semula.' : 'Padam rekod ' + b.dataset.k + '?')) return;
      sibuk(b, true, '…'); api('apiUrusPadam', { jadual: d.jadual, kunci: b.dataset.k }).then(() => { toast('Rekod dipadam.'); lukisUrus(); }).catch(() => sibuk(b, false));
    }
  });
  if ($('#urTambah')) $('#urTambah').onclick = () => borangUrus(d, null);
}
function borangUrus(d, r) {
  const baru = !r || !r.__tempatan, o = r || {};
  const kunciBolehUbah = !r && d.jadual !== 'CUTI';
  const medan = (kunciBolehUbah ? [d.kunci] : []).concat(d.medan);
  const input = h => {
    const v = o[h] == null ? '' : String(o[h]);
    if (h === 'Peranan') { const ada = v.split(/[,+]/).map(x => x.trim()); return '<div class="pilih-peranan">' + d.peranan.map(p => '<label><input type="checkbox" value="' + p + '" ' + (ada.indexOf(p) !== -1 ? 'checked' : '') + '>' + esc(p) + '</label>').join('') + '</div>'; }
    if (h === 'Status') return '<select class="input" data-h="Status">' + ['AKTIF', 'TIDAK AKTIF'].map(x => '<option ' + (x === (v || 'AKTIF') ? 'selected' : '') + '>' + x + '</option>').join('') + '</select>';
    if (h === 'DikiraPonteng') return '<select class="input" data-h="DikiraPonteng">' + ['TIDAK', 'YA'].map(x => '<option ' + (x === (v || 'TIDAK') ? 'selected' : '') + '>' + x + '</option>').join('') + '</select>';
    if (h === 'KelasTingkatan' || (h === 'Kelas' && d.jadual === 'PETA_KOD')) return '<select class="input" data-h="' + h + '"><option value="">— Tiada —</option>' + d.kelas.map(k => '<option ' + (k === v ? 'selected' : '') + '>' + esc(k) + '</option>').join('') + '</select>';
    if (/^Masa/.test(h)) return '<input type="time" class="input" data-h="' + h + '" value="' + esc(v) + '">';
    if (/^Tarikh/.test(h)) return '<input type="date" class="input" data-h="' + h + '" value="' + esc(v) + '">';
    if (h === 'Nilai' && /SPREADSHEET_ID$/.test(o.Kunci || '')) return '<input class="input" data-h="Nilai" value="' + esc(v) + '" placeholder="Tampal URL atau ID spreadsheet">';
    return '<input class="input" data-h="' + h + '" value="' + esc(v) + '"' + (h === 'NoKP' ? ' inputmode="numeric" maxlength="14"' : '') + '>';
  };
  const m = bukaModal(kepalaModal((baru && !r ? 'Tambah — ' : 'Edit — ') + d.label, baru && !r ? 'plus' : 'pencil-simple') + '<div class="modal-badan">' +
    (r ? '<div class="banner biru" style="margin-bottom:12px">' + ikon('info', 'fill') + '<div><b>' + esc(LABEL_MEDAN[d.kunci] || d.kunci) + ': ' + esc(o[d.kunci]) + '</b><p>' + esc(d.jadual === 'TETAPAN' ? o.Keterangan || '' : (!r.__tempatan ? 'Rekod daripada e-Data — perubahan disimpan sebagai tetapan tempatan.' : '')) + '</p></div></div>' : '') +
    medan.map(h => '<div class="medan" data-m="' + h + '"><label>' + esc(LABEL_MEDAN[h] || h) + '</label>' + input(h) + '</div>').join('') + '</div>' +
    '<div class="modal-kaki"><button class="btn hantu" data-tutup>Batal</button><button class="btn" id="urSimpan">' + ikon('floppy-disk', 'bold') + 'Simpan</button></div>');
  $('#urSimpan', m).onclick = () => {
    const data = {};
    if (r && !r.__tempatan) data[d.kunci] = o[d.kunci];
    $$('.medan[data-m]', m).forEach(el => {
      const h = el.dataset.m;
      data[h] = h === 'Peranan' ? $$('input:checked', el).map(i => i.value).join(',') : el.querySelector('[data-h]').value;
    });
    if (data.NoKP) data.NoKP = String(data.NoKP).replace(/\D/g, '');
    const b = $('#urSimpan', m); sibuk(b, true, 'Menyimpan…');
    api('apiUrusSimpan', { jadual: d.jadual, kunciAsal: r && r.__tempatan ? o[d.kunci] : '', data })
      .then(() => { toast('Disimpan.'); tutupModal(); lukisUrus(); if (d.jadual === 'TETAPAN' || d.jadual === 'GURU') api('apiSemakSesi', {}, true).then(s => { TETAPAN_UI = s.tetapanUi || TETAPAN_UI; }).catch(() => {}); })
      .catch(() => sibuk(b, false));
  };
}
function penapisTarikh(id, d, lain) {
  return '<div class="alat-jadual" style="margin:0 0 12px"><div class="medan" style="margin:0"><label>Dari</label><input type="date" class="input" id="' + id + 'Dari" value="' + esc(d.dari) + '"></div>' +
    '<div class="medan" style="margin:0"><label>Hingga</label><input type="date" class="input" id="' + id + 'Hingga" value="' + esc(d.hingga) + '"></div>' +
    '<div class="medan" style="margin:0"><label>Kelas</label><select class="input" id="' + id + 'Kelas"><option value="">Semua kelas</option>' + d.kelas.map(k => '<option ' + (k === UR.kelas ? 'selected' : '') + '>' + esc(k) + '</option>').join('') + '</select></div>' + (lain || '') +
    '<button class="btn hantu" style="align-self:flex-end" id="' + id + 'Tapis">' + ikon('funnel') + 'Tapis</button></div>';
}
function pasangPenapisTarikh(id) {
  $('#' + id + 'Tapis').onclick = () => { UR.dari = $('#' + id + 'Dari').value; UR.hingga = $('#' + id + 'Hingga').value; UR.kelas = $('#' + id + 'Kelas').value; if ($('#' + id + 'Guru')) UR.cari = $('#' + id + 'Guru').value; lukisUrus(); };
}

      penapisTarikh('us', d, '<div class="medan" style="margin:0"><label>Guru</label><input class="input" id="usGuru" value="' + esc(UR.cari) + '" placeholder="Nama guru"></div>') + '<div id="tUSesi"></div></div>';

    jadualData('#tUSesi', { data: d.senarai, eksport: 'sesi-subjek-' + d.dari + '-' + d.hingga, perHalaman: 15, lajur: [{ k: 'tarikh', label: 'Tarikh', f: r => '<b>' + esc(tarikhPendek(r.tarikh)) + '</b><br><small style="color:var(--teks-2)">' + esc(r.hari) + '</small>' },
      { k: 'slot', label: 'Masa' }, { k: 'kelas', label: 'Kelas' }, { k: 'subjek', label: 'Subjek' }, { k: 'guru', label: 'Guru' }, { k: 'jenis', label: 'Jenis', f: r => lencana(r.jenis, r.jenis === 'GURU TEACH-IN' ? 'ungu' : 'biru') },
      { k: 'statusMasa', label: 'Status', f: r => lencana(r.statusMasa, r.statusMasa === 'LEWAT' ? 'kuning' : r.statusMasa === 'TEPAT MASA' ? 'hijau' : 'kelabu') },
      { k: 'hadir', label: 'Hadir', nombor: true, f: r => r.hadir + ' / ' + r.jumlah }, { k: 'x', label: '', isih: false, teks: () => '', f: r => butangSuntingSesi(Object.assign({ bolehEdit: true }, r)) }] });
    pasangSuntingSesi('#tUSesi', lukisUrus);
  }).catch(e => { $('#urIsi').innerHTML = kosong('wifi-slash', 'Gagal memuat', e.message); });
}
function urusHarian() {

      { k: 'kelas', label: 'Kelas' }, { k: 'hadir', label: 'Hadir', nombor: true, f: r => r.hadir + ' / ' + r.jumlah }, { k: 'tidakHadir', label: 'Tidak Hadir', nombor: true }, { k: 'guru', label: 'Direkod Oleh' },
      { k: 'masa', label: 'Masa Rekod' }, { k: 'selepasKunci', label: 'Catatan', f: r => r.selepasKunci ? lencana('Selepas kunci', 'kuning') : '' },
      { k: 'x', label: '', isih: false, teks: () => '', f: r => '<div class="aksi"><button class="btn hantu kecil uh-edit" data-t="' + esc(r.tarikh) + '" data-k="' + esc(r.kelas) + '">' + ikon('pencil-simple') + 'Edit</button>' +
        '<button class="btn bahaya kecil uh-padam" data-id="' + esc(r.id) + '" data-n="' + esc(r.kelas + ' ' + r.tarikh) + '">' + ikon('trash') + 'Padam</button></div>' }] });

  }).catch(e => { $('#urIsi').innerHTML = kosong('wifi-slash', 'Gagal memuat', e.message); });

/* Dipanggil apabila ApexCharts selesai dimuat (Index.html). */

  q.forEach(([el, o]) => { if (el.isConnected) { el.innerHTML = ''; carta(el, o); } });

function apexGagal() { window.APEX_GAGAL = true; (window.CARTA_MENUNGGU || []).forEach(([el]) => { el.innerHTML = kosong('chart-bar', 'Carta tidak dapat dimuat', 'Semak sambungan internet.'); }); window.CARTA_MENUNGGU = []; }
