<script>
/* =========================================================================
 * App.html — skrip klien SPA e-Kehadiran.
 * Semua panggilan pelayan melalui google.script.run → api*() (Apps Script).
 * Kebenaran sentiasa disahkan di pelayan; menu hanya memudahkan paparan.
 * ========================================================================= */
let TOKEN = '';
try { TOKEN = localStorage.getItem('ekhd_token') || ''; } catch (e) { TOKEN = ''; }
let PENGGUNA = null, TETAPAN_UI = {}, HALAMAN = 'dashboard', JENIS_LOGIN = 'GURU', BIL_PERMOHONAN = 0;
const WARNA = { biru: '#1E3BD1', merah: '#D9141B', kuning: '#F6D20F', emas: '#E9B200', ungu: '#5B1F8C', hijau: '#16A34A', navy: '#0B1D6B', biruTerang: '#2F80ED', oren: '#F97316', kelabu: '#CBD5E1' };
const PALET = [WARNA.biru, WARNA.merah, WARNA.emas, WARNA.ungu, WARNA.hijau, WARNA.biruTerang, WARNA.oren, WARNA.navy, '#0EA5E9', '#DB2777'];
const HARI_PENDEK = { ISNIN: 'Isn', SELASA: 'Sel', RABU: 'Rab', KHAMIS: 'Kha', JUMAAT: 'Jum', SABTU: 'Sab', AHAD: 'Ahd' };
const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const HARI_PENUH = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];

/* ------------------------------ UTILITI ------------------------------ */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function ikon(n, g) { return '<i class="ph' + (g ? '-' + g : '') + ' ph-' + n + '"></i>'; }
function inisial(nama) { return String(nama || '?').replace(/\b(BIN|BINTI|ANAK|A\/L|A\/P|CIKGU)\b/gi, '').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase(); }
function avatar(nama, gambar, kelas) {
  return gambar ? '<img class="avatar ' + (kelas || '') + '" src="' + esc(gambar) + '" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=&quot;avatar ' + (kelas || '') + '&quot;>' + esc(inisial(nama)) + '</span>\'">'
    : '<span class="avatar ' + (kelas || '') + '">' + esc(inisial(nama)) + '</span>';
}
function tarikhPanjang(t) { if (!t) return '-'; const [y, m, d] = t.split('-').map(Number); const dt = new Date(y, m - 1, d); return HARI_PENUH[dt.getDay()] + ', ' + d + ' ' + BULAN[m - 1] + ' ' + y; }
function tarikhPendek(t) { if (!t) return '-'; const [y, m, d] = String(t).slice(0, 10).split('-').map(Number); return d + ' ' + BULAN[m - 1].slice(0, 3) + ' ' + y; }
/* Jam aplikasi = jam PELAYAN (waktu Kuching), bukan jam komputer guru — tarikh rekod
   & kiraan kunci 07:10 tetap betul walaupun jam PC/telefon tersilap. Baca dengan getUTC*. */
let BEZA_JAM = 0;
try { BEZA_JAM = Number(localStorage.getItem('ekhd_beza_jam')) || 0; } catch (e) { BEZA_JAM = 0; }
function selarasJam(t) { if (t && t.epochPelayan) { BEZA_JAM = t.epochPelayan - Date.now(); try { localStorage.setItem('ekhd_beza_jam', String(BEZA_JAM)); } catch (e) { /* abaikan */ } } }
function jamSekolah() { return new Date(Date.now() + BEZA_JAM + 8 * 3600000); }
function tarikhIniKlien() { const d = jamSekolah(); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
function warnaPeratus(p) { return p >= 95 ? WARNA.hijau : p >= 85 ? WARNA.biru : p >= 75 ? WARNA.emas : WARNA.merah; }
function barPeratus(p) { const v = Number(p) || 0; return '<div class="bar-peratus"><div class="trek"><div class="isi" style="width:' + Math.min(100, v) + '%;background:' + warnaPeratus(v) + '"></div></div><b class="nombor">' + v.toFixed(1) + '%</b></div>'; }
function lencana(teks, warna, ik) { return '<span class="lencana l-' + warna + '">' + (ik ? ikon(ik, 'fill') : '') + esc(teks) + '</span>'; }
function kosong(ik, tajuk, teks) { return '<div class="kosong">' + ikon(ik, 'duotone') + '<b>' + esc(tajuk) + '</b>' + esc(teks || '') + '</div>'; }
function rangka(tinggi) { return '<div class="rangka" style="height:' + (tinggi || 120) + 'px"></div>'; }
function kadStat(warna, ik, label, nilai, sub) {
  return '<div class="kad kad-stat w-' + warna + '"><div class="bulat">' + ikon(ik, 'duotone') + '</div><div><div class="label">' + esc(label) + '</div><div class="nilai nombor">' + nilai + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div></div>';
}

function toast(mesej, jenis) {
  const t = document.createElement('div');
  t.className = 'toast ' + (jenis || 'jaya');
  t.innerHTML = ikon(jenis === 'gagal' ? 'warning-circle' : 'check-circle', 'fill') + '<span>' + esc(mesej) + '</span>';
  $('#kotakToast').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3800);
}

/* ------------------------------ PANGGILAN PELAYAN ------------------------------ */
/* Semua panggilan melalui jalankanApi (pelayan). Gangguan rangkaian, had pelaksanaan
   serentak Apps Script atau kunci sibuk → cuba semula automatik (hingga 4 kali,
   tunda eksponen + rawak) dengan idPermintaan SAMA — pelayan menjamin tiada pendua. */
const tunda = ms => new Promise(r => setTimeout(r, ms));
function panggil(fn, param, cubaan) {
  const n = cubaan || 0;
  const ulang = () => tunda(Math.min(6000, 700 * Math.pow(2, n)) + Math.random() * 600).then(() => panggil(fn, param, n + 1));
  return new Promise((selesai, gagal) => { google.script.run.withSuccessHandler(selesai).withFailureHandler(gagal).jalankanApi(fn, param || {}); })
    .then(h => (h && h.kod === 'SIBUK' && n < 4) ? ulang() : h, e => { if (n < 4) return ulang(); throw e; });
}
function idBaharu() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
const RE_TULIS = /^api(KehadiranKelasSimpan|Rekod|Mohon|Proses|Jana|Kemaskini|Padam|Simpan|Batal|Urus(Simpan|Padam)|Tindakan|TukarKataLaluan|AdminSetSemula)/;
function api(fn, param, senyap) {
  const tulis = RE_TULIS.test(fn);
  return panggil(fn, Object.assign({ token: TOKEN, idPermintaan: idBaharu() }, param || {})).then(h => {
    if (tulis && h && h.success !== false) batalCacheSelepasTulis();
    if (!h || h.success === false) {
      const mesej = (h && h.message) || 'Ralat tidak diketahui.';
      if (h && h.kod === 'SESI') { keluar(true); $('#ralatLogin').textContent = mesej; }
      else if (h && h.kod === 'MESTI_TUKAR') paparTukarKataLaluan(true);
      else if (!senyap) toast(mesej, 'gagal');
      const e = new Error(mesej); e.kod = h && h.kod; throw e;
    }
    return h;
  }, err => { if (!senyap) toast('Sambungan ke pelayan gagal. Sila cuba lagi.', 'gagal'); throw err; });
}
/* Pemuat halaman: jika pengguna sudah berpindah halaman sebelum respons tiba,
   abaikan respons lama supaya ia tidak menimpa halaman semasa. */
let NAV_SEQ = 0;
/* ---------- Cache peranti (stale-while-revalidate) ----------
   Halaman dipaparkan SERTA-MERTA daripada data terakhir yang disimpan dalam peranti
   (hari yang sama sahaja), kemudian data terkini diambil di belakang dan halaman
   dilukis semula jika ada perubahan — kecuali pengguna sedang mengisi borang. */
const AWALAN_CACHE = 'ekhd_c_';
const MEM_SEGAR = {};          // data terkini dalam memori (15 saat)
let KUNCI_HALAMAN = [];        // kunci cache yang digunakan halaman semasa
let KOTOR = false;             // borang ada perubahan belum disimpan
let BIL_SEGAR = 0;
function kunciCache(fn, param) { return AWALAN_CACHE + (PENGGUNA ? PENGGUNA.nokp : '-') + '|' + fn + '|' + JSON.stringify(param || {}); }
function bacaCacheKlien(k) {
  try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v && v.d === tarikhIniKlien() ? v : null; } catch (e) { return null; }
}
function simpanCacheKlien(k, h) {
  let j; try { j = JSON.stringify({ t: Date.now(), d: tarikhIniKlien(), h }); } catch (e) { return; }
  if (j.length > 1500000) return;
  try { localStorage.setItem(k, j); } catch (e) { bersihCacheKlien(); try { localStorage.setItem(k, j); } catch (e2) { /* penuh */ } }
}
function bersihCacheKlien(kunci) {
  try { Object.keys(localStorage).forEach(k => { if (k.indexOf(AWALAN_CACHE) === 0 && (!kunci || kunci.indexOf(k) !== -1)) localStorage.removeItem(k); }); } catch (e) { /* abaikan */ }
}
function batalCacheSelepasTulis() {
  Object.keys(MEM_SEGAR).forEach(k => { delete MEM_SEGAR[k]; });
  bersihCacheKlien(KUNCI_HALAMAN.slice());   // halaman semasa dimuat semula dengan data terkini
}
function barSegar(tambah) { BIL_SEGAR = Math.max(0, BIL_SEGAR + tambah); const b = $('#barSegar'); if (b) b.classList.toggle('aktif', BIL_SEGAR > 0); }
function sedangMengisi() {
  const a = document.activeElement;
  return KOTOR || !!$('#kotakModal').innerHTML || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#kandungan').contains(a) && a.type !== 'month' && a.type !== 'date');
}
function muat(fn, param) {
  const seq = NAV_SEQ, gantung = () => new Promise(() => {});
  const k = kunciCache(fn, param);
  if (KUNCI_HALAMAN.indexOf(k) === -1) KUNCI_HALAMAN.push(k);
  const mem = MEM_SEGAR[k];
  if (mem && Date.now() - mem.t < 15000) return Promise.resolve(mem.h);
  const c = bacaCacheKlien(k);
  barSegar(1);
  const ambil = api(fn, param, !!c).then(h => { barSegar(-1); MEM_SEGAR[k] = { t: Date.now(), h }; simpanCacheKlien(k, h); return h; }, e => { barSegar(-1); throw e; });
  if (c) {
    ambil.then(h => {
      if (seq !== NAV_SEQ || sedangMengisi() || JSON.stringify(h) === JSON.stringify(c.h)) return;
      const y = window.scrollY; HALAMAN_FN[HALAMAN](); setTimeout(() => window.scrollTo(0, y), 30);
    }).catch(() => {});
    return Promise.resolve(c.h);
  }
  return ambil.then(h => seq === NAV_SEQ ? h : gantung(), e => { if (seq !== NAV_SEQ) return gantung(); throw e; });
}
/* Pra-muat di belakang (tanpa menyekat UI) supaya borang penting dibuka serta-merta. */
function praMuat(fn, param) {
  const k = kunciCache(fn, param);
  if (bacaCacheKlien(k) && (Date.now() - bacaCacheKlien(k).t) < 60000) return Promise.resolve();
  return api(fn, param, true).then(h => { MEM_SEGAR[k] = { t: Date.now(), h }; simpanCacheKlien(k, h); }).catch(() => {});
}
function praMuatPeranan() {
  if (!PENGGUNA || PENGGUNA.jenis !== 'GURU') return;
  const senarai = [];
  if (PENGGUNA.guruKelas) senarai.push(['apiKehadiranKelasMuat', { tarikh: tarikhIniKlien(), kelas: '' }]);
  senarai.push(['apiKelasDiajar', {}]);
  if (PENGGUNA.guruKelas || PENGGUNA.admin) senarai.push(['apiAmaranPonteng', { kelas: '' }]);
  senarai.reduce((p, x) => p.then(() => tunda(400)).then(() => praMuat(x[0], x[1])), tunda(1200));
}
function sibuk(btn, ya, teks) {
  if (!btn) return;
  if (ya) { btn.dataset.asal = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="putar"></span>' + (teks || 'Memproses…'); }
  else { btn.disabled = false; if (btn.dataset.asal) btn.innerHTML = btn.dataset.asal; }
}

/* ------------------------------ CARTA (ApexCharts) ------------------------------ */
/* Carta aktif didaftar supaya dimusnahkan sebelum kandungan halaman diganti —
   carta yang dibuang dari DOM tanpa destroy() terus beranimasi pada nod tertanggal. */
let CARTA_AKTIF = [];
function musnahCarta(semua) {
  CARTA_AKTIF = CARTA_AKTIF.filter(c => {
    if (!semua && c.el.isConnected) return true;
    try { c.carta.destroy(); } catch (e) { /* abaikan */ }
    return false;
  });
}
function carta(el, opsyen) {
  if (typeof el === 'string') el = $(el);
  if (!el) return;
  musnahCarta(false);
  if (el._carta) { try { el._carta.destroy(); } catch (e) { /* abaikan */ } CARTA_AKTIF = CARTA_AKTIF.filter(c => c.el !== el); }
  if (typeof ApexCharts === 'undefined') {
    /* Pustaka carta dimuat secara tak segerak — data dipaparkan dahulu, carta menyusul. */
    if (window.APEX_GAGAL) { el.innerHTML = kosong('chart-bar', 'Carta tidak dapat dimuat', 'Semak sambungan internet.'); return; }
    el.innerHTML = rangka(200); (window.CARTA_MENUNGGU = window.CARTA_MENUNGGU || []).push([el, opsyen]); return;
  }
  const asas = { chart: { fontFamily: 'Plus Jakarta Sans, sans-serif', toolbar: { show: false }, animations: { speed: 400 }, foreColor: '#64748B' },
    grid: { borderColor: '#EEF1F7', strokeDashArray: 4 }, dataLabels: { enabled: false }, legend: { fontWeight: 600, markers: { radius: 12 } },
    tooltip: { theme: 'light' }, colors: PALET };
  const o = Object.assign({}, asas, opsyen, { chart: Object.assign({}, asas.chart, opsyen.chart || {}) });
  el._carta = new ApexCharts(el, o); el._carta.render(); CARTA_AKTIF.push({ el, carta: el._carta });
}
function cartaDonut(el, label, nilai, warna, tengah) {
  carta(el, { chart: { type: 'donut', height: 280 }, labels: label, series: nilai, colors: warna || PALET, stroke: { width: 3, colors: ['#fff'] },
    legend: { position: 'bottom' }, plotOptions: { pie: { donut: { size: '70%', labels: { show: true, total: { show: true, label: tengah || 'Jumlah', fontWeight: 700 } } } } } });
}
function cartaGauge(el, nilai, label, warna) {
  carta(el, { chart: { type: 'radialBar', height: 250, sparkline: { enabled: true } }, series: [Number(nilai) || 0], colors: [warna || warnaPeratus(nilai)], labels: [label],
    plotOptions: { radialBar: { hollow: { size: '64%' }, track: { background: '#EEF1F7', strokeWidth: '100%' },
      dataLabels: { name: { offsetY: 24, fontSize: '13px', fontWeight: 700, color: '#64748B' }, value: { offsetY: -12, fontSize: '30px', fontWeight: 800, color: '#0F172A', formatter: v => Number(v).toFixed(1) + '%' } } } },
    stroke: { lineCap: 'round' } });
}
function cartaBar(el, kategori, siri, opsyen) {
  const o = opsyen || {};
  /* Bar mendatar: paksi Y = kategori (teks), paksi X = nilai — pemformat nombor mesti pada paksi nilai sahaja. */
  const fmtNilai = v => o.peratus ? Math.round(v) + '%' : Math.round(v);
  const paksiNilai = o.peratus ? { max: 100, min: 0, labels: { formatter: fmtNilai } } : { labels: { formatter: fmtNilai } };
  carta(el, { chart: { type: 'bar', height: o.tinggi || 300, stacked: !!o.bertindan }, series: siri,
    xaxis: o.mendatar ? Object.assign({ categories: kategori }, paksiNilai) : { categories: kategori, labels: { rotate: -35, trim: true } },
    plotOptions: { bar: { borderRadius: 6, columnWidth: o.lebar || '55%', barHeight: '60%', horizontal: !!o.mendatar, borderRadiusApplication: 'end' } },
    yaxis: o.mendatar ? { labels: { maxWidth: 220 } } : paksiNilai,
    colors: o.warna || PALET, tooltip: { y: { formatter: v => o.peratus ? Number(v).toFixed(1) + '%' : v } }, fill: { opacity: 1 } });
}
function cartaKawasan(el, kategori, siri, opsyen) {
  const o = opsyen || {};
  carta(el, { chart: { type: 'area', height: o.tinggi || 280, zoom: { enabled: false } }, series: siri, xaxis: { categories: kategori, labels: { rotate: -35 } },
    stroke: { curve: 'smooth', width: 3 }, fill: { type: 'gradient', gradient: { opacityFrom: .35, opacityTo: .02 } }, markers: { size: 4, strokeWidth: 2, hover: { size: 6 } },
    yaxis: o.peratus ? { max: 100, min: o.min || 0, labels: { formatter: v => Math.round(v) + '%' } } : {}, colors: o.warna || [WARNA.biru, WARNA.merah],
    tooltip: { y: { formatter: v => o.peratus ? Number(v).toFixed(1) + '%' : v } } });
}

/* ------------------------------ JADUAL DATA ------------------------------
   jadualData(el, { lajur:[{k,label,f(row),nombor,isih}], data, cari:true, eksport:'nama', perHalaman, klik(row) }) */
function jadualData(el, cfg) {
  if (typeof el === 'string') el = $(el);
  const st = { q: '', isih: cfg.isihAwal || null, arah: cfg.arahAwal || 1, hal: 0, per: cfg.perHalaman || 10 };
  const nilaiTeks = (r, l) => l.teks ? l.teks(r) : (r[l.k] == null ? '' : r[l.k]);
  function tapis() {
    let d = cfg.data.slice();
    if (st.q) { const q = st.q.toLowerCase(); d = d.filter(r => cfg.lajur.some(l => String(nilaiTeks(r, l)).toLowerCase().indexOf(q) !== -1)); }
    if (st.isih) { const l = cfg.lajur.find(x => x.k === st.isih); d.sort((a, b) => { const x = nilaiTeks(a, l), y = nilaiTeks(b, l);
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * st.arah; }); }
    return d;
  }
  function lukis() {
    const d = tapis(), mula = st.hal * st.per, keping = d.slice(mula, mula + st.per), bilHal = Math.max(1, Math.ceil(d.length / st.per));
    const badan = el.querySelector('tbody');
    badan.innerHTML = keping.length ? keping.map((r, i) => '<tr class="' + (cfg.klik ? 'boleh-klik' : '') + '" data-i="' + (mula + i) + '">' +
      cfg.lajur.map(l => '<td class="' + (l.nombor ? 'nombor' : '') + '">' + (l.f ? l.f(r) : esc(r[l.k])) + '</td>').join('') + '</tr>').join('')
      : '<tr><td colspan="' + cfg.lajur.length + '">' + kosong('magnifying-glass', 'Tiada rekod', st.q ? 'Cuba carian lain.' : '') + '</td></tr>';
    el.querySelector('.hal-info').textContent = d.length ? (mula + 1) + '–' + Math.min(d.length, mula + st.per) + ' daripada ' + d.length + ' rekod' : '0 rekod';
    el.querySelector('.hal-sebelum').disabled = st.hal === 0; el.querySelector('.hal-seterusnya').disabled = st.hal >= bilHal - 1;
    el.querySelectorAll('th').forEach(th => { const a = th.querySelector('.anak-panah'); if (a) a.innerHTML = th.dataset.k === st.isih ? (st.arah > 0 ? '▲' : '▼') : '↕'; });
    if (cfg.klik) badan.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => cfg.klik(d[Number(tr.dataset.i)]));
  }
  el.innerHTML = '<div class="alat-jadual">' + (cfg.cari === false ? '' : '<div class="input-ikon"><i class="ph ph-magnifying-glass"></i><input class="input" placeholder="Cari…"></div>') +
    (cfg.alatTambahan || '') + (cfg.eksport ? '<button class="btn hantu kecil eksport" style="margin-left:auto">' + ikon('download-simple') + 'Eksport CSV</button>' : '') + '</div>' +
    '<div class="bekas-jadual"><table class="jadual"><thead><tr>' + cfg.lajur.map(l => '<th data-k="' + esc(l.k) + '">' + esc(l.label) + (l.isih === false ? '' : '<span class="anak-panah">↕</span>') + '</th>').join('') +
    '</tr></thead><tbody></tbody></table></div><div class="halaman"><span class="hal-info"></span><span><button class="btn hantu kecil hal-sebelum">' + ikon('caret-left') +
    '</button> <button class="btn hantu kecil hal-seterusnya">' + ikon('caret-right') + '</button></span></div>';
  const cari = el.querySelector('.alat-jadual input');
  if (cari) cari.oninput = () => { st.q = cari.value.trim(); st.hal = 0; lukis(); };
  el.querySelectorAll('th').forEach(th => { const l = cfg.lajur.find(x => x.k === th.dataset.k); if (l && l.isih !== false) th.onclick = () => { st.arah = st.isih === th.dataset.k ? -st.arah : 1; st.isih = th.dataset.k; lukis(); }; });
  el.querySelector('.hal-sebelum').onclick = () => { st.hal--; lukis(); };
  el.querySelector('.hal-seterusnya').onclick = () => { st.hal++; lukis(); };
  const ek = el.querySelector('.eksport');
  if (ek) ek.onclick = () => eksportCSV(cfg.eksport, cfg.lajur, tapis(), nilaiTeks);
  lukis();
}
function eksportCSV(nama, lajur, data, nilaiTeks) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '﻿' + [lajur.map(l => q(l.label)).join(',')].concat(data.map(r => lajur.map(l => q(nilaiTeks(r, l))).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = nama + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ------------------------------ MODAL ------------------------------ */
function bukaModal(html, opsyen) {
  const o = opsyen || {};
  const k = $('#kotakModal');
  k.innerHTML = '<div class="lapik"><div class="modal ' + (o.lebar ? 'lebar' : '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
  musnahCarta(false); /* carta dalam modal lama kini tertanggal */
  const lapik = k.querySelector('.lapik');
  if (!o.wajib) {
    lapik.addEventListener('click', e => { if (e.target === lapik) tutupModal(); });
    k.querySelectorAll('[data-tutup]').forEach(b => b.onclick = tutupModal);
  }
  return k.querySelector('.modal');
}
function tutupModal() { $('#kotakModal').innerHTML = ''; musnahCarta(false); }

document.addEventListener('DOMContentLoaded', mula);
function mula() {
  $$('img.logo-sekolah').forEach(i => { i.src = LOGO_SEKOLAH; });
  $$('.tab-jenis button').forEach(b => b.onclick = () => {
    JENIS_LOGIN = b.dataset.jenis; $$('.tab-jenis button').forEach(x => x.classList.toggle('aktif', x === b));
    $('#inNoKP').placeholder = JENIS_LOGIN === 'GURU' ? 'cth: 800101135001' : 'cth: 090101130123';
  });
  $$('.lihat').forEach(b => b.onclick = () => { const i = document.getElementById(b.dataset.sasaran); i.type = i.type === 'password' ? 'text' : 'password'; b.innerHTML = ikon(i.type === 'password' ? 'eye' : 'eye-slash'); });
  $('#formLogin').onsubmit = logMasuk;
  $('#btnKeluar').onclick = () => keluar();
  $('#btnMenu').onclick = () => document.body.classList.toggle('menu-buka');
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#/', ''); if (PENGGUNA && h && h !== HALAMAN) pergi(h, true); });
  setInterval(kemaskiniJam, 1000); kemaskiniJam();
  if (!TOKEN) return tunjukLogin();
  /* Buka serta-merta dengan profil tersimpan; sahkan sesi di belakang. */
  let tersimpan = null;
  try { tersimpan = JSON.parse(localStorage.getItem('ekhd_pengguna') || 'null'); } catch (e) { tersimpan = null; }
  if (tersimpan && tersimpan.pengguna) masukAplikasi(tersimpan.pengguna, tersimpan.tetapanUi, tersimpan.pengguna.mestiTukar);
  panggil('apiSemakSesi', { token: TOKEN }).then(h => {
    if (!h || !h.success) { if (tersimpan) { keluar(true); $('#ralatLogin').textContent = (h && h.message) || 'Sesi tamat. Sila log masuk semula.'; } else tunjukLogin(); return; }
    selarasJam(h.tetapanUi);
    const berubah = !tersimpan || JSON.stringify(tersimpan.pengguna) !== JSON.stringify(h.pengguna);
    simpanPenggunaKlien(h.pengguna, h.tetapanUi);
    if (!tersimpan) masukAplikasi(h.pengguna, h.tetapanUi, h.mestiTukarPassword);
    else if (berubah) { PENGGUNA = h.pengguna; TETAPAN_UI = h.tetapanUi || {}; lukisPengguna(); binaNav(); if (h.mestiTukarPassword) paparTukarKataLaluan(true); }
  }).catch(() => { if (!tersimpan) tunjukLogin(); });
}
function simpanPenggunaKlien(pengguna, tetapanUi) { try { localStorage.setItem('ekhd_pengguna', JSON.stringify({ pengguna, tetapanUi })); } catch (e) { /* abaikan */ } }
function tunjukLogin() { $('#skrinSplash').classList.add('hidden'); $('#skrinApp').classList.add('hidden'); $('#skrinLogin').classList.remove('hidden'); setTimeout(() => $('#inNoKP').focus(), 50); }

function logMasuk(e) {
  e.preventDefault();
  const btn = $('#btnLogin'); $('#ralatLogin').textContent = '';
  const nokp = $('#inNoKP').value.replace(/\D/g, ''), kl = $('#inKataLaluan').value;
  if (nokp.length !== 12) { $('#ralatLogin').textContent = 'No. KP mesti 12 digit (tanpa sengkang).'; return; }
  sibuk(btn, true, 'Mengesahkan…');
  panggil('apiLogin', { nokp, kataLaluan: kl }).then(h => {
    sibuk(btn, false);
    if (!h.success) { $('#ralatLogin').textContent = h.message; return; }
    if (h.pengguna.jenis !== JENIS_LOGIN) toast('Anda log masuk sebagai ' + (h.pengguna.jenis === 'GURU' ? 'guru' : 'murid') + '.');
    TOKEN = h.token; try { localStorage.setItem('ekhd_token', TOKEN); } catch (er) { /* abaikan */ }
    $('#inKataLaluan').value = '';
    selarasJam(h.tetapanUi); simpanPenggunaKlien(h.pengguna, h.tetapanUi || {});
    masukAplikasi(h.pengguna, h.tetapanUi || {}, h.mestiTukarPassword);
  }).catch(() => { sibuk(btn, false); $('#ralatLogin').textContent = 'Sambungan ke pelayan gagal. Sila cuba lagi.'; });
}

function keluar(senyap) {
  if (TOKEN && !senyap) panggil('apiLogout', { token: TOKEN }).catch(() => {});
  TOKEN = ''; PENGGUNA = null; try { localStorage.removeItem('ekhd_token'); localStorage.removeItem('ekhd_pengguna'); } catch (e) { /* abaikan */ }
  bersihCacheKlien(); Object.keys(MEM_SEGAR).forEach(k => { delete MEM_SEGAR[k]; });   // data murid tidak kekal di komputer berkongsi
  tutupModal(); document.body.classList.remove('menu-buka'); history.replaceState(null, '', location.pathname + location.search); tunjukLogin();
}

function kemaskiniJam() {
  const d = jamSekolah();
  const jam = ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2);
  if ($('#teksJam')) $('#teksJam').textContent = jam + ':' + ('0' + d.getUTCSeconds()).slice(-2);
  if ($('#teksTarikh')) $('#teksTarikh').textContent = tarikhPanjang(tarikhIniKlien());
  const cip = $('#cipKunci');
  if (!cip || !PENGGUNA || !PENGGUNA.guruKelas) { if (cip) cip.classList.add('hidden'); return; }
  const mk = TETAPAN_UI.masaKunci || '07:10';
  const [h, m] = mk.split(':').map(Number);
  const baki = (h * 3600 + m * 60) - (d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds());
  cip.classList.remove('hidden');
  if (baki > 0) { cip.className = 'cip-kunci buka'; cip.innerHTML = ikon('lock-simple-open', 'fill') + '<span class="teks-kunci">Rekod kelas dikunci dalam </span>' + Math.floor(baki / 60) + ':' + ('0' + baki % 60).slice(-2); }
  else { cip.className = 'cip-kunci kunci'; cip.innerHTML = ikon('lock-simple', 'fill') + '<span class="teks-kunci">Rekod kelas dikunci </span>(' + mk + ')'; }

function pasangBorangKataLaluan(wajib) {
  const baharu = $('#klBaharu');

  baharu.oninput = () => {
    const v = baharu.value; let s = 0;
    if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
    const bar = $('#barKekuatan'); bar.style.width = (s * 25) + '%'; bar.style.background = [WARNA.merah, WARNA.merah, WARNA.emas, WARNA.biru, WARNA.hijau][s];
  };
  $('#formKL').onsubmit = e => {
    e.preventDefault();
    const r = $('#ralatKL'); r.textContent = '';
    if ($('#klBaharu').value !== $('#klSahkan').value) { r.textContent = 'Pengesahan kata laluan tidak sepadan.'; return; }

    }).catch(() => { sibuk(btn, false); r.textContent = 'Sambungan gagal.'; });

  if (ks && ks.direkod) cartaDonut('#cGDonut', ['Hadir', 'Tidak hadir'], [ks.hadir, ks.tidakHadir], [WARNA.hijau, WARNA.merah], 'Murid');

  if (sk) lukisCartaSekolah(sk);

    { k: 'hadir', label: 'Hadir', nombor: true, f: r => r.direkod ? r.hadir + ' / ' + r.jumlah : '-' }, { k: 'tidakHadir', label: 'Tidak Hadir', nombor: true, f: r => r.direkod ? r.tidakHadir : '-' },
    { k: 'peratus', label: 'Peratus', teks: r => r.peratus == null ? -1 : r.peratus, f: r => r.peratus == null ? '-' : barPeratus(r.peratus) }, { k: 'oleh', label: 'Direkod Oleh' }] });
}

/* ============================== REKOD KEHADIRAN KELAS (GT/PGT) ============================== */
let KK = null;
HALAMAN_FN['kehadiran-kelas'] = function (tarikh, kelas) {
  muat('apiKehadiranKelasMuat', { tarikh: tarikh || (KK && KK.tarikh) || tarikhIniKlien(), kelas: kelas || (KK && KK.kelasPilihan) || '' }).then(d => {
    KK = d; KK.kelasPilihan = kelas || (KK && KK.kelasPilihan) || ''; lukisKehadiranKelas();
  }).catch(e => { $('#kandungan').innerHTML = kosong('users-three', 'Tidak dapat memuat rekod kelas', e.message); });
};
function lukisKehadiranKelas() {
  const d = KK, k = d.kunci;
  $('#remehHalaman').textContent = d.kelas + ' · ' + tarikhPanjang(d.tarikh);
  let banner = '';
  if (k.boleh) banner = '<div class="banner hijau">' + ikon('lock-simple-open', 'fill') + '<div><b>Akses rekod dibuka</b><p>' + (k.melaluiPermohonan ? 'Dibuka melalui permohonan yang diluluskan admin — sah sehingga ' + esc(k.tamat) + '.' : 'Rekod kehadiran kelas sebelum ' + esc(k.masaKunci) + '. Selepas itu rekod dikunci secara automatik.') + '</p></div></div>';
  else if (k.permohonanMenunggu) banner = '<div class="banner kuning">' + ikon('hourglass-medium', 'fill') + '<div><b>Permohonan buka akses sedang menunggu kelulusan admin</b><p>Dihantar ' + esc(k.permohonanMenunggu.masa) + ' · Alasan: ' + esc(k.permohonanMenunggu.alasan) + '</p></div></div>';
  else banner = '<div class="banner merah">' + ikon('lock-simple', 'fill') + '<div><b>Rekod dikunci</b><p>' + esc(k.sebab) + '</p></div>' + (d.tarikh <= tarikhIniKlien() ? '<button class="btn merah kecil" style="margin-left:auto" onclick="borangMohonAkses()">' + ikon('lock-key-open', 'bold') + 'Mohon Buka Akses</button>' : '') + '</div>';
  const bolehUbah = k.boleh || PENGGUNA.admin;
  $('#kandungan').innerHTML = banner +
    '<div class="kad mb"><div class="alat-jadual" style="margin:0">' +
      '<div class="medan" style="margin:0"><label>Tarikh</label><input type="date" class="input" id="kkTarikh" value="' + esc(d.tarikh) + '" max="' + tarikhIniKlien() + '"></div>' +
      (d.senaraiKelas.length ? '<div class="medan" style="margin:0"><label>Kelas</label><select class="input" id="kkKelas">' + d.senaraiKelas.map(c => '<option ' + (c === d.kelas ? 'selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' : '') +
      '<div class="medan" style="margin:0;flex:1;min-width:200px"><label>Cari murid</label><div class="input-ikon"><i class="ph ph-magnifying-glass"></i><input class="input" id="kkCari" placeholder="Nama murid…"></div></div>' +
      (bolehUbah ? '<button class="btn hantu" style="align-self:flex-end" id="kkSemuaHadir">' + ikon('checks') + 'Tandakan Semua Hadir</button>' : '') +
    '</div>' + (d.rekod ? '<p style="margin:12px 0 0;color:var(--teks-2);font-size:13px">' + ikon('info') + ' Direkod oleh <b>' + esc(d.rekod.direkodOleh) + '</b> pada ' + esc(d.rekod.masa) + (d.rekod.selepasKunci ? ' ' + lencana('Selepas kunci', 'kuning') : '') + '. Anda boleh kemaskini selagi akses dibuka.</p>' : '') + '</div>' +
    '<div class="banner biru">' + ikon('hand-tap', 'fill') + '<div><b>Semua murid ditanda HADIR secara lalai</b><p>Matikan suis <b>Hadir</b> bagi murid yang tidak hadir, kemudian pilih sebab daripada senarai IDME.</p></div></div>' +
    '<div class="roster" id="kkRoster">' + d.murid.map((m, i) => kadRoster(m, i, bolehUbah)).join('') + '</div>' +
    (d.murid.length ? '' : kosong('users', 'Tiada murid dalam kelas ini', 'Senarai murid diambil daripada e-Data & Enrolmen.')) +
    '<div class="bar-simpan"><div class="kiraan"><span><b id="kkHadir">0</b>Hadir</span><span style="color:#FCA5A5"><b id="kkTidak">0</b>Tidak hadir</span><span style="opacity:.7"><b>' + d.murid.length + '</b>Jumlah</span></div>' +
    (bolehUbah ? '<button class="btn kuning" id="kkSimpan">' + ikon('floppy-disk', 'bold') + (d.rekod ? 'Kemaskini Rekod' : 'Simpan Rekod Kehadiran') + '</button>' : '<span style="margin-left:auto;opacity:.8">' + ikon('lock-simple') + ' Paparan sahaja</span>') + '</div>';
  $('#kkTarikh').onchange = e => HALAMAN_FN['kehadiran-kelas'](e.target.value, $('#kkKelas') ? $('#kkKelas').value : '');
  if ($('#kkKelas')) $('#kkKelas').onchange = e => HALAMAN_FN['kehadiran-kelas']($('#kkTarikh').value, e.target.value);
  $('#kkCari').oninput = e => { const q = e.target.value.toLowerCase(); $$('.murid-kad').forEach(c => { c.style.display = c.dataset.nama.toLowerCase().indexOf(q) !== -1 ? '' : 'none'; }); };
  KOTOR = false;
  $$('.murid-kad input[type=checkbox]').forEach(cb => cb.onchange = () => togolMurid(cb));
  $$('.murid-kad select.sebab').forEach(sl => sl.addEventListener('change', () => { KOTOR = true; }));
  if ($('#kkSemuaHadir')) $('#kkSemuaHadir').onclick = () => $$('.murid-kad input[type=checkbox]').forEach(cb => { cb.checked = true; togolMurid(cb); });
  if ($('#kkSimpan')) $('#kkSimpan').onclick = simpanKehadiranKelas;
  kiraRoster();
}
function pilihanSebab(senarai, pilih) {
  const kump = {}; senarai.forEach(s => { (kump[s.kategori || 'Lain-lain'] = kump[s.kategori || 'Lain-lain'] || []).push(s); });
  return '<option value="">— Pilih sebab tidak hadir —</option>' + Object.keys(kump).map(k => '<optgroup label="' + esc(k) + '">' +
    kump[k].map(s => '<option value="' + esc(s.kod) + '" ' + (String(s.kod) === String(pilih) ? 'selected' : '') + '>' + esc(s.sebab) + (s.dikiraPonteng ? ' ⚠' : '') + '</option>').join('') + '</optgroup>').join('');
}
function kadRoster(m, i, bolehUbah) {
  return '<div class="murid-kad ' + (m.hadir ? '' : 'tidak-hadir') + '" data-nokp="' + esc(m.nokp) + '" data-nama="' + esc(m.nama) + '"><div class="baris"><span class="no">' + (i + 1) + '</span>' + avatar(m.nama, m.gambar) +
    '<div class="nama">' + esc(m.nama) + '<small>' + esc(m.nokp) + '</small></div><label class="togol"><input type="checkbox" ' + (m.hadir ? 'checked' : '') + (bolehUbah ? '' : ' disabled') + '><span class="landas"></span><span class="teks-togol">' + (m.hadir ? 'Hadir' : 'Tidak') + '</span></label></div>' +
    '<select class="input sebab ' + (m.hadir ? 'hidden' : '') + '" ' + (bolehUbah ? '' : 'disabled') + '>' + pilihanSebab(KK.sebab, m.kodSebab) + '</select></div>';
}
function togolMurid(cb) {
  KOTOR = true;
  const kad = cb.closest('.murid-kad'); const hadir = cb.checked;
  kad.classList.toggle('tidak-hadir', !hadir); kad.querySelector('.sebab').classList.toggle('hidden', hadir); kad.querySelector('.teks-togol').textContent = hadir ? 'Hadir' : 'Tidak';
  if (!hadir) kad.querySelector('.sebab').focus();
  kiraRoster();
}
function kiraRoster() { const jum = $$('.murid-kad').length, tidak = $$('.murid-kad.tidak-hadir').length; $('#kkHadir').textContent = jum - tidak; $('#kkTidak').textContent = tidak; }
function simpanKehadiranKelas() {
  const tidakHadir = [], tiadaSebab = [];
  $$('.murid-kad.tidak-hadir').forEach(c => { const kod = c.querySelector('.sebab').value; if (!kod) tiadaSebab.push(c.dataset.nama); tidakHadir.push({ nokp: c.dataset.nokp, kodSebab: kod }); });
  if (tiadaSebab.length) { toast('Pilih sebab tidak hadir bagi: ' + tiadaSebab.slice(0, 3).join(', ') + (tiadaSebab.length > 3 ? '…' : ''), 'gagal'); return; }
  const btn = $('#kkSimpan'); sibuk(btn, true, 'Menyimpan…');
  api('apiKehadiranKelasSimpan', { tarikh: KK.tarikh, kelas: KK.senaraiKelas.length ? KK.kelas : '', tidakHadir, versi: KK.versi === undefined ? null : KK.versi }).then(r => {
    KOTOR = false;
    toast((r.dikemaskini ? 'Rekod dikemaskini' : 'Rekod disimpan') + ': ' + r.hadir + ' hadir, ' + r.tidakHadir + ' tidak hadir.');
    HALAMAN_FN['kehadiran-kelas'](KK.tarikh, KK.kelasPilihan);
  }).catch(e => { sibuk(btn, false); if (e.kod === 'TERKUNCI' || e.kod === 'KONFLIK') { KOTOR = false; batalCacheSelepasTulis(); HALAMAN_FN['kehadiran-kelas'](KK.tarikh, KK.kelasPilihan); } });
}
function borangMohonAkses() {
  bukaModal(kepalaModal('Mohon Buka Akses Rekod', 'lock-key-open') + '<div class="modal-badan"><div class="banner biru">' + ikon('info', 'fill') + '<div><b>' + esc(KK.kelas) + ' · ' + esc(tarikhPanjang(KK.tarikh)) + '</b><p>Permohonan akan dihantar kepada admin. Alasan disimpan dan dianalisis untuk rujukan pentadbiran.</p></div></div>' +
    '<div class="medan"><label>Alasan (wajib)</label><textarea class="input" id="mohonAlasan" rows="4" placeholder="Nyatakan sebab rekod tidak dapat dibuat sebelum masa kunci…"></textarea><small style="color:var(--teks-2)"><span id="mohonBil">0</span> aksara · minimum 15</small></div>' +
    '<p class="ralat" id="mohonRalat"></p></div><div class="modal-kaki"><button class="btn hantu" data-tutup>Batal</button><button class="btn merah" id="mohonHantar">' + ikon('paper-plane-tilt', 'bold') + 'Hantar Permohonan</button></div>');
  $('#mohonAlasan').oninput = e => { $('#mohonBil').textContent = e.target.value.trim().length; };
  $('#mohonHantar').onclick = () => {
    const alasan = $('#mohonAlasan').value.trim();
    if (alasan.length < 15) { $('#mohonRalat').textContent = 'Alasan mesti sekurang-kurangnya 15 aksara.'; return; }
    const btn = $('#mohonHantar'); sibuk(btn, true, 'Menghantar…');
    api('apiMohonBukaAkses', { tarikh: KK.tarikh, kelas: KK.senaraiKelas.length ? KK.kelas : '', alasan }).then(() => { tutupModal(); toast('Permohonan dihantar kepada admin.'); HALAMAN_FN['kehadiran-kelas'](KK.tarikh, KK.kelasPilihan); })
      .catch(e => { sibuk(btn, false); $('#mohonRalat').textContent = e.message; });
  };
}

function urlPengimbas() {
  const asas = TETAPAN_UI.urlPengimbas || 'https://smkasajaya.my/kehadiranqrscanner.html';
  return asas + (asas.indexOf('?') === -1 ? '?' : '&') + 'token=' + encodeURIComponent(TOKEN) + '&nama=' + encodeURIComponent(PENGGUNA.nama) + '&exec=' + encodeURIComponent(EXEC_URL);
}
HALAMAN_FN.imbas = function () {

/* ============================== REKOD KEHADIRAN & ANALISIS BULANAN ============================== */
let RK = { bulan: '', kelas: '', tab: '' };
HALAMAN_FN.rekod = function () {
  if (!RK.bulan) RK.bulan = tarikhIniKlien().slice(0, 7);
  muat('apiRekodKehadiran', { bulan: RK.bulan, kelas: RK.kelas }).then(d => {
    $('#remehHalaman').textContent = 'Analisis bulanan · ' + d.labelBulan;
    const pemilih = '<div class="kad mb"><div class="alat-jadual" style="margin:0"><div class="medan" style="margin:0"><label>Bulan</label><input type="month" class="input" id="rkBulan" value="' + esc(d.bulan) + '" max="' + tarikhIniKlien().slice(0, 7) + '"></div>' +
      (d.senaraiKelas ? '<div class="medan" style="margin:0"><label>Kelas</label><select class="input" id="rkKelas"><option value="">— Pilih kelas —</option>' + d.senaraiKelas.map(k => '<option ' + (k === RK.kelas ? 'selected' : '') + '>' + esc(k) + '</option>').join('') + '</select></div>' : '') + '</div></div>';
    if (d.murid) { $('#kandungan').innerHTML = pemilih + '<div id="rkIsi"></div>'; rekodMurid(d.murid); }
    else {
      const tab = [];
      if (d.kelas) tab.push(['kelas', 'Kelas ' + d.kelas.kelas, 'users-three']);
      tab.push(['subjek', 'Sesi Subjek Saya', 'qr-code']);
      if (d.sekolah) tab.push(['sekolah', 'Seluruh Sekolah', 'buildings']);
      if (!tab.some(t => t[0] === RK.tab)) RK.tab = tab[0][0];
      $('#kandungan').innerHTML = pemilih + '<div class="tab">' + tab.map(t => '<button data-tab="' + t[0] + '" class="' + (t[0] === RK.tab ? 'aktif' : '') + '">' + ikon(t[2]) + esc(t[1]) + '</button>').join('') + '</div><div id="rkIsi"></div>';
      $$('.tab button').forEach(b => b.onclick = () => { RK.tab = b.dataset.tab; $$('.tab button').forEach(x => x.classList.toggle('aktif', x === b)); lukisTab(); });
      const lukisTab = () => RK.tab === 'kelas' ? rekodKelas(d.kelas) : RK.tab === 'sekolah' ? rekodSekolah(d.sekolah) : rekodSubjek(d.subjek);
      lukisTab();
    }
    $('#rkBulan').onchange = e => { RK.bulan = e.target.value; HALAMAN_FN.rekod(); };
    if ($('#rkKelas')) $('#rkKelas').onchange = e => { RK.kelas = e.target.value; RK.tab = e.target.value ? 'kelas' : RK.tab; HALAMAN_FN.rekod(); };
  }).catch(e => { $('#kandungan').innerHTML = kosong('wifi-slash', 'Gagal memuat', e.message); });
};

function rekodMurid(m) {
  const r = m.ringkasan;

  const peta = {}; m.harian.forEach(h => { peta[h.tarikh] = h; });
  let kal = ['Ahd', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'].map(h => '<div class="kepala-hari">' + h + '</div>').join('') + '<div></div>'.repeat(hariPertama);
  for (let i = 1; i <= bilHari; i++) { const t = m.bulan + '-' + ('0' + i).slice(-2), h = peta[t];
    kal += '<div class="sel ' + (h ? (h.hadir ? 'hadir' : h.ponteng ? 'ponteng' : 'sah') : '') + (t === tarikhIniKlien() ? ' hari-ini' : '') + '" title="' + esc(h && h.sebab ? h.sebab : '') + '">' + i + (h ? '<small>' + (h.hadir ? 'Hadir' : 'Tidak') + '</small>' : '') + '</div>'; }

    kadStat('merah', 'calendar-x', 'Tidak Hadir', r.tidakHadir, 'hari dalam bulan ini') + kadStat('ungu', 'chart-line-up', 'Kehadiran Tahun Ini', r.peratusTahun.toFixed(1) + '<small>%</small>', 'Purata kumulatif') +
    kadStat(r.pontengTahun || r.pontengKelasTahun ? 'oren' : 'hijau', 'prohibit', 'Ponteng (Tahun)', r.pontengTahun, r.pontengKelasTahun + ' kes ponteng kelas tahun ini (' + r.pontengKelas + ' bulan ini)') + '</div>' +
    '<div class="grid g-2 mb"><div class="kad"><div class="kad-kepala"><h3>' + ikon('calendar-dots', 'duotone') + 'Kalendar Kehadiran</h3></div><div class="kalendar">' + kal + '</div>' + petunjukKalendar() + '</div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('chart-bar', 'duotone') + 'Trend Bulanan (Tahun Ini)</h3></div><div id="cRTrend" class="carta"></div></div></div>' +
    '<div class="grid g-2 mb"><div class="kad"><div class="kad-kepala"><h3>' + ikon('books', 'duotone') + 'Kehadiran Mengikut Subjek</h3></div><div id="cRSubjek" class="carta"></div></div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('chart-pie-slice', 'duotone') + 'Sebab Tidak Hadir</h3></div><div id="cRSebab" class="carta"></div></div></div>' +
    '<div class="kad mb"><div class="kad-kepala"><h3>' + ikon('list-bullets', 'duotone') + 'Rekod Harian</h3></div><div id="tRHarian"></div></div>' +
    '<div class="grid g-2"><div class="kad"><div class="kad-kepala"><h3>' + ikon('clock-countdown', 'duotone') + 'Sesi Subjek Tidak Hadir</h3></div><div id="tRSubjek"></div></div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('person-simple-run', 'duotone') + 'Ponteng Kelas</h3><span class="remeh">' + m.pontengKelas.length + ' kes bulan ini</span></div><div id="tRPK"></div></div></div>';
  cartaBar('#cRTrend', m.trend.map(t => t.label), [{ name: 'Kehadiran', data: m.trend.map(t => t.peratus) }], { peratus: true, warna: [WARNA.ungu] });
  if (m.perSubjek.length) cartaBar('#cRSubjek', m.perSubjek.map(s => s.subjek), [{ name: 'Kehadiran', data: m.perSubjek.map(s => s.peratus) }], { peratus: true, mendatar: true, warna: [WARNA.biru], tinggi: Math.max(240, m.perSubjek.length * 38) });
  else $('#cRSubjek').innerHTML = kosong('books', 'Tiada sesi subjek direkod bulan ini');

  jadualData('#tRHarian', { data: m.harian.slice().reverse(), eksport: 'rekod-harian-' + m.bulan, lajur: [{ k: 'tarikh', label: 'Tarikh', f: r => '<b>' + esc(tarikhPendek(r.tarikh)) + '</b>' }, { k: 'hari', label: 'Hari' },

  $('#rkIsi').innerHTML = '<div class="grid g-4 mb">' + kadStat('biru', 'database', 'Rekod Kelas', r.rekod, 'Bulan ini') + kadStat('hijau', 'percent', 'Kehadiran Sekolah', r.peratus.toFixed(1) + '<small>%</small>', 'Purata bulanan') +
    kadStat('merah', 'user-minus', 'Ketidakhadiran', r.tidakHadir, 'Kes direkod') + kadStat('oren', 'prohibit', 'Ponteng', r.ponteng, 'Kes dikira ponteng') + '</div>' +
    '<div class="grid g-21 mb"><div class="kad"><div class="kad-kepala"><h3>' + ikon('trend-up', 'duotone') + 'Trend Harian Sekolah</h3></div><div id="cSkHarian" class="carta"></div></div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('chart-pie-slice', 'duotone') + 'Sebab Tidak Hadir</h3></div><div id="cSkSebab" class="carta"></div></div></div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('ranking', 'duotone') + 'Kedudukan Kelas</h3></div><div id="tSkKelas"></div></div>';
  if (s.harian.length) cartaKawasan('#cSkHarian', s.harian.map(h => tarikhPendek(h.tarikh).slice(0, -5)), [{ name: 'Kehadiran', data: s.harian.map(h => h.peratus) }], { peratus: true, min: 50 }); else $('#cSkHarian').innerHTML = kosong('chart-line', 'Tiada data');
  if (s.sebab.length) cartaDonut('#cSkSebab', s.sebab.map(x => x.sebab), s.sebab.map(x => x.bil), null, 'Kes'); else $('#cSkSebab').innerHTML = kosong('confetti', 'Tiada data');
  jadualData('#tSkKelas', { data: s.perKelas, eksport: 'kedudukan-kelas-' + RK.bulan, isihAwal: 'peratus', arahAwal: -1, klik: r => { RK.kelas = r.kelas; RK.tab = 'kelas'; HALAMAN_FN.rekod(); },
    lajur: [{ k: 'kelas', label: 'Kelas', f: r => '<b>' + esc(r.kelas) + '</b>' }, { k: 'hari', label: 'Hari Direkod', nombor: true }, { k: 'peratus', label: 'Kehadiran', f: r => barPeratus(r.peratus) },
      { k: 'selepasKunci', label: 'Rekod Selepas Kunci', nombor: true, f: r => r.selepasKunci ? lencana(r.selepasKunci + ' hari', 'kuning') : '0' }] });
}

/* ============================== PONTENG KELAS ============================== */
let PKL = { bulan: '', kelas: '' };
HALAMAN_FN['ponteng-kelas'] = function () {
  if (!PKL.bulan) PKL.bulan = tarikhIniKlien().slice(0, 7);
  muat('apiPontengKelas', { bulan: PKL.bulan, kelas: PKL.kelas }).then(d => {
    $('#remehHalaman').textContent = d.skop + ' · ' + d.labelBulan;
    const k = d.kad, beza = k.kes - k.kesBulanLalu;
    const trendTeks = k.kesBulanLalu || k.kes ? (beza > 0 ? '▲ ' + beza + ' berbanding bulan lalu' : beza < 0 ? '▼ ' + Math.abs(beza) + ' berbanding bulan lalu' : 'Sama seperti bulan lalu') : 'Tiada kes bulan lalu';
    $('#kandungan').innerHTML =
      '<div class="kad mb"><div class="alat-jadual" style="margin:0"><div class="medan" style="margin:0"><label>Bulan</label><input type="month" class="input" id="pkBulan" value="' + esc(d.bulan) + '" max="' + tarikhIniKlien().slice(0, 7) + '"></div>' +
      (d.senaraiKelas.length ? '<div class="medan" style="margin:0"><label>Kelas</label><select class="input" id="pkKelas"><option value="">Semua kelas</option>' + d.senaraiKelas.map(c => '<option ' + (c === PKL.kelas ? 'selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' : '') +
      '<div class="banner biru" style="margin:0;flex:1;min-width:260px">' + ikon('info', 'fill') + '<div><b>Ponteng kelas</b><p>Murid hadir ke sekolah (tidak ditanda tidak hadir oleh GT) tetapi tiada dalam kelas semasa waktu P&amp;P. Direkod oleh guru melalui imbasan QR kelas.</p></div></div></div></div>' +
      '<div class="grid g-4 mb">' +
        kadStat('merah', 'person-simple-run', 'Kes Ponteng Kelas', k.kes, trendTeks) +
        kadStat('oren', 'users', 'Murid Terlibat', k.murid, '<b style="color:var(--merah)">' + k.berulang + '</b> murid berulang (≥' + d.ambangBerulang + ' kes)') +
        kadStat('ungu', 'percent', 'Kadar Ponteng Kelas', k.kadar.toFixed(2) + '<small>%</small>', 'daripada kehadiran murid dalam ' + k.sesi + ' sesi direkod') +
        kadStat('biru', 'buildings', 'Kelas Terlibat', k.kelas, k.kesTahun + ' kes sepanjang ' + d.bulan.slice(0, 4)) + '</div>' +
      '<div class="grid g-21 mb"><div class="kad"><div class="kad-kepala"><h3>' + ikon('chart-bar', 'duotone') + 'Kes Harian</h3><span class="remeh">' + esc(d.labelBulan) + '</span></div><div id="cPKHarian" class="carta"></div></div>' +
      '<div class="kad"><div class="kad-kepala"><h3>' + ikon('trend-up', 'duotone') + 'Trend Bulanan</h3><span class="remeh">' + esc(d.bulan.slice(0, 4)) + '</span></div><div id="cPKBulanan" class="carta"></div></div></div>' +
      '<div class="grid g-3 mb"><div class="kad"><div class="kad-kepala"><h3>' + ikon('books', 'duotone') + 'Mengikut Subjek</h3></div><div id="cPKSubjek" class="carta"></div></div>' +
      '<div class="kad"><div class="kad-kepala"><h3>' + ikon('clock', 'duotone') + 'Mengikut Waktu</h3></div><div id="cPKMasa" class="carta"></div></div>' +
      '<div class="kad"><div class="kad-kepala"><h3>' + ikon('calendar', 'duotone') + 'Mengikut Hari</h3></div><div id="cPKHari" class="carta"></div></div></div>' +
      '<div class="grid g-21 mb"><div class="kad"><div class="kad-kepala"><h3>' + ikon('grid-four', 'duotone') + 'Peta Haba Hari × Waktu</h3><span class="remeh">Bila ponteng kelas paling kerap berlaku</span></div><div id="cPKHaba" class="carta"></div></div>' +
      '<div class="kad"><div class="kad-kepala"><h3>' + ikon('buildings', 'duotone') + 'Mengikut Kelas</h3></div><div id="cPKKelas" class="carta"></div></div></div>' +
      '<div class="kad mb"><div class="kad-kepala"><h3>' + ikon('student', 'duotone') + 'Murid Terlibat</h3><span class="remeh">Klik untuk profil</span></div><div id="tPKMurid"></div></div>' +
      (d.lihatGuru ? '<div class="kad mb"><div class="kad-kepala"><h3>' + ikon('chalkboard-teacher', 'duotone') + 'Mengikut Guru Yang Merekod</h3></div><div id="tPKGuru"></div></div>' : '') +
      '<div class="kad"><div class="kad-kepala"><h3>' + ikon('list-bullets', 'duotone') + 'Semua Kes</h3></div><div id="tPKKes"></div></div>';
    $('#pkBulan').onchange = e => { PKL.bulan = e.target.value; HALAMAN_FN['ponteng-kelas'](); };
    if ($('#pkKelas')) $('#pkKelas').onchange = e => { PKL.kelas = e.target.value; HALAMAN_FN['ponteng-kelas'](); };
    const tiada = sel => { $(sel).innerHTML = kosong('confetti', 'Tiada kes ponteng kelas'); };
    if (k.kes) carta('#cPKHarian', { chart: { type: 'bar', height: 290 }, series: [{ name: 'Kes', data: d.trendHarian.map(x => x.bil) }],
      xaxis: { categories: d.trendHarian.map(x => Number(x.tarikh.slice(8)) + ' ' + (HARI_PENDEK[hariDariTarikh(x.tarikh)] || '')) }, colors: [WARNA.merah],
      plotOptions: { bar: { borderRadius: 5, columnWidth: '60%' } }, yaxis: { labels: { formatter: v => Math.round(v) } } }); else tiada('#cPKHarian');
    cartaKawasan('#cPKBulanan', d.trendBulanan.map(x => x.bulan), [{ name: 'Kes', data: d.trendBulanan.map(x => x.bil) }], { warna: [WARNA.merah] });
    if (d.perSubjek.length) cartaBar('#cPKSubjek', d.perSubjek.map(x => x.label), [{ name: 'Kes', data: d.perSubjek.map(x => x.bil) }], { mendatar: true, warna: [WARNA.ungu], tinggi: Math.max(260, d.perSubjek.length * 34) }); else tiada('#cPKSubjek');
    if (d.perMasa.length) cartaBar('#cPKMasa', d.perMasa.map(x => x.label), [{ name: 'Kes', data: d.perMasa.map(x => x.bil) }], { warna: [WARNA.oren] }); else tiada('#cPKMasa');
    if (k.kes) cartaBar('#cPKHari', d.perHari.map(x => HARI_PENDEK[x.label] || x.label), [{ name: 'Kes', data: d.perHari.map(x => x.bil) }], { warna: [WARNA.biru], lebar: '50%' }); else tiada('#cPKHari');
    if (k.kes && d.petaHaba.masa.length) carta('#cPKHaba', { chart: { type: 'heatmap', height: 300 }, dataLabels: { enabled: true, style: { colors: ['#fff'] } },
      series: d.petaHaba.hari.map((h, ri) => ({ name: HARI_PENDEK[h] || h, data: d.petaHaba.masa.map((m, ci) => ({ x: m, y: d.petaHaba.nilai[ri][ci] })) })).reverse(),
      colors: [WARNA.merah], plotOptions: { heatmap: { radius: 6, colorScale: { ranges: [{ from: 0, to: 0, color: '#EEF1F7', name: 'Tiada' }] } } } }); else tiada('#cPKHaba');
    if (d.perKelas.length) cartaBar('#cPKKelas', d.perKelas.map(x => x.label), [{ name: 'Kes', data: d.perKelas.map(x => x.bil) }], { mendatar: true, warna: [WARNA.merah], tinggi: Math.max(260, d.perKelas.length * 34) }); else tiada('#cPKKelas');
    jadualData('#tPKMurid', { data: d.murid, eksport: 'ponteng-kelas-murid-' + d.bulan, klik: r => bukaProfilModal(r.nokp), lajur: [
      { k: 'nama', label: 'Murid', f: r => '<div class="orang">' + avatar(r.nama, r.gambar) + '<div><b>' + esc(r.nama) + '</b><small>' + esc(r.kelas) + '</small></div></div>' },
      { k: 'bil', label: 'Kes', nombor: true, f: r => '<b style="color:var(--merah)">' + r.bil + '</b>' + (r.berulang ? ' ' + lencana('Berulang', 'merah', 'warning') : '') },
      { k: 'subjek', label: 'Subjek', f: r => '<small>' + esc(r.subjek) + '</small>' }, { k: 'terkini', label: 'Kes Terkini', f: r => esc(tarikhPendek(r.terkini)) }] });
    if (d.lihatGuru) jadualData('#tPKGuru', { data: d.perGuru, cari: false, eksport: 'ponteng-kelas-guru-' + d.bulan, lajur: [{ k: 'label', label: 'Guru' }, { k: 'bil', label: 'Kes Direkod', nombor: true }] });
    jadualData('#tPKKes', { data: d.kes, eksport: 'ponteng-kelas-kes-' + d.bulan, lajur: [{ k: 'tarikh', label: 'Tarikh', f: r => '<b>' + esc(tarikhPendek(r.tarikh)) + '</b><br><small style="color:var(--teks-2)">' + esc(r.hari) + '</small>' },
      { k: 'masa', label: 'Masa' }, { k: 'nama', label: 'Murid', f: r => '<b>' + esc(r.nama) + '</b>' }, { k: 'kelas', label: 'Kelas' }, { k: 'subjek', label: 'Subjek' }, { k: 'guru', label: 'Guru' },
      { k: 'x', label: '', isih: false, teks: () => '', f: r => butangSuntingSesi(r) }] });
    pasangSuntingSesi('#tPKKes', () => HALAMAN_FN['ponteng-kelas']());
  }).catch(e => { $('#kandungan').innerHTML = kosong('wifi-slash', 'Gagal memuat', e.message); });
};
function hariDariTarikh(t) { const [y, m, d] = t.split('-').map(Number); return ['AHAD', 'ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU'][new Date(y, m - 1, d).getDay()]; }

/* ============================== PROFIL PELAJAR ============================== */
HALAMAN_FN.profil = function () {
  if (PENGGUNA.jenis === 'MURID') {
    muat('apiProfilPelajar', {}).then(p => { $('#kandungan').innerHTML = htmlProfil(p, 'p'); lukisCartaProfil(p, 'p'); }).catch(e => { $('#kandungan').innerHTML = kosong('identification-badge', 'Gagal memuat profil', e.message); });
    return;
  }
  $('#kandungan').innerHTML = '<div class="kad mb"><div class="alat-jadual" style="margin:0"><div class="input-ikon" style="max-width:none"><i class="ph ph-magnifying-glass"></i><input class="input" id="pfCari" placeholder="Cari nama atau No. KP murid…"></div>' +
    '<select class="input" id="pfKelas" style="max-width:220px"><option value="">Semua kelas saya</option></select></div></div><div id="pfSenarai">' + rangka(200) + '</div>';
  let pemasa;
  const muatSenarai = () => muat('apiCariPelajar', { q: $('#pfCari').value, kelas: $('#pfKelas').value }).then(r => {
    const sel = $('#pfKelas');
    if (sel.options.length === 1) r.senaraiKelas.forEach(k => sel.insertAdjacentHTML('beforeend', '<option>' + esc(k) + '</option>'));
    $('#remehHalaman').textContent = r.senarai.length + ' murid dipaparkan';
    $('#pfSenarai').innerHTML = r.senarai.length ? '<div class="grid-murid">' + r.senarai.map(m => '<div class="kad-murid" data-nokp="' + esc(m.nokp) + '">' + avatar(m.nama, m.gambar) + '<div style="min-width:0"><b style="font-size:13px">' + esc(m.nama) + '</b><small style="display:block;color:var(--teks-2)">' + esc(m.kelas) + '</small></div></div>').join('') + '</div>'
      : kosong('student', 'Tiada murid dijumpai', 'Anda hanya boleh melihat murid dalam kelas yang anda ajar atau kelas tingkatan anda.');
    $$('.kad-murid[data-nokp]').forEach(c => c.onclick = () => bukaProfilModal(c.dataset.nokp));
  }).catch(() => {});
  $('#pfCari').oninput = () => { clearTimeout(pemasa); pemasa = setTimeout(muatSenarai, 350); };
  $('#pfKelas').onchange = muatSenarai;
  muatSenarai();
};
function htmlProfil(p, id) {
  const m = p.profil, k = p.kehadiran;
  return '<div class="grid g-21 mb"><div class="kad"><div class="profil-kepala">' + (m.gambar ? '<img class="foto avatar" src="' + esc(m.gambar) + '" referrerpolicy="no-referrer" alt="" onerror="this.outerHTML=\'<span class=&quot;foto avatar&quot;>' + esc(inisial(m.nama)) + '</span>\'">' : '<span class="foto avatar">' + esc(inisial(m.nama)) + '</span>') +
    '<div><h2>' + esc(m.nama) + '</h2><p style="margin:4px 0 10px;color:var(--teks-2)">' + esc(m.kelas) + ' · Tingkatan ' + esc(m.tingkatan || '-') + '</p>' + lencana(k.peratus.toFixed(1) + '% kehadiran', k.peratus >= 90 ? 'hijau' : k.peratus >= 80 ? 'kuning' : 'merah', 'chart-line-up') + ' ' +
    (k.peringkatBerturut !== 'Tiada' ? lencana('Berturut: ' + k.peringkatBerturut, 'merah') + ' ' : '') + (k.peringkatTidakBerturut !== 'Tiada' ? lencana('Tidak berturut: ' + k.peringkatTidakBerturut, 'oren') : '') + '</div></div>' +
    '<hr style="border:0;border-top:1px solid var(--sempadan);margin:18px 0"><div class="butiran">' +
    [['No. Kad Pengenalan', m.nokp], ['Jantina', m.jantina], ['Tarikh Lahir', m.tarikhLahir ? tarikhPendek(m.tarikhLahir) : '-'], ['Kelas', m.kelas], ['Guru Tingkatan', (p.guruTingkatan || []).join(', ') || '-'],
      ['Penolong Guru Tingkatan', (p.penolongGT || []).join(', ') || '-'], ['Ibu Bapa / Penjaga', m.namaPenjaga], ['Telefon Penjaga', m.telefonPenjaga], ['Alamat', m.alamat]]
      .map(x => '<div><small>' + esc(x[0]) + '</small><span>' + esc(x[1] || '-') + '</span></div>').join('') + '</div><p style="font-size:11.5px;color:var(--kelabu);margin:16px 0 0">' + ikon('database') + ' Sumber: ' + esc(p.sumber) + '</p></div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('gauge', 'duotone') + 'Kehadiran Tahun Ini</h3></div><div id="' + id + 'Gauge"></div><div class="tangga" style="grid-template-columns:1fr 1fr;margin-top:8px">' +
    '<div><b>' + k.hadir + '/' + k.hari + '</b><small>Hari hadir</small></div><div><b style="color:var(--merah)">' + k.ponteng + '</b><small>Hari ponteng</small></div><div><b>' + k.tidakHadirSah + '</b><small>Tidak hadir bersebab</small></div><div><b>' + k.berturut + '</b><small>Ponteng berturut kini</small></div>' +
    '<div style="grid-column:1/-1"><b style="color:' + (k.pontengKelas ? 'var(--merah)' : 'inherit') + '">' + (k.pontengKelas || 0) + '</b><small>Kes ponteng kelas (tahun ini)</small></div></div></div></div>' +
    '<div class="grid g-2"><div class="kad"><div class="kad-kepala"><h3>' + ikon('chart-bar', 'duotone') + 'Trend Bulanan</h3></div><div id="' + id + 'Trend" class="carta"></div></div>' +
    '<div class="kad"><div class="kad-kepala"><h3>' + ikon('calendar-x', 'duotone') + 'Ketidakhadiran Terkini</h3></div><div class="senarai-jadual">' +
    (p.tidakHadirTerkini.length ? p.tidakHadirTerkini.map(h => '<div class="slot-item"><span class="garis" style="background:' + (h.ponteng ? WARNA.merah : WARNA.emas) + '"></span><div class="info"><b>' + esc(tarikhPanjang(h.tarikh)) + '</b><small>' + esc(h.sebab) + '</small></div>' + (h.ponteng ? lencana('Ponteng', 'merah') : lencana('Bersebab', 'kuning')) + '</div>').join('') : kosong('confetti', 'Tiada ketidakhadiran direkod')) + '</div></div></div>';
}
function lukisCartaProfil(p, id) {
  cartaGauge('#' + id + 'Gauge', p.kehadiran.peratus, 'Kehadiran');
  if (p.trend.length) cartaBar('#' + id + 'Trend', p.trend.map(t => t.label), [{ name: 'Kehadiran', data: p.trend.map(t => t.peratus) }], { peratus: true, warna: [WARNA.biru] }); else $('#' + id + 'Trend').innerHTML = kosong('chart-bar', 'Belum ada data');
}
function bukaProfilModal(nokp) {
  const m = bukaModal(kepalaModal('Profil Pelajar', 'identification-badge') + '<div class="modal-badan" id="pmBadan">' + rangka(300) + '</div>', { lebar: true });
  api('apiProfilPelajar', { nokp }).then(p => { $('#pmBadan', m).innerHTML = htmlProfil(p, 'pm'); lukisCartaProfil(p, 'pm'); }).catch(e => { $('#pmBadan', m).innerHTML = kosong('warning', 'Gagal memuat', e.message); });
}

/* ============================== AMARAN PONTENG ============================== */
let AM = { kelas: '', tapis: 'perlu', data: null };
const LABEL_PERINGKAT = { AMARAN_1: 'Amaran Pertama', AMARAN_2: 'Amaran Kedua', AMARAN_TERAKHIR: 'Amaran Terakhir', BUANG_SEKOLAH: 'Buang Sekolah', RUJUKAN_DISIPLIN: 'Rujukan Lembaga Disiplin' };
function pilPeringkat(kod) { return kod ? '<span class="lencana pil-' + kod + '">' + esc(LABEL_PERINGKAT[kod]) + '</span>' : '<span class="lencana l-kelabu">Tiada</span>'; }
function kemajuan(k) { return '<div class="kemajuan-amaran">' + [0, 1, 2, 3].map(i => '<span class="' + (i <= k.peringkat.indeks ? 'capai s' + i : '') + '"></span>').join('') + '</div>'; }
HALAMAN_FN.amaran = function () {
  muat('apiAmaranPonteng', { kelas: AM.kelas }).then(d => { AM.data = d; lukisAmaran(); }).catch(e => { $('#kandungan').innerHTML = kosong('warning-octagon', 'Gagal memuat amaran', e.message); });
};
function lukisAmaran() {
  const d = AM.data, rk = d.ringkasan;
  $('#remehHalaman').textContent = d.kelas + ' · Tahun ' + tarikhIniKlien().slice(0, 4);
  const tangga = (k, warna) => '<div class="kad"><div class="kad-kepala"><h3>' + ikon(k === 'BERTURUT' ? 'arrows-left-right' : 'dots-three-outline', 'duotone') + esc(d.labelKategori[k]) + '</h3></div><div class="tangga">' +
    d.peringkat[k].map(p => '<div><b>' + (rk[k][p.kod] || 0) + '</b><small>' + esc(p.label) + '</small><br><small style="font-weight:600;color:var(--kelabu)">hari ke-' + p.hari + '</small></div>').join('') + '</div></div>';
  const tapisan = { semua: d.senarai, perlu: d.senarai.filter(s => s.BERTURUT.perluSurat || s.TIDAK_BERTURUT.perluSurat),
    berturut: d.senarai.filter(s => s.BERTURUT.peringkat.indeks >= 0), tidak: d.senarai.filter(s => s.TIDAK_BERTURUT.peringkat.indeks >= 0),
    hampir: d.senarai.filter(s => ['BERTURUT', 'TIDAK_BERTURUT'].some(k => s[k].peringkat.seterusnya && s[k].peringkat.seterusnya.baki <= 2 && s[k].hari > 0)) };
  $('#kandungan').innerHTML = (d.senaraiKelas.length ? '<div class="kad mb"><div class="alat-jadual" style="margin:0"><div class="medan" style="margin:0"><label>Kelas</label><select class="input" id="amKelas"><option value="">Semua kelas</option>' +
    d.senaraiKelas.map(k => '<option ' + (k === AM.kelas ? 'selected' : '') + '>' + esc(k) + '</option>').join('') + '</select></div></div></div>' : '') +
    '<div class="grid g-4 mb">' + kadStat('merah', 'bell-ringing', 'Perlu Tindakan', rk.perluTindakan, 'Peringkat dicapai, surat belum dijana') + kadStat('oren', 'hourglass-medium', 'Hampir Peringkat Seterusnya', rk.hampir, 'Baki 2 hari atau kurang') +
    kadStat('kuning', 'arrows-left-right', 'Ponteng Berturut', tapisan.berturut.length, 'Murid dalam peringkat amaran') + kadStat('ungu', 'dots-three-outline', 'Ponteng Tidak Berturut', tapisan.tidak.length, 'Murid dalam peringkat amaran') + '</div>' +
    '<div class="grid g-2 mb">' + tangga('BERTURUT') + tangga('TIDAK_BERTURUT') + '</div>' +
    '<div class="kad"><div class="tab">' + [['perlu', 'Perlu Tindakan'], ['hampir', 'Hampir'], ['berturut', 'Berturut-turut'], ['tidak', 'Tidak Berturut-turut'], ['semua', 'Semua Ada Ponteng']]

    { k: 'b', label: 'Berturut-turut', teks: r => r.BERTURUT.hari, f: r => '<b class="nombor">' + r.BERTURUT.hari + ' hari</b> ' + pilPeringkat(r.BERTURUT.peringkat.kod) + kemajuan(r.BERTURUT) +
      (r.BERTURUT.peringkat.seterusnya && r.BERTURUT.hari ? '<small style="color:var(--teks-2)">' + r.BERTURUT.peringkat.seterusnya.baki + ' hari lagi → ' + esc(r.BERTURUT.peringkat.seterusnya.label) + '</small>' : '') },
    { k: 't', label: 'Tidak Berturut-turut', teks: r => r.TIDAK_BERTURUT.hari, f: r => '<b class="nombor">' + r.TIDAK_BERTURUT.hari + ' hari</b> ' + pilPeringkat(r.TIDAK_BERTURUT.peringkat.kod) + kemajuan(r.TIDAK_BERTURUT) +
      (r.TIDAK_BERTURUT.peringkat.seterusnya ? '<small style="color:var(--teks-2)">' + r.TIDAK_BERTURUT.peringkat.seterusnya.baki + ' hari lagi → ' + esc(r.TIDAK_BERTURUT.peringkat.seterusnya.label) + '</small>' : '') },
    { k: 'peratusHadir', label: 'Kehadiran', f: r => barPeratus(r.peratusHadir) },
    { k: 's', label: 'Status', teks: r => (r.BERTURUT.perluSurat || r.TIDAK_BERTURUT.perluSurat) ? 'Perlu surat' : 'Dikemas kini', f: r => ((r.BERTURUT.perluSurat || r.TIDAK_BERTURUT.perluSurat) ? lencana('Perlu surat', 'merah', 'envelope-simple') : lencana('Surat dijana', 'hijau', 'check')) + '<br><small style="color:var(--teks-2)">' + r.bilIntervensi + ' intervensi</small>' }] });
}
function bukaButiranAmaran(nokp) {

  api('apiButiranAmaranMurid', { nokp }).then(d => {
    const s = d.status, mu = d.murid;
    const blokKat = k => { const x = s[k]; return '<div class="kad"><div class="kad-kepala"><h3>' + esc(AM.data.labelKategori[k]) + '</h3>' + pilPeringkat(x.peringkat.kod) + '</div>' +
      '<div class="nilai nombor" style="font-size:30px;font-weight:800">' + x.hari + ' <small style="font-size:14px;color:var(--teks-2)">hari ' + (k === 'BERTURUT' ? 'berturut-turut' + (x.mulaEpisod ? ' sejak ' + esc(tarikhPendek(x.mulaEpisod)) : '') : 'terkumpul') + '</small></div>' + kemajuan(x) +
      '<p style="font-size:12.5px;color:var(--teks-2);margin:8px 0 12px">' + (x.peringkat.seterusnya ? 'Peringkat seterusnya: <b>' + esc(x.peringkat.seterusnya.label) + '</b> pada hari ke-' + x.peringkat.seterusnya.hari + ' (' + x.peringkat.seterusnya.baki + ' hari lagi).' : 'Peringkat tertinggi telah dicapai.') + '</p>' +
      (x.peringkat.indeks >= 0 ? '<button class="btn ' + (x.perluSurat ? 'merah' : 'hantu') + ' kecil jana" data-k="' + k + '">' + ikon('printer', 'bold') + (x.perluSurat ? 'Jana Surat ' + esc(x.peringkat.label) : 'Cetak Semula Surat ' + esc(x.peringkat.label)) + '</button>' : '<span style="font-size:12.5px;color:var(--kelabu)">Belum mencapai peringkat amaran.</span>') + '</div>'; };
    $('#baBadan', m).innerHTML = '<div class="profil-kepala mb" style="align-items:center">' + avatar(mu.nama, mu.gambar, 'foto') + '<div><h2 style="font-size:19px">' + esc(mu.nama) + '</h2><p style="margin:2px 0;color:var(--teks-2)">' + esc(mu.kelas) + ' · ' + esc(mu.nokp) + '</p>' +
      '<small style="color:var(--teks-2)">Penjaga: <b>' + esc(mu.namaPenjaga || '-') + '</b> · ' + esc(mu.telefonPenjaga || '-') + '</small></div></div>' +
      '<div class="grid g-2 mb">' + blokKat('BERTURUT') + blokKat('TIDAK_BERTURUT') + '</div>' +
      '<div class="grid g-2"><div class="kad"><div class="kad-kepala"><h3>' + ikon('hand-heart', 'duotone') + 'Tindakan & Intervensi</h3></div>' +
      '<div class="medan"><label>Tindakan</label><select class="input" id="ivTindakan"><option value="">— Pilih tindakan —</option>' + d.tindakan.map(t => '<option>' + esc(t) + '</option>').join('') + '</select></div>' +
      '<div class="grid g-2" style="gap:10px"><div class="medan"><label>Tarikh</label><input type="date" class="input" id="ivTarikh" value="' + tarikhIniKlien() + '" max="' + tarikhIniKlien() + '"></div>' +
      '<div class="medan"><label>Kategori</label><select class="input" id="ivKat"><option value="BERTURUT">Berturut-turut</option><option value="TIDAK_BERTURUT">Tidak berturut-turut</option><option value="UMUM">Umum</option></select></div></div>' +
      '<div class="medan"><label>Catatan / hasil</label><textarea class="input" id="ivCatatan" rows="3" placeholder="cth: Ibu dihubungi, murid sakit di rumah, akan hadir esok…"></textarea></div>' +
      '<button class="btn hijau kecil" id="ivSimpan">' + ikon('plus-circle', 'bold') + 'Rekod Intervensi</button><hr style="border:0;border-top:1px solid var(--sempadan);margin:16px 0">' +
      '<div class="garis-masa">' + (d.intervensi.length ? d.intervensi.map(i => itemIntervensi(i, d)).join('') : kosong('hand-heart', 'Belum ada intervensi direkod')) + '</div></div>' +
      '<div class="kad"><div class="kad-kepala"><h3>' + ikon('envelope-simple', 'duotone') + 'Surat Dikeluarkan</h3></div><div class="garis-masa">' +
      (d.surat.length ? d.surat.map(x => itemSurat(x, LABEL_PERINGKAT[x.peringkat] + ' · ' + AM.data.labelKategori[x.kategori], x.bilHari + ' hari', d.admin)).join('') : kosong('envelope-simple', 'Belum ada surat dikeluarkan')) +
      '</div><div class="kad-kepala" style="margin-top:16px"><h3>' + ikon('calendar-x', 'duotone') + 'Tarikh Tidak Hadir (Tahun Ini)</h3></div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
      d.tidakHadir.map(h => '<span class="lencana ' + (h.ponteng ? 'l-merah' : 'l-kuning') + '" title="' + esc(h.sebab) + '">' + esc(tarikhPendek(h.tarikh)) + '</span>').join('') + '</div></div></div>';
    $$('.jana', m).forEach(b => b.onclick = () => janaSurat(nokp, b.dataset.k, b));
    pasangAksiAmaran(m, d, () => { bukaButiranAmaran(nokp); HALAMAN_FN.amaran(); });
    $('#ivSimpan', m).onclick = () => {
      const btn = $('#ivSimpan', m); if (!$('#ivTindakan', m).value) { toast('Sila pilih tindakan.', 'gagal'); return; }
      sibuk(btn, true, 'Menyimpan…');
      api('apiRekodIntervensi', { nokp, tindakan: $('#ivTindakan', m).value, tarikh: $('#ivTarikh', m).value, kategori: $('#ivKat', m).value, catatan: $('#ivCatatan', m).value })
        .then(() => { toast('Intervensi direkod.'); bukaButiranAmaran(nokp); HALAMAN_FN.amaran(); }).catch(() => sibuk(btn, false));
    };
  }).catch(e => { $('#baBadan', m).innerHTML = kosong('warning', 'Gagal memuat', e.message); });
}
function janaSurat(nokp, kategori, btn) {
  sibuk(btn, true, 'Menjana…');
  api('apiJanaSurat', { nokp, kategori }).then(r => { sibuk(btn, false); cetakSurat(r.surat); toast('Surat ' + r.surat.noRujukan + ' sedia untuk dicetak.'); HALAMAN_FN.amaran(); })
    .catch(() => sibuk(btn, false));
}

/* Surat amaran bercetak (A4) — kepala surat dengan logo sekolah terbenam. */
function cetakSurat(s) {
  const m = s.murid, sk = s.sekolah, berturut = s.kategori === 'BERTURUT';
  const seterusnya = s.ambang[s.ambang.findIndex(x => x.kod === s.peringkat) + 1];
  const tajukPeringkat = s.peringkat === 'BUANG_SEKOLAH' ? 'NOTIS PEMBERITAHUAN TINDAKAN BUANG SEKOLAH' : 'SURAT ' + s.labelPeringkat.toUpperCase();
  const perenggan = s.peringkat === 'BUANG_SEKOLAH' ? [
    'Dengan hormatnya perkara di atas adalah dirujuk.',
    'Pihak sekolah telah mengeluarkan surat-surat amaran terdahulu berhubung ketidakhadiran anak/jagaan tuan/puan. Walau bagaimanapun, rekod menunjukkan anak/jagaan tuan/puan masih tidak hadir ke sekolah selama <b>' + s.bilHari + ' hari persekolahan ' + (berturut ? 'berturut-turut' : 'secara tidak berturut-turut') + '</b> tanpa sebab yang munasabah.',
    'Sehubungan itu, dimaklumkan bahawa pihak sekolah akan mengambil <b>tindakan buang sekolah</b> terhadap anak/jagaan tuan/puan mengikut peraturan yang berkuat kuasa.',
    'Tuan/puan dijemput hadir ke sekolah untuk berjumpa dengan Pengetua dalam tempoh <b>tujuh (7) hari</b> dari tarikh surat ini bagi memberikan penjelasan sebelum tindakan dimuktamadkan.'
  ] : [
    'Dengan hormatnya perkara di atas adalah dirujuk.',
    'Dimaklumkan bahawa anak/jagaan tuan/puan seperti butiran di atas telah tidak hadir ke sekolah selama <b>' + s.bilHari + ' hari persekolahan ' + (berturut ? 'berturut-turut' : 'secara tidak berturut-turut') + '</b> tanpa sebab yang munasabah.',
    'Sehubungan itu, tuan/puan diminta memastikan anak/jagaan tuan/puan hadir ke sekolah dengan segera dan berhubung dengan Guru Tingkatan bagi menjelaskan sebab ketidakhadiran tersebut.',
    seterusnya ? 'Sila ambil perhatian bahawa sekiranya ketidakhadiran ini berterusan sehingga <b>' + seterusnya.hari + ' hari</b>, <b>' + esc(seterusnya.label) + '</b> akan dikeluarkan' + (seterusnya.kod === 'BUANG_SEKOLAH' ? ' iaitu tindakan buang sekolah' : '') + ' mengikut peraturan yang berkuat kuasa.' : ''
  ].filter(Boolean);
  const pk = s.kategori === 'PONTENG_KELAS';
  let tajukPenuh = tajukPeringkat + ' — TIDAK HADIR KE SEKOLAH (' + s.labelKategori.toUpperCase() + ')';
  let barisJadual = '<tr><td>Bilangan Hari Tidak Hadir</td><td>' + s.bilHari + ' hari (' + esc(s.labelKategori) + ')</td></tr><tr><td>Tarikh Tidak Hadir</td><td>' + s.tarikhPonteng.map(t => esc(tarikhPendek(t))).join(', ') + '</td></tr>';
  if (pk) {
    const rujukan = s.peringkat === 'RUJUKAN_DISIPLIN';
    tajukPenuh = (rujukan ? 'NOTIS RUJUKAN KE LEMBAGA DISIPLIN SEKOLAH' : 'SURAT ' + s.labelPeringkat.toUpperCase()) + ' — PONTENG KELAS';
    barisJadual = '<tr><td>Bilangan Kes Ponteng Kelas</td><td>' + s.bilHari + ' kes (tahun ' + esc(String(s.tarikhKeluar).slice(0, 4)) + ')</td></tr>' +
      '<tr><td>Butiran Kes</td><td>' + s.kes.map(k => esc(tarikhPendek(k.tarikh)) + ' ' + esc(k.masa) + ' — ' + esc(k.subjek)).join('<br>') + '</td></tr>';
    perenggan.length = 0;
    perenggan.push('Dengan hormatnya perkara di atas adalah dirujuk.',
      'Dimaklumkan bahawa anak/jagaan tuan/puan seperti butiran di atas didapati <b>hadir ke sekolah tetapi tidak berada di dalam kelas</b> semasa waktu pengajaran dan pembelajaran (ponteng kelas) sebanyak <b>' + s.bilHari + ' kali</b> seperti direkodkan oleh guru mata pelajaran.',
      rujukan ? 'Memandangkan kesalahan ini berulang walaupun amaran terdahulu telah dikeluarkan, kes anak/jagaan tuan/puan telah <b>dirujuk kepada Lembaga Disiplin Sekolah</b> untuk tindakan selanjutnya mengikut peraturan yang berkuat kuasa.'
        : 'Ponteng kelas ialah satu kesalahan disiplin. Tuan/puan diminta menasihati anak/jagaan tuan/puan supaya sentiasa berada di dalam kelas mengikut jadual waktu dan berhubung dengan Guru Tingkatan bagi perbincangan lanjut.',
      rujukan ? 'Tuan/puan dijemput hadir ke sekolah untuk berjumpa dengan Penolong Kanan HEM / Guru Disiplin dalam tempoh <b>tujuh (7) hari</b> dari tarikh surat ini.'
        : (seterusnya ? 'Sila ambil perhatian bahawa sekiranya kesalahan ini berulang sehingga <b>' + seterusnya.hari + ' kes</b>, <b>' + esc(seterusnya.label) + '</b> akan dikeluarkan' + (seterusnya.kod === 'RUJUKAN_DISIPLIN' ? ' dan kes akan dirujuk kepada Lembaga Disiplin Sekolah' : '') + '.' : ''));
    for (let i = perenggan.length - 1; i >= 0; i--) if (!perenggan[i]) perenggan.splice(i, 1);
  }
  const html = '<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><title>' + esc(s.noRujukan) + '</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>' +
    '@page{size:A4;margin:16mm 18mm}body{font-family:"Plus Jakarta Sans",Arial,sans-serif;color:#0F172A;font-size:12.5px;line-height:1.6;margin:0}.kepala{display:flex;gap:16px;align-items:center;padding-bottom:10px}' +
    '.kepala img{width:78px;height:78px}.kepala h1{font-size:17px;margin:0;color:#0B1D6B;letter-spacing:.02em}.kepala p{margin:2px 0 0;font-size:11.5px;color:#475569}.pelangi{height:5px;background:linear-gradient(90deg,#D9141B 0 25%,#F6D20F 25% 50%,#1E3BD1 50% 75%,#5B1F8C 75% 100%);border-radius:3px;margin-bottom:16px}' +
    '.ruj{text-align:right;font-size:12px;margin-bottom:14px}.tajuk{font-weight:800;text-decoration:underline;margin:14px 0;text-transform:uppercase}table{border-collapse:collapse;width:100%;margin:10px 0 14px}td{border:1px solid #CBD5E1;padding:6px 10px;vertical-align:top}td:first-child{width:34%;background:#F7F9FD;font-weight:700}' +
    'ol{padding-left:20px}ol li{margin-bottom:8px}.ttd{display:flex;justify-content:space-between;gap:30px;margin-top:40px}.ttd div{flex:1}.garis{border-top:1px dotted #0F172A;margin-top:44px;padding-top:4px;font-weight:700}' +
    '.potong{margin-top:34px;border-top:2px dashed #94A3B8;padding-top:14px}.potong h4{margin:0 0 8px;text-align:center;letter-spacing:.06em}.cetak{position:fixed;top:12px;right:12px}@media print{.cetak{display:none}}' +
    '.cetak button{font:inherit;font-weight:700;background:#1E3BD1;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}</style></head><body>' +
    '<div class="cetak"><button onclick="window.print()">🖨 Cetak / Simpan PDF</button></div>' +
    '<div class="kepala"><img src="' + LOGO_SEKOLAH + '" alt=""><div><h1>' + esc(sk.nama || 'SEKOLAH MENENGAH KEBANGSAAN ASAJAYA') + '</h1><p>' + esc(sk.alamat) + '</p><p>' + [sk.telefon ? 'Tel: ' + esc(sk.telefon) : '', sk.emel ? 'E-mel: ' + esc(sk.emel) : '', sk.kod ? 'Kod Sekolah: ' + esc(sk.kod) : ''].filter(Boolean).join(' · ') + '</p></div></div><div class="pelangi"></div>' +
    '<div class="ruj">Ruj. Kami: <b>' + esc(s.noRujukan) + '</b><br>Tarikh: <b>' + esc(tarikhPanjang(s.tarikhKeluar).split(', ')[1]) + '</b></div>' +
    '<div>Kepada:<br><b>' + esc(m.namaPenjaga || 'Ibu Bapa / Penjaga') + '</b><br>' + esc(m.alamat || '').replace(/,\s*/g, ',<br>') + '</div><p>Tuan/Puan,</p>' +
    '<div class="tajuk">' + esc(tajukPenuh) + '</div>' +
    '<table><tr><td>Nama Murid</td><td>' + esc(m.nama) + '</td></tr><tr><td>No. Kad Pengenalan</td><td>' + esc(m.nokp) + '</td></tr><tr><td>Kelas</td><td>' + esc(m.kelas) + '</td></tr>' +
    barisJadual + '</table>' +
    '<ol>' + perenggan.map(p => '<li>' + p + '</li>').join('') + '<li>Kerjasama dan perhatian tuan/puan dalam perkara ini amatlah dihargai.</li></ol><p>Sekian, terima kasih.</p><p><b>"BERAZAM, BERUSAHA, BERJAYA"</b></p><p>Saya yang menjalankan amanah,</p>' +
    '<div class="ttd"><div><div class="garis">' + esc(s.guruTingkatan || '') + '</div>Guru Tingkatan ' + esc(m.kelas) + '</div><div><div class="garis">' + esc(sk.pengetua || '') + '</div>Pengetua<br>' + esc(sk.nama || 'SMK Asajaya') + '</div></div>' +
    '<div class="potong"><h4>AKUAN PENERIMAAN SURAT (Sila kembalikan kepada Guru Tingkatan)</h4>Saya, ...................................................................... ibu bapa/penjaga kepada <b>' + esc(m.nama) + '</b> (' + esc(m.kelas) + ') mengaku telah menerima surat rujukan <b>' + esc(s.noRujukan) + '</b> dan memahami kandungannya.' +
    '<div class="ttd" style="margin-top:20px"><div><div class="garis">Tandatangan</div></div><div><div class="garis">Tarikh</div></div><div><div class="garis">No. Telefon</div></div></div></div>' +
    '</body></html>';
  const w = window.open('', '_blank');
  if (!w) { toast('Benarkan tetingkap timbul (pop-up) untuk mencetak surat.', 'gagal'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

      .map(t => '<button data-s="' + t[0] + '" class="' + (PM.status === t[0] ? 'aktif' : '') + '">' + ikon(t[2]) + t[1] + '</button>').join('') + '</div>' +

        '<button class="btn hantu kecil proses" data-id="' + esc(p.id) + '" data-k="DITOLAK">' + ikon('x') + 'Tolak</button><button class="btn hijau kecil proses" data-id="' + esc(p.id) + '" data-k="DILULUSKAN">' + ikon('check', 'bold') + 'Luluskan</button></div></div>').join('') + '</div>'

function ubahAmbangPK(peringkat) {
