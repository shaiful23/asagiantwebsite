<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Jana Kod QR Kelas - Sistem Kehadiran</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
  body{font-family:'Segoe UI',Roboto,-apple-system,sans-serif; background:#f1f5f9; margin:0; padding:24px;}
  h1{font-size:18px; margin:0 0 4px;}
  p.sub{color:#64748b; font-size:13px; margin:0 0 20px;}
  #senarai{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
  .kad{background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .kad h3{margin:10px 0 2px; font-size:16px;}
  .kad p{margin:0; font-size:12px; color:#64748b;}
  .qrimg{display:flex; justify-content:center; margin-top:6px;}
  button{background:#4f46e5; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer;}
  @media print { button, #btnCetak { display:none; } body{background:#fff;} .kad{break-inside:avoid; box-shadow:none;} }
</style>
</head>
<body>
  <h1><i class="fas fa-qrcode"></i> Kod QR Kehadiran Setiap Kelas</h1>
  <p class="sub">Cetak dan tampal kod QR ini di dalam setiap bilik darjah. Guru akan mengimbas kod ini untuk merekod kehadiran.</p>
  <button id="btnCetak" onclick="window.print()"><i class="fas fa-print mr-1"></i> Cetak Semua</button>
  <div id="senarai" style="margin-top:20px;"></div>

<script>
google.script.run.withSuccessHandler(function(senaraiKelas){
  const wrap = document.getElementById('senarai');
  if (!senaraiKelas.length){
    wrap.innerHTML = '<p>Tiada kelas dijumpai. Sila tambah data dalam Sheet "Kelas" dahulu.</p>';
    return;
  }
  senaraiKelas.forEach(function(k){
    if (!k.kodQR) return;
    const kandunganQR = 'KELAS:' + k.kodQR + (k.bilik ? '|BILIK:' + k.bilik : '');
    const kad = document.createElement('div');
    kad.className = 'kad';
    kad.innerHTML = '<div class="qrimg" id="qr_' + k.idKelas + '"></div>' +
      '<h3>' + k.namaKelas + '</h3><p>' + (k.bilik || '') + '</p>';
    wrap.appendChild(kad);
    new QRCode(document.getElementById('qr_' + k.idKelas), {
      text: kandunganQR, width: 160, height: 160
    });
  });
}).dapatkanSenaraiKelasUntukQR();
</script>
</body>
</html>
