<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Headcount STPM - SMK Asajaya</title>
<style>
  :root {
    --biru: #1e3a8a; --biru-terang: #2563eb; --hijau: #16a34a; --kuning: #ca8a04;
    --merah: #dc2626; --abu: #6b7280; --bg: #f3f4f6; --kad: #ffffff; --garis: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: #111827; }
  #loginBox { max-width: 380px; margin: 10vh auto; background: var(--kad); border-radius: 12px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  #loginBox h1 { font-size: 18px; text-align: center; color: var(--biru); margin-bottom: 4px; }
  #loginBox p.sub { text-align: center; color: var(--abu); margin-top: 0; margin-bottom: 24px; font-size: 13px; }
  input, select, textarea, button { font-family: inherit; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--garis); border-radius: 6px; margin-bottom: 12px; }
  label { font-size: 12px; color: var(--abu); font-weight: 600; display: block; margin-bottom: 4px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 9px 16px; font-weight: 600; background: var(--biru-terang); color: #fff; }
  button.sekunder { background: #fff; color: var(--biru-terang); border: 1px solid var(--biru-terang); }
  button.bahaya { background: var(--merah); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #mesejLogin { color: var(--merah); font-size: 13px; margin-top: -4px; margin-bottom: 10px; min-height: 16px; }

  #app { display: none; min-height: 100vh; }
  #sidebar { position: fixed; top:0; left:0; bottom:0; width: 220px; background: var(--biru); color: #fff; padding: 20px 0; overflow-y: auto; }
  #sidebar h2 { font-size: 14px; text-align: center; margin: 0 0 20px; padding: 0 12px; line-height: 1.4; }
  #sidebar .nav-item { padding: 11px 20px; cursor: pointer; font-size: 14px; opacity: .85; border-left: 3px solid transparent; }
  #sidebar .nav-item:hover { background: rgba(255,255,255,.08); }
  #sidebar .nav-item.aktif { background: rgba(255,255,255,.12); opacity: 1; border-left-color: #fff; font-weight: 600; }
  #sidebar .pengguna-info { padding: 12px 20px; font-size: 12px; opacity: .7; border-top: 1px solid rgba(255,255,255,.2); margin-top: 20px; }
  #sidebar .pengguna-info button { width: 100%; margin-top: 8px; }
  #main { margin-left: 220px; padding: 24px 28px; }
  #topbar { display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  #topbar h1 { font-size: 20px; margin: 0; }
  .kawalan { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kawalan select, .kawalan input { margin-bottom: 0; width: auto; min-width: 120px; }

  .grid-kad { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 20px; }
  .kad { background: var(--kad); border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .kad .nilai { font-size: 26px; font-weight: 700; color: var(--biru); }
  .kad .label { font-size: 12px; color: var(--abu); margin-top: 4px; }
  .kad.hijau .nilai { color: var(--hijau); } .kad.kuning .nilai { color: var(--kuning); } .kad.merah .nilai { color: var(--merah); }

  .panel { background: var(--kad); border-radius: 10px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .panel h3 { margin-top: 0; font-size: 15px; color: var(--biru); }
  .borang-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 0 12px; align-items: end; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--garis); white-space: nowrap; }
  th { color: var(--abu); font-weight: 600; background: #fafafa; position: sticky; top: 0; }
  tbody tr:hover { background: #f9fafb; }
  .tbl-scroll { overflow-x: auto; max-height: 480px; overflow-y: auto; }

  .lencana { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff; }
  .lencana.HIJAU, .lencana.SELAMAT, .lencana.AKTIF, .lencana.BERJAYA_MENINGKAT { background: var(--hijau); }
  .lencana.KUNING, .lencana.PERLU_PEMANTAUAN { background: var(--kuning); }
  .lencana.MERAH, .lencana.BERISIKO, .lencana.MASIH_GAGAL, .lencana.TIDAK_AKTIF { background: var(--merah); }
  .lencana.MENINGKAT { background: var(--hijau); } .lencana.MENURUN { background: var(--merah); }
  .lencana.KONSISTEN, .lencana.KEKAL { background: var(--abu); } .lencana.TIDAK_STABIL, .lencana.TIDAK_CUKUP_DATA { background: #9ca3af; }

  .tab-link { display:inline-block; padding: 6px 14px; border-radius: 20px; background: #eef2ff; color: var(--biru-terang); font-size: 13px; cursor: pointer; margin-right: 8px; margin-bottom: 12px; }
  .tab-link.aktif { background: var(--biru-terang); color: #fff; }
  .kecil { font-size: 12px; color: var(--abu); }
  .mesej { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  .mesej.jaya { background: #dcfce7; color: #166534; } .mesej.ralat { background: #fee2e2; color: #991b1b; }

  /* Toast makluman terapung — sentiasa kelihatan tanpa kira kedudukan scroll semasa. */
  #toastKontena { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .toast { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); opacity: 0; transform: translateY(-8px); transition: opacity .2s, transform .2s; }
  .toast.tampak { opacity: 1; transform: translateY(0); }
  .toast.jaya { background: var(--hijau); } .toast.ralat { background: var(--merah); }
  @media (max-width: 480px) { #toastKontena { left: 12px; right: 12px; top: 12px; max-width: none; } }
  .muatan { color: var(--abu); font-size: 13px; padding: 20px 0; text-align: center; }
  .aksi-link { color: var(--biru-terang); cursor: pointer; font-size: 12px; margin-right: 8px; }

  @media (max-width: 820px) {
    #sidebar { position: static; width: 100%; padding: 10px 0; }
    #sidebar h2 { display:none; }
    #sidebar .nav-container { display:flex; overflow-x:auto; }
    #sidebar .nav-item { border-left:none; border-bottom: 3px solid transparent; white-space:nowrap; }
    #sidebar .nav-item.aktif { border-bottom-color: #fff; }
    #sidebar .pengguna-info { display:none; }
    #main { margin-left: 0; padding: 16px; }
  }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="loginBox">
  <h1>SISTEM HEADCOUNT STPM</h1>
  <p class="sub">SMK Asajaya</p>
  <div id="mesejLogin"></div>
  <label>No. Kad Pengenalan</label>
  <input id="inNoKP" placeholder="cth. 900101011234">
  <label>PIN</label>
  <input id="inPIN" type="password" placeholder="PIN anda">
  <button id="btnLogin" style="width:100%">Log Masuk</button>
</div>

<!-- ======================= APP ======================= -->
<div id="app">
  <div id="sidebar">
    <h2>HEADCOUNT<br>STPM</h2>
    <div class="nav-container">
      <div class="nav-item" data-halaman="dashboard">Dashboard</div>
      <div class="nav-item" data-halaman="pelajar">Pelajar</div>
      <div class="nav-item" data-halaman="subjek">Mata Pelajaran</div>
      <div class="nav-item" data-halaman="bld">Skema Gred (BLD)</div>
      <div class="nav-item" data-halaman="headcount">Headcount</div>
      <div class="nav-item" data-halaman="ujian">Markah Ujian</div>
      <div class="nav-item" data-halaman="ulangan">Ulangan</div>
      <div class="nav-item" data-halaman="intervensi">Intervensi</div>
      <div class="nav-item" data-halaman="analisis">Analisis</div>
      <div class="nav-item" data-halaman="laporan">Laporan</div>
      <div class="nav-item" data-halaman="pengguna">Pengguna</div>
    </div>
    <div class="pengguna-info">
      <div id="infoNama"></div>
      <div id="infoPeranan" class="kecil"></div>
      <button class="sekunder" id="btnLogout">Log Keluar</button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <h1 id="tajukHalaman">Dashboard</h1>
      <div class="kawalan" id="kawalanGlobal"></div>
    </div>
    <div id="content"><div class="muatan">Memuatkan...</div></div>
  </div>
</div>

<div id="toastKontena"></div>

<script>
/* ======================= PEMALAR (selaras Config.gs) ======================= */
const MEDAN_HEADCOUNT = ['TOV', 'OTR1', 'AR1', 'OTR2', 'AR2', 'ETR', 'SEBENAR'];
const SEMESTER_HEADCOUNT = ['S1', 'S2', 'S3'];

/* ======================= STATE ======================= */
const S = {
  token: localStorage.getItem('hcstpm_token') || '',
  nama: '', peranan: '', skopSubjek: [],
  semester: 'S1',
  tahunSTPM: '', senaraiTahun: [],
  halaman: 'dashboard',
  cacheSubjek: [], cachePelajar: []
};

/* ======================= UTIL ======================= */
function panggil(fn) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success === false) reject(res.message || 'Ralat tidak diketahui.');
        else resolve(res);
      })
      .withFailureHandler(err => reject(err.message || String(err)))
      [fn].apply(null, Array.prototype.slice.call(arguments, 1));
  });
}
/* Toast terapung (kanan atas skrin) — dipanggil selepas SETIAP tindakan yang
   mengubah data (simpan/padam/daftar/dsb.), supaya makluman sentiasa
   kelihatan tanpa kira sejauh mana pengguna sudah scroll ke bawah halaman.
   Toast bertindan (tidak saling menimpa) jika beberapa tindakan berlaku pantas. */
function tunjukMesej(teks, jenis) {
  const kontena = document.getElementById('toastKontena');
  const el = document.createElement('div');
  el.className = 'toast ' + (jenis || 'jaya');
  el.textContent = teks;
  kontena.appendChild(el);
  requestAnimationFrame(() => el.classList.add('tampak'));
  setTimeout(() => {
    el.classList.remove('tampak');
    setTimeout(() => el.remove(), 250);
  }, 4500);
}
function escapeHtml(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function lencana(nilai) { return nilai ? '<span class="lencana ' + nilai + '">' + nilai.replace(/_/g,' ') + '</span>' : ''; }
function bolehUrus() { return ['ADMIN','GPK_TINGKATAN6','KETUA_AKADEMIK'].indexOf(S.peranan) !== -1; }
function bolehUrusBLD() { return bolehUrus() || S.peranan === 'KETUA_PANITIA'; }
/* Paparan konsisten "markah (gred)" — dipakai di semua jadual/borang headcount. */
function formatMG(markah, gred) {
  if (markah === '' || markah === undefined || markah === null) return gred ? escapeHtml(gred) : '-';
  return escapeHtml(markah) + (gred ? ' (' + escapeHtml(gred) + ')' : '');
}

/* ======================= ROSTER PELAJAR (kongsi: Headcount "Isi ETR" & tab "Markah Ujian") =======================
   Jadual senarai pelajar satu Subjek x Kelas, dengan medanBolehEdit (cth. ['ETR']
   atau ['AR1','AR2','SEBENAR']) dipaparkan sebagai input Markah; medan lain paparan
   sahaja (Markah (Gred)). Backend sentiasa punca pengiraan (MODUL 43) — selepas
   simpan, roster dimuat SEMULA supaya Gap/Trend/Risiko/Gred terbitan sentiasa tepat. */
function renderJadualRoster(senarai, medanBolehEdit) {
  const bolehEdit = m => medanBolehEdit.indexOf(m) !== -1;
  const sel = (r, m) => {
    if (bolehEdit(m)) {
      const nilaiMarkah = (r[m + '_Markah'] !== '' && r[m + '_Markah'] !== undefined) ? r[m + '_Markah'] : '';
      const gredSemasa = r[m + '_Gred'] || '';
      return '<input type="number" min="0" max="100" step="0.5" class="input-roster" style="width:64px;margin:0" ' +
        'data-id="' + escapeHtml(r.ID_Pelajar) + '" data-medan="' + m + '" value="' + escapeHtml(nilaiMarkah) + '"> ' +
        '<span class="kecil">' + (gredSemasa ? '(' + escapeHtml(gredSemasa) + ')' : '') + '</span>';
    }
    return formatMG(r[m + '_Markah'], r[m + '_Gred']);
  };
  return `<div class="tbl-scroll"><table><thead><tr>
    <th>Pelajar</th><th>TOV</th><th>OTR1</th><th>AR1</th><th>Gap1</th><th>OTR2</th><th>AR2</th><th>Gap2</th><th>ETR</th><th>Sebenar</th><th>Status</th><th>Trend</th><th>Risiko</th>
  </tr></thead><tbody>
    ${senarai.map(r => `<tr>
      <td>${escapeHtml(r.namaPelajar||r.ID_Pelajar)}</td>
      <td>${sel(r,'TOV')}</td><td>${sel(r,'OTR1')}</td><td>${sel(r,'AR1')}</td><td>${lencana(r.statusGap1)}</td>
      <td>${sel(r,'OTR2')}</td><td>${sel(r,'AR2')}</td><td>${lencana(r.statusGap2)}</td>
      <td>${sel(r,'ETR')}</td><td>${sel(r,'SEBENAR')}</td>
      <td>${lencana(r.statusGapETR)}</td><td>${lencana(r.trend)}</td><td>${lencana(r.risiko)}</td>
    </tr>`).join('') || '<tr><td colspan=13 class="kecil">Tiada pelajar berdaftar bagi subjek + kelas ini pada Tahun STPM semasa.</td></tr>'}
  </tbody></table></div>`;
}

/* Lampirkan auto-simpan "onblur" pada setiap input.input-roster dalam #idContainer.
   fnSimpan(idPelajar, medan, markah) mesti pulangkan Promise (rujuk panggil()). */
function pasangSimpanRoster(idContainer, fnSimpan, fnMuatSemula) {
  document.querySelectorAll('#' + idContainer + ' .input-roster').forEach(el => {
    const nilaiAsal = el.value;
    el.addEventListener('blur', () => {
      if (el.value === nilaiAsal) return;
      const idPelajar = el.dataset.id, medan = el.dataset.medan, markah = el.value;
      el.disabled = true;
      fnSimpan(idPelajar, medan, markah).then(() => {
        tunjukMesej('Markah ' + medan + ' disimpan.');
        fnMuatSemula();
      }).catch(err => { tunjukMesej(err, 'ralat'); el.disabled = false; });
    });
  });
}

/* ======================= LOGIN / SESI ======================= */
document.getElementById('btnLogin').addEventListener('click', login);
document.getElementById('inPIN').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

function login() {
  const nokp = document.getElementById('inNoKP').value.trim();
  const pin = document.getElementById('inPIN').value.trim();
  const mesej = document.getElementById('mesejLogin');
  mesej.textContent = '';
  if (!nokp || !pin) { mesej.textContent = 'Sila isi No. KP dan PIN.'; return; }

  document.getElementById('btnLogin').disabled = true;
  panggil('apiLogin', { nokp, pin }).then(res => {
    S.token = res.token; S.nama = res.nama; S.peranan = res.peranan;
    S.skopSubjek = res.skopSubjek ? String(res.skopSubjek).split(',').map(s=>s.trim()).filter(Boolean) : [];
    localStorage.setItem('hcstpm_token', S.token);
    mulakanApp();
  }).catch(err => {
    mesej.textContent = err;
    document.getElementById('btnLogin').disabled = false;
  });
}

function semakSesiSediaAda() {
  if (!S.token) { document.getElementById('loginBox').style.display = 'block'; return; }
  panggil('apiSemakSesi', { token: S.token }).then(res => {
    S.nama = res.nama; S.peranan = res.peranan;
    S.skopSubjek = res.skopSubjek ? String(res.skopSubjek).split(',').map(s=>s.trim()).filter(Boolean) : [];
    mulakanApp();
  }).catch(() => {
    localStorage.removeItem('hcstpm_token'); S.token = '';
    document.getElementById('loginBox').style.display = 'block';
  });
}

document.getElementById('btnLogout').addEventListener('click', () => {
  panggil('apiLogout', { token: S.token }).finally(() => {
    localStorage.removeItem('hcstpm_token');
    location.reload();
  });
});

function mulakanApp() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('infoNama').textContent = S.nama;
  document.getElementById('infoPeranan').textContent = S.peranan.replace(/_/g,' ');
  if (S.peranan !== 'ADMIN') document.querySelector('.nav-item[data-halaman="pengguna"]').style.display = 'none';
  if (S.peranan === 'GURU') document.querySelector('.nav-item[data-halaman="bld"]').style.display = 'none';
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => tukarHalaman(el.dataset.halaman));
  });

  panggil('apiSenaraiTahunSTPM', { token: S.token }).then(res => {
    S.senaraiTahun = res.senarai;
    S.tahunSTPM = (res.tahunAktif && res.senarai.indexOf(res.tahunAktif) !== -1) ? res.tahunAktif : (res.senarai[0] || '');
  }).catch(() => {}).finally(() => tukarHalaman('dashboard'));
}

function tukarHalaman(nama) {
  S.halaman = nama;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('aktif', el.dataset.halaman === nama));
  const tajuk = { dashboard:'Dashboard', pelajar:'Pelajar', subjek:'Mata Pelajaran', bld:'Skema Gred (BLD)', headcount:'Headcount',
    ujian:'Markah Ujian', ulangan:'Ulangan Semester', intervensi:'Intervensi', analisis:'Analisis', laporan:'Laporan', pengguna:'Pengguna & Peranan' };
  document.getElementById('tajukHalaman').textContent = tajuk[nama] || nama;
  document.getElementById('content').innerHTML = '<div class="muatan">Memuatkan...</div>';
  document.getElementById('kawalanGlobal').innerHTML = '';
  const fn = { dashboard: muatDashboard, pelajar: muatPelajar, subjek: muatSubjek, bld: muatBLD, headcount: muatHeadcount,
    ujian: muatUjian, ulangan: muatUlangan, intervensi: muatIntervensi, analisis: muatAnalisis, laporan: muatLaporan, pengguna: muatPengguna }[nama];
  if (fn) fn();
}

/* ======================= PILIHAN SEMESTER (kawalan global) ======================= */
function pilihanSemesterHtml() {
  return '<select id="pilihSemester">' +
    ['S1','S2','S3'].map(s => '<option value="'+s+'"' + (s===S.semester?' selected':'') + '>Semester ' + s.slice(1) + '</option>').join('') +
    '</select>';
}
function pasangPilihanSemester(callback) {
  const el = document.getElementById('pilihSemester');
  if (el) el.addEventListener('change', () => { S.semester = el.value; callback(); });
}

/* ======================= PILIHAN TAHUN STPM / BATCH (kawalan global) =======================
   Membolehkan beberapa kohort (cth. calon STPM 2026 dan 2027) wujud serentak dalam sistem
   tanpa data bercampur — setiap paparan/laporan ditapis ikut S.tahunSTPM semasa. */
function pilihanTahunHtml() {
  const opsyen = ['<option value="">Semua Tahun</option>'].concat(
    S.senaraiTahun.map(t => '<option value="'+t+'"' + (t===S.tahunSTPM?' selected':'') + '>Tahun STPM '+t+'</option>')
  );
  return '<select id="pilihTahun">' + opsyen.join('') + '</select>';
}
function pasangPilihanTahun(callback) {
  const el = document.getElementById('pilihTahun');
  if (el) el.addEventListener('change', () => { S.tahunSTPM = el.value; callback(); });
}

/* ======================= DASHBOARD (MODUL 15/16/17/40) ======================= */
function muatDashboard() {
  document.getElementById('kawalanGlobal').innerHTML = pilihanSemesterHtml() + pilihanTahunHtml();
  pasangPilihanSemester(muatDashboard);
  pasangPilihanTahun(muatDashboard);

  const fn = bolehUrus() ? 'apiDashboardGPK' : 'apiDashboardGuru';
  panggil(fn, { token: S.token, semester: S.semester, tahunSTPM: S.tahunSTPM }).then(res => {
    if (bolehUrus()) renderDashboardGPK(res); else renderDashboardGuru(res);
  }).catch(err => renderRalat(err));
}

function renderDashboardGPK(d) {
  document.getElementById('content').innerHTML = `
    <div class="grid-kad">
      <div class="kad"><div class="nilai">${d.jumlahCalon}</div><div class="label">Jumlah Calon</div></div>
      <div class="kad"><div class="nilai">${d.jumlahSubjek}</div><div class="label">Jumlah Subjek</div></div>
      <div class="kad"><div class="nilai">${d.gpsSemasa ?? '-'}</div><div class="label">GPS Semasa (sasaran ${d.sasaranGPS})</div></div>
      <div class="kad"><div class="nilai">${d.gapGPS ?? '-'}</div><div class="label">Gap GPS</div></div>
      <div class="kad"><div class="nilai">${d.pngkPurata ?? '-'}</div><div class="label">PNGK Purata</div></div>
      <div class="kad hijau"><div class="nilai">${d.bilanganHijau}</div><div class="label">Pelajar Hijau</div></div>
      <div class="kad kuning"><div class="nilai">${d.bilanganKuning}</div><div class="label">Pelajar Kuning</div></div>
      <div class="kad merah"><div class="nilai">${d.bilanganMerah}</div><div class="label">Pelajar Merah</div></div>
      <div class="kad"><div class="nilai">${d.bilanganUlanganS1}</div><div class="label">Ulangan S1</div></div>
      <div class="kad"><div class="nilai">${d.bilanganUlanganS2}</div><div class="label">Ulangan S2</div></div>
    </div>
    <div class="panel">
      <h3>Subjek Kritikal (peratus status Merah tertinggi)</h3>
      <div class="tbl-scroll"><table><thead><tr><th>Subjek</th><th>% Merah</th></tr></thead><tbody>
        ${d.subjekKritikal.map(s => '<tr><td>'+escapeHtml(s.kodSubjek)+'</td><td>'+s.peratusMerah+'%</td></tr>').join('') || '<tr><td colspan=2 class="kecil">Tiada data.</td></tr>'}
      </tbody></table></div>
    </div>`;

/* ======================= SKEMA GRED / BLD (khusus setiap subjek x semester) ======================= */
function muatBLD() {
  document.getElementById('kawalanGlobal').innerHTML = pilihanSemesterHtml();
  pasangPilihanSemester(muatBLD);

  Promise.all([
    panggil('apiSenaraiSubjek', { token: S.token }),
    panggil('apiSenaraiBLD', { token: S.token, semester: S.semester })
  ]).then(([subjekRes, bldRes]) => renderBLD(subjekRes.senarai, bldRes.senarai, bldRes.senaraiGred)).catch(renderRalat);
}

function renderBLD(senaraiSubjek, senaraiBLD, senaraiGred) {
  S.cacheSubjek = senaraiSubjek;
  const kumpulan = {};
  senaraiBLD.forEach(b => { (kumpulan[b.KodSubjek] = kumpulan[b.KodSubjek] || []).push(b); });
  const opsyenSubjek = senaraiSubjek.map(s=>'<option value="'+s.KodSubjek+'">'+escapeHtml(s.KodSubjek)+' - '+escapeHtml(s.NamaSubjek)+'</option>').join('');
  const opsyenSemester = SEMESTER_HEADCOUNT.map(sem => '<option value="'+sem+'"'+(sem===S.semester?' selected':'')+'>'+sem+'</option>').join('');

  const borangUrus = bolehUrusBLD() ? `
    <div class="panel">
      <h3>Tambah / Kemaskini Julat Markah — Semester ${S.semester.slice(1)}</h3>
      <p class="kecil">Setiap mata pelajaran ada BLD sendiri BAGI SETIAP SEMESTER (S1, S2, S3 boleh ada julat markah berbeza untuk subjek yang sama). Julat tidak boleh bertindih dalam subjek+semester yang sama.</p>
      <div class="borang-grid">
        <div><label>Kod Subjek</label><select id="bKodSubjek">${opsyenSubjek}</select></div>
        <div><label>Gred</label><select id="bGred">${senaraiGred.map(g=>'<option>'+g+'</option>').join('')}</select></div>
        <div><label>Markah Min</label><input id="bMin" type="number" min="0" max="100" step="0.5"></div>
        <div><label>Markah Max</label><input id="bMax" type="number" min="0" max="100" step="0.5"></div>
      </div>
      <p class="kecil">Disimpan untuk Semester <b>${S.semester.slice(1)}</b> (tukar pemilih Semester di atas jika perlu tetapkan semester lain).</p>
      <button id="btnSimpanBLD">Simpan Julat</button>
    </div>
    <div class="panel">
      <h3>Salin BLD</h3>
      <p class="kecil">Salin BLD antara subjek dan/atau antara semester (cth. tetapkan BLD Semester 1 dahulu, salin sebagai titik permulaan untuk Semester 2, kemudian laraskan).</p>
      <div class="borang-grid">
        <div><label>Salin Dari (Subjek)</label><select id="bSumberSubjek">${opsyenSubjek}</select></div>
        <div><label>Salin Dari (Semester)</label><select id="bSumberSemester">${opsyenSemester}</select></div>
        <div><label>Salin Ke (Subjek)</label><select id="bDestinasiSubjek">${opsyenSubjek}</select></div>
        <div><label>Salin Ke (Semester)</label><select id="bDestinasiSemester">${opsyenSemester}</select></div>
      </div>
      <button class="sekunder" id="btnSalinBLD">Salin BLD (gantikan destinasi)</button>
    </div>` : '';

  document.getElementById('content').innerHTML = borangUrus +
    `<div id="senaraiBLDSubjek">${senaraiSubjek.map(s => renderJadualBLDSubjek(s, kumpulan[s.KodSubjek] || [])).join('')}</div>`;

  if (!bolehUrusBLD()) return;

  document.getElementById('btnSimpanBLD').addEventListener('click', () => {
    panggil('apiSimpanBLD', {
      token: S.token, kodSubjek: document.getElementById('bKodSubjek').value, semester: S.semester,
      gred: document.getElementById('bGred').value,
      markahMin: document.getElementById('bMin').value, markahMax: document.getElementById('bMax').value
    }).then(() => { tunjukMesej('Julat BLD disimpan.'); muatBLD(); }).catch(err => tunjukMesej(err, 'ralat'));
  });

  document.getElementById('btnSalinBLD').addEventListener('click', () => {
    const sumberSubjek = document.getElementById('bSumberSubjek').value, sumberSemester = document.getElementById('bSumberSemester').value;
    const destinasiSubjek = document.getElementById('bDestinasiSubjek').value, destinasiSemester = document.getElementById('bDestinasiSemester').value;
    if (sumberSubjek === destinasiSubjek && sumberSemester === destinasiSemester) { tunjukMesej('Sumber dan destinasi tidak boleh sama.', 'ralat'); return; }
    if (!confirm('Ini akan GANTIKAN BLD sedia ada bagi ' + destinasiSubjek + ' (' + destinasiSemester + '). Teruskan?')) return;
    panggil('apiSalinBLD', {
      token: S.token, kodSubjekSumber: sumberSubjek, semesterSumber: sumberSemester,
      kodSubjekDestinasi: destinasiSubjek, semesterDestinasi: destinasiSemester
    }).then(() => { tunjukMesej('BLD disalin.'); muatBLD(); }).catch(err => tunjukMesej(err, 'ralat'));
  });
}

function renderJadualBLDSubjek(subjek, senaraiJulat) {
  senaraiJulat = senaraiJulat.slice().sort((a, b) => Number(b.MarkahMin) - Number(a.MarkahMin));
  return `<div class="panel">
    <h3>${escapeHtml(subjek.KodSubjek)} — ${escapeHtml(subjek.NamaSubjek)} <span class="kecil">(Semester ${S.semester.slice(1)})</span></h3>
    <div class="tbl-scroll"><table><thead><tr><th>Gred</th><th>Markah Min</th><th>Markah Max</th>${bolehUrusBLD()?'<th></th>':''}</tr></thead>
    <tbody>${senaraiJulat.map(b => `<tr><td><b>${escapeHtml(b.Gred)}</b></td><td>${escapeHtml(b.MarkahMin)}</td><td>${escapeHtml(b.MarkahMax)}</td>
      ${bolehUrusBLD() ? '<td><span class="aksi-link" onclick="padamBLD(\''+subjek.KodSubjek+'\',\''+b.Gred+'\')">Padam</span></td>' : ''}</tr>`).join('')
      || '<tr><td colspan="'+(bolehUrusBLD()?4:3)+'" class="kecil">BLD belum ditetapkan untuk subjek ini pada semester ini — guru tidak boleh key-in markah sehingga ini disiapkan.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function padamBLD(kodSubjek, gred) {
  if (!confirm('Padam julat gred ' + gred + ' bagi ' + kodSubjek + ' (' + S.semester + ')?')) return;
  panggil('apiPadamBLD', { token: S.token, kodSubjek, semester: S.semester, gred })
    .then(() => { tunjukMesej('Julat dipadam.'); muatBLD(); }).catch(err => tunjukMesej(err, 'ralat'));

    selKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>' + res.senarai.map(k=>'<option value="'+escapeHtml(k)+'">'+escapeHtml(k)+'</option>').join('');

function muatRosterETR() {

/* Feature 1 (butang paparan): "Ikut Subjek" / "Ikut Kelas" bagi jadual keseluruhan. */
function muatAggregateHeadcount() {
  document.getElementById('aggregateHeadcount').innerHTML = '<div class="muatan">Memuatkan...</div>';
  panggil('apiDapatkanHeadcount', { token: S.token, semester: S.semester, tahunSTPM: S.tahunSTPM }).then(res => {
    document.getElementById('aggregateHeadcount').innerHTML = renderAggregateHeadcount(res.senarai, S.viewHeadcount);
  }).catch(err => { document.getElementById('aggregateHeadcount').innerHTML = '<div class="mesej ralat">'+escapeHtml(err)+'</div>'; });
}

function renderAggregateHeadcount(senarai, ikut) {
  if (!senarai.length) return '<p class="kecil">Tiada rekod.</p>';
  const medanKumpul = ikut === 'kelas' ? 'kelas' : 'KodSubjek';
  const kumpulan = {};
  senarai.forEach(r => { const k = r[medanKumpul] || '-'; (kumpulan[k] = kumpulan[k] || []).push(r); });

  return Object.keys(kumpulan).sort().map(kunci => `
    <h4 style="margin:16px 0 8px">${ikut==='kelas'?'Kelas':'Subjek'}: ${escapeHtml(kunci)} <span class="kecil">(${kumpulan[kunci].length} rekod)</span></h4>
    <div class="tbl-scroll"><table><thead><tr>
      <th>Pelajar</th><th>${ikut==='kelas'?'Subjek':'Kelas'}</th><th>TOV</th><th>OTR1</th><th>AR1</th><th>Gap1</th><th>OTR2</th><th>AR2</th><th>Gap2</th><th>ETR</th><th>Sebenar</th><th>Status</th><th>Trend</th><th>Risiko</th>
    </tr></thead><tbody>
      ${kumpulan[kunci].map(r => `<tr>
        <td>${escapeHtml(r.namaPelajar||r.ID_Pelajar)}</td><td>${escapeHtml(ikut==='kelas'?r.KodSubjek:r.kelas)}</td>
        <td>${formatMG(r.TOV_Markah, r.TOV_Gred)}</td><td>${formatMG(r.OTR1_Markah, r.OTR1_Gred)}</td><td>${formatMG(r.AR1_Markah, r.AR1_Gred)}</td><td>${lencana(r.statusGap1)}</td>
        <td>${formatMG(r.OTR2_Markah, r.OTR2_Gred)}</td><td>${formatMG(r.AR2_Markah, r.AR2_Gred)}</td><td>${lencana(r.statusGap2)}</td>
        <td>${formatMG(r.ETR_Markah, r.ETR_Gred)}</td><td>${formatMG(r.SEBENAR_Markah, r.SEBENAR_Gred)}</td>
        <td>${lencana(r.statusGapETR)}</td><td>${lencana(r.trend)}</td><td>${lencana(r.risiko)}</td>
      </tr>`).join('')}
    </tbody></table></div>`).join('');
}

function muatAnalisis() {
  document.getElementById('kawalanGlobal').innerHTML = pilihanSemesterHtml() + pilihanTahunHtml();
  pasangPilihanSemester(() => { if (S.subAnalisis !== 'whatif') muatHighImpact(); });

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <span class="tab-link aktif" data-sub="highimpact">Pelajar Impak Tinggi</span>
      <span class="tab-link" data-sub="whatif">Simulasi What-If</span>

  document.querySelectorAll('#content .tab-link').forEach(el => el.addEventListener('click', () => {

    <div class="panel">
      <h3>Jana Laporan</h3>
      ${Object.keys(JENIS_LAPORAN_LABEL).map(j => '<span class="tab-link" data-jenis="'+j+'">'+JENIS_LAPORAN_LABEL[j]+'</span>').join('')}
    </div>
    <div id="hasilLaporan"></div>`;
  S.laporanAktif = '';
  document.querySelectorAll('#content .tab-link').forEach(el => el.addEventListener('click', () => janaLaporan(el.dataset.jenis, el)));
}

function janaLaporan(jenis, elKlik) {
  S.laporanAktif = jenis;
  document.querySelectorAll('#content .tab-link').forEach(el => el.classList.toggle('aktif', el === elKlik));
  document.getElementById('hasilLaporan').innerHTML = '<div class="muatan">Menjana laporan...</div>';
  panggil('apiJanaLaporan', { token: S.token, jenis, semester: S.semester, tahunSTPM: S.tahunSTPM }).then(res => {
    if (!res.baris.length) { document.getElementById('hasilLaporan').innerHTML = '<div class="panel kecil">Tiada data untuk laporan ini.</div>'; return; }
    const lajur = Object.keys(res.baris[0]);
    document.getElementById('hasilLaporan').innerHTML = `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3>${JENIS_LAPORAN_LABEL[jenis]} (${res.baris.length} baris)</h3>
          <button id="btnEksportCSV">Eksport CSV</button>
        </div>
        <div class="tbl-scroll"><table><thead><tr>${lajur.map(l=>'<th>'+l+'</th>').join('')}</tr></thead>
        <tbody>${res.baris.map(b => '<tr>'+lajur.map(l=>'<td>'+escapeHtml(b[l])+'</td>').join('')+'</tr>').join('')}</tbody></table></div>
      </div>`;
    document.getElementById('btnEksportCSV').addEventListener('click', () => eksportCSV(jenis, lajur, res.baris));
  }).catch(err => { document.getElementById('hasilLaporan').innerHTML = '<div class="mesej ralat">'+escapeHtml(err)+'</div>'; });
}

function eksportCSV(jenis, lajur, baris) {
  const escapeCsv = v => { const s = String(v===undefined||v===null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const isiCsv = [lajur.join(',')].concat(baris.map(b => lajur.map(l => escapeCsv(b[l])).join(','))).join('\n');
  const blob = new Blob([isiCsv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = jenis + '_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  tunjukMesej('Fail CSV dimuat turun.');
}

/* ======================= PENGGUNA (MODUL 1, ADMIN sahaja) ======================= */
function muatPengguna() {
  if (S.peranan !== 'ADMIN') { renderRalat('Hanya ADMIN boleh mengurus pengguna.'); return; }
  panggil('apiSenaraiPengguna', { token: S.token }).then(renderPengguna).catch(renderRalat);
}

function renderPengguna(res) {
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <h3>Tambah / Kemaskini Pengguna</h3>
      <div class="borang-grid">
        <div><label>No. KP</label><input id="uNoKP"></div>
        <div><label>Nama Penuh</label><input id="uNama"></div>
        <div><label>Peranan</label><select id="uPeranan">
          <option value="ADMIN">ADMIN</option><option value="GPK_TINGKATAN6">GPK TINGKATAN 6</option>
          <option value="KETUA_AKADEMIK">KETUA AKADEMIK</option><option value="KETUA_PANITIA">KETUA PANITIA</option>
          <option value="GURU">GURU</option></select></div>
        <div><label>Skop Subjek (jika Guru/Ketua Panitia, kod dipisah koma)</label><input id="uSkop" placeholder="cth. PA,BM"></div>
        <div><label>PIN (kosong jika kekal)</label><input id="uPIN"></div>
        <div><label>Status</label><select id="uStatus2"><option>AKTIF</option><option>TIDAK_AKTIF</option></select></div>
      </div>
      <button id="btnSimpanPengguna">Simpan Pengguna</button>
    </div>
    <div class="panel"><h3>Senarai Pengguna (${res.senarai.length})</h3>
    <div class="tbl-scroll"><table><thead><tr><th>No. KP</th><th>Nama</th><th>Peranan</th><th>Skop</th><th>Status</th></tr></thead>
    <tbody>${res.senarai.map(u => `<tr><td>${escapeHtml(u.nokp)}</td><td>${escapeHtml(u.nama)}</td><td>${escapeHtml(u.peranan)}</td><td>${escapeHtml(u.skopSubjek)}</td><td>${lencana(u.status)}</td></tr>`).join('')}</tbody></table></div></div>`;

  document.getElementById('btnSimpanPengguna').addEventListener('click', () => {
    panggil('apiSimpanPengguna', {
      token: S.token, nokp: document.getElementById('uNoKP').value, nama: document.getElementById('uNama').value,
      peranan: document.getElementById('uPeranan').value, skopSubjek: document.getElementById('uSkop').value,
      pin: document.getElementById('uPIN').value, status: document.getElementById('uStatus2').value
    }).then(() => { tunjukMesej('Pengguna disimpan.'); muatPengguna(); }).catch(err => tunjukMesej(err, 'ralat'));
  });
}
