<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Murid Rumah Sukan - SMK Asajaya</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- Portal Murid. Ganti URL di bawah dengan URL Web App (/exec) selepas deploy (kekalkan ?portal=murid). Rujuk apps-script/rumah-sukan/README.md -->
    <iframe src="https://script.google.com/macros/s/AKfycbwllAeCnGWsp4LB03BsmWXf75kyT_h-4mj05c88g0Lk4MmA4kg4WfoFxYZ4WpkAabP9/exec?portal=murid"></iframe>
    <script>
        // Butang "Tutup Portal" dalam Sistem Rumah Sukan menghantar isyarat closePortal; cuba tutup tab ini.
        // Jika pelayar tidak membenarkan, sistem sendiri memaparkan skrin "Portal Telah Ditutup".
        window.addEventListener('message', function (ev) {
            var d = ev.data || {};
            if (!/(^|\.)(googleusercontent\.com|script\.google\.com)$/.test(String(ev.origin).replace(/^https:\/\//, ''))) return;
            if (d === 'closePortal' || d.type === 'closePortal' || d.action === 'closePortal') {
                try { window.close(); } catch (e) { /* abaikan */ }
            }
        });
    </script>
</body>
</html>
