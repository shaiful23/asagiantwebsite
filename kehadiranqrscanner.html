  #statusTeks { text-align:center; color:var(--teks-2); font-size:13px; margin:10px 0 0; }
  .baris-manual { display:flex; gap:8px; margin-top:12px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:11px 16px; font:inherit; font-weight:700; cursor:pointer; background:var(--biru); color:#fff; white-space:nowrap; }
  .btn:disabled { opacity:.55; } .btn.penuh { width:100%; } .btn.kuning { background:var(--kuning); color:var(--navy-800); } .btn.hantu { background:#fff; color:var(--teks); border:1.5px solid var(--sempadan); }
  .btn.kecil { padding:7px 12px; font-size:13px; }
  .putar { width:16px; height:16px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:p .7s linear infinite; display:inline-block; } @keyframes p { to { transform:rotate(360deg); } }
  .kelas-kepala { display:flex; gap:12px; align-items:center; }
  .kelas-kepala .lencana-kelas { width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#fff; background:linear-gradient(135deg,var(--navy-700),var(--biru)); flex-shrink:0; }
  .kelas-kepala h3 { margin:0; font-size:19px; font-weight:800; }
  .info { display:flex; gap:10px; padding:10px 12px; border-radius:12px; font-size:13px; margin-top:12px; }

<header>
  <div class="baris"><img id="logo" alt="Logo SMK Asajaya"><div><b>e-KEHADIRAN · SMK ASAJAYA</b><small id="infoPengguna">Imbas QR Kelas</small></div></div>
  <div class="pelangi"></div>
</header>
<main>
  <div id="aksesTidakSah" class="kad hidden" style="text-align:center">

    <h2 style="justify-content:center">Akses Tidak Sah</h2>
    <p class="sub">Buka pengimbas ini melalui butang <b>“Buka Pengimbas Kamera”</b> di menu <b>Imbas QR Kelas</b> dalam portal e-Kehadiran.</p>

  <section id="skrinImbas" class="kad">
    <h2><i class="ph-fill ph-qr-code"></i>Imbas Kod QR Kelas</h2>
    <p class="sub">Halakan kamera ke kod QR yang ditampal di dalam kelas.</p>
    <div id="qr-reader"></div>
    <p id="statusTeks">Menghidupkan kamera…</p>
    <div class="baris-manual"><input id="kodManual" class="input" placeholder="Atau taip kod kelas (cth: 5ALP)"><button id="btnManual" class="btn hantu"><i class="ph ph-arrow-right"></i></button></div>
  </section>

  <section id="skrinBorang" class="hidden"></section>
  <section id="skrinHasil" class="kad hidden"></section>
</main>
<div id="barBawah" class="bar-bawah hidden"><div class="dalam"><div class="kira"><b id="kHadir">0</b> hadir · <b id="kTidak" style="color:#FCA5A5">0</b> tidak</div>
  <button id="btnSimpan" class="btn kuning"><i class="ph-bold ph-floppy-disk"></i>Simpan Kehadiran</button></div></div>

const P = new URLSearchParams(location.search);
const TOKEN = P.get('token') || '', NAMA = P.get('nama') || '', EXEC = P.get('exec') || '';
const $ = s => document.querySelector(s);
document.getElementById('logo').src = LOGO_SEKOLAH;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function inisial(n) { return String(n || '?').replace(/\b(BIN|BINTI|ANAK|A\/L|A\/P)\b/gi, '').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase(); }
function avatar(n, g) { return g ? '<img class="avatar" src="' + esc(g) + '" referrerpolicy="no-referrer" alt="" onerror="this.outerHTML=\'<span class=&quot;avatar&quot;>' + esc(inisial(n)) + '</span>\'">' : '<span class="avatar">' + esc(inisial(n)) + '</span>'; }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }

if (!TOKEN || !EXEC || !/^https:\/\/script\.google(usercontent)?\.com\//.test(EXEC)) {
  $('#aksesTidakSah').classList.remove('hidden'); $('#skrinImbas').classList.add('hidden');
  throw new Error('Parameter URL tidak sah.');
}
$('#infoPengguna').textContent = NAMA ? 'Log masuk: ' + NAMA : 'Imbas QR Kelas';

function jsonp(action, param, ms) {
  return new Promise((selesai, gagal) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e5), s = document.createElement('script');
    let tamat = false;
    const bersih = () => { delete window[cb]; s.remove(); clearTimeout(pemasa); };
    window[cb] = d => { if (tamat) return; tamat = true; bersih(); selesai(d); };
    s.onerror = () => { if (tamat) return; tamat = true; bersih(); gagal(new Error('Gagal sambung ke pelayan.')); };
    const pemasa = setTimeout(() => { if (tamat) return; tamat = true; bersih(); gagal(new Error('Pelayan lambat memberi respons. Cuba lagi.')); }, ms || 20000);
    let url = EXEC + '?apiAction=' + encodeURIComponent(action) + '&token=' + encodeURIComponent(TOKEN);
    Object.keys(param || {}).forEach(k => { url += '&' + k + '=' + encodeURIComponent(param[k]); });
    s.src = url + '&callback=' + cb;
    document.body.appendChild(s);
  });
}

/* ------------------------------ KAMERA ------------------------------ */
let pengimbas = null, sibuk = false, DATA = null;
function mulaKamera() {
  $('#statusTeks').textContent = 'Menghidupkan kamera…';
  if (typeof Html5Qrcode === 'undefined') { $('#statusTeks').textContent = 'Pustaka pengimbas gagal dimuat. Guna kod kelas manual di bawah.'; return; }
  pengimbas = new Html5Qrcode('qr-reader');
  const cfg = { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1 };
  pengimbas.start({ facingMode: 'environment' }, cfg, t => diimbas(t.trim()), () => {})
    .then(() => { $('#statusTeks').textContent = 'Sedia — halakan kamera ke kod QR kelas.'; })
    .catch(() => Html5Qrcode.getCameras().then(c => {
      if (!c || !c.length) throw new Error('tiada');
      return pengimbas.start(c[0].id, cfg, t => diimbas(t.trim()), () => {}).then(() => { $('#statusTeks').textContent = 'Sedia — halakan kamera ke kod QR kelas.'; });
    }).catch(() => { pengimbas = null; $('#statusTeks').innerHTML = '<b style="color:var(--merah)">Kamera tidak dapat diakses.</b> Benarkan akses kamera, atau taip kod kelas di bawah.'; }));
}
function hentiKamera() {
  if (!pengimbas) return;
  const p = pengimbas; pengimbas = null;
  try { Promise.resolve(p.stop()).then(() => p.clear()).catch(() => {}); } catch (e) { try { p.clear(); } catch (e2) { /* kamera tidak berjalan */ } }
}

function diimbas(teks) {
  if (sibuk) return;
  if (teks.toUpperCase().indexOf('KELAS:') !== 0) { $('#statusTeks').textContent = 'Kod QR ini bukan kod QR kelas e-Kehadiran.'; return; }
  sibuk = true; hentiKamera();
  $('#statusTeks').innerHTML = '<span class="putar" style="border-color:rgba(30,59,209,.2);border-top-color:var(--biru)"></span> Mengesahkan kelas…';
  jsonp('imbasKelas', { kod: teks }).then(r => {
    sibuk = false;
    if (!r.success) { tunjukRalat(r.message); return; }
    DATA = r; lukisBorang();
  }).catch(e => { sibuk = false; tunjukRalat(e.message); });
}
$('#btnManual').onclick = () => { const k = $('#kodManual').value.trim(); if (k) diimbas('KELAS:' + k); };
$('#kodManual').onkeydown = e => { if (e.key === 'Enter') $('#btnManual').click(); };

function tunjukRalat(mesej) {
  $('#skrinImbas').classList.add('hidden'); $('#skrinBorang').classList.add('hidden'); $('#barBawah').classList.add('hidden');
  const h = $('#skrinHasil'); h.classList.remove('hidden');
  h.innerHTML = '<div class="hasil"><i class="ph-fill ph-x-circle besar" style="color:var(--merah)"></i><h3>Tidak berjaya</h3><p class="sub">' + esc(mesej) + '</p><br><button class="btn" onclick="imbasSemula()"><i class="ph ph-camera"></i>Imbas Semula</button></div>';
}
function imbasSemula() {
  DATA = null; $('#skrinHasil').classList.add('hidden'); $('#skrinBorang').classList.add('hidden'); $('#barBawah').classList.add('hidden');
  $('#skrinImbas').classList.remove('hidden'); $('#kodManual').value = ''; window.scrollTo(0, 0); mulaKamera();
}

/* ------------------------------ BORANG ------------------------------ */
function pilihanSebab(pilih) {
  const k = {}; DATA.sebab.forEach(s => { (k[s.kategori || 'Lain-lain'] = k[s.kategori || 'Lain-lain'] || []).push(s); });
  return '<option value="">— Pilih sebab tidak hadir —</option>' + Object.keys(k).map(g => '<optgroup label="' + esc(g) + '">' +
    k[g].map(s => '<option value="' + esc(s.kod) + '"' + (String(s.kod) === String(pilih) ? ' selected' : '') + '>' + esc(s.sebab) + '</option>').join('') + '</optgroup>').join('');
}
function lukisBorang() {
  const d = DATA;
  const senaraiSubjek = Array.from(new Set([d.subjekCadangan].concat(d.subjekSaya, d.senaraiSubjek).filter(Boolean)));
  let info = '';
  if (d.teachIn) info = '<div class="info ungu"><i class="ph-fill ph-swap"></i><div><b>Kelas teach-in dikesan</b> (e-Teach-In) — menggantikan ' + esc(d.teachIn.guruAsal || 'guru asal') + '.</div></div>';
  else if (d.jadual && d.jadual.milikSaya) info = '<div class="info biru"><i class="ph-fill ph-calendar-check"></i><div>Sepadan dengan jadual anda: <b>' + esc(d.jadual.subjek) + '</b>.</div></div>';
  else if (d.jadual) info = '<div class="info kuning"><i class="ph-fill ph-warning"></i><div>Jadual asal slot ini: <b>' + esc(d.jadual.subjek) + '</b> oleh ' + esc(d.jadual.guru) + '. Sahkan jenis kehadiran anda.</div></div>';
  else info = '<div class="info kuning"><i class="ph-fill ph-info"></i><div>' + (d.slot ? 'Tiada jadual untuk kelas ini pada slot semasa.' : 'Di luar waktu P&P berjadual.') + ' Sila lengkapkan borang secara manual.</div></div>';
  if (d.sudahDirekod) info += '<div class="info biru"><i class="ph-fill ph-arrows-clockwise"></i><div>Sesi ini telah direkod pada ' + esc(d.sudahDirekod.masa) + '. Menyimpan semula akan <b>mengemas kini</b> rekod tersebut.</div></div>';
  const bilPagi = d.murid.filter(m => m.tidakHadirPagi).length;
  if (bilPagi && !d.sudahDirekod) info += '<div class="info kuning"><i class="ph-fill ph-user-minus"></i><div>' + bilPagi + ' murid ditanda tidak hadir oleh Guru Tingkatan pagi ini — ditanda tidak hadir secara automatik (boleh diubah).</div></div>';

  $('#skrinImbas').classList.add('hidden');
  const b = $('#skrinBorang'); b.classList.remove('hidden');
  b.innerHTML = '<div class="kad"><div class="kelas-kepala"><span class="lencana-kelas">' + esc(String(d.kelas).split(' ')[0]) + '</span><div><h3>' + esc(d.kelas) + '</h3>' +
    '<p class="sub">' + esc(d.hari) + ' · ' + (d.slot ? 'Slot ' + esc(d.slot.slot) + ' (' + esc(d.slot.mula) + '–' + esc(d.slot.tamat) + ')' : 'Tiada slot') + '</p></div></div>' + info +
    '<div class="grid2"><div><label class="l">Subjek</label><select id="fSubjek" class="input">' + senaraiSubjek.map(s => '<option' + (s === d.subjekCadangan ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select></div>' +
    '<div><label class="l">Jenis Kehadiran</label><select id="fJenis" class="input">' + d.senaraiJenis.map(j => '<option' + (j === d.jenisCadangan ? ' selected' : '') + '>' + esc(j) + '</option>').join('') + '</select></div></div>' +
    '<label class="l">Bilik</label><input id="fBilik" class="input" value="' + esc(d.bilik || '') + '">' +
    '<label class="l">Catatan (pilihan)</label><input id="fCatatan" class="input" placeholder="cth: Kelas di makmal / aktiviti luar"></div>' +
    '<div class="kad"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px"><h2 style="margin:0"><i class="ph-fill ph-users-three"></i>Murid (' + d.murid.length + ')</h2>' +
    '<button class="btn hantu kecil" id="btnSemua"><i class="ph ph-checks"></i>Semua Hadir</button></div>' +
    '<p class="sub" style="margin-bottom:10px">Semua murid <b>hadir</b> secara lalai. Matikan suis bagi murid yang tidak hadir dan pilih sebab.</p>' +
    d.murid.map(m => '<div class="murid' + (m.hadir ? '' : ' tidak') + '" data-nokp="' + esc(m.nokp) + '" data-nama="' + esc(m.nama) + '"><div class="atas">' + avatar(m.nama, m.gambar) +
      '<div class="nama">' + esc(m.nama) + (m.tidakHadirPagi ? '<small>Tidak hadir pagi ini (GT)</small>' : '') + '</div><label class="togol"><input type="checkbox"' + (m.hadir ? ' checked' : '') + '><span class="landas"></span><span>' + (m.hadir ? 'Hadir' : 'Tidak') + '</span></label></div>' +
      '<select class="input sebab' + (m.hadir ? ' hidden' : '') + '">' + pilihanSebab(m.kodSebab) + '</select></div>').join('') + '</div>' +
    '<button class="btn hantu penuh" onclick="imbasSemula()"><i class="ph ph-arrow-counter-clockwise"></i>Batal & Imbas Kelas Lain</button>';
  b.querySelectorAll('.murid input[type=checkbox]').forEach(cb => cb.onchange = () => togol(cb));
  $('#btnSemua').onclick = () => b.querySelectorAll('.murid input[type=checkbox]').forEach(cb => { cb.checked = true; togol(cb); });
  $('#barBawah').classList.remove('hidden');
  $('#btnSimpan').innerHTML = '<i class="ph-bold ph-floppy-disk"></i>' + (d.sudahDirekod ? 'Kemas Kini' : 'Simpan Kehadiran');
  kira(); window.scrollTo(0, 0);
}
function togol(cb) {
  const m = cb.closest('.murid'), h = cb.checked;
  m.classList.toggle('tidak', !h); m.querySelector('.sebab').classList.toggle('hidden', h); cb.parentNode.lastElementChild.textContent = h ? 'Hadir' : 'Tidak'; kira();
}
function kira() { const j = document.querySelectorAll('.murid').length, t = document.querySelectorAll('.murid.tidak').length; $('#kHadir').textContent = j - t; $('#kTidak').textContent = t; }

$('#btnSimpan').onclick = () => {
  const tidakHadir = [], tiada = [];
  document.querySelectorAll('.murid.tidak').forEach(m => { const k = m.querySelector('.sebab').value; if (!k) tiada.push(m.dataset.nama); tidakHadir.push({ nokp: m.dataset.nokp, kodSebab: k }); });
  if (tiada.length) { toast('Pilih sebab bagi: ' + tiada.slice(0, 2).join(', ') + (tiada.length > 2 ? '…' : '')); return; }
  const btn = $('#btnSimpan'); btn.disabled = true; btn.innerHTML = '<span class="putar"></span>Menyimpan…';
  jsonp('rekodKehadiranSubjek', { kelas: DATA.kelas, subjek: $('#fSubjek').value, jenis: $('#fJenis').value, bilik: $('#fBilik').value, catatan: $('#fCatatan').value, tidakHadir: JSON.stringify(tidakHadir) })
    .then(r => {
      btn.disabled = false;
      if (!r.success) { toast(r.message); btn.innerHTML = '<i class="ph-bold ph-floppy-disk"></i>Cuba Lagi'; return; }
      $('#skrinBorang').classList.add('hidden'); $('#barBawah').classList.add('hidden');
      const h = $('#skrinHasil'); h.classList.remove('hidden');
      h.innerHTML = '<div class="hasil"><i class="ph-fill ph-check-circle besar" style="color:var(--hijau)"></i><h3>Kehadiran ' + (r.dikemaskini ? 'dikemas kini' : 'direkod') + '!</h3><p class="sub">' + esc(DATA.kelas) + ' · ' + esc($('#fSubjek').value) + '</p><br>' +
        '<span class="cip c-hijau"><i class="ph-fill ph-check"></i>' + r.hadir + ' hadir</span><span class="cip c-merah"><i class="ph-fill ph-x"></i>' + r.tidakHadir + ' tidak hadir</span>' +
        '<span class="cip ' + (r.statusMasa === 'LEWAT' ? 'c-kuning' : 'c-biru') + '"><i class="ph-fill ph-clock"></i>Guru: ' + esc(r.statusMasa) + '</span><br><br>' +
        '<button class="btn" onclick="imbasSemula()"><i class="ph ph-qr-code"></i>Imbas Kelas Seterusnya</button></div>';
      window.scrollTo(0, 0);
    }).catch(e => { btn.disabled = false; btn.innerHTML = '<i class="ph-bold ph-floppy-disk"></i>Cuba Lagi'; toast(e.message); });
};

mulaKamera();
</script>
</body>
</html>
