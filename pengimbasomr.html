<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213F">
<meta name="robots" content="noindex">
<title>Pengimbas OMR · SMK Asajaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL@24,400,0&display=swap" rel="stylesheet">
<style>
:root{--ink:#13213F;--blue:#2344B8;--red:#C62828;--gold:#F4C430;--green:#1E8E5A;--amber:#E09A00;--paper:#F3F5F9;--muted:#5B6479;--line:#E2E6EF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1328;color:#fff;font-family:Lexend,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
button,select{font:inherit}
[hidden]{display:none!important}
.ms{width:1em;overflow:hidden;white-space:nowrap;text-align:center}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--ink)}
header img{width:34px;height:34px}
header .t{flex:1;min-width:0}
header b{display:block;font-size:15px;font-weight:600}
header small{display:block;font-size:12px;color:#AEB8D0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.1);color:#fff}
.link i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.link.on i{background:#3DDC84}
.stage{position:relative;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;inset:6% 7%;pointer-events:none}
.guide i{position:absolute;width:34px;height:34px;border:4px solid var(--gold);border-radius:4px}
.guide i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.guide i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.guide i:nth-child(3){right:0;bottom:0;border-left:0;border-top:0}
.guide i:nth-child(4){left:0;bottom:0;border-right:0;border-top:0}
.stage.ok .guide i{border-color:#3DDC84}
.status{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 28px);background:rgba(11,19,40,.82);padding:9px 16px;border-radius:99px;font-size:14px;text-align:center;backdrop-filter:blur(6px)}
.status.ok{background:rgba(30,142,90,.92)}
.status.bad{background:rgba(198,40,40,.92)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.go{opacity:.55;transition:none}
.start{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;padding:24px;background:var(--ink)}
.start p{margin:0;color:#C9D1E6;font-size:14px;line-height:1.6;max-width:420px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:15px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
footer{background:var(--ink);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.ctrl .l{display:flex;gap:8px}
.ctrl .r{display:flex;justify-content:flex-end;gap:8px}
.shutter{width:66px;height:66px;border-radius:50%;border:5px solid #fff;background:var(--gold);cursor:pointer}
.shutter:active{transform:scale(.94)}
.icon{width:44px;height:44px;padding:0;border-radius:50%}
.icon[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.count{position:relative}
.count em{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);font-style:normal;font-size:11px;display:grid;place-content:center}
select{height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 8px;max-width:100%}
select option{color:#000}
.sheet{position:fixed;inset:auto 0 0 0;max-height:78vh;background:#fff;color:var(--ink);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;display:grid;grid-template-rows:auto 1fr auto;z-index:5;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open{transform:none}
.sheet .h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet .h b{flex:1;font-size:16px}
.sheet .list{overflow:auto;padding:0 16px}
.sheet .f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line)}
.sheet .btn{background:var(--paper);color:var(--ink);border-color:var(--line)}
.sheet .btn.gold{background:var(--gold);border-color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:40px;height:54px;object-fit:cover;border-radius:4px;background:var(--paper)}
.row div{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12px}
.pill{font-size:11.5px;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:#E3F4EC;color:var(--green)}
.pill.wait{background:#FFF3D6;color:#8A5B00}
.pill.bad{background:#FDE7E7;color:var(--red)}
.empty{color:var(--muted);font-size:14px;padding:18px 0}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 6px}
textarea{width:100%;height:110px;border-radius:10px;border:1px solid var(--line);padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* ================= RESPONSIF: semua saiz skrin & orientasi ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none;width:100%}
/* minmax(0,1fr) menghalang kandungan panjang (cth. nama ujian) melebarkan halaman */
.app{height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"h" "s" "f"}
.app>*{min-width:0}
header{grid-area:h;padding-left:calc(env(safe-area-inset-left,0px) + 14px);padding-right:calc(env(safe-area-inset-right,0px) + 14px)}
header img{flex:none}
.link{flex:none;max-width:46%}
.link span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{grid-area:s;container-type:size}
footer{grid-area:f;padding-left:calc(env(safe-area-inset-left,0px) + 14px);padding-right:calc(env(safe-area-inset-right,0px) + 14px)}
.tsel{margin-bottom:10px;min-width:0}
select{display:block;width:100%;min-width:0;max-width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;font-size:16px;height:40px}
.inner{width:100%;max-width:560px;margin:0 auto}
.ctrl{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
/* bingkai panduan mengikut nisbah A4, sentiasa di tengah dan muat dalam skrin */
.guide{inset:auto;left:50%;top:calc(50% + 20px);transform:translate(-50%,-50%);width:74%;aspect-ratio:210/297;max-height:90%}
@supports (width:1cqw){ .guide{top:calc(50% + 26px);width:min(86cqw,calc((100cqh - 76px) * .707));max-height:none} }
.guide i{width:clamp(22px,9%,40px);height:auto;aspect-ratio:1;border-width:clamp(3px,1vmin,5px)}
.status{top:clamp(8px,2.5%,16px);width:max-content;max-width:calc(100% - 24px);font-size:clamp(12.5px,3.6vw,15px);line-height:1.35;padding:8px 14px;border-radius:16px}
.start{overflow:auto;padding:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
.shutter{width:clamp(56px,17vw,72px);height:clamp(56px,17vw,72px);flex:none}
.icon{width:clamp(40px,12vw,48px);height:clamp(40px,12vw,48px);flex:none}
.sheet{left:50%;right:auto;width:min(100%,560px);transform:translate(-50%,105%);max-height:min(78vh,78dvh)}
.sheet.open{transform:translate(-50%,0)}
.sheet .f{padding-left:calc(env(safe-area-inset-left,0px) + 16px);padding-right:calc(env(safe-area-inset-right,0px) + 16px)}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 130px)}
/* telefon sangat kecil (iPhone SE 1st gen, Android kecil) */
@media (max-width:359px){
  header{gap:8px} header img{width:28px;height:28px} header b{font-size:14px}
  .link #linkTxt{display:none} .link{padding:0 9px}
  footer{padding-top:8px}
}
/* skrin rendah dalam orientasi potret */
@media (max-height:600px) and (orientation:portrait){ header{padding-bottom:6px} header small{display:none} }
/* landskap telefon: kawalan di sisi kanan supaya kamera lebih besar */
@media (orientation:landscape) and (max-height:560px){
  .app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"h h" "s f"}
  header{padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px}
  header small{display:none}
  footer{width:clamp(170px,26vw,230px);display:flex;flex-direction:column;justify-content:center;padding:10px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) 12px}
  .inner{max-width:none}
  .ctrl{grid-template-columns:1fr;grid-template-rows:auto auto auto;justify-items:center;gap:12px}
  .ctrl .l,.ctrl .r{justify-content:center}
  .ctrl .r{order:3} .shutter{order:2} .ctrl .l{order:1}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  .sheet{max-height:92dvh}
}
/* tablet & desktop */
@media (min-width:768px) and (min-height:561px){
  header{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:14px}
  header img{width:40px;height:40px} header b{font-size:17px}
  .status{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" alt="">
    <div class="t"><b>Pengimbas OMR</b><small id="sub">SMK Asajaya</small></div>
    <span class="link" id="link"><i></i><span id="linkTxt">Belum bersambung</span></span>
  </header>
  <div class="stage" id="stage">
    <video id="v" playsinline muted></video>
    <div class="guide"><i></i><i></i><i></i><i></i></div>
    <div class="status" id="st">Halakan kamera ke kertas</div>
    <div class="flash" id="flash"></div>
    <div class="start" id="start">
      <span class="ms" style="font-size:54px;color:var(--gold);margin:0 auto">document_scanner</span>
      <b style="font-size:19px">Imbasan langsung</b>
      <p>Letakkan kertas jawapan di atas meja. Kertas dikesan dan dibaca secara automatik apabila keempat-empat petak hitam dan kod QR kelihatan.</p>
      <p id="startMsg"></p>
      <div><button class="btn gold" id="go"><span class="ms">videocam</span>Mulakan kamera</button></div>
    </div>
  </div>
  <footer>
    <div class="inner">
    <div class="tsel"><select id="test" aria-label="Ujian"></select></div>
    <div class="ctrl">
      <div class="l"><button class="btn icon" id="torch" aria-pressed="false" aria-label="Lampu suluh" title="Lampu suluh" hidden><span class="ms">flashlight_on</span></button></div>
      <button class="shutter" id="shot" aria-label="Tangkap sekarang"></button>
      <div class="r"><button class="btn icon count" id="openList" aria-label="Senarai imbasan"><span class="ms">list</span><em id="cnt" hidden>0</em></button></div>
    </div>
    </div>
  </footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Senarai imbasan">
  <div class="h"><b>Kertas diimbas</b><button class="btn sm" id="closeList"><span class="ms">close</span></button></div>
  <div class="list" id="list"></div>
  <div class="f">
    <button class="btn sm gold" id="resend"><span class="ms">send</span>Hantar ke aplikasi</button>
    <button class="btn sm" id="copy"><span class="ms">content_copy</span>Salin kod</button>
    <button class="btn sm" id="clear"><span class="ms">delete_sweep</span>Kosongkan dihantar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
 *  OMR ENGINE — SMK Asajaya
 *  Satu sumber geometri untuk CETAK dan IMBAS. Semua ukuran dalam milimeter
 *  (mm) pada kertas A4 (210 x 297). Jangan ubah pemalar di sini selepas
 *  kertas sudah dicetak, kerana kertas lama tidak akan dapat diimbas lagi.
 * ========================================================================== */
var OMR = (function () {
  'use strict';

  var PAGE_W = 210, PAGE_H = 297;
  var MK = 7;                                   // saiz penanda sudut
  var MARKERS = [                               // penjuru kiri-atas setiap penanda
    { x: 10, y: 10 }, { x: 193, y: 10 }, { x: 193, y: 280 }, { x: 10, y: 280 }
  ];                                            // urutan: TL, TR, BR, BL
  var MARKER_C = MARKERS.map(function (m) { return { x: m.x + MK / 2, y: m.y + MK / 2 }; });
  var QR = { x: 164, y: 13, s: 26 };
  var GRID_TOP = 101, ROW_H = 6.7, MAX_ROWS = 25;
  var LABEL_W = 9, OPT_P = 6.4, BUB_R = 2.3;
  // v2: saiz bulatan dibesarkan secara automatik mengikut bilangan soalan
  var GRID_BOTTOM = 270, GRID_LEFT = 14, GRID_RIGHT = 196, MAX_SCALE = 1.6, ROW_MIN = 6.4, COL_GAP = 5;
  var LAYOUT_VER = 2;
  var LETTERS = 'ABCDE';
  var MAX_Q = 100;

  /* ------------------------------------------------------------ LAYOUT */
  /**
   * Susun atur bulatan.
   *  ver 1: saiz tetap (kertas yang dicetak sebelum kemas kini ini).
   *  ver 2: saiz dibesarkan secara automatik supaya grid memenuhi ruang
   *         kertas (soalan sedikit = bulatan dan huruf lebih besar).
   */
  function layout(numQ, numOpt, ver) {
    numQ = Math.max(1, Math.min(MAX_Q, numQ | 0));
    numOpt = Math.max(2, Math.min(5, numOpt | 0));
    ver = ver === 1 ? 1 : LAYOUT_VER;
    var cols, rows, sc, rowH;
    if (ver === 1) {
      cols = Math.min(4, Math.ceil(numQ / 15));
      rows = Math.ceil(numQ / cols);
      sc = 1;
      rowH = Math.min(9.5, (MAX_ROWS * ROW_H) / rows);
    } else {
      var H = GRID_BOTTOM - GRID_TOP, Wd = GRID_RIGHT - GRID_LEFT, best = null;
      for (var c = 1; c <= 4; c++) {
        var r = Math.ceil(numQ / c);
        if (r > MAX_ROWS) continue;
        var sW = (Wd / c - COL_GAP) / (LABEL_W + numOpt * OPT_P);
        var sH = H / (r * ROW_MIN);
        var k = Math.min(MAX_SCALE, sW, sH);
        if (k < 0.95) continue;
        // pilih skala terbesar; jika sama, pilih lajur lebih sedikit
        if (!best || k > best.k + 0.01) best = { c: c, r: r, k: k };
      }
      if (!best) best = { c: 4, r: Math.ceil(numQ / 4), k: 0.95 };
      cols = best.c; rows = best.r; sc = Math.round(best.k * 100) / 100;
      rowH = Math.min(sc * 9.5, H / rows);
    }
    var labelW = LABEL_W * sc, optP = OPT_P * sc, r0 = BUB_R * sc;
    var colP = labelW + numOpt * optP + COL_GAP;
    var startX = PAGE_W / 2 - (cols * colP) / 2 + 2;
    var bubbles = [];
    for (var q = 0; q < numQ; q++) {
      var cc = Math.floor(q / rows), rr = q % rows, row = [];
      for (var o = 0; o < numOpt; o++) {
        row.push({ x: startX + cc * colP + labelW + o * optP + optP / 2, y: GRID_TOP + rr * rowH + rowH / 2 });
      }
      bubbles.push(row);
    }
    return {
      ver: ver, numQ: numQ, numOpt: numOpt, cols: cols, rows: rows, colP: colP, startX: startX, scale: sc,
      labelW: labelW, optP: optP, bubbles: bubbles, r: r0, gridTop: GRID_TOP, rowH: rowH
    };
  }

  /* ----------------------------------------------------------- RENDER */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fit(text, maxW, base) {               // anggaran lebar teks (mm)
    var n = String(text || '').length || 1;
    return Math.max(2.4, Math.min(base, maxW / (n * 0.56)));
  }
  function qrData(testId, studentId) { return 'OMRSA' + LAYOUT_VER + '|' + testId + '|' + (studentId || '0'); }

  /**
   * Hasilkan satu halaman SVG A4.
   * test: {id,nama,subjek,kod,tarikh,hari,masaMula,masaTamat,tempohTeks,numQ,numOpt}
   * student: {id,nama,tingkatan,kelas,bil} atau null (kertas kosong)
   * opts: {logo: dataURL, qr: fn(text)->dataURL, school: {...}}
   */
  function renderSheet(test, student, opts) {
    opts = opts || {};
    var L = layout(test.numQ, test.numOpt, LAYOUT_VER);
    var s = [];
    var blank = !student || !student.id;
    s.push('<svg class="omr-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Arial, Helvetica, sans-serif">');
    s.push('<rect x="0" y="0" width="210" height="297" fill="#fff"/>');
    // penanda sudut
    MARKERS.forEach(function (m) { s.push('<rect x="' + m.x + '" y="' + m.y + '" width="' + MK + '" height="' + MK + '" fill="#000"/>'); });
    // logo + kepala
    if (opts.logo) s.push('<image href="' + opts.logo + '" x="22" y="12" width="25" height="25" preserveAspectRatio="xMidYMid meet"/>');

        for (var i = 0; i < offs.length; i++) { var p = apply(H, mx + dx + offs[i][0], my + dy + offs[i][1]); s += sample(g, w, h, p.x, p.y); }
        var d = (white - s / offs.length) / (white - black);
        if (d > best) best = d;
      }
      return Math.max(0, Math.min(1, best));
    }
    var D = L.bubbles.map(function (row) { return row.map(function (b) { return dark(b.x, b.y); }); });
    // Tolak dakwat huruf dalam bulatan kosong: garis dasar = kegelapan rendah
    // (persentil ke-25) bagi setiap pilihan, kerana kebanyakan bulatan kosong.
    if (ver >= 2 && D.length >= 3) {
      var pooled = [].concat.apply([], D).sort(function (a, b) { return a - b; });
      var pBase = pooled[Math.floor((pooled.length - 1) * 0.25)];
      for (var oi = 0; oi < L.numOpt; oi++) {
        var col = D.map(function (d) { return d[oi]; }).sort(function (a, b) { return a - b; });
        // had atas: garis dasar keseluruhan + 0.08, supaya pilihan yang kerap dijawab tidak dianggap kosong
        var base = Math.min(0.35, pBase + 0.08, col[Math.floor((col.length - 1) * 0.25)]);
        D.forEach(function (d) { d[oi] = Math.max(0, (d[oi] - base) / (1 - base)); });
      }
    }
    var all = [].concat.apply([], D);
    // v2: dakwat huruf sudah ditolak, jadi had bawah ambang boleh lebih rendah
    var th = Math.max(ver >= 2 ? 0.2 : 0.3, Math.min(0.6, otsu(all))) / sens;
    var answers = [], flags = [];
    D.forEach(function (d) {
      var idx = d.map(function (v, i) { return i; }).sort(function (a, b) { return d[b] - d[a]; });
      var marked = idx.filter(function (i) { return d[i] >= th; });
      var ans, flag = '';
      if (!marked.length) { ans = '-'; if (d[idx[0]] > th * 0.75) flag = 'lemah'; }
      else if (marked.length === 1) { ans = LETTERS[marked[0]]; if (d[idx[1]] > th * 0.75) flag = 'ragu'; }
      else if (d[marked[0]] - d[marked[1]] >= 0.25) { ans = LETTERS[marked[0]]; flag = 'padam'; }
      else { ans = '*'; flag = 'berganda'; }
      answers.push(ans); flags.push(flag);
    });
    var img = L.bubbles.map(function (row) { return row.map(function (b) { return apply(H, b.x, b.y); }); });
    var rpx = Math.hypot(apply(H, 105 + L.r, 150).x - apply(H, 105, 150).x, apply(H, 105 + L.r, 150).y - apply(H, 105, 150).y);
    return { answers: answers, flags: flags, darkness: D, threshold: th, bubblesImg: img, rpx: rpx, white: white, black: black, ver: ver };
  }

  return {
    PAGE_W: PAGE_W, PAGE_H: PAGE_H, LETTERS: LETTERS, MAX_Q: MAX_Q, LAYOUT_VER: LAYOUT_VER,
    layout: layout, renderSheet: renderSheet, qrData: qrData, parseQR: parseQR,
    prepare: prepare, readAnswers: readAnswers, setQRDecoder: setQRDecoder,
    _h: { homography: homography, apply: apply, MARKER_C: MARKER_C, QR: QR }
  };
})();
if (typeof module !== 'undefined') module.exports = OMR;
</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
'use strict';
/* ==========================================================================
   PENGIMBAS OMR SMK ASAJAYA — halaman kamera berasingan
   Halaman ini hanya membaca kertas. Semua data disimpan oleh aplikasi
   Apps Script (tab yang membuka halaman ini). Tiada data dihantar ke pelayan
   GitHub: maklumat ujian dihantar melalui postMessage atau bahagian # URL.
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = { tests: {}, students: {}, sens: 1, origin: '', items: [], done: new Set(), lastKey: '', stable: 0, busy: false, timer: null, stream: null, linked: false, wake: null };

/* ---------- data daripada # URL (mod tanpa sambungan) ---------- */
function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
}
function b64urlEncode(str) {
  const b = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function loadHash() {
  const m = location.hash.match(/[#&]d=([^&]+)/); if (!m) return false;
  try {
    const d = JSON.parse(b64urlDecode(m[1]));
    setTests(d.tests.map(t => ({ id: t[0], numQ: t[1], numOpt: t[2], nama: t[3] || '' })), d.test);
    if (d.sens) P.sens = +d.sens || 1;
    return true;
  } catch (e) { return false; }
}
function setTests(list, def) {
  P.tests = {}; list.forEach(t => P.tests[t.id] = t);
  const sel = $('#test');
  sel.innerHTML = '<option value="">Kesan ujian melalui kod QR</option>' + list.map(t => `<option value="${esc(t.id)}">${esc(t.nama)}${t.subjek ? ' · ' + esc(t.subjek) : ''}</option>`).join('');
  if (def && P.tests[def]) sel.value = def;
  $('#sub').textContent = list.length ? `${list.length} ujian tersedia` : 'Tiada maklumat ujian';
}

/* ---------- sambungan dengan aplikasi ---------- */
function setLink(on) {
  P.linked = on;
  $('#link').classList.toggle('on', on);
  $('#linkTxt').textContent = on ? 'Bersambung' : 'Tidak bersambung';
}
function getOpener() { try { return window.opener && !window.opener.closed ? window.opener : null; } catch (e) { return null; } }
window.addEventListener('message', e => {
  if (!e.data || typeof e.data !== 'object' || e.source !== getOpener()) return;
  if (e.data.type === 'omrsa-init') {
    P.origin = e.origin;
    setTests(e.data.tests || [], e.data.test || $('#test').value);
    P.students = e.data.students || {};
    P.sens = +e.data.sens || P.sens;
    setLink(true);
    flushUnsent();
  } else if (e.data.type === 'omrsa-ack') {
    const it = P.items.find(x => x.key === e.data.key);
    if (it) { it.sent = true; it.dup = !!e.data.dup; persist(); renderList(); }
  }
});
function hello() {
  let n = 0;
  const tick = () => {
    const o = getOpener();
    if (P.linked || !o || n++ > 15) { if (!P.linked) setLink(false); return; }
    o.postMessage({ type: 'omrsa-hello' }, '*');
    setTimeout(tick, 800);
  };
  tick();
}
function send(it) {
  const o = getOpener();
  if (!o || !P.origin) { setLink(false); return false; }
  o.postMessage({ type: 'omrsa-result', item: {
    key: it.key, testId: it.testId, studentId: it.studentId, answers: it.answers, flags: it.flags,
    notes: it.notes, img: it.img, pts: it.pts, rpx: it.rpx, dispScale: it.dispScale
  } }, P.origin);
  return true;
}
function flushUnsent() { P.items.filter(i => !i.sent).forEach(send); }

/* ---------- simpanan sementara (jika halaman dimuat semula) ---------- */
function persist() {
  try {
    sessionStorage.setItem('omrsa-items', JSON.stringify(P.items.filter(i => !i.sent).map(i => ({ ...i, img: '', pts: null }))));
  } catch (e) { }
}
function restore() {
  try {
    const l = JSON.parse(sessionStorage.getItem('omrsa-items') || '[]');
    l.forEach(i => { P.items.push(i); P.done.add(i.key); });
  } catch (e) { }
}

/* ---------- kamera ---------- */
function status(txt, cls) { const s = $('#st'); s.textContent = txt; s.className = 'status ' + (cls || ''); $('#stage').classList.toggle('ok', cls === 'ok'); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function canvasFrom(src, w, h, max) {
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d', { willReadFrequently: true }).drawImage(src, 0, 0, c.width, c.height);
  return c;
}
async function startCam() {
  $('#startMsg').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#startMsg').textContent = 'Pelayar ini tidak menyokong kamera. Cuba Chrome atau Safari terkini.'; return; }
  try {
    P.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
  } catch (e) {
    $('#startMsg').innerHTML = 'Kamera tidak dapat dibuka (' + esc(e.name || e.message) + '). Benarkan akses kamera untuk laman ini dalam tetapan pelayar, kemudian cuba lagi.' +
      (getOpener() ? '<br><br>Jika masih gagal, salin alamat halaman ini dan buka terus dalam Chrome atau Safari. Selepas mengimbas, guna <b>Salin kod</b> dan tampal dalam aplikasi.' : '');
    return;
  }
  const v = $('#v'); v.srcObject = P.stream; await v.play().catch(() => { });
  $('#start').hidden = true;
  const track = P.stream.getVideoTracks()[0];
  try { if (track.getCapabilities && track.getCapabilities().torch) $('#torch').hidden = false; } catch (e) { }
  try { if (navigator.wakeLock) P.wake = await navigator.wakeLock.request('screen'); } catch (e) { }
  P.stable = 0; P.timer = setInterval(tick, 700);
  status('Halakan kamera ke kertas');
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && P.stream && navigator.wakeLock) { try { P.wake = await navigator.wakeLock.request('screen'); } catch (e) { } }
});

function currentTest(pre) {
  if (pre.qr) return P.tests[pre.qr.testId] || null;
  return P.tests[$('#test').value] || null;
}
function keyOf(pre) { return pre.qr ? pre.qr.testId + '|' + (pre.qr.studentId || 'kosong') : 'manual|' + $('#test').value; }
function nameOf(sid) { const s = P.students[sid]; return s ? s.nama : ''; }

async function tick() {
  const v = $('#v'); if (P.busy || !v.videoWidth || $('#sheet').classList.contains('open')) return;
  P.busy = true;
  try {
    const c = canvasFrom(v, v.videoWidth, v.videoHeight, 1100);
    const pre = OMR.prepare(c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height));
    if (!pre.qr && !$('#test').value) { P.stable = 0; status('Penanda dikesan, kod QR belum dibaca. Dekatkan sedikit.'); return; }
    if (pre.qr && !P.tests[pre.qr.testId]) { P.stable = 0; status('Kertas ini milik ujian yang tiada dalam senarai anda', 'bad'); return; }
    const key = keyOf(pre);
    if (key === P.lastKey || (pre.qr && pre.qr.studentId && P.done.has(key))) {
      P.stable = 0;
      const nm = pre.qr && nameOf(pre.qr.studentId);
      status((nm ? nm.split(' ').slice(0, 2).join(' ') + ' sudah' : 'Sudah') + ' diimbas. Letak kertas seterusnya', 'ok');
      return;
    }
    status('Kertas dikesan, tahan sekejap…', 'ok');
    if (++P.stable >= 2) { P.stable = 0; await capture(false); }
  } catch (e) {
    P.stable = 0; status('Cari keempat-empat petak hitam di penjuru kertas');
  } finally { P.busy = false; }
}

async function capture(manual) {
  const v = $('#v'); if (!v.videoWidth) return;
  const c = canvasFrom(v, v.videoWidth, v.videoHeight, 1800);
  let pre, test;
  try {
    pre = OMR.prepare(c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height));
    test = currentTest(pre);
    if (!test) throw new Error(pre.qr ? 'Ujian dalam kod QR tiada dalam senarai anda.' : 'Kod QR tidak dibaca. Pilih ujian di bawah dahulu.');
  } catch (e) {
    if (manual) status(e.message.length > 70 ? 'Kertas tidak dapat dibaca. Pastikan keempat-empat petak hitam kelihatan.' : e.message, 'bad');
    return;
  }
  const r = OMR.readAnswers(pre, test.numQ, test.numOpt, P.sens);
  const d = canvasFrom(c, c.width, c.height, 1100);
  const key = keyOf(pre) + (pre.qr && pre.qr.studentId ? '' : '|' + Date.now());
  const it = {
    key, testId: test.id, studentId: pre.qr ? pre.qr.studentId : '', answers: r.answers, flags: r.flags,
    notes: pre.qr ? [] : ['Kod QR tidak dibaca; ujian dipilih secara manual.'],
    img: d.toDataURL('image/jpeg', 0.8), pts: r.bubblesImg, rpx: r.rpx, dispScale: Math.min(1, 1100 / Math.max(c.width, c.height)),
    nama: pre.qr ? nameOf(pre.qr.studentId) : '', ujian: test.nama, at: Date.now(), sent: false
  };
  P.items = P.items.filter(x => x.key !== it.key);
  P.items.unshift(it); P.done.add(it.key); P.lastKey = keyOf(pre);
  const flagged = r.flags.filter(Boolean).length, blank = r.answers.filter(a => a === '-').length;
  $('#flash').classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => $('#flash').classList.remove('go')));
  if (navigator.vibrate) navigator.vibrate(70);
  const who = it.nama ? it.nama.split(' ').slice(0, 2).join(' ') : (it.studentId ? 'Kertas' : 'Kertas tanpa nama');
  status(`${who} diimbas${flagged ? ` · ${flagged} perlu disemak` : ''}${blank ? ` · ${blank} kosong` : ''}`, 'ok');
  if (!send(it)) toast('Disimpan dalam senarai. Hantar ke aplikasi atau salin kod kemudian.');
  persist(); renderList();
}

/* ---------- senarai ---------- */
function renderList() {
  const n = P.items.length, unsent = P.items.filter(i => !i.sent).length;
  $('#cnt').hidden = !n; $('#cnt').textContent = unsent || n;
  $('#cnt').style.background = unsent ? 'var(--red)' : 'var(--green)';
  $('#list').innerHTML = n ? P.items.map(i => `<div class="row">${i.img ? `<img src="${i.img}" alt="">` : '<img alt="">'}
    <div><b>${esc(i.nama || (i.studentId ? 'ID ' + i.studentId : 'Murid belum dikenal pasti'))}</b>
    <small>${esc(i.ujian || '')} · ${i.answers.filter(a => a !== '-').length}/${i.answers.length} dijawab${i.flags.filter(Boolean).length ? ' · ' + i.flags.filter(Boolean).length + ' semakan' : ''}</small></div>
    ${i.sent ? `<span class="pill ok">${i.dup ? 'Dikemas kini' : 'Dihantar'}</span>` : '<span class="pill wait">Belum dihantar</span>'}</div>`).join('')
    : '<div class="empty">Belum ada kertas diimbas.</div>';
  $('#resend').disabled = !unsent;
}
function codeText() {
  const list = P.items.filter(i => !i.sent);
  const src = list.length ? list : P.items;
  return 'OMRSA1:' + b64urlEncode(JSON.stringify(src.map(i => [i.testId, i.studentId, i.answers.join(''), i.flags.join(',')])));
}

/* ---------- mula ---------- */
function bind() {
  $('#go').onclick = startCam;
  $('#shot').onclick = () => { if (!P.stream) return startCam(); capture(true); };
  $('#torch').onclick = async e => {
    const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
    try { await P.stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }); b.setAttribute('aria-pressed', on); } catch (err) { toast('Lampu suluh tidak disokong.'); }
  };
  $('#test').onchange = () => { P.lastKey = ''; };
  $('#openList').onclick = () => { renderList(); $('#sheet').classList.add('open'); };
  $('#closeList').onclick = () => $('#sheet').classList.remove('open');
  $('#resend').onclick = () => {
    if (!getOpener()) return toast('Tab aplikasi telah ditutup. Guna "Salin kod" dan tampal dalam aplikasi.');
    if (!P.origin) { hello(); return toast('Menyambung semula ke aplikasi…'); }
    flushUnsent(); toast('Dihantar ke aplikasi');
  };
  $('#copy').onclick = async () => {
    if (!P.items.length) return toast('Belum ada imbasan.');
    const txt = codeText();
    try { await navigator.clipboard.writeText(txt); toast('Kod disalin. Tampal dalam aplikasi: Imbas → Tampal kod imbasan.'); }
    catch (e) {
      $('#list').insertAdjacentHTML('afterbegin', `<p class="note">Salin kod di bawah dan tampal dalam aplikasi (Imbas → Tampal kod imbasan).</p><textarea readonly>${esc(txt)}</textarea>`);
      $('#list textarea').select();
    }
  };
  $('#clear').onclick = () => { P.items = P.items.filter(i => !i.sent); persist(); renderList(); };
}

(function init() {
  $('#logo').src = window.LOGO_SRC || '';
  bind();
  const fromHash = loadHash();
  restore(); renderList();
  if (getOpener()) { $('#linkTxt').textContent = 'Menyambung…'; hello(); }
  else setLink(false);
  if (!fromHash && !getOpener()) {
    $('#startMsg').innerHTML = '<b style="color:var(--gold)">Buka halaman ini melalui butang "Imbasan langsung" dalam aplikasi OMR SMK Asajaya</b> supaya senarai ujian dimuatkan.';
  }
})();
</script>
