<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bidang Sains &amp; Matematik</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <iframe src="GANTI_DENGAN_EXEC_URL_ANDA"></iframe>
    <script>
        window.addEventListener('message', function (ev) {
            if (ev.data && ev.data.action === 'closePortal') {
                // Jika ebidang.html berada dalam iframe induk, hantar ke induk
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ action: 'closePortal' }, '*');
                } else {
                    // Jika ebidang.html adalah halaman utama, navigate keluar
                    window.location.href = '/';
                }
            }
        });
    </script>
</body>
</html>
