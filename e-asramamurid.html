<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>e-Asrama SMK Asajaya</title>
    <style>
        /* Memastikan tiada ruang kosong langsung di sekeliling halaman */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #ffffff;
        }

        /* Memaksa iframe memenuhi 100% lebar dan tinggi skrin peranti */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body>
    <!-- PENTING: src tuju ke borang LOG MASUK (login-penghuni), BUKAN terus
         ke portal (penghuni) — supaya sistem boleh sahkan sesi log masuk
         dgn betul. -->
    <iframe id="asramaFrame" src="https://script.google.com/macros/s/AKfycbykYksuDRd_3YpY-jXO6LF8uL5cb05mnjU198t6_SEvEpkZdUQOurR7p2Gej2ZCUmvKXg/exec?page=login-penghuni"></iframe>
    <div id="statusDebug" style="position:fixed; bottom:8px; left:8px; background:rgba(0,0,0,.75); color:#0f0; font:11px monospace; padding:6px 10px; border-radius:6px; z-index:9999; max-width:90vw; word-break:break-all;">Menunggu isyarat...</div>
    <script>
      // Sistem di dalam iframe (script.googleusercontent.com) disekat oleh
      // sandbox Google drpd menavigasi dirinya sendiri terus (cth. selepas log
      // masuk, atau bila sesi tamat). Ia hantar isyarat postMessage ke sini
      // (halaman paling luar), dan KITA yang navigasi iframe tersebut —
      // menavigasi iframe milik sendiri (sama origin dgn diri sendiri di sini)
      // sentiasa dibenarkan.
      var dbg = document.getElementById('statusDebug');
      window.addEventListener('message', function(event){
        // PENUNJUK DEBUG: papar SETIAP mesej yang tiba (walaupun tak sepadan)
        // supaya kita nampak sama ada postMessage sampai langsung atau tidak.
        dbg.textContent = 'Mesej diterima drpd ' + event.origin + ': ' + JSON.stringify(event.data).substring(0,200);

        if (!event.data || event.data.jenis !== 'e_asrama_navigate') return;
        var url = event.data.url;
        if (typeof url !== 'string') return;
        // Sahkan URL memang milik deployment Apps Script kita sahaja (elak
        // penyalahgunaan open-redirect drpd sumber lain).
        var awalanSah = 'https://script.google.com/macros/s/AKfycbykYksuDRd_3YpY-jXO6LF8uL5cb05mnjU198t6_SEvEpkZdUQOurR7p2Gej2ZCUmvKXg/';
        if (url.indexOf(awalanSah) !== 0) { dbg.textContent = 'URL ditolak (tak sepadan awalan): ' + url; return; }
        dbg.textContent = 'Navigasi iframe ke: ' + url;
        document.getElementById('asramaFrame').src = url;
      });
    </script>
</body>
</html>
