    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0C1048; }

        iframe.sedia { opacity: 1; }
        #pemuat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            color: #fff; font-family: Georgia, 'Times New Roman', serif; transition: opacity .35s ease;
            background: radial-gradient(circle at 30% 20%, #2A2F9C, #0C1048 60%, #3A1675); }

        #pemuat img { width: 104px; height: 104px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); animation: denyut 1.6s ease-in-out infinite; }

        #pemuat span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
        .bar { width: 170px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
        .bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 4px; animation: gelongsor 1.1s ease-in-out infinite;
            background: linear-gradient(90deg, #D7141B 0 25%, #F4E21B 25% 50%, #2433C4 50% 75%, #6B1F9A 75% 100%); }
        @keyframes denyut { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @keyframes gelongsor { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
